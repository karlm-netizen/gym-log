<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Gym-Log</title>
<!-- ---------- Vorschau-Karte beim Verschicken (27.08.2026) ----------
     Karls Idee: "kann man den Link sonst verpacken? In eine Ueberschrift z.B., hinter
     einfach Gym-Log."

     Das hier ist der Teil, der UEBERALL wirkt. Messenger holen sich diese Zeilen und zeigen
     statt einer nackten Adresse eine Karte mit Symbol und Titel.
     ⚠️ **Die Adresse verschwindet dadurch NICHT** -- WhatsApp zeigt sie weiter unter der
     Karte, und daran kann keine Seite der Welt etwas aendern: was ein Messenger mit einem
     Link anstellt, entscheidet der Messenger. Die Nachricht sieht nur nach etwas aus statt
     nach hingeworfenem Text.
     ⚠️ Die Karte ist immer dieselbe, auch bei einem Plan-Link. Der Teil nach der Raute
     (`#p=...`) wird nie an den Server geschickt -- ein Vorschau-Dienst sieht ihn also gar
     nicht und koennte den Plannamen nicht in den Titel schreiben. -->
<meta name="description" content="Trainings mitschreiben, Rekorde sehen, Level steigen. Läuft offline im Browser.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Gym-Log">
<meta property="og:title" content="Gym-Log">
<meta property="og:description" content="Trainingsplan öffnen — Trainings mitschreiben, Rekorde sehen, Level steigen.">
<meta property="og:image" content="https://karlm-netizen.github.io/gym-log/icon-512.png">
<meta property="og:url" content="https://karlm-netizen.github.io/gym-log/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Gym-Log">
<meta name="twitter:description" content="Trainingsplan öffnen — Trainings mitschreiben, Rekorde sehen, Level steigen.">
<meta name="twitter:image" content="https://karlm-netizen.github.io/gym-log/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- Icons: Karls Entwurf vom 23.08.2026. icon.svg zeigte das ALTE Motiv und ist
     deshalb raus - sonst steht im Browser-Tab ein anderes Bild als auf dem Homescreen. -->
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym-Log">
<!-- ⚠️ Laeuft absichtlich HIER oben, vor dem ersten Bild. Wer eine der freigespielten Paletten
     traegt, saehe beim Start sonst kurz Dunkelgrau aufblitzen: die Palette wird erst unten in
     applyTheme() gesetzt. Ein Ladebildschirm in der falschen Farbe waere genau das Aufblitzen,
     das er verhindern soll. Gelesen wird nur ein Abbild aus vier Farben und einem Bildnamen
     (geschrieben in applyTheme) — die Paletten selbst gibt es hier oben noch gar nicht.
     Fehlt der Eintrag (erster Besuch), bleibt es bei den Vorgaben aus :root und brock.png. -->
<script>
(function(){
  try {
    var f = JSON.parse(localStorage.getItem('gymlog:splash') || 'null');
    if (!f) return;
    var s = document.documentElement.style;
    if (f.bg)    s.setProperty('--bg', f.bg);
    if (f.txt)   s.setProperty('--txt', f.txt);
    if (f.muted) s.setProperty('--muted', f.muted);
    if (f.line)  s.setProperty('--line', f.line);
    if (f.card)  s.setProperty('--card', f.card);
    if (f.ok)    s.setProperty('--ok', f.ok);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m && f.bg) m.content = f.bg;
    // Brock in seinem getragenen Rang — der Ladebildschirm zeigt den eigenen Stand,
    // nicht immer den Anfaenger-Brock.
    window.__splashImg = f.img || 'brock.png';
  } catch (e) {}
})();

// ⚠️ Die harte Obergrenze. Der Ladebildschirm liegt UEBER der ganzen App — bliebe er stehen,
// waere die App gesperrt, und zwar unbedienbar, nicht nur haesslich. Der Wecker steht
// absichtlich HIER und nicht in init(): so greift er auch dann, wenn init() nie erreicht wird
// (Skriptfehler weiter unten, abgebrochener Download, kaputter Datenbestand).
// Uebernommen aus angel-log — dort ist genau das schon einmal passiert.
var SPLASH_HOECHSTENS = 5000;

// ---- Wie lange der Schirm MINDESTENS steht (23.08.2026) ----
// Karls Ansage: „der ladescreen ist zu kurz" — dasselbe wie am 08.08. bei angel-log.
// Die Oberflaeche steht nach wenigen Millisekunden, also war der Schirm weg, bevor man
// ihn gesehen hatte.
//
// ⚠️ Gezaehlt wird ab dem OEFFNEN der Seite, nicht ab dem Fertigwerden. Sonst kaeme
// die Wartezeit oben drauf und ein langsames Geraet wuerde doppelt bestraft.
//
// ⚠️ Muss unter SPLASH_HOECHSTENS liegen, sonst laufen zwei Uhren gegeneinander:
// die Obergrenze raeumte den Schirm weg, waehrend die Mindestzeit ihn noch haelt.
var SPLASH_MINDESTENS = 1800;
var splashSeit = Date.now();
setTimeout(function(){
  var s = document.getElementById('splash');
  if (s) s.classList.add('weg');
}, SPLASH_HOECHSTENS);
</script>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#222630; --line:#2b303b;
    --txt:#eef1f6; --muted:#8b93a4; --accent:#e6e9ef; --accent-ink:#12141a; --ok:#3ecf8e;
    --danger:#ff5d5d; --r:16px; --sp:16px;
    /* Gold fuer neu freigeschaltete Erfolge (27.08.2026). Zwei Werte, weil eins nicht
       reicht: `--gold` ist die FLAECHE (darauf liegt dunkle Schrift, das traegt auf
       jedem Untergrund), `--gold-txt` ist die SCHRIFT. Auf „Schlicht Hell“ waere ein
       helles Gold als Schrift auf Weiss nicht mehr zu lesen — dort steht deshalb ein
       dunkleres. Jedes Design setzt beide selbst, siehe THEMES. */
    --gold:#f0b429; --gold-txt:#f5c542;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  /* ---------- Ladebildschirm ----------
     Karls Ansage vom 22.08.2026: „Ich brauche einen lade screen mit brock drauf."
     ⚠️ Er liegt ueber allem. Alles hier drin muss ohne JavaScript funktionieren, weil er
     genau dann sichtbar ist, wenn das Skript noch nicht gelaufen ist. */
  #splash{position:fixed; inset:0; z-index:9000; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px)}
  #splash{transition:opacity .3s ease, visibility 0s .3s}
  #splash.weg{opacity:0; visibility:hidden; pointer-events:none}
  #splash img{width:132px; height:132px; object-fit:contain; display:block;
    animation:splashHeb 1.6s ease-in-out infinite}
  /* Karls Entwurf vom 23.08.2026: Wortmarke oben, darunter der Satz, dann Brock.
     ⚠️ Die zwei Farben stehen als HTML da (`gym<span>-log</span>`) und nicht als
     Bild — der Ladebildschirm ist genau dann sichtbar, wenn noch nichts geladen ist. */
  #splash .titel{font-size:40px; font-weight:800; letter-spacing:-.5px; color:var(--txt);
    line-height:1}
  #splash .titel span{color:var(--ok)}
  #splash .unter{font-size:14px; color:var(--muted); margin-top:-8px}
  #splash .laedt{font-size:13px; color:var(--ok); margin-bottom:-6px}
  #splash .balken{width:132px; height:4px; border-radius:99px; background:var(--line);
    overflow:hidden; position:relative}
  #splash .balken:after{content:''; position:absolute; inset:0; width:40%; border-radius:99px;
    background:var(--ok); animation:splashLauf 1.15s ease-in-out infinite}
  @keyframes splashHeb{0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)}}
  @keyframes splashLauf{0%{left:-40%} 100%{left:100%}}
  /* ⚠️ Wer „Bewegung reduzieren" gesetzt hat, bekommt einen ruhigen Schirm statt eines
     huepfenden Monsters. Der Balken bleibt sichtbar, damit man sieht, dass etwas laeuft. */
  @media (prefers-reduced-motion:reduce){
    #splash img{animation:none}
    #splash .balken:after{animation:none; width:100%; left:0; opacity:.5}
  }

  html,body{margin:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; transition:background .25s}
  /* Kein Kopfbereich mehr — der Abstand nach oben sitzt jetzt am Body. */
  body{max-width:520px; margin:0 auto; padding:0 0 96px; padding-top:calc(env(safe-area-inset-top) + 18px)}
  h1,h2,h3{margin:0; font-weight:700}
  button{font-family:inherit; cursor:pointer; border:none; color:var(--txt)}
  input{font-family:inherit}
  .wrap{padding:0 var(--sp)}
  .theme-toggle{width:38px;height:38px;flex:0 0 38px; display:grid; place-items:center;
    background:var(--card2); border:1px solid var(--line); border-radius:11px; color:var(--muted)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin:12px 0}
  .card h2{font-size:16px; margin-bottom:4px}
  .row{display:flex; align-items:center; gap:12px}
  .between{justify-content:space-between}
  .muted{color:var(--muted)} .tiny{font-size:12px}
  .pill{font-size:11px; padding:3px 9px; border-radius:999px; background:var(--card2); color:var(--muted)}
  .btn{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    font-size:15px; font-weight:600; width:100%; text-align:center}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn.primary:active{filter:brightness(.9)}
  .btn.ghost{background:transparent}
  .btn.sm{width:auto; padding:8px 12px; font-size:13px}
  /* Der Abschluss-Knopf (03.09.2026, Karls Ansage „am besten einen grossen fertig button
     unten"). Deutlich hoeher als ein normaler Knopf, damit er am Ende einer langen Seite
     ohne Zielen zu treffen ist. */
  .btn.gross{padding:18px 14px; font-size:17px; border-radius:14px}
  /* Favoriten-Stern (03.09.2026). 40x40 Trefferflaeche bei 20 px Zeichen -- er sitzt
     direkt neben dem Loesch-Kreuz, und die beiden duerfen sich nicht verwechseln lassen. */
  .fav-stern{width:40px; height:40px; flex:0 0 auto; display:inline-flex; align-items:center;
    justify-content:center; background:none; border:0; cursor:pointer; font-size:20px;
    line-height:1; color:var(--muted); padding:0}
  .fav-stern.an{color:#f59e0b}
  .fav-stern:active{transform:scale(.9)}
  /* Brock oben: etwas flacher als eine normale Karte -- er ist eine Begruessung,
     kein Datenblock, und darf der Ueberschrift „Heute" nicht die Schau stehlen. */
  .brock-oben{padding:12px 14px}
  .brock-oben .bubble{margin:0}
  .listen-kopf{font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--muted); padding:14px 4px 6px}
  .btn.danger{color:var(--danger)}
  .iconbtn{width:40px;height:40px;flex:0 0 40px; display:grid; place-items:center;
    background:var(--card2); border:1px solid var(--line); border-radius:12px; color:var(--muted)}
  /* Knopfreihe. Ohne flex-basis + wrap passen drei Knoepfe (Auswaehlen · Bearbeiten · Loeschen)
     bei 320 px nicht nebeneinander: Flex-Elemente schrumpfen von sich aus nicht unter ihre
     Textbreite, also ragte die Reihe aus dem Bild. Jetzt rutscht der letzte notfalls nach unten. */
  .fab-row{display:flex; gap:10px; flex-wrap:wrap}
  .fab-row > .btn{flex:1 1 96px; width:auto; min-width:0}
  /* rank card */
  .rankcard{position:relative; overflow:hidden}
  .rc-body{position:relative; z-index:2}
  .spark{position:absolute; width:5px; height:5px; border-radius:99px; background:#fff;
    box-shadow:0 0 7px #fff, 0 0 13px var(--rc); opacity:.2; z-index:1; pointer-events:none;
    animation:tw 1.9s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.1; transform:scale(.5)} 50%{opacity:.95; transform:scale(1.35)}}
  .aura-1{box-shadow:0 0 18px -9px var(--rc)}
  .aura-2{box-shadow:0 0 26px -7px var(--rc); border-color:var(--rc)}
  .aura-3{box-shadow:0 0 34px -5px var(--rc); border-color:var(--rc)}
  .aura-4{border-color:var(--rc); animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 26px -6px var(--rc)} 50%{box-shadow:0 0 54px 0 var(--rc)}}
  .aura-3::after,.aura-4::after{content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);
    transform:translateX(-130%); animation:shimmer 3.6s ease-in-out infinite}
  @keyframes shimmer{0%,55%{transform:translateX(-130%)} 100%{transform:translateX(130%)}}
  .aura-2 .badge{filter:drop-shadow(0 0 8px var(--rc))}
  .aura-3 .badge{filter:drop-shadow(0 0 11px var(--rc))}
  .aura-4 .badge{filter:drop-shadow(0 0 15px var(--rc))}
  @media (prefers-reduced-motion: reduce){ .spark,.aura-4,.aura-3::after,.aura-4::after{animation:none} }
  .badge{width:44px;height:44px;flex:0 0 44px; display:grid; place-items:center}
  .xpbar{height:10px; background:var(--card2); border-radius:99px; overflow:hidden; margin:12px 0 6px}
  .xpbar > i{display:block; height:100%; background:var(--accent); border-radius:99px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center}
  .stat b{display:block; font-size:22px} .stat span{color:var(--muted); font-size:11px}
  .plan-chip{display:inline-flex; align-items:center; gap:8px}
  .dot{width:9px;height:9px;border-radius:99px;background:var(--accent)}
  /* exercise/sets */
  .ex{background:var(--card); border:1px solid var(--line); border-radius:var(--r); margin:12px 0; overflow:hidden}
  .ex.active{border-color:var(--accent)}
  .ex-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; gap:10px}
  .ex-head .name{font-size:16px; font-weight:700}
  .ex-body{padding:0 12px 12px}
  .set{display:grid; grid-template-columns:26px 1fr 1fr 46px; gap:8px; align-items:center; padding:6px 4px}
  .set .idx{color:var(--muted); font-weight:700; text-align:center; font-size:13px}
  .set input{width:100%; background:var(--card2); border:1px solid var(--line); border-radius:10px;
    color:var(--txt); padding:11px 8px; font-size:16px; text-align:center}
  .set.done input{opacity:.5}
  /* Laufzeit oben rechts im Training: soll man im Vorbeigehen ablesen koennen, deshalb gross
     und in der Akzentfarbe. tabular-nums, damit die Ziffern beim Ticken nicht springen. */
  .sessclock{text-align:right; line-height:1.1; flex:0 0 auto}
  .sessclock b{display:block; font-size:26px; font-weight:800; color:var(--ok);
    font-variant-numeric:tabular-nums; letter-spacing:.5px}
  .sessclock span{display:block; font-size:11px; color:var(--muted); margin-top:2px}
  /* Aufwaermsatz: zaehlt nicht mit, deshalb sichtbar zurueckgenommen und mit „W" statt Nummer */
  .set.warm .idx{color:var(--ok); font-size:12px}
  .set.warm input{border-style:dashed}
  .set .target{padding:11px 8px; font-size:15px; font-weight:700; text-align:center;
    color:var(--muted); border:1px dashed var(--line); border-radius:10px; white-space:nowrap}
  .set.done .target{opacity:.5}
  .ex-target{width:100%; padding:11px 8px; font-size:15px; font-weight:700; text-align:center;
    color:var(--muted); background:transparent; border:1px dashed var(--line); border-radius:10px}
  /* Ohne min-width:0 schrumpft ein Flex-Element nie unter seine Inhaltsbreite — bei 320 px
     schob das Namensfeld den Loesch-Knopf aus dem Bild. Bestand schon vor dem 05.08. */
  .ex-name{min-width:0}
  .ex-vol{display:grid; grid-template-columns:1fr 1fr; gap:6px}
  .ex-vol .chip{padding:11px 0; text-align:center; font-size:12.5px}
  .chip[disabled]{opacity:.35}
  .check{width:44px;height:42px; border-radius:10px; background:var(--card2); border:1px solid var(--line);
    display:grid; place-items:center; color:var(--muted)}
  .check.on{background:var(--ok); border-color:var(--ok); color:var(--bg)}
  .set-head{display:grid; grid-template-columns:26px 1fr 1fr 46px; gap:8px; padding:2px 4px;
    color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px}
  .set-head span{text-align:center}
  .hint{color:var(--muted); font-size:12px; padding:2px 4px 8px}
  .hint b{color:var(--txt)}
  .hint.up{color:var(--ok)} .hint.up b{color:var(--ok)}
  .field{margin:10px 0}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px}
  .field input{width:100%; background:var(--card2); border:1px solid var(--line); border-radius:12px;
    color:var(--txt); padding:13px; font-size:16px}
  /* Kalorien: Makro-Zeilen neben dem Ring, und ein Balken fuers Warten auf Barcode/KI */
  /* Melde-Postfach (23.08.2026) */
  .meld{padding:12px 14px}
  .meld + .meld{border-top:1px solid var(--line)}
  /* Eine unglelesene Antwort bekommt eine Kante, keine Flaeche — dieselbe
     Begruendung wie beim faelligen Mahlzeiten-Block. */
  .meld.neu{box-shadow:inset 3px 0 0 var(--ok); cursor:pointer}
  .meld-antwort{margin-top:8px; padding:8px 10px; border-radius:10px; background:var(--card2)}
  .rotzahl{min-width:20px; height:20px; padding:0 6px; border-radius:99px; background:var(--danger);
    color:#fff; font-size:12px; font-weight:700; display:inline-flex; align-items:center;
    justify-content:center}
  /* Dieselbe rote Zahl, aber an der unteren Leiste. Sie sitzt am Zahnrad, weil das
     Postfach dort drin liegt -- eine Zahl an einer Stelle, hinter der nichts steckt,
     waere schlimmer als keine. */
  nav button{position:relative}
  /* ⚠️ `.navtxt` ist auf dem Handy bewusst `position:static`. Die Zahl liegt IM Wort-Span,
     positioniert sich dadurch aber gegen den Knopf (der ist `position:relative`) -- also
     genau wie vor dem 27.08. Erst die PC-Fassung unten schaltet den Span auf `relative`
     und holt die Zahl damit ans Wort heran. Ein Umhaengen im DOM je Bildschirmbreite waere
     die Alternative gewesen; ein Wort, das seinen eigenen Bezugsrahmen mitbringt, ist
     weniger beweglich und faellt bei Umbauten nicht auf die Nase. */
  .navtxt{position:static}
  .navpunkt{position:absolute; top:4px; left:50%; margin-left:6px; min-width:16px; height:16px;
    padding:0 4px; border-radius:99px; background:var(--danger); color:#fff; font-size:10px;
    font-weight:700; display:flex; align-items:center; justify-content:center; line-height:1}

  /* ---- Neue Erfolge: goldene Zahl + Zeichen, das sich bewegt (27.08.2026) ----
     Karls Wunsch: "eine goldene Zahl wenn man ein neues Achievement freigeschaltet hat,
     und das Zeichen wird dann auch Gold und bewegt sich so ein bisschen."
     ⚠️ Rot heisst in dieser App "da liegt etwas fuer dich" (Postfach). Ein Erfolg ist
     kein offener Posten, sondern eine Belohnung -- deshalb Gold und nicht dieselbe rote
     Zahl. Zwei verschiedene Sachen duerfen nicht gleich aussehen. */
  .navpunkt.gold{background:var(--gold); color:#3a2a00; box-shadow:0 0 0 2px var(--card), 0 0 10px rgba(245,197,66,.55)}
  nav button.hat-neu{color:var(--gold-txt)}
  nav button.hat-neu svg{animation:pokal 2.2s ease-in-out infinite; transform-origin:50% 70%}
  @keyframes pokal{
    0%,68%,100%{transform:rotate(0) scale(1)}
    74%{transform:rotate(-9deg) scale(1.08)}
    80%{transform:rotate(7deg) scale(1.08)}
    86%{transform:rotate(-5deg) scale(1.04)}
    92%{transform:rotate(0) scale(1)} }
  /* Wer Bewegung abgestellt hat, bekommt keine — das Gold traegt die Botschaft auch allein. */
  @media (prefers-reduced-motion: reduce){ nav button.hat-neu svg{animation:none} }

  /* ---- Der Seitenwechsel (27.08.2026) ----
     Karls Wunsch: "kann die Animation, wenn ich zur naechsten Seite switche, besser aussehen,
     nach richtig ziehen z. B.?"
     ⚠️ Die Bewegung sitzt am `#app`, nicht am `body`: die untere Leiste und der
     Pausen-Timer duerfen NICHT mitwandern -- die stehen ueber den Seiten, nicht auf einer.
     ⚠️ Kurz (0,22 s) und ohne Nachfedern. Eine Seite, die man zwanzigmal am Tag wechselt,
     darf nicht jedes Mal auf eine Animation warten lassen. */
  @keyframes blattVonRechts{ from{ transform:translateX(42px); opacity:.25 } to{ transform:none; opacity:1 } }
  @keyframes blattVonLinks { from{ transform:translateX(-42px); opacity:.25 } to{ transform:none; opacity:1 } }
  #app.rein-r{ animation:blattVonRechts .22s cubic-bezier(.2,.7,.3,1) }
  #app.rein-l{ animation:blattVonLinks  .22s cubic-bezier(.2,.7,.3,1) }
  #app.zieht{ transition:none }
  #app.faellt-zurueck{ transition:transform .18s cubic-bezier(.2,.7,.3,1) }
  @media (prefers-reduced-motion: reduce){
    #app.rein-r, #app.rein-l{ animation:none }
    #app.faellt-zurueck{ transition:none } }

  /* ---- Erfolgs-Symbole (27.08.2026) ----
     Derselbe Strich wie bei den Uebungsbildern. Drei Zustaende, und sie sind BEWUSST nicht
     nur ueber die Deckkraft getrennt: ein blasses Symbol und ein graues sehen bei Sonnenlicht
     auf dem Handy gleich aus. Offen bekommt deshalb die Muted-Farbe, frisch das Gold. */
  .erf-ico{fill:none; stroke:var(--txt); stroke-width:3; stroke-linecap:round;
    stroke-linejoin:round; flex:0 0 auto}
  .erf-ico .ma{stroke:var(--accent); stroke-width:4}
  .erf-zu{stroke:var(--muted); opacity:.45}
  .erf-zu .ma{stroke:var(--muted); stroke-width:3}
  .erf-gold{stroke:var(--gold-txt)}
  .erf-gold .ma{stroke:var(--gold)}
  /* Frisch freigeschaltet wackelt kurz — dieselbe Bewegung wie der Pokal an der Leiste,
     damit die goldene Zahl und das, was sie meint, erkennbar zusammengehoeren. */
  .erf-frisch .erf-ico{animation:pokal 2.2s ease-in-out infinite; transform-origin:50% 60%}
  @media (prefers-reduced-motion: reduce){ .erf-frisch .erf-ico{animation:none} }

  /* ---- Das Board oben auf der Erfolgs-Seite (27.08.2026) ---- */
  .erf-ring{width:78px; height:78px; flex:0 0 78px; border-radius:50%;
    background:conic-gradient(var(--accent) calc(var(--anteil,0)*1%), var(--card2) 0);
    display:flex; align-items:center; justify-content:center}
  .erf-ring-in{width:60px; height:60px; border-radius:50%; background:var(--card);
    display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.15}
  .erf-ring-in b{font-size:21px}
  /* Der frisch freigeschaltete Erfolg im Katalog. Nur eine Kante und ein Hauch Flaeche —
     eine kraeftig gefuellte Zeile zwischen grauen sieht aus wie "ausgewaehlt". */
  .erf-frisch{border-left:3px solid var(--gold); padding-left:9px; margin-left:-12px;
    background:rgba(245,197,66,.08); border-radius:0 8px 8px 0}
  .erf-neu-pill{background:var(--gold); color:#3a2a00; font-weight:800; padding:2px 8px;
    border-radius:99px; white-space:nowrap; letter-spacing:.4px}

  /* Mahlzeiten-Bloecke (23.08.2026, nach Karls Vorlage) */
  /* ➡️ „die schrift dort und der button sehen so ein bisschen gequetscht aus"
     (Karl, 03.09.2026). Nachgemessen war es kein Gefuehl, sondern eine Zahl: der
     Plus-Knopf war **32x32 px**. Apple nennt 44x44 als Mindestmass fuer alles, was ein
     Daumen treffen soll, Google 48x48 -- der Knopf lag unter beidem.
     🔴 Und er ist seit derselben Ansage der EINZIGE Weg ins Essen-Eintragen (der
     allgemeine Knopf ist weg). Ein zu kleines Ziel ist damit nicht mehr nur unschoen,
     sondern die einzige Tuer. */
  .mz{padding:14px}
  .mz.trenn{border-top:1px solid var(--line)}
  /* Der jetzt faellige Block bekommt eine Kante statt einer Flaeche - eine gefuellte
     Zeile zwischen drei leeren sieht aus wie "ausgewaehlt", und ausgewaehlt ist hier
     nichts. Es ist ein Hinweis, keine Auswahl. */
  .mz.jetzt{box-shadow:inset 3px 0 0 var(--ok)}
  .mz-icon{font-size:23px; width:38px; height:38px; border-radius:99px; background:var(--card2);
    display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto}
  /* 44x44 als Trefferflaeche, aber der Kreis sieht mit einem ruhigeren Rahmen aus als
     vorher -- gewachsen ist das Ziel, nicht die Lautstaerke. */
  /* ➡️ Weiss (03.09.2026, Karls Ansage: „meal selection buttons to white background").
     🔴 Fest `#fff` und nicht `var(--card2)`: der Knopf soll in BEIDEN Themen weiss sein.
     Im hellen Thema hebt ihn der Rahmen von der Karte ab, im dunklen ist er der einzige
     helle Punkt der Seite -- was hier richtig ist, weil er seit derselben Ansage der
     einzige Weg ins Essen-Eintragen ist. Das Plus wird dafuer dunkel, sonst stuende
     weisse Schrift auf weissem Grund. */
  .mz-plus{width:44px; height:44px; flex:0 0 auto; border-radius:99px; cursor:pointer;
    border:1px solid rgba(0,0,0,.14); background:#fff; color:#111;
    font-size:24px; line-height:1; display:inline-flex; align-items:center; justify-content:center;
    transition:transform .08s, background .12s; font-weight:600;
    box-shadow:0 1px 2px rgba(0,0,0,.18)}
  .mz-plus:active{transform:scale(.94); background:#e9e9e9}
  /* Die Eintraege standen auf 6 px Luft und 14 px Schrift -- zusammen mit dem Datum
     darunter waren das drei Zeilen in der Hoehe von zweien. */
  .mz-eintrag{display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:9px 0 9px 48px; font-size:14.5px; line-height:1.45}
  .mz-eintrag + .mz-eintrag{border-top:1px solid var(--line)}

  /* Die Ess-Serie (23.08.2026). Grau, solange sie bei 0 steht — siehe flammeHTML(). */
  .flamme{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:99px;
    background:var(--card2); border:1px solid var(--line); font-size:13px; line-height:1;
    color:var(--muted); white-space:nowrap}
  .flamme span[aria-hidden]{font-size:14px; filter:grayscale(1); opacity:.55}
  .flamme b{font-weight:700}
  /* ⚠️ Zwei Zeilen mit Absicht: color-mix kann aelteres Safari nicht. Ohne die
     erste Zeile faellt der Hintergrund dort ganz weg und die aktive Flamme saehe
     aus wie die inaktive. Die zweite ueberschreibt sie, wo color-mix geht. */
  .flamme.an{color:var(--txt); border-color:transparent; background:rgba(245,158,11,.16)}
  @supports (background: color-mix(in srgb, red 10%, transparent)){
    .flamme.an{background:color-mix(in srgb, #f59e0b 16%, transparent)}
  }
  .flamme.an span[aria-hidden]{filter:none; opacity:1}
  .flamme .rek{font-size:11px; color:var(--muted); font-weight:600}
  .flamme .rek:before{content:'2'; margin-right:4px; opacity:.6}
  .makro{display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    padding:5px 0; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .makro:last-child{border-bottom:none}
  .makro b{color:var(--txt); font-size:15px}
  .ladebalken{height:6px; border-radius:99px; background:var(--card2); overflow:hidden; margin-top:12px}
  .ladebalken > i{display:block; height:100%; width:40%; border-radius:99px; background:var(--accent);
    animation:laden 1.1s ease-in-out infinite}
  @keyframes laden{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}
  @media (prefers-reduced-motion: reduce){ .ladebalken > i{animation:none; width:100%} }
  .sess{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line)}
  .sess:last-child{border-bottom:none}
  .link{color:var(--accent); background:none; font-weight:600; font-size:14px; padding:4px}
  /* ➡️ Einheitlicher Zurueck-Pfeil (03.09.2026, Karls Ansage: „replace all small
     text-based back links, use a back-arrow icon only, increase the tap target").
     Vorher waren es acht Textlinks („‹ Einstellungen", „‹ Kalorien", „‹ Verlauf" …) in
     14 px Schrift mit 4 px Polsterung -- eine Trefferflaeche von rund 20 px Hoehe.
     🔴 Das Ziel steht weiter im `aria-label`: sichtbar ist nur der Pfeil, aber wer die
     Seite vorgelesen bekommt, hoert weiterhin, wohin er zurueckgeht. Ein Pfeil ohne
     jede Beschriftung heisst dort nur „Schaltflaeche". */
  .zurueck{width:44px; height:44px; margin:0 0 4px -8px; flex:0 0 auto; padding:0;
    display:inline-flex; align-items:center; justify-content:center;
    background:none; border:0; color:var(--accent); cursor:pointer; border-radius:99px;
    transition:transform .08s, background .12s}
  .zurueck:active{transform:scale(.92); background:var(--card2)}
  .del-x{color:var(--muted); background:none; font-size:20px; padding:4px 8px}
  .empty{text-align:center; color:var(--muted); padding:30px 10px}
  .ex-ico{flex:0 0 auto; display:grid; place-items:center; background:var(--card2); border:1px solid var(--line); border-radius:10px; color:var(--txt)}
  .ex-move{display:flex; flex-direction:column; gap:3px; flex:0 0 auto}
  .ex-move button{background:var(--card2); border:1px solid var(--line); color:var(--txt);
    border-radius:8px; width:30px; height:23px; font-size:11px; line-height:1; padding:0}
  .ex-move button:disabled{opacity:.3}
  .mon{display:block; height:auto; animation:monbob 3.2s ease-in-out infinite}
  @keyframes monbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @media (prefers-reduced-motion: reduce){ .mon{animation:none} }
  .mascot{display:flex; align-items:center; gap:11px; margin:2px 2px 16px}
  .mascot .mon{flex:0 0 auto}
  .bubble{position:relative; background:var(--card); border:1px solid var(--line); border-radius:15px;
    padding:11px 13px; font-size:13.5px; line-height:1.55; flex:1}
  .bubble:before{content:''; position:absolute; left:-7px; top:26px; width:12px; height:12px; background:var(--card);
    border-left:1px solid var(--line); border-bottom:1px solid var(--line); transform:rotate(45deg)}
  /* Kleine Fassung: Brock sitzt direkt in der Heute-Karte, deshalb Blase auf Kartenhintergrund */
  /* Sprechblase unter Brock+Ring: ohne Zipfel, weil daneben niemand mehr steht. */
  .kcal-bubble{margin-top:12px; text-align:center}
  .kcal-bubble:before{display:none}
  .mascot.mini{gap:9px; margin:12px 0 0}
  .mascot.mini .bubble{background:var(--card2); padding:9px 12px; font-size:13px; border-radius:13px}
  .mascot.mini .bubble:before{background:var(--card2); top:17px; left:-6px; width:10px; height:10px}
  .chip{background:var(--card2); border:1px solid var(--line); color:var(--txt); border-radius:11px;
    padding:9px 12px; font-size:13px; font-weight:600}
  .chip.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .chip.big{padding:14px 0; font-size:17px; font-weight:800}
  .ob-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
  .ob-days{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  /* Zeitraum-Wahl ueber der Gewichtskurve (01.09.2026). Vier gleich breite Felder statt
     umbrechender Reihe: die vier Zeitraeume sind EINE Auswahl, kein Sortiment. */
  .zeitwahl{display:grid; grid-template-columns:repeat(4,1fr); gap:6px}
  .zeitwahl .chip{padding:10px 0; text-align:center; font-size:12.5px}
  .ob-days .chip{padding:11px 0; text-align:center}
  .ob-favs{display:flex; flex-wrap:wrap; gap:7px}
  .ob-favs .chip{padding:8px 11px; font-size:12.5px; font-weight:500}
  .ob-dots{display:flex; gap:6px; justify-content:center; margin:2px 0 16px}
  .ob-dots i{width:26px; height:4px; border-radius:99px; background:var(--line)}
  .ob-dots i.on{background:var(--accent)}
  .ob-opt{display:block; width:100%; text-align:left; background:var(--card2); border:1px solid var(--line);
    border-radius:14px; padding:14px; margin-bottom:10px; color:var(--txt)}
  .ob-opt.on{border-color:var(--accent)}
  .ob-opt b{display:block; font-size:15px; margin-bottom:4px}
  .ob-opt span{display:block; font-size:12.5px; color:var(--muted); line-height:1.55}
  .ob-sum > div{padding:9px 0; border-bottom:1px solid var(--line); font-size:14px}
  .ob-sum > div:last-child{border-bottom:none}
  .exa{fill:none; stroke:var(--txt); stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
  .exa .ma{stroke:var(--accent); stroke-width:4.4}
  @media (prefers-reduced-motion: reduce){ .exa animate, .exa animateTransform{display:none} }
  .lib-row{display:flex; align-items:center; gap:12px; width:100%; background:none; border:none;
    border-bottom:1px solid var(--line); padding:11px 4px; text-align:left; font-size:15px; color:var(--txt)}
  .lib-row:last-child{border-bottom:none}
  /* rank ladder + themes */
  .ladder-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line)}
  .ladder-row:last-child{border-bottom:none}
  .ladder-row.now{}
  .ladder-badge{width:30px;height:30px;flex:0 0 30px; display:grid; place-items:center; color:var(--c)}
  .theme-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .theme-cell{border:1px solid var(--line); border-radius:14px; padding:12px; position:relative; cursor:pointer}
  .theme-cell.on{border-color:var(--accent)}
  .theme-cell.locked{opacity:.55}
  .sw{display:flex; gap:5px; margin-bottom:8px}
  .sw i{width:20px;height:20px;border-radius:6px; display:block; border:1px solid rgba(255,255,255,.12)}
  .lock{position:absolute; top:10px; right:10px; color:var(--muted)}
  /* timer */
  #timerbar{position:fixed; left:0; right:0; bottom:56px; z-index:40; max-width:520px; margin:0 auto;
    padding:8px var(--sp); display:none}
  #timerbar.show{display:block}
  .timer{background:var(--card); border:1px solid var(--accent); border-radius:14px; padding:10px 12px;
    display:flex; align-items:center; gap:10px}
  .timer .time{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; min-width:70px}
  .timer .bar{flex:1; height:8px; background:var(--card2); border-radius:99px; overflow:hidden}
  .timer .bar > i{display:block; height:100%; background:var(--accent)}
  .timer .t-btn{background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:8px 9px; font-size:13px; font-weight:700}
  nav{position:fixed; left:0; right:0; bottom:0; z-index:30; max-width:520px; margin:0 auto; display:flex;
    background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1; background:none; padding:9px 0 8px; color:var(--muted); display:flex; flex-direction:column;
    align-items:center; gap:3px; font-size:11px}
  nav button.on{color:var(--accent)} nav svg{width:22px;height:22px}
  body.gate #nav, body.gate #timerbar, body.setup #nav, body.setup #timerbar{display:none}
  body.gate main, body.setup main{padding-bottom:32px}
  .gate-hero{text-align:center; margin:18px 0 22px}
  .gate-hero .big{font-size:22px; font-weight:800; margin-bottom:6px}
  .toast{position:fixed; left:50%; bottom:120px; transform:translateX(-50%); background:var(--ok); color:var(--bg);
    padding:10px 16px; border-radius:12px; font-weight:700; z-index:60; opacity:0; transition:opacity .2s;
    pointer-events:none; max-width:88%; text-align:center}
  .toast.show{opacity:1}
  /* ---------- Hinweis auf eine neue Fassung (31.08.2026) ----------
     Karl hatte am 27.08. zweimal die alte Fassung vor sich, ohne es zu merken -- einmal davon
     hat er es als Fehler gemeldet ("es sind nur 2 Tutorials da"). Der Service Worker holt
     zwar sofort das Neue, aber ein Fenster, das schon offen steht, behaelt sein altes HTML.
     ⚠️ Oben und nicht unten: unten sitzen schon Reiterleiste und Pausenuhr -- und die Uhr
     laeuft genau dann, wenn am wenigsten Platz fuer etwas Drittes ist. */
  #neufassung{position:fixed; left:0; right:0; top:0; z-index:70; max-width:520px; margin:0 auto;
    display:none; width:100%; border:0; background:var(--accent); color:var(--bg);
    font-weight:700; font-size:13px; text-align:center; cursor:pointer;
    padding:9px 14px; padding-top:calc(9px + env(safe-area-inset-top))}
  #neufassung.show{display:block}
  /* Dieselbe Leiste wie oben, nur in Rot: sie meldet, dass das Geraet nichts mehr
     behaelt. Sie sitzt darunter, damit sich beide nicht verdecken. */
  #speicherwarnung{position:fixed; left:0; right:0; top:0; z-index:69; max-width:520px; margin:0 auto;
    display:none; width:100%; border:0; background:var(--danger); color:#fff;
    font-weight:700; font-size:13px; text-align:center; cursor:pointer;
    padding:9px 14px; padding-top:calc(9px + env(safe-area-inset-top))}
  #speicherwarnung.show{display:block}
  #neufassung.show ~ #speicherwarnung.show{top:36px}
  /* Dieselbe Bauart, dritte Leiste: ein Fehler, den bis zum 02.09.2026 NIEMAND gefangen
     hat -- window.onerror und unhandledrejection gab es in der ganzen App nicht (nachgesehen:
     null Treffer in 6600 Zeilen). Grau statt Rot: kein Datenverlust wie bei speicherwarnung,
     nur „etwas ist schiefgelaufen, wurde aber gefangen". */
  #fehlerbanner{position:fixed; left:0; right:0; top:0; z-index:68; max-width:520px; margin:0 auto;
    display:none; width:100%; border:0; background:var(--card2); color:var(--txt);
    border-bottom:1px solid var(--line);
    font-weight:600; font-size:13px; text-align:center; cursor:pointer;
    padding:9px 14px; padding-top:calc(9px + env(safe-area-inset-top))}
  #fehlerbanner.show{display:block}
  #neufassung.show ~ #fehlerbanner.show{top:36px}
  #speicherwarnung.show ~ #fehlerbanner.show{top:36px}
  #neufassung.show ~ #speicherwarnung.show ~ #fehlerbanner.show{top:72px}
  .modal{position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.6); display:none;
    align-items:center; justify-content:center; padding:24px}
  .modal.show{display:flex}
  .modal-box{background:var(--card); border:1px solid var(--accent); border-radius:20px; padding:24px;
    max-width:340px; width:100%; text-align:center}
  .modal-box .big{font-size:40px; font-weight:800; margin:6px 0}

  /* ============================================================
     PC-Version (ab 900 px). Dieselbe App, nur anders angeordnet:
     die untere Leiste wandert als Seitenleiste nach links, der Inhalt
     wird breiter und liegt in zwei Spalten. Kein zweiter Quelltext —
     alles ueber Umbrueche, damit es eine App bleibt.
     ============================================================ */
  @media (min-width: 900px){
    body{max-width:none; padding:0 0 40px 232px; padding-top:32px}
    #app.wrap{max-width:980px; margin:0 auto; padding:0 32px}

    /* Untere Leiste wird zur Seitenleiste */
    nav{top:0; bottom:0; right:auto; left:0; width:232px; max-width:none; flex-direction:column;
      justify-content:flex-start; gap:4px; padding:26px 14px; border-top:none;
      border-right:1px solid var(--line)}
    nav:before{content:'Gym-Log'; display:block; font-size:17px; font-weight:800;
      color:var(--txt); padding:0 12px 18px}
    nav button{flex:0 0 auto; flex-direction:row; justify-content:flex-start; gap:12px;
      font-size:14.5px; font-weight:600; padding:11px 12px; border-radius:12px; width:100%}
    nav button.on{background:var(--card2)}
    /* 🔴 Karls Meldung vom 27.08.2026: "auf dem PC ist die rote Zahl ein bisschen
       verschoben, die muss rechts ueber dem Wort sein wie auf dem Handy auch."
       Und so war es auch: `left:50%` meint in der Seitenleiste die Mitte eines 204 px
       breiten Knopfes -- die Zahl schwebte hinter dem Wort im Leeren. Hier wird der
       Wort-Span zum Bezugsrahmen, damit die Zahl an der Schrift klebt und nicht an der
       Knopfbreite. Mitgewandert waere sie sonst bei jeder Aenderung an der Leiste. */
    .navtxt{position:relative}
    .navpunkt{top:-7px; left:auto; right:-15px; margin-left:0}
    body.gate{padding-left:0} body.setup{padding-left:0}

    /* Pausen-Timer sitzt rechts unten statt ueber der Leiste */
    #timerbar{left:auto; right:24px; bottom:24px; width:380px; max-width:none; margin:0; padding:0}

    /* Zwei Spalten: Karten fliessen nebeneinander statt endlos untereinander */
    .cols2{display:grid; grid-template-columns:1fr 1fr; gap:0 24px; align-items:start}
    .cols2 > .spanne{grid-column:1 / -1}

    /* Auf breiten Schirmen darf mehr nebeneinander */
    .grid3{grid-template-columns:repeat(3,1fr)}
    .ob-favs .chip{font-size:13px}
    .theme-grid{grid-template-columns:repeat(3,1fr)}
    .modal-box{max-width:460px}
    /* Zeiger nur dort, wo wirklich geklickt werden kann */
    .card[data-nav],.card[data-act],.lib-row,.chip,.btn,.iconbtn{cursor:pointer}
  }
  @media (min-width: 1280px){
    #app.wrap{max-width:1120px}
  }

  /* Kippschalter (29.08.2026, Karls Ansage: "ich will so einen richtigen Schalter").
     Vorher stand dort ein Knopf mit "Ausschalten"/"Einschalten" -- der sagt, was PASSIEREN
     WUERDE, nicht was IST. Ein Kippschalter zeigt den Zustand selbst, und den liest man ohne
     zu lesen.
     ⚠️ Die Masse haengen zusammen: 28 hoch minus 2x1 Rahmen = 26 innen, Knopf 22 mit je 2 px
     Luft. Der Weg nach rechts ist 44 innen - 22 Knopf - 2x2 Luft = 18. Wer eine Zahl aendert,
     muss die anderen mitrechnen, sonst sitzt der Knopf schief. */
  .schalter{position:relative; flex:0 0 auto; width:46px; height:28px; border-radius:999px;
    background:var(--card2); border:1px solid var(--line); padding:0; cursor:pointer;
    transition:background .18s ease, border-color .18s ease}
  .schalter i{position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%;
    background:var(--txt); display:block; transition:transform .18s ease, background .18s ease}
  .schalter.an{background:var(--ok); border-color:var(--ok)}
  .schalter.an i{transform:translateX(18px); background:#fff}
  /* Tastatur: ohne das waere der Schalter nur mit der Maus als "hier bin ich" erkennbar. */
  .schalter:focus-visible{outline:2px solid var(--ok); outline-offset:2px}
  /* ⚠️ Wer Bewegung im System abgestellt hat, bekommt sie auch hier nicht. */
  @media (prefers-reduced-motion: reduce){
    .schalter, .schalter i{transition:none}
  }

  /* Kurve mit Beschriftung.
     Die Zahlen stehen als HTML NEBEN dem SVG, nicht darin: das SVG wird mit
     preserveAspectRatio="none" auf die volle Kartenbreite gezogen, Text darin waere auf
     breiten Schirmen waagerecht mitgedehnt und damit verzerrt.
     Die 4px Innenabstand oben/unten setzen die Mitte der ersten und letzten Zahl genau auf
     die 10px Rand, die das SVG oben und unten haelt -- sonst zeigen die Zahlen daneben. */
  .chart{display:grid; grid-template-columns:auto 1fr; gap:0 7px}
  .chart-y{display:flex; flex-direction:column; justify-content:space-between; padding:4px 0;
    text-align:right; font-size:10px; line-height:12px; color:var(--muted); white-space:nowrap}
  .chart-y.einer{justify-content:flex-end}

     ausgerechnet fuer Plaene, Einheiten und Profil. Die vier Nebensachen
     (meldungenSchreiben, postfachSchreiben, letzteMailMerken, bremseSchreiben) waren
     alle abgesichert.
     Was passierte: `save()` schreibt fuenf Schluessel nacheinander und ruft DANACH
     scheduleSync(). Wirft der zweite (Speicher voll, Safari mit gesperrtem
     Seitenspeicher), steht der erste schon, die restlichen drei nicht, und der Abgleich
     lief nie. Auf dem Bildschirm sah alles richtig aus -- der Wert stand ja in der
     Variablen. Weg war er erst nach dem naechsten Neuladen.
     ⚠️ Der Rueckgabewert ist der Punkt, nicht das catch: nur so kann `save()`
     ueberhaupt merken, dass etwas fehlt. Ein stilles catch haette den Absturz
     verhindert und den Datenverlust behalten. */
  set(k,v){ try{ localStorage.setItem('gymlog:'+k, JSON.stringify(v)); return true; }
            catch(e){ return false; } }
};

   Suchfeld. Wer nur blättert, sieht zuerst das Geläufige. */
EXLIB_WGER.forEach(([name, icon, reps]) => EXLIB.push({name, icon, reps}));

function guessIcon(name){ const n=(name||'').toLowerCase();
  if(/kniebeug|beinpress|ausfall|wade|kreuzheb|squat|bein|leg/.test(n)) return 'legs';
  if(/laufband|rudergerät|cardio|fahrrad|lauf|bike|ergo/.test(n)) return 'cardio';
  if(/klimmzug|latzug|lat|klimm|rudern|row|ruder/.test(n)) return 'pull';
  if(/schulter|seitheb|overhead/.test(n)) return 'shoulder';
  if(/curl|bizeps|hammer|trizeps|dip/.test(n)) return 'dumbbell';
  if(/crunch|plank|bauch|core|beinheb|situp/.test(n)) return 'core';
  if(/bank|brust|liege|butterfly|chest|drück/.test(n)) return 'press';
  return 'dumbbell';
}

// Für selbst angelegte Übungen: aus dem Namen raten
function guessMove(name){ const n=(name||'').toLowerCase();
  // ⚠️ Umlaut-Falle: „Klimmzüge" enthaelt NICHT „klimmzug", und „Überzüge" nicht „überzug".
  // Bis zum 22.08.2026 landeten beide bei der neutralen Hantel, sobald jemand sie als eigene
  // Uebung anlegte. Bei den hinterlegten Uebungen fiel es nie auf, weil dort EXMOVE zuerst
  // greift. Gefunden hat es der Pruefrahmen beim allerersten Lauf.
  if(/klimmz[uü]g|pull-?up/.test(n)) return 'pullup';
  if(/latzug|pulldown|überz[uü]g|pullover/.test(n)) return 'pulldown';
  if(/rudern|row|face pull/.test(n)) return 'row';
  if(/liegestütz|push-?up|burpee/.test(n)) return 'pushup';
  if(/dips?\b/.test(n)) return 'dip';
  if(/butterfly|fliegende|flye|pec deck/.test(n)) return 'flye';
  if(/schrägbank|incline|schrägdrück/.test(n)) return 'press_inc';
  if(/negativbank|decline/.test(n)) return 'press_dec';
  if(/bank|brustpresse|bench/.test(n)) return 'press_flat';
  if(/shrug|nackenheben|aufrechtes rudern/.test(n)) return 'shrug';
  if(/seitheb|lateral/.test(n)) return 'lateral';
  if(/fronthe/.test(n)) return 'front_raise';
  if(/schulterdrück|overhead|arnold|military/.test(n)) return 'ohp';
  if(/trizeps|stirndrück|french|kickback|pushdown/.test(n)) return 'pushdown';
  if(/curl|bizeps|hammer/.test(n)) return 'curl';
  if(/beinpress|leg press/.test(n)) return 'legpress';
  if(/beinstreck|leg ext/.test(n)) return 'legext';
  if(/beinbeug|leg curl|hamstring/.test(n)) return 'legcurl';
  if(/wade|calf/.test(n)) return 'calf';
  if(/kreuzheb|deadlift|swing|hyperext|rückenstreck|good morning/.test(n)) return 'deadlift';
  if(/hip thrust|glute bridge|beckenheb/.test(n)) return 'hipthrust';
  if(/kniebeug|squat|ausfall|lunge|step-?up|wall sit/.test(n)) return 'squat';
  if(/plank|unterarmstütz|mountain|rollout|ab-?wheel/.test(n)) return 'plank';
  if(/twist|seitlich/.test(n)) return 'twist';
  if(/crunch|sit-?up|bauch|beinheb/.test(n)) return 'crunch';
  if(/seilspring|rope/.test(n)) return 'rope';
  if(/fahrrad|ergo|bike|rad/.test(n)) return 'bike';
  if(/lauf|sprint|cross|stepper|cardio/.test(n)) return 'run';
  // Nichts erkannt → neutrale Hantel. Vorher stand hier 'curl', also machte jede unbekannte
  // Uebung Bizeps-Curls; bei eigenen Uebungen war das fast immer falsch.
  return 'dumbbell';
}
function iconTile(name,stored,size){ size=size||44;
  const mv=EXANIM[EXMOVE[name]||guessMove(name)]||EXANIM.dumbbell;
  return `<div class="ex-ico" style="width:${size}px;height:${size}px"><svg class="exa" viewBox="0 0 48 48" width="${size-4}" height="${size-4}" aria-hidden="true">${mv}</svg></div>`; }
function libRowHTML(x){ return `<button class="lib-row" data-libadd="${esc(x.name)}|${x.icon}|${x.reps}">${iconTile(x.name,x.icon,44)}<span>${esc(x.name)}</span></button>`; }
// Eigene Uebung: was man in die Suche tippt, ist zugleich der Name. Steht nichts Passendes in
// der Bibliothek, legt eine Zeile die Uebung genau so an — Icon wird geraten, sonst die Hantel.
function libNewHTML(name){ return `<button class="lib-row" data-libnew="${esc(name)}" style="color:var(--ok)">
  ${iconTile(name,null,44)}<span>„<b>${esc(name)}</b>" als eigene Übung anlegen</span></button>`; }
function renderLibList(q){ const list=document.getElementById('libList'); if(!list) return;
  const roh=(q||'').trim(); q=roh.toLowerCase();
  const items=q?EXLIB.filter(x=>x.name.toLowerCase().includes(q)):EXLIB;
  const genau=items.some(x=>x.name.toLowerCase()===q);
  let h=items.map(libRowHTML).join('');
  if(roh && !genau) h+=libNewHTML(roh);                      // eigene Uebung als letzte Zeile
  if(!h) h=`<div class="empty" style="padding:20px">Tipp einen Namen ein, um eine eigene Übung anzulegen.</div>`;
  list.innerHTML=h;
}
function openLibrary(){
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal-box" style="max-width:400px;text-align:left;max-height:82vh;display:flex;flex-direction:column;padding:16px">
    <div class="row between" style="margin-bottom:10px"><b>Übung wählen · ${EXLIB.length}</b><button class="del-x" data-act="closemodal" style="margin:0">✕</button></div>
    <input id="libSearch" placeholder="Suchen oder eigene eintippen…" autocomplete="off" style="width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:12px;font-size:16px;margin-bottom:10px">
    <div id="libList" style="overflow:auto;margin:0 -4px;flex:1"></div>
    <div class="tiny muted" style="padding:8px 2px 0;border-top:1px solid var(--line);margin-top:8px">
      Übungsdaten teilweise von <b>wger.de</b> · CC-BY-SA</div></div>`;
  m.classList.add('show'); renderLibList('');
}

function normalizeProfile(){
  if(!profile||typeof profile!=='object') profile={xp:0,theme:'system'};
  if(typeof profile.xp!=='number') profile.xp=0;
  if(!Array.isArray(profile.weights)) profile.weights=[];   // [{date, kg}] — Körpergewicht über die Zeit
  if(profile.rankSkin===undefined) profile.rankSkin=null;   // ausgerüsteter Rang (null = der echte)
  if(!profile.aufgaben||typeof profile.aufgaben!=='object') profile.aufgaben={tag:'',fertig:{}};  // Tagesaufgaben
  if(!profile.erfolge||typeof profile.erfolge!=='object') profile.erfolge={};              // schon ausgezahlte Erfolge
  /* Erinnerungen auf der Startseite (29.08.2026, Karls Ansage: abschaltbar).
     ⚠️ `ts` ist kein Schmuck: die Schalter muessen ueber den Abgleich zwischen Handy und PC
     wandern, und ohne Zeitstempel gibt es keine Regel, welche Seite gewinnt. Wer sie am
     Handy ausschaltet, will sie nicht am PC wiedersehen -- und umgekehrt genauso. */
  if(!profile.erinnerungen||typeof profile.erinnerungen!=='object') profile.erinnerungen={wiegen:true,essen:true,ts:0};
  if(typeof profile.erinnerungen.wiegen!=='boolean') profile.erinnerungen.wiegen=true;
  if(typeof profile.erinnerungen.essen!=='boolean') profile.erinnerungen.essen=true;
  if(typeof profile.erinnerungen.ts!=='number') profile.erinnerungen.ts=0;
  /* Welche Erfolge Karl schon GESEHEN hat -- davon haengt die goldene Zahl an der Leiste ab.
     ⚠️ Bleibt hier bewusst `null`, wenn das Feld fehlt, statt auf `{}` zu springen: `{}` hiesse
     "noch keinen gesehen", und beim ersten Start mit v33 leuchteten dann auf einen Schlag alle
     laengst verdienten Erfolge als neu auf. Gesaet wird erst in erfolgeGesehenInit() -- dort
     steht ERFOLGE zur Verfuegung, hier oben noch nicht (const, Zeile ~1290). */
  if(profile.erfolgeGesehen!==null && typeof profile.erfolgeGesehen!=='object') profile.erfolgeGesehen=null;
  /* Wann die App zuletzt offen war -- daran haengt das Wiederkommen (27.08.2026).
     ⚠️ Fehlt der Wert, ist er `null` und NICHT `Date.now()`. Beim ersten Start mit dieser
     Fassung weiss die App noch nichts, und "noch nichts" darf nicht als "war lange weg"
     durchgehen -- sonst begruesst sie jeden Bestandsnutzer beim Umstieg mit "wieder da?". */
  if(typeof profile.zuletztDa !== 'number') profile.zuletztDa = null;
  kcalInit();                                               // Tagesziel, eigene Lebensmittel, Mahlzeiten
}

   wie beim Essens-Serienrekord.

function gesamtVolumen(){ return sessions.reduce((v,s)=>v+volume(s.entries),0); }

/* ⚠️ Beide benutzen `wochenStart()` weiter unten -- die App hat ihren eigenen Begriff von
   einer Woche (Montag 00:00), und der muss ueberall derselbe sein. Beim ersten Bauen stand
   hier eine eigene Wochenrechnung; die haette an einer Stelle Montag und an einer anderen
   Donnerstag gemeint. */
function besteWoche(){
  const z={}; sessions.forEach(s=>{ const w=wochenStart(s.date); z[w]=(z[w]||0)+1; });
  return Object.values(z).reduce((m,v)=>Math.max(m,v),0);
}
/* 🔴 NICHT `wochenSerie()` -- die gibt es schon und meint etwas anderes: die Serie BIS HEUTE,
   fuer die Flamme auf der Startseite. Beim ersten Bauen hiess diese hier genauso und wurde
   von der bestehenden still ueberschrieben; gefunden hat es erst eine Pruefung.

   ⚠️ Fuer einen Erfolg braucht es die LAENGSTE JE, nicht die laufende. Sonst verschwindet
   eine Trophaee wieder, sobald die Serie reisst -- und ein Katalog, aus dem Dinge wieder
   herausfallen, ist kein Katalog. Geschafft bleibt geschafft. */
function besteWochenSerie(){
  const w=[...new Set(sessions.map(s=>wochenStart(s.date)))].sort((a,b)=>a-b);
  const WOCHE=604800000;
  let best=0, lauf=0, vor=null;
  w.forEach(x=>{ lauf = (vor!==null && x-vor===WOCHE) ? lauf+1 : 1; vor=x; best=Math.max(best,lauf); });
  return best;
}
/* ---------- Dieselbe Serie, aber eine Luecke wird verziehen (27.08.2026) ----------
   Karls Einwand: "13 Wochen ist zu viel, vor allem unfair fuer Leute die mal krank sind."

   🔴 Er hat zweimal recht, und es sind zwei verschiedene Sachen:
   1. **Zu lang** -- das Ziel steht deshalb jetzt auf 8 statt 13 Wochen.
   2. **Zu hart** -- und das waere mit einer kleineren Zahl NICHT behoben. Eine Grippe reisst
      eine Serie ab Woche 1 genauso wie ab Woche 12. Wer acht Wochen durchhaelt und in Woche
      sechs flach liegt, faengt sonst bei null an, und der Erfolg bestraft dann Krankheit,
      nicht fehlenden Willen.

   ➡️ Deshalb ueberbrueckt diese Zaehlung **eine** ausgefallene Woche. Die Pausenwoche zaehlt
   dabei NICHT mit -- wer trainiert, pausiert, trainiert, steht bei 2, nicht bei 3. Verziehen
   heisst verziehen, nicht geschenkt.
   ⚠️ Zwei Wochen am Stueck reissen die Serie weiterhin ab. Ohne diese Grenze waere aus dem
   Erfolg "irgendwann mal acht Wochen trainiert" geworden, und das misst gar nichts mehr.
   ⚠️ `besteWochenSerie()` bleibt daneben unveraendert -- "Vier am Stueck" soll streng sein.
   Vier Wochen sind kurz genug, dass ein Joker sie fast geschenkt haette.                  */
function besteWochenSerieJoker(erlaubt){
  const luecken = (erlaubt==null ? 1 : erlaubt);
  const w=[...new Set(sessions.map(s=>wochenStart(s.date)))].sort((a,b)=>a-b);
  const WOCHE=604800000;
  let best=0, lauf=0, offen=luecken, vor=null;
  w.forEach(x=>{
    if(vor===null){ lauf=1; offen=luecken; }
    else {
      const abstand = Math.round((x-vor)/WOCHE);
      if(abstand===1) lauf++;
      else if(abstand===2 && offen>0){ offen--; lauf++; }   // eine Woche ausgelassen: verziehen
      else { lauf=1; offen=luecken; }                        // zwei oder mehr: von vorn
    }
    vor=x; best=Math.max(best,lauf);
  });
  return best;
}

   um -- geht er wieder aus, steht ueberall wieder der echte Stand. Ein Erfolg, der sich
   ueber den Admin dauerhaft ins Profil schreibt, waere spaeter nicht mehr von einem echten
   zu unterscheiden.
   ⚠️ Und er zahlt **keine XP** aus -- siehe die Sperre in erfolgeAuszahlen(). Sonst haette
   ein Blick in den Katalog Karls Rang um 8.050 XP verschoben, und zwar unumkehrbar (es wird
   nichts zurueckgenommen).                                                              */
function alleErfolgeFrei(){ return !!settings.devAllErfolge; }
function erfolgOffen(e){ return alleErfolgeFrei() ? false : (e.ist() < e.ziel); }
function erfolgeGeschafft(){ return ERFOLGE.filter(e=>!erfolgOffen(e)).length; }

/* ---------- Was ist neu? (27.08.2026) ----------
   Karls Wunsch: "bei Erfolge eine goldene Zahl wenn man ein neues Achievement freigeschaltet
   hat, und das Zeichen wird dann auch gold und bewegt sich ein bisschen."

   Dafuer muss die App wissen, was Karl schon GESEHEN hat -- der Erfolg selbst bleibt
   gerechnet. Gespeichert wird nur diese Sichtliste.
   ⚠️ **Beim allerersten Start wird alles Verdiente als gesehen eingetragen**, nicht als neu.
   Sonst leuchtete beim Umstieg auf v33 eine goldene 12 auf fuer Erfolge, die Karl seit
   gestern kennt -- und die goldene Zahl waere entwertet, bevor sie das erste Mal etwas
   bedeutet hat.                                                                          */
function erfolgeGesehenInit(){
  if(profile.erfolgeGesehen && typeof profile.erfolgeGesehen==='object') return;
  const g={}; ERFOLGE.forEach(e=>{ if(e.ist() >= e.ziel) g[e.id]=true; });   // echter Stand, nicht der Admin-Schalter
  profile.erfolgeGesehen=g; save();
}
/* ⚠️ Der Admin-Schalter zaehlt hier NICHT mit. Sonst stuende nach einem Klick eine goldene 22
   an der Leiste, und Karl sucht 22 Erfolge, die er nie freigeschaltet hat. */
function erfolgeNeu(){
  const g = profile.erfolgeGesehen || {};
  return ERFOLGE.filter(e => e.ist() >= e.ziel && !g[e.id]);
}
/* Beim Oeffnen der Erfolgs-Seite abhaken. Gibt zurueck, ob sich etwas geaendert hat --
   nur dann muss die Leiste neu gezeichnet werden. */
function erfolgeAlsGesehen(){
  const neu = erfolgeNeu(); if(!neu.length) return false;
  if(!profile.erfolgeGesehen || typeof profile.erfolgeGesehen!=='object') profile.erfolgeGesehen={};
  neu.forEach(e=>{ profile.erfolgeGesehen[e.id]=true; });
  save(); return true;
}

/* ---------- XP fuer Erfolge (26.08.2026, v32) ----------
   Karls Frage: "Macht es Sinn, fuer Erfolge XP zu kriegen? Aber nicht fuer Erfolge in
   Hinsicht auf Level."

   🔴 **Der zweite Halbsatz ist der wichtige, und er stimmt.** Ein Erfolg fuer Level 25, der
   XP gibt, ist ein Kreis: die Belohnung fuers Leveln waeren Level. Bei Gigachad waere es
   sogar folgenlos, weil darueber nichts mehr kommt. Daraus die Regel, nach der die Tabelle
   oben gebaut ist:

       Ein Erfolg gibt XP, wenn er NICHT in XP gemessen wird.

   Die drei Rang-Erfolge stehen deshalb auf `xp:0` -- nicht vergessen, sondern entschieden.

   ⚠️ **Warum das die Regel vom 22.08. (kein XP fuers Essen) nicht bricht:** "App geoeffnet"
   waere eine NEUE, freie XP-Quelle. "100 Einheiten" ist keine -- die hundert Einheiten sind
   laengst trainiert und haben laengst XP gebracht. Der Erfolg ist ein Bonus auf Arbeit, die
   schon geleistet ist, kein zweiter Weg nach oben. Deshalb darf er auch dreistellig sein.
   Alle zusammen: rund 8.000 von 42.240 XP bis Gigachad -- und fuer jeden einzelnen muss die
   Arbeit trotzdem gemacht werden.                                                        */

/* ⚠️ Hier wird als Einziges im ganzen Erfolgs-Teil etwas GESPEICHERT: welche schon ausgezahlt
   sind. Der Erfolg selbst bleibt gerechnet (und damit immer ehrlich) -- ohne diese Liste
   gaebe es aber bei jedem App-Start dieselben XP nochmal. */
function erfolgeBezahlt(){
  if(!profile.erfolge || typeof profile.erfolge!=='object') profile.erfolge={};
  return profile.erfolge;
}
/* Zahlt aus, was faellig ist. Gibt zurueck, was diesmal dazukam -- fuer die Meldung.
   ⚠️ **Es wird NICHTS zurueckgenommen.** Wer eine Einheit im Verlauf korrigiert und dabei
   unter eine Schwelle rutscht, behaelt die XP. Gleiche Linie wie bei sessRecalc: lieber ein
   alter Wert stehen als ein geratener abgezogen. */
function erfolgeAuszahlen(){
  /* 🔴 Der Admin-Schalter darf NICHTS auszahlen. erfolgOffen() meldet mit ihm alles als
     geschafft -- ohne diese Sperre haette ein Klick auf "Alle Erfolge freischalten" 8.050 XP
     ins Profil geschrieben, und zurueckgenommen wird hier nichts. */
  if(alleErfolgeFrei()) return [];
  const bez = erfolgeBezahlt(); const neu = [];
  ERFOLGE.forEach(e => {
    if(!e.xp || bez[e.id] || erfolgOffen(e)) return;
    bez[e.id] = true; profile.xp += e.xp; neu.push(e);
  });
  if(neu.length) save();
  return neu;
}
function lastPerf(name){ for(let i=sessions.length-1;i>=0;i--){ const e=sessions[i].entries.find(x=>x.name===name);
  if(e){ const d=arbeit(e.sets).filter(s=>s.done&&(+s.weight||+s.reps)); if(d.length){ const b=d[d.length-1]; return {w:+b.weight||0,r:+b.reps||0}; } } } return null; }
// ---------- Steigerung vorschlagen ----------
// Letztes Mal jeden Satz abgehakt → mehr Gewicht. Sonst dasselbe nochmal.
function lastEntry(name){ for(let i=sessions.length-1;i>=0;i--){
  const e=sessions[i].entries.find(x=>x.name===name);
  if(e){ const s=arbeit(e.sets); if(s.length) return {name:e.name, sets:s, soll:e.soll}; } } return null; }
function stepFor(name){ const n=(name||'').toLowerCase();
  return /kniebeug|squat|kreuzheb|deadlift|beinpress|hack squat|hip thrust|langhantelrudern|beinbeuger|beinstrecker/.test(n) ? 5 : 2.5; }
function fmtKg(v){ return (Math.round(v*10)/10).toString().replace('.',','); }
// Ab wie vielen Wiederholungen mehr Gewicht drankommt. Karls Vorgabe vom 05.08.:
// bei wenig Volumen ueber 10, bei viel Volumen ueber 14. Bewusst ueber dem Zielbereich
// (6–10 bzw. 8–12) — wer den oberen Rand nur trifft, bleibt beim Gewicht.
function repGoal(ex){ return volOf(ex)==='low' ? 10 : 14; }
// ex = die Uebung im laufenden Training; ihr Ziel schlaegt die globale Wahl
/* 🔴 Hier lag ein Schutz, der NIE greifen konnte (gefunden beim Durchsehen am
   27.08.2026). Die Absicht war richtig: mehr Gewicht erst, wenn beim letzten Mal **jeder**
   Satz gemacht wurde -- wer vier Saetze geplant und zwei geschafft hat, soll nicht auch noch
   hochgehen.

   Nur stand da `done.length === e.sets.length`, und **in einer gespeicherten Einheit sind
   ausschliesslich gemachte Saetze**: `finishWorkout` legt nur ab, was abgehakt ist. Beide
   Zahlen waren also immer gleich, `alle` war immer `true` -- und der Zweig darunter
   ("letztes Mal 2 von 4 Saetzen") konnte nie erscheinen. Toter Text und ein Schutz, der
   nichts schuetzt, an derselben Stelle.

   ➡️ Seit v43 schreibt `finishWorkout` die geplante Zahl als `soll` mit. Jetzt laesst
   sich vergleichen, was dastand, mit dem, was gemacht wurde.
   ⚠️ Aeltere Einheiten haben kein `soll`. Fuer die faellt es auf das alte Verhalten
   zurueck (`alle === true`) -- lieber wie bisher als eine geratene Sollzahl, die einen
   Vorschlag ausbremst, den es nie gab. */
function suggest(name,ex){
  const e=lastEntry(name); if(!e) return null;
  const done=e.sets.filter(s=>s.done); if(!done.length) return null;
  const w=Math.max(...done.map(s=>+s.weight||0));
  const soll=(+e.soll>0) ? +e.soll : done.length;
  const alle=done.length>=soll;                   // jeder geplante Satz auch gemacht
  const [lo,hi]=exRange(ex), grenze=repGoal(ex);
  // Die schwaechste Wiederholungszahl entscheidet: hochgehen erst, wenn JEDER Satz drueber lag.
  // Ein einzelner guter Satz soll das Gewicht nicht hochziehen.
  const minWdh=Math.min.apply(null,done.map(s=>+s.reps||0));
  const drueber=alle && minWdh>grenze;
  if(w>0){
    if(drueber){ const nw=w+stepFor(name);
      return {w:nw, up:true, text:`Heute <b>${fmtKg(nw)} kg</b> — letztes Mal ${minWdh} Wdh bei ${fmtKg(w)} kg, also über ${grenze}`}; }
    if(!alle) return {w:w, up:false, text:`Nochmal <b>${fmtKg(w)} kg</b> — letztes Mal ${done.length} von ${soll} Sätzen`};
    return {w:w, up:false, text:`Nochmal <b>${fmtKg(w)} kg</b> — mehr Gewicht, sobald jeder Satz über <b>${grenze} Wdh</b> liegt`};
  }
  // Ohne Hantel (Klimmzuege & Co.) gibt es kein Gewicht zum Draufpacken
  if(drueber) return {up:true, text:`Letztes Mal ${minWdh} Wdh — heute schwerer machen, z.B. mit Zusatzgewicht`};
  return {up:false, text:`Ziel <b>${lo}–${hi} Wdh</b> — letztes Mal ${alle?`${minWdh} Wdh`:`${done.length} von ${e.sets.length} Sätzen`}`};
}
function prFor(name){ let best=0,rep=0; sessions.forEach(s=>s.entries.forEach(e=>{ if(e.name===name) arbeit(e.sets).forEach(st=>{ if(st.done&&+st.weight>best){ best=+st.weight; rep=+st.reps||0; } }); })); return best?{w:best,r:rep}:null; }

// ---------- Theme anwenden ----------
function resolveSystem(){ return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
function applyTheme(){
  const lvl=levelFromXP(profile.xp).level;
  let key=profile.theme||'system';
  if(key!=='system' && !unlockedThemes(lvl).has(key)){ key='system'; profile.theme='system'; }
  const eff = key==='system' ? resolveSystem() : key;
  const th=THEMES[eff]||THEMES.dark, root=document.documentElement;
  Object.entries(th.vars).forEach(([k,v])=>root.style.setProperty(k,v));
  document.querySelector('meta[name=theme-color]').setAttribute('content', th.vars['--bg']);
  // ⚠️ Abbild fuer den Ladebildschirm des NAECHSTEN Starts. Das Kopf-Skript ganz oben laeuft,
  // bevor es THEMES oder RANKS gibt — es kann sich die Palette nicht selbst herleiten, nur
  // vier fertige Farben und einen Bildnamen lesen. Deshalb wird hier abgelegt, was dort
  // gebraucht wird. Rein kosmetisch: fehlt es, sieht der Schirm nur schlichter aus.
  try { DB.set('splash', {bg:th.vars['--bg'], txt:th.vars['--txt'], muted:th.vars['--muted'],
    line:th.vars['--line'], card:th.vars['--card'], ok:th.vars['--ok'],
    img: brockSrc(equippedRank())}); } catch(e){}
}
// Den Ladebildschirm wegnehmen. ⚠️ Nur EIN Weg dorthin, und der laeuft nach dem ersten
// render() — nicht nach dem Abgleich: der kann ohne Netz ewig dauern, und die App ist
// vorher vollstaendig bedienbar. Die harte Grenze im Kopf bleibt als Notausstieg.
function splashWeg(){
  const el=document.getElementById('splash'); if(!el) return;
  // Rest der Mindestzeit abwarten. Ist sie schon um, geht er sofort.
  const rest = SPLASH_MINDESTENS - (Date.now() - splashSeit);
  if(rest > 0) setTimeout(()=>el.classList.add('weg'), rest);
  else el.classList.add('weg');
}

// Die Rang-Ansicht hat keinen eigenen Platz mehr in der Leiste — man kommt nur über die

function setNav(){ const map=(view==='erfolge')?'erfolge':(view==='history'||view==='session'||view==='exdetail'||view==='settings'||view==='admin'||view==='privacy'||view==='meldung')?'settings':(view==='body'||view==='food')?'body':'home';

   ⚠️ Sie war vorher NUR in den Einstellungen zu sehen -- also erst, nachdem man dort
   hingegangen war. Wer auf die Mitteilung tippte, landete auf der Startseite, und dort

/* Eine Zahl an einen Knopf haengen -- oder wieder wegnehmen.
   ⚠️ Sie sitzt IM Wort-Span, nicht am Knopf. Auf dem Handy ist das egal (der Span ist
   `position:static`, die Zahl bezieht sich also weiter auf den Knopf und steht wie eh und
   je). Auf dem PC wird der Span zum Bezugsrahmen, und die Zahl sitzt rechts ueber dem Wort
   statt irgendwo in der Mitte der Seitenleiste. Karls Meldung vom 27.08.2026. */
function navZahl(knopf, n, gold){
  if(!knopf) return;
  const ziel = knopf.querySelector('.navtxt') || knopf;
  let punkt = ziel.querySelector('.navpunkt');
  if(!n){ if(punkt) punkt.remove(); knopf.classList.remove('hat-neu'); return; }
  if(!punkt){ punkt = document.createElement('span'); ziel.appendChild(punkt); }
  punkt.className = 'navpunkt' + (gold ? ' gold' : '');

  knopf.classList.toggle('hat-neu', !!gold);
}
function navPunktZeichnen(){
  navZahl(document.querySelector('#nav button[data-nav="settings"]'), postfachUngelesen(), false);
  /* 🔴 Golden, nicht rot. Rot heisst in dieser App "da liegt etwas fuer dich"
     (eine Antwort im Postfach). Ein neuer Erfolg ist kein offener Posten, sondern eine
     Belohnung -- und zwei verschiedene Sachen duerfen nicht gleich aussehen. */
  navZahl(document.querySelector('#nav button[data-nav="erfolge"]'), erfolgeNeu().length, true);
}
function render(){
  if(!session){ document.body.classList.add('gate'); document.body.classList.remove('setup'); renderAuthGate(); return; }
  document.body.classList.remove('gate');
  document.body.classList.toggle('setup', view==='onboard');   // Assistent: untere Leiste ausblenden
  if(view!=='session') sessEdit=false;   // Bearbeiten-Modus gilt nur, solange man die Einheit ansieht
  if(view!=='meldung') meldNeuMarkiert=null;   // beim naechsten Besuch ist nichts mehr "neu"
  // Beim Verlassen der Essen-Ansicht den halbfertigen Eintrag wegräumen — aber nicht,
  // während Barcode oder KI noch laufen (die setzen view selbst auf 'food').
  if(view!=='food'&&!foodBusy){ foodStep='list'; foodDraft=null; foodFehler=''; foodMz=''; }
  setNav();
  /* Ein zurueckgehaltener Fassungs-Hinweis wird hier faellig: er erscheint nicht mitten
     im Training, sondern beim naechsten Bild danach. */
  if(window.neueFassungPruefen) window.neueFassungPruefen();
  ({home:renderHome, progs:renderProgs, plans:renderPlans, onboard:renderOnboard, plan:renderPlan, workout:renderWorkout, history:renderHistory, session:renderSession, exdetail:renderExDetail, rang:renderRang, body:renderBody, food:renderFood, privacy:renderPrivacy, settings:renderSettings, admin:renderAdmin, meldung:renderMeldung, erfolge:renderErfolge, comeback:renderComeback}[view]||renderHome)();
  syncSessionClock();
  /* Den Kurzcode fuers Teilen im Hintergrund bauen, solange noch niemand geklickt hat.
     Genau hier, weil auf diesen zwei Seiten der Teilen-Knopf steht -- und weil ein Umbau am
     Plan den alten Code ungueltig macht (der Zwischenspeicher haengt am Inhalt, nicht an der
     Kennung, und faellt deshalb von allein auf einen neuen Eintrag). */
  if(view==='progs'||view==='plans') alleplaeneVorwaermen();
  /* ⚠️ NACH dem Zeichnen, nicht davor: bestenlisteAuffrischen() ruft am Ende selbst render(),
     und ein render() im render() waere eine Schleife. So steht erst die Seite (mit
     „Wird geladen …"), dann kommen die Zahlen nach. */
  if(view==='erfolge') bestenlisteAuffrischen();
  // Geteilter Plan aus dem Link: erst anbieten, wenn jemand angemeldet ist und nicht gerade
  // im Assistenten steckt — sonst laege das Fenster ueber der Pflicht-Einrichtung.
  if(planImport && !importGezeigt && view!=='onboard'){ importGezeigt=true;
    // Ein unerwartetes Format darf nicht die ganze Ansicht mitreissen.
    if(planImport && Array.isArray(planImport.p) && planImport.p.length){ try{ zeigeImport(); }catch(e){ planImport=null; } }
    else planImport=null; }
  /* Derselbe Haken fuer den Fehlschlag: nicht waehrend der Einrichtung, nicht zweimal.
     ⚠️ Der Hinweis ist die einzige Stelle, an der ein kaputter Link ueberhaupt
     sichtbar wird -- vorher ging die App einfach auf, als waere nichts gewesen. */
  if(planImportFehler && !importFehlerGezeigt && view!=='onboard'){
    importFehlerGezeigt=true; try{ zeigeImportFehler(); }catch(e){ planImportFehler=''; } } }

// ---------- Laufzeit der Einheit ----------

let sessClock=null;

}

// Welcher Rang angezeigt wird: normalerweise der echte, sonst der ausgerüstete.
// Level und XP bleiben davon unberührt — ausgerüstet wird nur der Look.
function equippedRank(){
  const lvl=levelFromXP(profile.xp).level, real=rankForLevel(lvl);
  if(profile.rankSkin==null) return real;
  const r=RANKS.find(x=>x.min===profile.rankSkin);
  return (r && lvl>=r.min) ? r : real;      // nicht (mehr) erreicht → zurück auf echt
}
function rankCardHTML(){
  const lp=levelFromXP(profile.xp), rank=equippedRank(), pct=Math.round(lp.into/lp.need*100);
  const sparks = (rank.aura||0)>=4
    ? '<i class="spark" style="left:12%;top:24%"></i><i class="spark" style="left:84%;top:28%;animation-delay:.6s"></i><i class="spark" style="left:66%;top:72%;animation-delay:1.1s"></i><i class="spark" style="left:26%;top:66%;animation-delay:.35s"></i>'
    : '';
  return `<div class="card rankcard aura-${rank.aura||0}" data-nav="rang" style="--rc:${rank.color}">
    ${sparks}
    <div class="rc-body">
      <div class="row between">

/* NEU (22.08.2026): die Serie — wie viele Wochen am Stueck wurde trainiert?

   💡 Warum Wochen und nicht Tage: eine Tagesserie reisst bei jedem Ruhetag, und
   Ruhetage GEHOEREN zum Plan. Eine Wochenserie misst das, worauf es ankommt —
   dranbleiben, nicht taeglich schuften.

   ⚠️ Karls Restlisten-Punkt 4 („XP soll Dranbleiben staerker belohnen") ist
   ZURUECKGESTELLT. Das hier fasst XP bewusst NICHT an: es zeigt die Serie nur an.
   Der XP-Umbau bleibt seine Entscheidung.                                        */
function wochenStart(ts){
  const d=new Date(ts); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7));   // zurueck auf Montag
  return d.getTime();
}
function wochenSerie(){
  if(!sessions.length) return 0;
  const wochen=new Set(sessions.map(s=>wochenStart(s.date)));
  let n=0, d=new Date(wochenStart(Date.now()));
  // ⚠️ Die laufende Woche zaehlt nur mit, wenn darin schon trainiert wurde. Sonst
  // waere die Serie jeden Montagmorgen gerissen, obwohl noch nichts versaeumt ist.
  if(!wochen.has(d.getTime())) d.setDate(d.getDate()-7);
  while(wochen.has(d.getTime())){ n++; d.setDate(d.getDate()-7); }
  return n;
}
/* NEU (22.08.2026): das Trainingsjahr als Raster.

   💡 Die Idee: die Serie sagt „5 Wochen am Stück" — eine Zahl. Das Raster ZEIGT es.
   Ein Jahr, 53 Spalten zu je sieben Tagen, jeder Trainingstag ein heller Fleck.
   Man sieht Urlaube, Durchhänger und gute Phasen auf einen Blick, ohne eine
   einzige Zahl zu lesen.

   ⚠️ Die Helligkeit haengt am VOLUMEN des Tages, nicht nur an „trainiert ja/nein" —
   sonst sehen ein Zehn-Minuten-Durchlauf und eine schwere Einheit gleich aus.     */
function jahresRaster(){
  if(!sessions.length) return '';
  /* Volumen UND Saetze je Tag einsammeln.
     🔴 Bis zum 30.08.2026 stand hier nur das Volumen — und damit war ein reiner
     Koerpergewichts-Tag im Raster ein Ruhetag. Klimmzuege, Liegestuetze, Dips, Plank,
     Crunches: alle in der Bibliothek, alle mit Gewicht 0. `volume()` rechnet kg × Wdh,
     also kommt 0 heraus, und 0 war die Farbe fuer „nichts gemacht".
     ⚠️ Das Raster beantwortet genau eine Frage — „bin ich drangeblieben?" — und gab
     darauf die falsche Antwort, ausgerechnet fuer den, der ohne Hanteln trainiert.
     ➡️ Getrennt: ob ein Tag zaehlt, entscheiden die Saetze. Wie dunkel er wird,
     entscheidet weiter das Volumen. */
  const proTag=new Map();
  sessions.forEach(s=>{
    const d=new Date(s.date); d.setHours(0,0,0,0);
    const k=d.getTime(), alt=proTag.get(k)||{vol:0,saetze:0};
    proTag.set(k,{ vol: alt.vol+volume(s.entries||[]),
                   saetze: alt.saetze+doneSets(s.entries||[]) });
  });
  const werte=[...proTag.values()].map(t=>t.vol).filter(v=>v>0).sort((a,b)=>a-b);
  // Schwellen ueber die eigenen Einheiten, nicht ueber feste Zahlen — 3000 kg sind
  // fuer den einen viel und fuer den anderen wenig.
  const q=p=>werte.length?werte[Math.min(werte.length-1,Math.floor(werte.length*p))]:0;
  const s1=q(0.33), s2=q(0.66);
  /* ⚠️ Ein Tag mit Saetzen bekommt mindestens Stufe 1, auch bei Volumen 0. Stufe 0 heisst
     ab jetzt ausschliesslich „an diesem Tag war nichts" — vorher hiess es beides. */
  const stufe=t=>!t||!t.saetze&&!t.vol?0:!t.vol?1:t.vol<=s1?1:t.vol<=s2?2:3;
  // ⚠️ NICHT --accent: das ist im dunklen Design fast weiss, und ein Raster aus
  // weissen Kaestchen liest sich wie ein Fehler, nicht wie Fortschritt. --ok ist
  // das Gruen, das der Kalorienring schon benutzt — dieselbe Bedeutung, dieselbe Farbe.
  const farben=['var(--card2)','color-mix(in srgb, var(--ok) 28%, var(--card2))',
                'color-mix(in srgb, var(--ok) 58%, var(--card2))','var(--ok)'];

  // 53 Wochen zurueck, immer bei Montag beginnend
  const heute=new Date(); heute.setHours(0,0,0,0);
  const ende=new Date(wochenStart(heute.getTime()));
  const start=new Date(ende); start.setDate(start.getDate()-52*7);

  /* ⚠️ `tage` wird beim Zeichnen mitgezaehlt, nicht hinterher aus `proTag`. Vorher stand
     dort die Zahl ALLER Trainingstage seit jeher — unter einer Ueberschrift, die „Dein
     Jahr" heisst und 53 Wochen zeigt. Solange die App keine 53 Wochen alt ist, faellt das
     nicht auf; danach behauptet die Zahl etwas ueber Kaestchen, die gar nicht da sind.
     Im Zaehlen an der Zeichenstelle koennen die beiden nicht auseinanderlaufen. */
  let spalten='', monate='', letzterMonat=-1, tage=0;
  const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  for(let w=0; w<=52; w++){
    const wochenTag=new Date(start); wochenTag.setDate(wochenTag.getDate()+w*7);
    // Monatsbeschriftung nur beim Wechsel, sonst wird es Brei
    const m=wochenTag.getMonth();
    monate+=`<div style="width:11px;font-size:9px;color:var(--muted);white-space:nowrap">${
      m!==letzterMonat && wochenTag.getDate()<=7 ? MON[m] : ''}</div>`;
    if(m!==letzterMonat && wochenTag.getDate()<=7) letzterMonat=m;

    let zellen='';
    for(let d=0; d<7; d++){
      const tag=new Date(wochenTag); tag.setDate(tag.getDate()+d);
      const zukunft=tag.getTime()>heute.getTime();
      const t=proTag.get(tag.getTime());
      const st=stufe(t);
      if(!zukunft && st) tage++;
      /* Ohne Volumen die Saetze zeigen — sonst stuende am Koerpergewichts-Tag nur das
         Datum, und das sieht aus wie ein leerer Tag, der aus Versehen eingefaerbt ist. */
      const info=!t?'':t.vol?' · '+t.vol+' kg'
        :(t.saetze?' · '+t.saetze+(t.saetze===1?' Satz':' Sätze'):'');
      zellen+=`<div title="${tag.toLocaleDateString('de-DE')}${info}"
        style="width:11px;height:11px;border-radius:3px;background:${
          zukunft?'transparent':farben[st]};${zukunft?'':'box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)'}"></div>`;
    }
    spalten+=`<div style="display:grid;grid-template-rows:repeat(7,11px);gap:3px">${zellen}</div>`;
  }

  return `<div class="row between" style="margin:22px 4px 6px"><h2>Dein Jahr</h2>
      <span class="tiny muted">${tage} ${tage===1?'Tag':'Tage'} trainiert</span></div>
    <div class="card" style="padding:12px 10px">
      <div style="overflow-x:auto">
        <div style="display:inline-block;min-width:100%">
          <div style="display:grid;grid-auto-flow:column;gap:3px;margin-bottom:3px">${monate}</div>
          <div style="display:grid;grid-auto-flow:column;gap:3px">${spalten}</div>
        </div>
      </div>
      <div class="row" style="gap:6px;align-items:center;margin-top:10px;justify-content:flex-end">
        <span class="tiny muted">wenig</span>
        ${farben.map(f=>`<div style="width:11px;height:11px;border-radius:3px;background:${f}"></div>`).join('')}
        <span class="tiny muted">viel</span></div>
    </div>`;
}
function sessionsOn(ts){ return sessions.filter(s=>sameDay(s.date,ts)); }
function trainedToday(){ return sessionsOn(Date.now()).length>0; }
function missedYesterday(){ const y=Date.now()-864e5, d=(new Date(y).getDay()+6)%7;
  return plans.some(p=>p.day===d) && sessionsOn(y).length===0; }
function brockSay(){
  const key = active ? 'running' : trainedToday() ? 'done' : missedYesterday() ? 'missed'
            : planForToday() ? 'todo' : 'rest';
  const list=BROCK_SAY[key];
  // Über den Tag stabil — der Spruch springt nicht bei jedem Antippen.
  return list[Math.floor(Date.now()/864e5)%list.length];
}

/* Zentrale Stelle, welcher Split zu wie vielen Tagen gehoert -- buildPlans(),
   renderOnboard() (die Zusammenfassung) und splitHint() rufen ALLE dieselbe Funktion,
   damit die Anfaenger-Regel nicht wie der 503-Fund vom 31.08. an nur EINER von mehreren

function splitFuer(n, anfaenger){
  if(anfaenger && n===3) return SPLITS_ANFAENGER;
  return SPLITS[Math.min(6,Math.max(2,n))]||SPLITS[3];
}
function splitHint(n, anfaenger){
  if(anfaenger && n===3) return 'Ganzkörper A/B im Wechsel — am Anfang bringt das mehr als ein Split.';
  return ({2:'Upper/Lower — Oberkörper und Unterkörper im Wechsel.',
  3:'Push/Pull/Legs — der Klassiker.',
