}
async function sendeRuecksetzLink(){
  const el=document.getElementById('rs_mail');
  const mail=(el?el.value:'').trim();
  if(!mail.includes('@')) return renderAuthGate('Bitte deine E-Mail-Adresse eingeben.');
  /* ⚠️ Die Sperre kommt VOR der Netz-Pruefung und VOR dem Absenden. Wer gesperrt und
     offline ist, bekaeme sonst "kein Netz", ginge online und erfuehre erst dann von der
     Wartezeit. Und eine Bremse, die erst nach der Anfrage greift, hat den Platz schon
     verbraucht. */
  const rest=bremseRestMin(mail);
  if(rest>0){ resetMail=mail;
    return renderAuthGate(`Für diese Adresse ist gerade ein Link unterwegs. Neuer Versuch in ${rest} Min.`); }
  const btn=document.querySelector('[data-act="sendReset"]');
  if(btn){ btn.disabled=true; btn.textContent='Einen Moment …'; }
  try{ await rueckstellungAnfordern(mail);
    /* Gesetzt wird erst NACH dem Erfolg: ein Vertipper, ein Netzausfall oder die
       Server-Bremse selbst darf niemanden eine Stunde aussperren, ohne dass ueberhaupt
       eine Mail unterwegs ist. */
    bremseSetzen(mail); resetMail=mail; authMode='gesendet'; renderAuthGate(); }
  catch(e){ if(btn){ btn.disabled=false; btn.textContent='Link schicken'; }
    resetMail=mail; renderAuthGate(typeof e==='string'?e:'Hat nicht geklappt — bitte nochmal.'); }
}

async function speichereNeuesPasswort(){
  const v=id=>{ const el=document.getElementById(id); return el?el.value:''; };
  const pw=v('np_pw'), pw2=v('np_pw2');
  if(pw.length<6) return renderAuthGate('Passwort mind. 6 Zeichen.');
  if(pw!==pw2)    return renderAuthGate('Die beiden Passwörter sind nicht gleich.');
  if(!resetToken) return renderAuthGate('Der Link ist nicht mehr gültig. Fordere unten einen neuen an.');
  const btn=document.querySelector('[data-act="savePw"]');
  if(btn){ btn.disabled=true; btn.textContent='Einen Moment …'; }
  try{ const nutzer=await passwortSetzen(pw, resetToken);
    /* Der Token aus der Mail IST eine gueltige Sitzung -- wer das Passwort gesetzt hat,
       ist damit angemeldet und muss es nicht gleich noch einmal eintippen. Genau das ist
       der Moment, in dem er sonst wieder scheitern koennte. */
    setSession({access_token:resetToken, refresh_token:resetRefresh, expires_in:3600, user:nutzer},
               (nutzer&&nutzer.user_metadata&&nutzer.user_metadata.username)||null);
    resetToken=null; resetRefresh=null;
    authMode='login'; view='home'; render(); toast('Passwort geändert');
    cloudSyncStart().then(()=>{ if(!profile.onboarded) startOnboard(); }); }
  catch(e){ if(btn){ btn.disabled=false; btn.textContent='Passwort speichern'; }
    renderAuthGate(typeof e==='string'?e:'Hat nicht geklappt — bitte nochmal.'); }
}

async function doAuth(mode){ const v=id=>{ const el=document.getElementById(id); return el?el.value:''; };
  const btn=document.querySelector('[data-act="doLogin"],[data-act="doRegister"]');
  if(btn){ btn.disabled=true; btn.textContent='Moment …'; }
  try{ if(mode==='register') await authSignUp(v('au_user'),v('au_id'),v('au_pw')); else await authSignIn(v('au_id'),v('au_pw'));
    // Nach einer Registrierung immer einrichten, beim Anmelden nur wenn noch nie geschehen.
    if(mode==='register' || !profile.onboarded) return startOnboard();
    view = active ? 'workout' : 'home'; render(); toast('Angemeldet'); }
  catch(e){ renderAuthGate(typeof e==='string'?e:'Fehler — bitte nochmal.'); } }

// ---------- Training ----------
// Aufwaermgewicht: rund 70 % des Arbeitsgewichts, auf 2,5 kg gerundet, damit es an der Stange
// auch auflegbar ist. Ohne Vorgeschichte bleibt das Feld leer.
// ⚠️ Das Runden auf 2,5 kg kann NACH OBEN gehen: bei 2 kg Arbeitsgewicht kamen 2,5 kg
// Aufwaermgewicht heraus — schwerer als der Arbeitssatz. Betrifft leichte Uebungen wie
// Seitheben. Ergibt sich kein Wert unter dem Arbeitsgewicht, bleibt das Feld lieber leer,
// als etwas Falsches vorzuschlagen. (Pruefrahmen, 22.08.2026.)
function warmKg(w){ if(!(w>0)) return ''; const v=Math.round(w*0.7/2.5)*2.5; return (v>0&&v<w)?v:''; }
// Plaene ohne eigenes warmup (alle vor dem 05.08.) folgen der Wahl aus dem Assistenten.
function planWarm(p){ return p && p.warmup!=null ? !!p.warmup : !!profile.warmup; }
function startWorkout(plan){
  // Aufwaermsatz: pro Uebung einer, vorneweg, markiert mit warm:true. Ob es ihn gibt, steht am
  // Plan (Karls Wahl im Assistenten oder im Editor).
  const warm = plan.warmup!=null ? !!plan.warmup : !!profile.warmup;
  const ex=plan.exercises.map(e=>{ const lp=lastPerf(e.name);
    // vol wandert mit ins Training — sonst zeigte die Satz-Zeile ein anderes Ziel als der Editor
    const sets=Array.from({length:e.sets||3},()=>({weight:lp&&lp.w?lp.w:'',reps:'',done:false}));
    if(warm) sets.unshift({weight:warmKg(lp&&lp.w),reps:'',done:false,warm:true});
    return {id:uid(),name:e.name,icon:e.icon,reps:e.reps,vol:e.vol,sets}; });
  active={id:uid(),date:Date.now(),planId:plan.id,planName:plan.name,currentIdx:0,exercises:ex}; save(); view='workout'; render(); }

/* ---------- Eingetragenes zaehlt, auch ohne Haken (27.08.2026) ----------
   🔴 Karls Meldung: "wenn ich auf Training beenden gehe, wird das Training einfach
   verworfen. Liegt es daran, dass das Training nicht komplett abgeschlossen wurde? Aber das
   waere nicht richtig."

   **Er hat recht, und der Fehler war schwerer als er klingt.** Bis hierher entschied allein
   der Haken, ob ein Satz existiert. Wer 80 kg und 8 Wiederholungen eintippte und den Haken
   nicht setzte, hatte fuer die App **nichts getan** -- und beim Beenden verschwand die ganze
   Einheit hinter einem Hinweis, der nach 1,8 Sekunden weg war. **Kein Rueckweg, keine
   Nachfrage, und der Hinweis las sich wie eine Feststellung statt wie ein Verlust.**

   ➡️ Ein Satz gilt jetzt als gemacht, **wenn er abgehakt ist ODER wenn etwas drinsteht.**
   Niemand tippt 80 kg ein, ohne sie gehoben zu haben. Der Haken bleibt, wofuer er da ist --
   die Pause starten, den Rekord im Moment feiern --, aber er entscheidet nicht mehr darueber,
   ob die Arbeit stattgefunden hat.

   ⚠️ **Leere Saetze bleiben draussen.** Die Felder sind leer, solange niemand tippt (die
   Vorschlaege stehen als Platzhalter, nicht als Wert) -- ein geplanter, aber nicht gemachter
   Satz traegt also weiterhin nichts bei.
   ⚠️ Nachgezogen wird dabei dasselbe wie beim Abhaken von Hand: fehlende Wiederholungen
   bekommen die untere Zahl des Zielbereichs, und ein Rekord wird auch hier vermerkt. Sonst
   verloere Karl fuer genau diese Saetze den Rekord-Bonus -- also fuer die, die er getippt hat.
   `prFor()` liest nur abgeschlossene Einheiten, die laufende ist nicht dabei; der Wert bleibt
   waehrend der Schleife also stabil. */
function eingetragenesUebernehmen(){
  let n=0;
  (active.exercises||[]).forEach(e=>{
    (e.sets||[]).forEach(s=>{
      if(s.done) return;
      if(!(+s.weight>0) && !(+s.reps>0)) return;      // wirklich leer: bleibt leer
      s.done=true; n++;
      if(!(+s.reps>0)) s.reps=exRange(e)[0];
      if(!s.warm && +s.weight>0){ const alt=prFor(e.name); if(!alt || +s.weight>alt.w) s.pr=true; }
    });
  });
  return n;
}
function finishWorkout(){
  const nachgetragen=eingetragenesUebernehmen();
  /* 🔴 `soll` ist neu am 27.08.2026 und behebt einen Schutz, der nie greifen konnte --
     siehe die Erklaerung bei suggest(). Es ist die Zahl der ARBEITSSAETZE, die dastanden;
     was davon gemacht wurde, steht in `sets`. Aufwaermsaetze zaehlen nicht mit, sie sind
     auch sonst nirgends Teil der Rechnung. */
  const entries=active.exercises.map(e=>({name:e.name||'Übung',icon:e.icon,
    soll:arbeit(e.sets).length, sets:e.sets.filter(s=>s.done)})).filter(e=>e.sets.length);
  /* ⚠️ Hier steht jetzt wirklich nichts — kein Haken, kein getippter Wert. Verworfen wird
     trotzdem nicht mehr stillschweigend: der Hinweis sagt, dass nichts da war, und die Einheit
     bleibt stehen, bis Karl selbst abbricht. Ein Fenster, das man wegtippen muss, ist an
     dieser Stelle billiger als eine verlorene Einheit. */
  if(entries.length===0){
    showModal(`<div class="tiny muted">Nichts eingetragen</div>
      <div style="margin-top:8px">In keinem Satz steht ein Gewicht oder eine Wiederholung —
      es gibt nichts zu speichern.</div>
      <div class="tiny muted" style="margin-top:10px">Die Einheit läuft weiter. Zum Wegwerfen
      unten auf <b>Abbrechen</b>.</div>`);
    return; }
  const beforeL=levelFromXP(profile.xp).level, beforeRank=rankForLevel(beforeL).name;
  const prs=zaehleRekorde(entries);
  const gained=sessXP(entries, prs);
  profile.xp+=gained;
  aufgabeErledigen('train');     // Tagesaufgabe mit abhaken, falls noch offen
  /* ⚠️ NACH dem Gutschreiben der Einheit und NACH dem Anhaengen an `sessions` -- sonst
     zaehlt der Erfolg "Angefangen" die gerade beendete Einheit noch nicht mit, und man
     bekaeme ihn erst beim naechsten Mal. Das Anhaengen passiert gleich unten. */
  // dur = wie lange die Einheit gedauert hat. Einheiten vor dem 05.08. haben kein dur.
  // xp = was es dafuer gab. Wird gebraucht, um den Punktestand nachzufuehren, wenn die
  // Einheit spaeter im Verlauf korrigiert wird (seit 06.08.).
  sessions.push({id:active.id,date:active.date,dur:Date.now()-active.date,planName:active.planName,xp:gained,pr:prs,entries});
  active=null; endRest();
  const frischeErfolge = erfolgeAuszahlen();          // jetzt ist die Einheit in `sessions`
  const afterL=levelFromXP(profile.xp).level, afterRank=rankForLevel(afterL);
  save(); view='home';
  /* ⚠️ Der Nachtrag wird GESAGT, nicht stillschweigend gemacht. Wer nie abhakt, soll
     merken, dass die App mitgezaehlt hat — und wer versehentlich etwas stehen liess, soll
     es sehen, solange die Einheit noch frisch im Kopf ist (korrigieren geht im Verlauf). */
  const nachZeile = nachgetragen
    ? `<div class="tiny muted" style="margin-top:10px">${nachgetragen===1?'Ein Satz war':nachgetragen+' Sätze waren'} nicht abgehakt — mitgezählt, weil etwas drinstand.</div>`
    : '';
  if(afterL>beforeL){ let extra='';
    if(afterRank.name!==beforeRank){ extra+=`<div style="margin-top:8px">Neuer Rang: <b style="color:${afterRank.color}">${esc(afterRank.name)}</b></div>`;
      if(afterRank.unlock) extra+=`<div class="tiny muted" style="margin-top:4px">Design „${THEMES[afterRank.unlock].label}" freigeschaltet — im Rang-Tab wählbar</div>`; }
    render(); showModal(`<div class="tiny muted">Level up!</div><div class="big">Level ${afterL}</div><div>+${gained} XP</div>${erfolgZeile(frischeErfolge)}${extra}${nachZeile}`);
  } else if(frischeErfolge.length){
    /* ⚠️ Ein neuer Erfolg bekommt sein eigenes Fenster, keinen Toast. Ein Toast ist nach
       1,8 s weg -- und etwas, das man einmal im Leben freischaltet, soll man auch sehen. */
    render(); showModal(`<div class="tiny muted">Stark! +${gained} XP</div>${erfolgZeile(frischeErfolge)}${nachZeile}`);
  } else if(nachgetragen){
    render(); showModal(`<div class="tiny muted">Stark! +${gained} XP</div>${nachZeile}`);
  } else { render(); toast(`Stark! +${gained} XP`); }
}

/* Die Zeile "neuer Erfolg" fuer das Fenster nach einer Einheit. Leer, wenn nichts dazukam --
   dann faellt sie im Text einfach weg, statt ein leeres Kaestchen zu hinterlassen. */
function erfolgZeile(liste){
  if(!liste || !liste.length) return '';
  const xp = liste.reduce((n,e)=>n+e.xp,0);
  return `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
      <div class="tiny muted">${liste.length===1?'Neuer Erfolg':liste.length+' neue Erfolge'}</div>
      ${liste.map(e=>`<div class="row" style="margin-top:6px;gap:8px;align-items:center;justify-content:center">
        ${erfolgSvg(e,'frisch',22)}<b>${esc(e.name)}</b></div>`).join('')}
      <div class="tiny" style="color:var(--ok);margin-top:6px">+${xp} XP</div></div>`;
}

let armed={};
function confirmTwice(key,btn,label,run){ if(armed[key]){ clearTimeout(armed[key]); delete armed[key]; run(); return; }
  const old=btn.textContent; btn.dataset.old=old; btn.textContent=label; btn.style.color='#fff'; btn.style.background='var(--danger)';
  armed[key]=setTimeout(()=>{ delete armed[key]; btn.textContent=old; btn.style.color=''; btn.style.background=''; },2500); }

// ---------- Events ----------
if(window.matchMedia){ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if((profile.theme||'system')==='system') applyTheme(); }); }

document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-nav],[data-act],[data-editplan],[data-startplan],[data-check],[data-addset],[data-delset],[data-focusex],[data-opensess],[data-rest],[data-delex],[data-theme],[data-libadd],[data-setbase],[data-admin],[data-fav],[data-planday],[data-exvol],[data-planwarm],[data-libnew],[data-useprog],[data-editprog],[data-delprog],[data-shareprog],[data-moveex],[data-openex],[data-delweight],[data-skin],[data-sdel],[data-sdelex],[data-sadd],[data-delmeal],[data-delfood],[data-foodfav],[data-pickfood],[data-zielart],[data-testverbindung]');
  if(!t) return;
  // ---- Eine abgeschlossene Einheit korrigieren (Verlauf › Bearbeiten) ----
  if(t.dataset.sdel){ const [ei,si]=t.dataset.sdel.split(':').map(Number);
    const s=sessions.find(x=>x.id===detailSessionId); if(!s) return;
    s.entries[ei].sets.splice(si,1);
    // Uebung ohne Saetze traegt nichts mehr bei und wuerde als leere Karte stehenbleiben.
    if(!s.entries[ei].sets.filter(x=>x.done).length) s.entries.splice(ei,1);
    sessRecalc(s); render(); return; }
  if(t.dataset.sdelex){ const ei=+t.dataset.sdelex, s=sessions.find(x=>x.id===detailSessionId); if(!s) return;
    confirmTwice('sdx'+ei,t,'Weg?',()=>{ s.entries.splice(ei,1); sessRecalc(s); render(); }); return; }
  if(t.dataset.sadd){ const ei=+t.dataset.sadd, s=sessions.find(x=>x.id===detailSessionId); if(!s) return;
    const e=s.entries[ei], last=e.sets[e.sets.length-1]||{};
    e.sets.push({weight:last.weight||'',reps:last.reps||'',done:true});
    sessRecalc(s); render(); return; }
  if(t.dataset.delweight){ const ts=+t.dataset.delweight;
    confirmTwice('dw'+ts,t,'Löschen?',()=>{ profile.weights=(profile.weights||[]).filter(x=>x.date!==ts); save(); render(); }); return; }
  // ---- Kalorien ----
  if(t.dataset.delmeal){ const id=t.dataset.delmeal, k=kcalInit();
    k.meals=k.meals.filter(x=>x.id!==id); save(); render(); return; }
  // NEU: dasselbe nochmal essen. Kopiert den alten Eintrag mit heutigem Datum —
  // ⚠️ bewusst eine Kopie mit neuer id, kein Verschieben: der alte Tag bleibt stehen.
  // NEU: Vorhaben waehlen. Setzt gleich ein passendes Kalorienziel, damit der
  // Nutzer nicht zweimal etwas entscheiden muss.
  if(t.dataset.zielart){ const art=t.dataset.zielart; if(!ZIELE[art]) return;
    const k=kcalInit(); k.art=art;
    const v=kcalVorschlagFuer(art); if(v && !(k.goal>0)) k.goal=v;
    save(); render(); toast(ZIELE[art].name+(v?' · '+v+' kcal':'')); return; }
  /* ⚠️ `stopPropagation`, sonst traegt der Klick auf den Stern das Lebensmittel gleich
     ein: die ganze Zeile ist ein `data-pickfood`. Genau wie beim Loesch-Kreuz daneben. */
  if(t.dataset.foodfav){ ev.stopPropagation();
    const f=kcalInit().foods.find(x=>x.id===t.dataset.foodfav); if(!f) return;
    f.fav=!f.fav; save();
    /* Nur die Liste neu zeichnen, nicht die ganze Seite: `render()` wuerde das
       Suchfeld leeren und die Tastatur am Handy zuklappen -- mitten im Suchen. */
    const feld=document.getElementById('foodSearch');
    renderFoodList(feld?feld.value:'');
    toast(f.name+(f.fav?' ist ein Favorit':' ist kein Favorit mehr')); return; }
  if(t.dataset.delfood){ ev.stopPropagation(); const id=t.dataset.delfood, k=kcalInit();
    confirmTwice('df'+id,t,'Weg?',()=>{ k.foods=k.foods.filter(x=>x.id!==id); save(); render(); }); return; }
  if(t.dataset.pickfood){ const f=kcalInit().foods.find(x=>x.id===t.dataset.pickfood); if(!f) return;
    foodDraft={...f, basis:'g100', menge:f.letzteMenge>0?f.letzteMenge:100, quelle:'eigen'};
    foodStep='menge'; foodFehler=''; render(); return; }
  /* 💡 Der Barcode wird mitgenommen, obwohl hier keiner gescannt wurde: wer den Treffer
     mit „Auch in meine Liste aufnehmen“ behält, trifft ihn beim nächsten Mal SOFORT per
     Scan -- ohne Netz und ohne Suche. */
  if(t.dataset.dbpick){ const f=dbTreffer[+t.dataset.dbpick]; if(!f) return;
    foodDraft={...f, quelle:'db'}; foodStep='menge'; foodFehler=''; render(); return; }
  if(t.dataset.skin){ const min=+t.dataset.skin, lvl=levelFromXP(profile.xp).level;
    const r=RANKS.find(x=>x.min===min); if(!r||lvl<r.min) return;      // gesperrte Ränge bleiben gesperrt
    profile.rankSkin = (profile.rankSkin===min) ? null : min;          // nochmal tippen = wieder der echte Rang
    save(); render(); toast(profile.rankSkin===null?'Wieder dein echter Rang':`„${r.name}" ausgerüstet`); return; }
  if(t.dataset.fav){ const n=t.dataset.fav, i=obDraft.favs.indexOf(n);
    if(i<0) obDraft.favs.push(n); else obDraft.favs.splice(i,1); renderOnboard(); return; }
  if(t.dataset.openex){ detailExName=t.dataset.openex; view='exdetail'; render(); return; }
  if(t.dataset.moveex){ syncPlanInputs(); const [i,d]=t.dataset.moveex.split(':').map(Number);
    const p=editPlans().find(x=>x.id===editPlanId), j=i+d;
    if(p && j>=0 && j<p.exercises.length){ const a=p.exercises;
      [a[i],a[j]]=[a[j],a[i]]; save(); }
    render(); return; }
  if(t.dataset.planday){ syncPlanInputs(); const p=editPlans().find(x=>x.id===editPlanId);
    if(p){ const v=+t.dataset.planday;
      if(editPlans().some(x=>x.id!==p.id && x.day===v)) return;   // belegter Tag, auch wenn der Knopf durchrutscht
      p.day = (p.day===v) ? null : v; save(); } render(); return; }
  if(t.dataset.exvol){ syncPlanInputs(); const [i,v]=t.dataset.exvol.split(':'); const p=editPlans().find(x=>x.id===editPlanId);
    if(p&&p.exercises[+i]){ p.exercises[+i].vol=v; save(); } render(); return; }
  if(t.dataset.planwarm){ syncPlanInputs(); const p=editPlans().find(x=>x.id===editPlanId);
    if(p){ p.warmup=t.dataset.planwarm==='1'; save(); } render(); return; }
  if(t.dataset.setbase){ profile.theme=t.dataset.setbase; save(); applyTheme(); render(); return; }
  if(t.dataset.testverbindung){ adminTestVerbindung(t.dataset.testverbindung); return; }
  if(t.dataset.admin){ const [cmd,arg]=t.dataset.admin.split(':'); const cur=levelFromXP(profile.xp).level;
    if(cmd==='xp') profile.xp=Math.max(0,profile.xp+(+arg));
    else if(cmd==='xpset') profile.xp=Math.max(0,+arg);
    else if(cmd==='lvl') profile.xp=xpForLevel(Math.max(1,cur+(+arg)));
    else if(cmd==='jump') profile.xp=xpForLevel(+arg);
    else if(cmd==='unlockall') settings.devUnlockAll=!settings.devUnlockAll;
    else if(cmd==='allerfolge') settings.devAllErfolge=!settings.devAllErfolge;
    else if(cmd==='zu'){ devAdmin=false; DB.set('devadmin',false); view='settings'; render(); toast('Admin zu'); return; }
    /* ⚠️ Diese beiden kehren SOFORT zurueck: sie zeichnen eine Ansicht, statt einen Wert
       zu setzen. Das save()/render() unten wuerde sie sonst gleich wieder ueberschreiben. */
    else if(cmd==='tut'){
      if(arg==='plan'){ startOnboard(); return; }
      if(arg==='kcal'){ startKcalOb(); return; }
      // Vorgetaeuscht, nicht gespeichert: comebackTage ist nur der Text in der Ansicht.
      comebackTage = COMEBACK_TAGE + 3; view='comeback'; render(); return; }
    else if(cmd==='demo') genDemo();
    else if(cmd==='clearhist') sessions=[];
    save(); applyTheme(); render(); return; }
  if(t.dataset.libadd){ syncPlanInputs(); const [nm,ic,rp]=t.dataset.libadd.split('|'); const p=editPlans().find(x=>x.id===editPlanId);
    if(p){ p.exercises.push({id:uid(),name:nm,icon:ic,sets:volSets(),reps:+rp||10,vol:profile.vol}); save(); } closeModal(); render(); return; }
  if(t.dataset.libnew){ syncPlanInputs(); const nm=t.dataset.libnew.slice(0,60); const p=editPlans().find(x=>x.id===editPlanId);
    if(p){ p.exercises.push({id:uid(),name:nm,sets:volSets(),reps:10,vol:profile.vol,eigen:true}); save(); }
    closeModal(); render(); toast(`„${nm}" angelegt`); return; }
  if(t.dataset.theme){ const lvl=levelFromXP(profile.xp).level; if(unlockedThemes(lvl).has(t.dataset.theme)){ profile.theme=t.dataset.theme; save(); applyTheme(); render(); } return; }
  if(t.dataset.nav){
    // Zwischen zwei Reitern mit Bewegung, sonst wie bisher -- ein Sprung aus dem Verlauf
    // zurueck in die Einstellungen ist kein Nachbarwechsel und braucht keine Richtung.
    if(REITER.indexOf(view) !== -1 && REITER.indexOf(t.dataset.nav) !== -1) reiterZeigen(t.dataset.nav);
    else { view=t.dataset.nav; render(); }
    return; }
  if(t.dataset.rest){ const r=t.dataset.rest; if(r==='skip'){ stopRest(); rest.remaining=0; paintTimer(); } else adjust(+r); return; }
  if(t.dataset.useprog){ const pr=progById(t.dataset.useprog);
    if(pr){ profile.prog=pr.id; bindPlans(); active=null; save(); render(); toast(`„${pr.name}" ist jetzt dein Plan`); } return; }
  if(t.dataset.editprog){ editProgId=t.dataset.editprog; view='plans'; render(); return; }
  if(t.dataset.shareprog){ sharePlan(t.dataset.shareprog); return; }
  if(t.dataset.delprog){ const id=t.dataset.delprog, pr=progById(id);
    if(!pr||programs.length<2) return;                       // der letzte Plan bleibt stehen
    confirmTwice('dpr'+id,t,'Plan löschen?',()=>{
      programs=programs.filter(x=>x.id!==id);
      if(profile.prog===id){ profile.prog=programs[0].id; active=null; }
      if(editProgId===id) editProgId=null;
      bindPlans(); save(); view='progs'; render(); toast('Gelöscht'); }); return; }
  if(t.dataset.editplan){ editPlanId=t.dataset.editplan; view='plan'; render(); return; }
  if(t.dataset.startplan){ startWorkout(editPlans().find(p=>p.id===t.dataset.startplan)); return; }
  if(t.dataset.opensess){ detailSessionId=t.dataset.opensess; view='session'; render(); return; }
  if(t.dataset.focusex){ active.currentIdx=+t.dataset.focusex; save(); render(); return; }
  if(t.dataset.check){ const [ei,si]=t.dataset.check.split(':').map(Number); const s=active.exercises[ei].sets[si]; s.done=!s.done;
    // Wdh werden seit dem 05.08. wieder selbst eingetippt. Nur wenn das Feld leer bleibt,
    // zählt fürs Volumen ersatzweise die untere Zahl des Zielbereichs.
    if(s.done && !(+s.reps>0)) s.reps=exRange(active.exercises[ei])[0];
    // NEU: einen Rekord in dem Moment feiern, in dem er passiert. Bisher standen
    // Rekorde nur als stille Liste im Verlauf — man erfuhr erst Tage spaeter davon,
    // dass man einen aufgestellt hat. Das ist der billigste Motivationsmoment, den
    // die App zu vergeben hat, und sie hat ihn liegen lassen.
    // ⚠️ prFor() rechnet nur ueber ABGESCHLOSSENE Einheiten, das laufende Training
    // ist nicht darin — sonst schlaege der eigene Satz von eben den Rekord und es
    // gaebe nie wieder eine Meldung.
    if(s.done && !s.warm){
      const name=active.exercises[ei].name, alt=prFor(name);
      if(+s.weight>0 && (!alt || +s.weight>alt.w)){
        /* ⚠️ Am SATZ merken, nicht mitzaehlen. Wer abhakt, wieder abwaehlt und erneut
           abhakt, wuerde sonst zweimal Rekord-XP bekommen. Gezaehlt wird erst beim
           Beenden, ueber die Saetze -- das ist unabhaengig davon, wie oft geklickt wurde. */
        s.pr = true;
        toast(alt ? `Neuer Rekord: ${fmtKg(+s.weight)} kg (vorher ${fmtKg(alt.w)})`
                  : `Erster Eintrag für ${name} — ab jetzt zählt jeder Rekord`);
      }
    }
    if(!s.done) delete s.pr;      // abgewaehlt = kein Rekord mehr
    save();
    if(s.done){ startRest(settings.rest); if(navigator.vibrate) navigator.vibrate(40); } render(); return; }
  if(t.dataset.addset!=null){ const e=active.exercises[+t.dataset.addset], last=e.sets[e.sets.length-1]||{}; e.sets.push({weight:last.weight||'',reps:last.reps||'',done:false}); save(); render(); return; }
  if(t.dataset.delset!=null){ const e=active.exercises[+t.dataset.delset]; if(e.sets.length>1){ e.sets.pop(); save(); render(); } return; }
  if(t.dataset.delex!=null){ editPlans().find(x=>x.id===editPlanId).exercises.splice(+t.dataset.delex,1); save(); render(); return; }
  const a=t.dataset.act;
  /* Der Fehlerfang-Weg: „Verwerfen" macht nur die Leiste weg, „Schicken" legt den
     Fehler in dieselbe Melde-Schlange wie „Problem melden" -- derselbe Weg,
     dieselbe Bremse, dieselbe Ablehnungs-Behandlung (Fund 5 vom heutigen Tag). */
  if(a==='fehlerbanner:weg'){
    letzterFehler=null; document.getElementById('fehlerbanner').classList.remove('show');
    closeModal(); return; }

document.addEventListener('input',ev=>{ const t=ev.target;
  if(t.id==='obName'&&obDraft){ obDraft.name=t.value; return; }   // ohne Neuzeichnen mitschreiben
  if(t.id==='libSearch'){ renderLibList(t.value); return; }
  if(t.id==='foodSearch'){ renderFoodList(t.value); return; }
  // Mengen-Vorschau: nur die drei Zahlen nachziehen, nicht neu zeichnen — sonst
  // faellt der Fokus beim Tippen aus dem Feld (gleiche Falle wie im Verlauf).
  if(t.id==='mengeInput'&&foodDraft){ const m=+t.value.replace(',','.');
    foodDraft.menge=t.value; const w=draftWerte(foodDraft,m);
    const set=(sel,v)=>{ const el=document.querySelector(sel); if(el) el.textContent=v; };
    set('[data-vk]',w.kcal); set('[data-vp]',w.p); set('[data-vc]',w.c); return; }
  if(t.dataset.f&&active){ active.exercises[+t.dataset.ex].sets[+t.dataset.set][t.dataset.f]=t.value; DB.set('active',active); return; }
  // Korrektur im Verlauf: beim Tippen nur wegschreiben, nicht neu zeichnen — sonst faellt der
  // Fokus aus dem Feld. Volumen, Rekorde und XP werden beim Verlassen des Feldes nachgezogen.
  if(t.dataset.se&&view==='session'){ const [ei,si]=t.dataset.se.split(':').map(Number);
    const s=sessions.find(x=>x.id===detailSessionId);
    if(s&&s.entries[ei]&&s.entries[ei].sets[si]){ s.entries[ei].sets[si][t.dataset.sf]=t.value; DB.set('sessions',sessions); }
    return; }
  if(t.id==='progName'){ const pr=editProg(); if(pr){ pr.name=t.value.trim()||'Plan'; DB.set('programs',programs); } }
  if(t.id==='planName'){ const p=editPlans().find(x=>x.id===editPlanId); if(p){ p.name=t.value; DB.set('programs',programs); } }
  if(t.id==='restInput'){ settings.rest=Math.max(10,+t.value||90); DB.set('settings',settings); }
});
function syncPlanInputs(){ const p=editPlans().find(x=>x.id===editPlanId); if(!p) return;
  const n=document.getElementById('planName'); if(n) p.name=n.value.trim()||'Training';
  document.querySelectorAll('.ex-name').forEach(el=>p.exercises[+el.dataset.i].name=el.value);
  document.querySelectorAll('.ex-sets').forEach(el=>p.exercises[+el.dataset.i].sets=Math.max(1,+el.value||1)); }
document.addEventListener('change',ev=>{ if(view==='plan') syncPlanInputs();
  // Feld verlassen = Zahl steht fest: Volumen/Rekorde/XP nachziehen.
  // ⚠️ Hier bewusst KEIN render(): ein Neuzeichnen genau im Moment des Fokusverlusts frisst den
  // Klick, der ihn ausgeloest hat (mousedown auf ✕ → blur → neues DOM → mouseup ins Leere → kein
  // click). Stattdessen nur die eine Zahl im Kopf nachtragen.
  if(view==='session'&&ev.target.dataset&&ev.target.dataset.se){
    const s=sessions.find(x=>x.id===detailSessionId); if(!s) return;
    sessRecalc(s);
    const el=document.querySelector('[data-sessvol]'); if(el) el.textContent=volume(s.entries); } });

(function(){ const el=document.getElementById('splashMon');

// Schritte aus dem Kurzbefehl-Link uebernehmen. ⚠️ VOR render(), damit die Zahl gleich in der
// Ansicht steht — und nur bei eingeschaltetem Modus, sonst schriebe ein versehentlich
// geoeffneter Link Werte in ein Konto, das damit gar nicht rechnet.
(function(){ const n=leseSchritteAusLink();
  if(n===null) return;
  if(!schrittModus()){ toast('Schritte sind ausgeschaltet — anschalten in den Einstellungen'); return; }
  if(setzeSchritte(n)){ view='body';
    setTimeout(()=>toast(n.toLocaleString('de-DE')+' Schritte übernommen'), 400); } })();
/* 🔴 Das steht VOR dem ersten render() -- und das ist die eigentliche Korrektur vom
   27.08.2026. Karls Meldung: "Reingeschaut geht nicht direkt durch, wenn man die App
   startet." Es ging tatsaechlich durch, nur eben eine Zeile zu spaet: gezeichnet wurde
   zuerst, abgehakt danach, und neu gezeichnet hat niemand. Wer nach dem Start sofort auf
   die Erfolgs-Seite ging, sah einen leeren Haken an einer Aufgabe, die schon erledigt war.
   ⚠️ Reihenfolge ist hier kein Schoenheitsfehler, sondern das Feature. */
if(session){
  /* 🔴 Gefunden beim Durchsehen am 27.08.2026, eine Stunde nach dem Einbauen: das hier
     stand ganz am Ende der Startfolge und hat damit **alles ueberschrieben, was vorher eine
     Ansicht gesetzt hatte** -- eine offene Einheit (`view='workout'`), den Assistenten und die
     Schritte aus dem Kurzbefehl-Link (`view='body'`).
     ➡️ Alle drei haben einen konkreten Anlass; das Wiederkommen hat nur ein Datum. Es
     kommt deshalb nur zum Zug, wenn sonst nichts ansteht.
     ⚠️ Gefragt (und gestempelt) wird trotzdem immer -- sonst haengt es beim naechsten
     Start noch da und springt einen an, wenn man laengst wieder drin ist.
     💡 Hier wurde bis zum 29.08.2026 die Tagesaufgabe "Reingeschaut" abgehakt. Die gibt
     es nicht mehr (kein XP fuers blosse Oeffnen, Karls Ansage) -- das Wiederkommen bleibt. */
  view = startAnsicht(view, comebackPruefen(), active);
  erfolgeGesehenInit();      // muss VOR erfolgeAuszahlen laufen -- sonst gilt frisch Bezahltes als "schon gesehen"
  /* ⚠️ Rueckwirkend: beim ersten Start mit v32 wird auf einen Schlag gutgeschrieben, was
     laengst erfuellt war. Das ist ein Sprung, kein Aufbau -- aber die Arbeit dafuer ist
     getan, und die Alternative waere, sie nie zu wuerdigen. */
  erfolgeAuszahlen();
}
if(startFehler) renderAuthGate(startFehler); else render();   // ohne Anmeldung erscheint hier das Login-Fenster
splashWeg();              // die Ansicht steht — der Schirm hat seine Aufgabe erfuellt
cloudSyncStart();         // im Hintergrund; ohne Netz startet die App trotzdem normal
postfachAuffrischen();    // ist waehrend der Abwesenheit eine Antwort gekommen?
// Auf die Mitteilung getippt. Zwei Wege, weil zwei Faelle:
//   App lief noch  -> der Service Worker schickt eine Nachricht ins offene Fenster
//   App war zu     -> sie wird mit '#postfach' geoeffnet
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('message', e => {
    if(e.data && e.data.typ === 'postfach') postfachOeffnen();
  });
}
if(location.hash === '#postfach'){
  // Die Raute wieder wegnehmen, sonst landet ein spaeteres Neuladen erneut im Postfach.
  history.replaceState(null, '', location.pathname + location.search);
  postfachOeffnen();
}
window.addEventListener('online',()=>{ if(session&&dirty) cloudPush(); });
// Zwei Wege, weil kein Browser beide zuverlaessig meldet: 'visibilitychange' kommt beim
// Wegwischen und beim Bildschirm-Aus, 'pagehide' beim echten Schliessen. Doppelt gesendet
// wird nichts -- flushSync prueft dirty, und der erste Erfolg setzt es zurueck.
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){ flushSync(); return; }
  // Zurueck in der App: nachsehen, ob am anderen Geraet etwas dazugekommen ist. Ohne das
  // wuerde ein PC, der den ganzen Tag offen steht, die Einheiten vom Handy nie sehen.
  // Hoechstens alle 30 s, damit Hin- und Herschalten keine Anfragen-Lawine ausloest.
  if(session && Date.now()-letzterAbgleich>30000) cloudSyncStart();
  // Eigene Bremse, nicht die vom Abgleich: wer auf die Mitteilung tippt, kommt SOFORT
  // zurueck in die App -- und genau dann muss die Antwort da sein, nicht 30 s spaeter.
  if(session && Date.now()-postfachZuletzt>5000) postfachAuffrischen();
  /* 💡 Hier stand bis zum 29.08.2026 die zweite Haelfte der "Reingeschaut"-Korrektur:
     die App liegt als PWA im Hintergrund, der Startblock oben laeuft am naechsten Morgen
     nie erneut, also wurde die Tagesaufgabe beim Zurueckkommen nachgeholt.
     🔴 Mit der Aufgabe faellt auch das weg -- und mit ihm ein render() bei jedem Wechsel
     in die App, das laufende Eingaben wegreissen konnte. Ein Grund weniger neu zu zeichnen
     ist hier ein Gewinn, kein Verlust. */
});
window.addEventListener('pagehide',flushSync);

// Versteckte Admin-Freischaltung: 5x auf Brock auf der Startseite tippen (nur auf Karls Gerät).
// Lag früher auf dem App-Titel — den gibt es seit dem Entfernen des Kopfbereichs nicht mehr.
(function(){ let n=0,t0=0;
  document.addEventListener('click',ev=>{
    if(view!=='home' || !ev.target.closest('.mascot')) return;
    const now=Date.now(); if(now-t0>1500) n=0; t0=now; n++;
    /* 🔴 Frueher stand hier `devAdmin=!devAdmin` -- die Geste hat also auch WIEDER
       ZUGESPERRT. Karl am 27.08.2026: "meine Admin-Konsole auf dem Handy ist ausserdem weg."
       Genau so geht sie weg: fuenfmal auf Brock getippt, waehrend sie schon offen war, und
       der Hinweis dazu ist nach 1,8 Sekunden verschwunden.
       ⚠️ Eine Geste, die aufschliesst, darf nicht zufaellig auch abschliessen. Zumachen
       geht jetzt nur noch bewusst, ueber den Knopf in der Konsole selbst. */
    if(n>=5){ n=0;
      if(devAdmin){ toast('Admin ist schon offen — steht unten in den Einstellungen'); return; }
      devAdmin=true; DB.set('devadmin',true);
      toast('Admin freigeschaltet — steht unten in den Einstellungen'); }
  });
})();

/* ---------- Zurueckgebaut: die Leiste wird NICHT mehr angefasst (27.08.2026) ----------
   🔴 Hier stand ein paar Stunden lang eine Korrektur, die die untere Leiste an den
   sichtbaren Bildschirm heften sollte. Karls Meldung danach: **"man kann die Leiste unten
   nicht mehr sehen, und immer wenn ich schon ganz oben bin und weiter hochscrolle, geht sie
   hoch bis zur Mitte des Bildschirms."**

   ⚠️ **Das war schlimmer als das Problem, das sie loesen sollte.** Der Anlass war ein
   Verrutschen, das Karl **einmal** gesehen hatte. Der Rueckbau eines Browser-Verhaltens von
   Hand hat daraus einen Fehler gemacht, der **bei jedem Scrollen** auftritt.

   **Warum sie nicht funktionieren konnte:** `visualViewport.offsetTop` wandert beim
   Ueberziehen am oberen Rand (Gummiband) mit, und `clientHeight` und `visualViewport.height`
   stehen auf Android je nach Zustand der Adressleiste in beiden Richtungen auseinander. Die
   Rechnung hatte also weder ein verlaessliches Vorzeichen noch einen ruhenden Nullpunkt --
   sie hat das Gummiband einfach mitgezeichnet.

   ➡️ **Regel daraus:** gegen ein Verhalten, das man nicht nachstellen kann, baut man
   keine Dauerkorrektur. `position:fixed; bottom:0` macht der Browser selbst richtig, und die
   seltene Ausnahme ist billiger als eine Korrektur, die immer laeuft.                      */

/* ---------- Zwischen den Reitern wischen (27.08.2026) ----------
   Karls Ansage: "man soll auf dem Handy zwischen den einzelnen Reitern hin und her switchen
   koennen."

   ⚠️ **Nur zwischen den vier Reitern der unteren Leiste**, und nur wenn man gerade auf
   einem davon steht. Wer in einer Einheit, im Assistenten oder in einer Unteransicht
   (Verlauf, Datenschutz, Meldung) ist, wischt nichts weg -- dort waere ein Wisch ein
   Datenverlust oder mindestens ein verlorener Platz.
   🔴 **Und drei Riegel, damit es nicht ausloest, wo es nicht soll:** nicht aus einem
   Eingabefeld heraus (dort wischt man Text), nicht aus etwas seitlich Scrollbarem heraus
   (dort wischt man den Inhalt), und nicht bei offenem Fenster.
   ⚠️ `passive:true` -- es wird nichts abgefangen, nur zugehoert. Ein Wisch, der das
   normale Scrollen bremst, waere schlimmer als kein Wisch.                                */
const REITER = ['home','body','erfolge','settings'];
/* Einen Reiter zeigen -- mit der Bewegung in die Richtung, in die es geht.
   ⚠️ Steht als eigene Funktion da, weil BEIDE Wege sie brauchen: der Wisch und der Tipp
   auf die untere Leiste. Sonst saehe dasselbe Ziel je nach Weg anders aus. */
function reiterZeigen(ziel){
  const el = document.getElementById('app');
  const von = REITER.indexOf(view), nach = REITER.indexOf(ziel);
  if(el){ el.classList.remove('zieht','faellt-zurueck','rein-r','rein-l'); el.style.transform=''; }
  view = ziel; render();
  if(!el || von === -1 || nach === -1 || von === nach) return;
  /* Das Lesen von offsetWidth erzwingt einen Neuaufbau -- ohne das startet die Animation
     nicht neu, wenn zweimal hintereinander in dieselbe Richtung gewechselt wird. */
  void el.offsetWidth;
  el.classList.add(nach > von ? 'rein-r' : 'rein-l');
}
/* ---------- Zwischen den Reitern wischen (27.08.2026) ----------
   Karls Ansage: "man soll auf dem Handy zwischen den einzelnen Reitern hin und her switchen
   koennen." Und danach: es soll "nach richtig ziehen" aussehen.

   ⚠️ **Nur zwischen den vier Reitern der unteren Leiste**, und nur wenn man gerade auf
   einem davon steht. Wer in einer Einheit, im Assistenten oder in einer Unteransicht ist,
   wischt nichts weg -- dort waere ein Wisch ein Datenverlust oder ein verlorener Platz.
   🔴 **Drei Riegel:** nicht aus einem Eingabefeld heraus (dort wischt man Text), nicht
   aus etwas seitlich Scrollbarem heraus (dort wischt man den Inhalt), und nicht bei offenem
   Fenster.
   ⚠️ Alle Zuhoerer sind `passive` -- es wird nichts abgefangen, nur zugehoert. Ein Wisch,
   der das normale Scrollen bremst, waere schlimmer als kein Wisch. Deshalb entscheidet
   `touchmove` auch erst nach ein paar Pixeln, ob es ueberhaupt waagerecht gemeint war:
   solange das offen ist, wird nichts bewegt.
   💡 **Am Rand wird es zaeh** (0,18 statt 0,45): die Seite gibt ein Stueck nach und
   federt zurueck. Das sagt "da kommt nichts mehr", ohne einen Satz dafuer zu brauchen. */
(function(){
  const el = document.getElementById('app'); if(!el) return;
  let x0=0, y0=0, t0=0, laeuft=false, zieht=false;
  function darfWischen(ziel){
    if(window.innerWidth >= 900) return false;                       // PC: Seitenleiste
    if(document.getElementById('modal').classList.contains('show')) return false;
    if(REITER.indexOf(view) === -1) return false;
    if(ziel && ziel.closest && ziel.closest('input,textarea,select,button')) return false;
    for(let n = ziel; n && n !== el; n = n.parentElement){
      const st = getComputedStyle(n);
      if((st.overflowX === 'auto' || st.overflowX === 'scroll') && n.scrollWidth > n.clientWidth + 4) return false;
    }
    return true;
  }
  function losslassen(){
    el.classList.remove('zieht');
    if(zieht){ el.classList.add('faellt-zurueck'); el.style.transform='';
      setTimeout(()=>el.classList.remove('faellt-zurueck'), 200); }
    laeuft=false; zieht=false;
  }
  el.addEventListener('touchstart', e => {
    laeuft = false; zieht = false;
    if(e.touches.length !== 1) return;
    if(!darfWischen(e.target)) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now(); laeuft = true;
  }, {passive:true});
  el.addEventListener('touchmove', e => {
    if(!laeuft || e.touches.length !== 1) return;
    const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
    if(!zieht){
      // Senkrecht gemeint? Dann ist es Scrollen, und wir halten uns raus -- endgueltig.
      if(Math.abs(dy) > 10 && Math.abs(dy) >= Math.abs(dx)){ laeuft = false; return; }
      if(Math.abs(dx) < 12) return;
      zieht = true; el.classList.remove('faellt-zurueck'); el.classList.add('zieht');
    }
    const i = REITER.indexOf(view);
    const amRand = (dx < 0 && i >= REITER.length-1) || (dx > 0 && i <= 0);
    el.style.transform = 'translateX(' + (dx * (amRand ? 0.18 : 0.45)).toFixed(1) + 'px)';
  }, {passive:true});
  el.addEventListener('touchcancel', losslassen, {passive:true});
  el.addEventListener('touchend', e => {
    if(!laeuft){ losslassen(); return; }
    const t = e.changedTouches && e.changedTouches[0];
    const dx = t ? t.clientX - x0 : 0, dy = t ? t.clientY - y0 : 0, dt = Date.now() - t0;
    const i = REITER.indexOf(view);
    const weit = Math.abs(dx) >= 60 && Math.abs(dy) <= 45 && Math.abs(dx) > Math.abs(dy) * 1.8;
    // Ein kurzer, schneller Wisch zaehlt auch, wenn er nicht die vollen 60 px schafft.
    const schnell = dt < 250 && Math.abs(dx) >= 35 && Math.abs(dx) > Math.abs(dy) * 2;
    const ziel = i + (dx < 0 ? 1 : -1);
    if(t && dt <= 700 && (weit || schnell) && i !== -1 && ziel >= 0 && ziel < REITER.length){
      el.classList.remove('zieht'); el.style.transform='';
      laeuft = false; zieht = false;
      reiterZeigen(REITER[ziel]);
      return;
    }
    losslassen();
  }, {passive:true});
})();

/* ---------- Neue Fassung erkennen und anbieten (31.08.2026) ----------
   Der Service Worker laeuft auf "Netz zuerst" und ruft `skipWaiting()` -- neue Dateien sind
   also sofort da. **Ein Fenster, das schon offen steht, merkt davon nichts:** sein HTML ist
   geladen, und geladen bleibt geladen. Genau das ist Karl am 27.08. zweimal passiert.

   ⚠️ **Es wird NICHT von selbst neu geladen.** Ein Neuladen reisst weg, was gerade eingetippt
   ist; die App uebt dieselbe Vorsicht schon beim Sprung ins Postfach ("laeuft ein Training,
   bleibt sie stehen"). Der Hinweis fragt, das Laden entscheidet Karl.

   ⚠️ `installed` ALLEIN genuegt als Bedingung nicht -- das ist auch der Zustand bei der
   allerersten Installation. `navigator.serviceWorker.controller` trennt beides: den gibt es
   nur, wenn vorher schon einer da war. Ohne die Abfrage saehe jeder neue Nutzer beim ersten
   Start "Neue Fassung ist da". */
/* Rein rechnerisch: soll die Leiste jetzt zu sehen sein? Ausgelagert, weil der Rest dieses
   Blocks in den Pruefungen NIE laeuft -- die laden ueber `file://`, und dort gibt es
   `navigator.serviceWorker` gar nicht. Als freie Funktion ist wenigstens die Entscheidung
   nachpruefbar, samt der Ruecksicht aufs laufende Training. */
function fassungsLeisteFaellig(wartet, ansicht){ return wartet === true && ansicht !== 'workout'; }

if('serviceWorker' in navigator){
  const leiste = document.getElementById('neufassung');
  let fassungWartet = false;

  /* Beim Zeichnen aus render() heraus: ein Hinweis, der waehrend des Trainings gekommen ist,
     wird hier nachgeholt. */
  window.neueFassungPruefen = () => {
    if(fassungsLeisteFaellig(fassungWartet, view)) leiste.classList.add('show');
  };

  leiste.addEventListener('click', () => {
    flushSync();            // erst wegschreiben, dann neu laden -- sonst kostet der Klick Daten
    location.reload();
  });

  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const neu = reg.installing;
      if(!neu) return;
      neu.addEventListener('statechange', () => {
        if(neu.state === 'installed' && navigator.serviceWorker.controller){
          fassungWartet = true;
          window.neueFassungPruefen();
        }
      });
    });

    /* Von selbst sieht der Browser nur beim Navigieren nach -- eine PWA, die wochenlang im
       Hintergrund liegt, navigiert nie. Also beim Zurueckkommen fragen, hoechstens alle
       fuenf Minuten (dieselbe Ueberlegung wie bei der 30-Sekunden-Bremse am Abgleich). */
    let zuletztGesucht = Date.now();
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState !== 'visible') return;
      if(Date.now() - zuletztGesucht < 300000) return;
      zuletztGesucht = Date.now();
      reg.update().catch(()=>{});
    });
  }).catch(()=>{});
}
</script>
