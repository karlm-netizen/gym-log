function renderHome(){
  // Reihenfolge: Fortschritt, dann Heute (mit dem laufenden Training darin), dann Nachschlagen.
  // Brock sitzt klein in der Heute-Karte, weil sein Spruch sich genau darauf bezieht.
  // Der Begleiter waechst mit: er zeigt den getragenen Rang, nicht mehr den alten Brock.
  const brock=`<div class="mascot mini">${monster(56,'',equippedRank())}<div class="bubble">${brockSay()}</div></div>`;
  // Auf dem PC (ab 900 px) stehen die zwei Blöcke nebeneinander, am Handy untereinander.
  // Dieselben Karten, nur ein Umbruch — kein eigener Bau fürs breite Fenster.
  let h='<div class="cols2"><div>';

  // 1 · Fortschritt. Die drei Kacheln (Einheiten / diese Woche / kg Vol.) sind am 05.08. auf
  // Karls Ansage raus — die Zahlen stehen im Verlauf, hier waren sie nur Beiwerk.
  h+=`<div class="row between" style="margin:2px 4px 6px"><h2>Fortschritt</h2></div>`;
  h+=rankCardHTML();

  /* 🗑️ Hier stand bis zum 29.08.2026 die Wochen-Serie ("1 Woche am Stueck" mit den
     Kaestchen daneben). Karls Ansage: sie kann von der Startseite raus.
     ⚠️ NUR von der Startseite -- `wochenSerie()` selbst bleibt stehen. Sie ist getestet,
     sie meint etwas anderes als `besteWochenSerie()` (laufend statt laengste je), und die
     Unterscheidung ist eine Falle, die schon zweimal geloest werden musste.
     🔴 Sie hat damit aber KEINEN Aufrufer mehr in der App. Wer sie wieder braucht, holt
     sich hier eine fertige Funktion -- wer aufraeumt, weiss, dass nichts daran haengt. */
  h+='</div><div>';

  // 2 · Heute. Ein laufendes Training steht seit dem 05.08. NICHT mehr ganz oben, sondern
  // direkt unter dieser Überschrift — Karls Ansage.
  const p=planForToday();
  h+=`<div class="row between" style="margin:2px 4px 6px"><h2>Heute · ${DAYLONG[todayIdx()]}</h2></div>`;
  if(active){ h+=`<div class="card" style="border-color:var(--accent)">
    <div class="row between"><h2>Training läuft</h2><span class="pill">${esc(active.planName)}</span></div>

    <button class="btn primary" style="margin-top:12px" data-act="resume">Fortsetzen</button>
    <button class="btn ghost sm" style="margin-top:8px;color:var(--danger)" data-act="discard">Verwerfen</button></div>`; }
  if(p){ h+=`<div class="card" style="border-color:var(--accent);margin-top:${active?'10px':'0'}">

      ${active?'':brock}
      <button class="btn primary" style="margin-top:12px" data-startplan="${p.id}">${active?'Nochmal starten':'Starten'}</button></div>`; }
  else if(!active){ const nx=nextTrainingDay();
    h+=`<div class="card"><b>Ruhetag</b>
      <div class="muted tiny" style="margin-top:6px">${nx?`Weiter geht's am ${DAYLONG[nx.d]} mit ${esc(nx.p.name)}.`:'Noch keine Trainingstage festgelegt.'}</div>

      ${plans.length?'':`<button class="btn primary" style="margin-top:12px" data-act="ob:start">Plan einrichten</button>`}</div>`; }

  /* Erinnerungen (Karls Ansagen vom 28. und 29.08.2026).
     ⚠️ Jede steht NUR da, solange die Sache heute offen ist -- eine Erinnerung, die nach dem
     Erledigen stehen bleibt, ist keine Erinnerung mehr, sondern Deko.
     ⚠️ Und jede laesst sich in den Einstellungen abschalten. Ohne Schalter waere sie eine
     Aufforderung, die man nicht loswird -- der Unterschied zwischen Erinnern und Noergeln.
     Das Feld traegt dieselbe Kennung und denselben Knopf wie auf der Kalorien-Seite; beide
     Seiten sind nie gleichzeitig da, also gibt es keine zwei.
     💡 Der erklaerende Satz ("Am besten morgens vor dem Essen. Zuletzt ... kg am ...") ist
     am 29.08. auf Karls Ansage raus. Er stand jeden Tag da und sagte jeden Tag dasselbe. */
  if(erinnerungAn('wiegen') && !gewogenHeute()){

// ---------- Verlauf einer einzelnen Übung ----------
/* 🔴 `arbeit()` und nicht `e.sets` — gefunden beim Durchsehen am 30.08.2026. Der
   Aufwaermsatz zaehlte hier mit, ueberall sonst nicht: `volume()`, `doneSets()` und
   `prFor()` gehen alle durch `arbeit()`. Damit widersprachen sich zwei Seiten ueber
   dieselbe Einheit — im Verlauf stand „4 Saetze", in der Uebung darunter „5". Und die
   Volumen-Kurve hier zeigte eine andere Zahl als die Liste eine Ansicht darueber.
   ⚠️ Der teuerste Teil war nicht die Anzahl, sondern `w`: der Aufwaermsatz ist mit 70 %
   angesetzt, aber eingetippt wird von Hand. Eine 100 statt 10 im Aufwaermfeld hob das
   „Bestes kg seit Start" an, ohne je in einem Rekord aufzutauchen. */
function exHistory(name){ const out=[];
  sessions.forEach(s=>{ const e=s.entries.find(x=>x.name===name); if(!e) return;
    const d=arbeit(e.sets).filter(x=>x.done); if(!d.length) return;
    out.push({ date:s.date, w:Math.max(...d.map(x=>+x.weight||0)),
      vol:d.reduce((a,x)=>a+(+x.weight||0)*(+x.reps||0),0), sets:d.length,
      reps:d.reduce((a,x)=>a+(+x.reps||0),0) }); });
  return out; }
// Kurve mit Beschriftung an der Seite und unten (Karls Meldung, 28.08.2026: „beim Verlauf
// vom Gewicht stehen keine Parameter an der Seite und unten"). Vorher war es eine nackte
// Linie -- man sah, DASS es hoch oder runter ging, aber nicht von wo nach wo.
//   opt.x       Zeitstempel je Punkt, gleich lang wie vals -> Datum unten
//   opt.fmt     wie ein Wert geschrieben wird (Standard: Kilogramm mit Komma)
//   opt.einheit steht hinter der obersten Zahl, damit die Achse nicht nur Ziffern zeigt
// ⚠️ Der waagerechte Rand ist mit 4 statt 10 knapp gehalten, damit das erste und das letzte
// Datum praktisch ueber ihrem Punkt stehen.
// ✅ Seit dem 02.09.2026 sitzen die Punkte nach ihrem ZEITABSTAND, nicht nach ihrer
// Reihenfolge. Die Mitte der Achse ist damit immer ein echter Zeitpunkt (die Mitte zwischen
// erstem und letztem Eintrag) -- vorher gab es dort nur bei ungerader Punktzahl ein
// ehrliches Datum. Ohne brauchbare Zeitstempel gilt weiter der gleichmaessige Abstand.
function lineChart(vals,w,h,opt){
  if(vals.length<2) return '';
  const o=opt||{}, fmtV=o.fmt||fmtKg, xs=Array.isArray(o.x)?o.x:[];
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1, pad=10, padX=4;
  /* 🔴 Bis zum 02.09.2026 sassen die Punkte gleichmaessig nebeneinander -- der
     Abstand war die Reihenfolge, nicht die Zeit. Bei „1 Jahr" sah eine Pause von drei
     Monaten aus wie ein einzelner Tag, und zwei Wiegungen an aufeinanderfolgenden Tagen
     genauso breit wie zwei mit einem halben Jahr dazwischen. **Die Kurve behauptete damit
     einen Verlauf, den es nicht gab** -- ein steiler Anstieg konnte in Wahrheit ein halbes
     Jahr gedauert haben. Betraf alle drei Kurven, seit es sie gibt.
     ⚠️ Die Zeitachse gilt nur, wenn die Zeitstempel auch wirklich aufsteigend
     sind. `exHistory` folgt der Reihenfolge in `sessions`, und die ist nirgends zugesichert
     -- bei einer Zeitreise rutschte die Linie sonst zurueck und wuerde zum Zickzack.
     Dann bleibt es beim alten, gleichmaessigen Abstand: falscher Massstab ist besser als
     eine Linie, die vor- und zurueckspringt.
     ⚠️ Und wenn alle Punkte auf denselben Zeitpunkt fallen (Spanne null), gibt es
     nichts zu verteilen -- auch dann der alte Weg. */
  const zeitAchse = xs.length===vals.length
    && xs.every((z,i)=> typeof z==='number' && isFinite(z) && (i===0 || z>=xs[i-1]))
    && (xs[xs.length-1]-xs[0]) > 0;
  const zSpanne = zeitAchse ? (xs[xs.length-1]-xs[0]) : 0;
  const anteil = i => zeitAchse ? (xs[i]-xs[0])/zSpanne : i/(vals.length-1);
  const pt=(v,i)=>[ padX+(w-2*padX)*anteil(i), h-pad-(h-2*pad)*((v-min)/span) ];
  const ps=vals.map(pt);
  const line=ps.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${ps[ps.length-1][0].toFixed(1)} ${h-pad} L${ps[0][0].toFixed(1)} ${h-pad} Z`;
  // ⚠️ `vector-effect="non-scaling-stroke"` an JEDEM Strich (Karls Meldung 28.08.2026:
  // „der Gewichtsverlauf ist so komisch stretched auf dem PC"). Die Flaeche wird mit
  // preserveAspectRatio="none" auf die Kartenbreite gezogen -- am Telefon ist das gut ein
  // Zehntel, auf einem 1120-px-Fenster fast das Vierfache. Ohne den Zusatz wird JEDE
  // Strichstaerke waagerecht mitgedehnt: die Linie ist an flachen Stellen duenn und an
  // steilen dick, die Striche des Rasters werden zu Balken.
  // 🔴 Und die Punkte sind deshalb keine <circle> mehr: eine Kreis-FUELLUNG laesst sich
  // nicht davon ausnehmen, sie wird zur Ellipse. Ein sehr kurzer Strich mit runder Kappe
  // zeichnet denselben Punkt -- und eine Kappe ist Strich, gilt also die Ausnahme.
  // ⚠️ Die 0,001 Einheiten Laenge sind Absicht und nicht null: ein Strich der Laenge null
  // wird zwar laut Norm gezeichnet, hat aber im Browser ein leeres Rechteck -- damit koennte
  // die Pruefung unten gar nicht nachmessen, ob der Punkt rund ist.
  const dots=ps.map(p=>`<line x1="${p[0].toFixed(1)}" y1="${p[1].toFixed(1)}" x2="${(p[0]+0.001).toFixed(3)}" y2="${p[1].toFixed(1)}" stroke="var(--accent)" stroke-width="5.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`).join('');
  const raster=[pad,h/2,h-pad].map(y=>`<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>`).join('');
  const svg=`<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block">
    ${raster}
    <path d="${area}" fill="var(--accent)" opacity=".13"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${dots}</svg>`;
  // Sind alle Werte gleich, laeuft die Linie unten -- dann steht dort auch nur EINE Zahl.
  // Dreimal dieselbe untereinander wuerde eine Spanne vortaeuschen, die es nicht gibt.
  const eine=(max===min);
  const einh=o.einheit?' '+o.einheit:'';
  const yTxt=eine ? `<span>${fmtV(min)}${einh}</span>`
    : [max,(min+max)/2,min].map((v,i)=>`<span>${fmtV(v)}${i?'':einh}</span>`).join('');
  let xTxt='';
  if(xs.length===vals.length){
    const d=z=>`<span>${fmtTag(z)}</span>`;
    /* ⚠️ Die mittlere Beschriftung stand frueher nur bei ungerader Punktzahl da --
       nur dann lag ein PUNKT wirklich in der Mitte, und bei gerader Zahl haette das Datum
       einen Zeitpunkt behauptet, den es nicht gibt.
       ✅ Mit der Zeitachse ist das anders herum: die Mitte der Achse ist jetzt immer
       ein echter Zeitpunkt, naemlich die Mitte zwischen erstem und letztem Eintrag. Sie
       gehoert keinem Punkt, und genau deshalb stimmt sie. Die Punktzahl ist egal. */
    const mitte = zeitAchse ? (xs[0]+xs[xs.length-1])/2
                            : (vals.length%2 ? xs[(vals.length-1)/2] : null);
    xTxt = (vals.length>=5 && mitte!=null) ? d(xs[0])+d(mitte)+d(xs[xs.length-1])
                                           : d(xs[0])+d(xs[xs.length-1]);
  }
  return `<div class="chart"><div class="chart-y${eine?' einer':''}">${yTxt}</div>`
    +`<div class="chart-plot">${svg}</div>`
    +(xTxt?`<div class="chart-x">${xTxt}</div>`:'')+`</div>`;
}

// ---------- Eine Einheit im Verlauf ----------
// Seit dem 06.08. laesst sich eine abgeschlossene Einheit nachtraeglich geradebiegen (Karls
// Ansage). Vorher gab es nur „loeschen" — ein Tippfehler bei kg (100 statt 10) verzog Rekorde,
// Volumen und Kurven dauerhaft, und der einzige Ausweg war, die ganze Einheit wegzuwerfen.
let sessEdit=false;
// XP nachfuehren. Moeglich nur, wenn beim Beenden festgehalten wurde, wie viel es dafuer gab —
// Einheiten von vor dem 06.08. haben kein s.xp, dort bleibt der Punktestand unangetastet
// (lieber ein alter Wert stehen als ein geratener abgezogen).
/* ---------- XP fuer eine Einheit (neu am 26.08.2026) ----------
   ⚠️ VORHER: Saetze*10 + 50 + (Volumen/1000)*20, ohne Deckel. Das hat DIE KILOS belohnt,
   nicht die Anstrengung. Durchgerechnet am 22.08.:

     Anfaenger Oberkoerper  12 Saetze,  2.500 kg = 210 XP
     Fortgeschritten Beine  18 Saetze, 20.000 kg = 630 XP   -> dreimal so viel

   Kniebeugen bewegen nun mal mehr Kilo als Curls. Wer stark ist, stieg dreimal so
   schnell auf, und ein ehrlich harter Oberkoerpertag war weniger wert als ein lockerer
   Beintag. Bis Gigachad (Level 45, 42.240 XP): Anfaenger 15 Monate, Fortgeschrittener 5.

   JETZT: die Kilos zaehlen weiter (Karls Ansage: "soll aber auch Gewicht belohnen"),
   aber GEDECKELT. Oben drauf kommt, was wirklich Anstrengung ist: jeder Satz, und jeder
   Satz, der einen eigenen Rekord bricht.

     Anfaenger Oberkoerper  12 Saetze, 2 Rekorde, 2.500 kg = 260 XP
     Fortgeschritten Beine  18 Saetze, 2 Rekorde, 20.000 kg = 380 XP  -> Faktor 1,5

   ⚠️ Der Deckel ist der eigentliche Eingriff, nicht der Rekord-Bonus. Ohne ihn waechst
   der Volumenanteil mit der Kraft unbegrenzt weiter und frisst alles andere auf. */
const VOL_XP_MAX = 100;              // hoechstens 100 XP aus dem Volumen, also 5.000 kg
function volXP(en){ return Math.min(Math.floor(volume(en)/1000)*20, VOL_XP_MAX); }
/* ⚠️ `prs` kommt VON AUSSEN und wird nicht aus `en` gerechnet. Ob ein Satz ein Rekord war,
   haengt an der Historie zum Zeitpunkt des Trainings -- nicht an den Saetzen selbst. Wer
   das aus `en` herleiten wollte, bekaeme beim spaeteren Nachrechnen (sessRecalc) eine
   andere Zahl als beim Beenden. Deshalb wird die Anzahl an der Einheit festgehalten. */
function sessXP(en, prs){ return doneSets(en)*10 + 50 + (+prs||0)*25 + volXP(en); }
function sessRecalc(s){
  if(typeof s.xp==='number'){ const neu=sessXP(s.entries, s.pr||0);
    profile.xp=Math.max(0, profile.xp + (neu - s.xp)); s.xp=neu; }
  save();
}

// ---------- Kalorien ----------
// Der Tab hiess bis zum 06.08. „Körper" und hielt nur das Gewicht. Jetzt sitzt hier der
// Ernaehrungs-Teil (Karls Ansage): Tagesziel, was heute gegessen wurde, und drei Wege,
// etwas einzutragen — eigene Liste, Barcode, Foto. Das Gewicht bleibt darunter stehen.
//
// Datenmodell (alles in profile.kcal, wandert damit ueber Sync und Backup mit):
//   goal   Tagesziel in kcal (null = noch nicht gesetzt)
//   foods  eigene Lebensmittel [{id,name,marke,kcal,p,c,f}] — Werte immer je 100 g
//   meals  Eintraege [{id,date,name,menge,kcal,p,c,f,quelle}] — Werte schon ausgerechnet,
//          damit ein spaeter geaendertes Lebensmittel die Vergangenheit nicht umschreibt.
/* Alles in profile.kcal, was KEINE Liste ist. Steht hier, weil zwei Stellen es
   brauchen: kcalInit legt es an, blobsZusammen fuehrt es zusammen.
   🔴 Am 01.09.2026 gefunden: blobsZusammen kannte diese Felder gar nicht. Beim
   Abgleich mit einem Geraet, dessen Stand aelter ist als der 23.08., wurde
   `b.profile.kcal` neu gebaut -- und das Tagesziel war weg. Ohne Meldung: fuer
   Karl stand einfach der Einrichtungs-Assistent wieder da.
   ⚠️ Wer hier ein Feld dazunimmt, muss nichts weiter tun -- die Pruefung
   `kcal-felder-vollstaendig` haelt diese Liste gegen den Quelltext und wird rot,
   sobald irgendwo ein `k.neuesFeld=` steht, das hier fehlt. */
const KCAL_SKALARE = ['goal','setup','art','wochen','start','startKg','schritte'];
function kcalInit(){
  if(!profile.kcal || typeof profile.kcal!=='object') profile.kcal={};
  const k=profile.kcal;
  if(!(k.goal>0)) k.goal=k.goal===0?0:null;
  if(!Array.isArray(k.foods)) k.foods=[];
  if(!Array.isArray(k.meals)) k.meals=[];
  return k;
}
function mealsToday(){ const n=Date.now(); return kcalInit().meals.filter(m=>sameDay(m.date,n)); }

/* ============================================================================
   Mahlzeiten (23.08.2026) — nach Karls Vorlage aus Discord.
   Vorher war der Tag EINE flache Liste; jetzt vier Bloecke mit eigenem Ziel.

   💡 Die Anteile stammen aus Karls Bild, nicht aus dem Lehrbuch: dort stehen
   1.113 / 1.484 / 927 / 185 kcal bei 3.709 kcal Tagesziel — also 30 / 40 / 25 / 5 %.

   ⚠️ BESTANDSDATEN haben kein `mz`-Feld. Sie werden NICHT auf "Snacks" geworfen,
   sondern aus ihrer Uhrzeit erschlossen (`mahlzeitVon`). Ein pauschaler Sammeltopf
   haette jeden alten Eintrag falsch einsortiert und die Bloecke von Tag eins an
   unbrauchbar gemacht. Die Uhrzeit steht in jedem Eintrag — sie ist die beste
   Auskunft, die es rueckwirkend gibt.                                              */
const MAHLZEITEN = [
  { id:'f', name:'Frühstück',   icon:'☕', anteil:0.30, von:4,  bis:11 },
  { id:'m', name:'Mittagessen', icon:'🍝', anteil:0.40, von:11, bis:16 },
  { id:'a', name:'Abendessen',  icon:'🥗', anteil:0.25, von:16, bis:22 },
  { id:'s', name:'Snacks',      icon:'🍎', anteil:0.05, von:22, bis:4  },
];
/* Welche Mahlzeit gehoert zu dieser Stunde? Snacks umschliessen Mitternacht,
   deshalb die Fallunterscheidung statt eines einfachen Vergleichs. */
function mahlzeitAusStunde(std){
  for(const mz of MAHLZEITEN){
    if(mz.von < mz.bis){ if(std >= mz.von && std < mz.bis) return mz.id; }
    else               { if(std >= mz.von || std < mz.bis) return mz.id; }
  }
  return 's';
}
function mahlzeitVon(m){
  if(m && m.mz && MAHLZEITEN.some(x=>x.id===m.mz)) return m.mz;
  return mahlzeitAusStunde(new Date(m && m.date ? m.date : Date.now()).getHours());
}
function mahlzeitJetzt(){ return mahlzeitAusStunde(new Date().getHours()); }
/* Das Ziel eines Blocks. Haengt am TAGESziel des Tages (im Schritt-Modus beweglich),
   nicht am Grundziel — sonst zeigten die vier Bloecke zusammen etwas anderes an als
   der Ring darueber. */
function mahlzeitZiel(mzId, tagesziel){
  const mz = MAHLZEITEN.find(x=>x.id===mzId);
  return (mz && tagesziel>0) ? Math.round(tagesziel*mz.anteil) : 0;
}
function sumMeals(list){ const s={kcal:0,p:0,c:0,f:0};
  list.forEach(m=>{ s.kcal+=+m.kcal||0; s.p+=+m.p||0; s.c+=+m.c||0; s.f+=+m.f||0; });
  Object.keys(s).forEach(x=>s[x]=Math.round(s[x])); return s; }

/* NEU (23.08.2026): die Ess-Serie — wie viele TAGE am Stueck wurde mitgeschrieben?
   Karls Ansage: „Flammen beim kalorientracken streak".

   💡 Warum Tage und nicht Wochen wie beim Training: das ist bewusst anders. Beim
   Training zaehlt die Serie Wochen, weil Ruhetage zum Plan GEHOEREN — eine Tagesserie
   wuerde dort jeden Ruhetag reissen und damit etwas bestrafen, das richtig ist.
   Beim Essen gibt es keinen Ruhetag: gegessen wird jeden Tag, also ist jeder Tag
   entweder mitgeschrieben oder nicht.

   ⚠️ Der heutige Tag zaehlt nur mit, wenn schon etwas eingetragen ist — sonst
   staende die Serie jeden Morgen auf 0, obwohl noch gar nichts versaeumt ist.
   Dieselbe Falle wie bei wochenSerie(), dort schon einmal geloest.

   ⚠️ Fasst XP NICHT an. Am 22.08. wurde bewusst entschieden, fuers Essen keine XP
   zu geben — das wuerde den Rang entwerten, der zurzeit Training misst. Die Flamme
   ist eine Anzeige, keine Waehrung.                                                */
function tagStart(ts){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function essSerie(){
  const meals=kcalInit().meals||[];
  if(!meals.length) return 0;
  const tage=new Set(meals.map(m=>tagStart(m.date)));
  let n=0, d=tagStart(Date.now());
  if(!tage.has(d)) d-=864e5;          // heute noch nichts? Dann ab gestern zaehlen.
  while(tage.has(d)){ n++; d-=864e5; }
  return n;
}
/* Der laengste je erreichte Lauf — damit eine gerissene Serie nicht spurlos weg ist.
   ⚠️ Wird aus den Daten GERECHNET, nicht gespeichert: ein gespeicherter Rekord waere
   nach dem Loeschen eines Eintrags falsch und liesse sich nie wieder richtigstellen. */
function essSerieRekord(){
  const meals=kcalInit().meals||[];
  if(!meals.length) return 0;
  const tage=[...new Set(meals.map(m=>tagStart(m.date)))].sort((a,b)=>a-b);
  let best=1, lauf=1;
  for(let i=1;i<tage.length;i++){
    lauf = (tage[i]-tage[i-1]===864e5) ? lauf+1 : 1;
    if(lauf>best) best=lauf;
  }
  return best;
}

/* ============================================================================
   NEU (lokale Variante, 22.08.2026) — der Ernaehrungsteil kennt das Gewicht

   Der Kern der Idee: die App weiss beides. Sie fuehrt eine Gewichtskurve UND ein
   Essensprotokoll, hat die beiden aber nie miteinander reden lassen. Alles hier
   unten leitet aus dem Gewicht ab, was der Nutzer sonst selbst ausrechnen muesste.
   ========================================================================== */

// Ist heute ein Trainingstag? Die App weiss das laengst (Plan oder bereits trainiert),
// hat es im Ernaehrungsteil aber nie benutzt — die beiden Haelften der App kannten
// einander nicht.
function istTrainingstag(){ return !!planForToday() || trainedToday(); }

// Eiweissziel aus dem Koerpergewicht. 1,8 g je kg ist der gaengige Richtwert beim
// Krafttraining (Bereich 1,6-2,2). ⚠️ Ohne eingetragenes Gewicht gibt es KEIN Ziel —
// geraten wird nicht, dann steht dort ein Hinweis statt einer Zahl.
// 💡 An Trainingstagen 2,0 g statt 1,8 g je kg — an dem Tag, an dem der Reiz gesetzt
// wird, ist der Baustoff am wichtigsten.
function eiweissZiel(){
  const w=lastWeight(); if(!w) return null;
  return Math.round(w.kg*(istTrainingstag()?2.0:1.8));
}

// Kalorien-Vorschlag aus dem Koerpergewicht. Anhalt kg x 30, auf 50 gerundet —
// dieselbe Faustregel, die bisher nur als Text im Eingabefenster stand. Sie dort
// hinzuschreiben und den Nutzer rechnen zu lassen, war der halbe Weg.
function kcalVorschlag(){ const w=lastWeight(); return w ? Math.round(w.kg*30/50)*50 : null; }

function mealsOn(ts){ return kcalInit().meals.filter(m=>sameDay(m.date,ts)); }

// Schnitt der letzten `tage` Tage — aber NUR ueber Tage, an denen etwas eingetragen
// wurde. ⚠️ Wichtig: Tage ohne Eintrag als 0 kcal zu zaehlen wuerde den Schnitt
// beliebig nach unten druecken und aus "nicht protokolliert" ein "nichts gegessen"
// machen. Das ist der haeufigste Rechenfehler in solchen Apps.
function kcalSchnitt(tage){
  const n=Date.now(); let summe=0, mitEintrag=0;
  for(let i=0;i<tage;i++){
    const liste=mealsOn(n-i*864e5);
    if(liste.length){ summe+=sumMeals(liste).kcal; mitEintrag++; }
  }
  return mitEintrag ? {schnitt:Math.round(summe/mitEintrag), tage:mitEintrag} : null;
}

// Brock im Ernaehrungsteil. Bisher kam er dort ueberhaupt nicht vor — er stand nur
// auf der Startseite und redete ausschliesslich ueber das Training.
const BROCK_ESSEN={
  'kein-ziel':[ 'Ohne Ziel ist der Ring nur ein Kreis. Sag mir, worauf du hinwillst.',
                'Setz oben ein Tagesziel — dann kann ich dir auch was dazu sagen.' ],
  leer:[ 'Noch nichts eingetragen. Der Tag ist jung, der Ring ist leer.',
         'Ich seh hier nichts. Hast du heute Luft gegessen?',
         'Leer. Trag was ein, ich guck es mir an.' ],
  wenig:[ 'Das war bis jetzt wenig. Da geht noch was.',
          'Erst ein Bruchteil. Muskeln bauen sich nicht aus Absicht.' ],
  unterwegs:[ 'Gut unterwegs. Weiter so.',
              'Läuft. Der Ring füllt sich ordentlich.',
              'Solide Zwischenbilanz.' ],
  punkt:[ 'Punktlandung. Genau das war der Plan.',
          'Ziel getroffen. Das war sauber.',
          'Auf den Punkt. Ich bin beeindruckt und zeig es nicht.' ],
  drueber:[ 'Ein bisschen drüber. Passiert, morgen wieder.',
            'Leicht über dem Ziel — kein Drama, nur eine Zahl.' ],
  'weit-drueber':[ 'Deutlich drüber heute. Ich sag nichts, ich notiere nur.',
                   'Das war ein üppiger Tag. Auch die gehören dazu.' ]
};
function brockEssenSay(kcal, ziel){
  let key;
  if(!(ziel>0)) key='kein-ziel';
  else if(!kcal) key='leer';
  else { const t=kcal/ziel;
    key = t<0.5 ? 'wenig' : t<0.95 ? 'unterwegs' : t<=1.05 ? 'punkt'
        : t<=1.25 ? 'drueber' : 'weit-drueber'; }
  const list=BROCK_ESSEN[key];
  // Ueber den Tag stabil, wie beim Training — der Spruch springt nicht bei jedem Antippen.
  return list[Math.floor(Date.now()/864e5)%list.length];
}

/* ----------------------------------------------------------------------------
   Der Regelkreis: Gewichtskurve <-> Kalorien

   ⚠️ Das ist die eigentliche Luecke der App gewesen. Sie fuehrt beide Reihen seit
   Wochen und hat sie nie miteinander reden lassen. Es braucht dafuer weder Server
   noch KI — nur Arithmetik ueber zwei Zahlenreihen, die schon da sind.
   -------------------------------------------------------------------------- */

// Was will der Nutzer ueberhaupt? Stand bisher NIRGENDS in der App - und ohne das
// ist jede Kalorienzahl geraten.
// ---------- Schritte ----------
// Karls Ansage vom 22.08.2026: „soll mit der health app verbunden werden können um schritte
// zutracken und die einrechnet."
//
// ⚠️ Gym-Log kann Apple Health NICHT selbst lesen. HealthKit gibt es nur fuer native Apps aus
// dem App Store; Safari stellt dafuer keine Schnittstelle bereit, und einen Web-Standard fuer
// Schrittzaehler gibt es ueberhaupt nicht. Der Weg laeuft deshalb ueber die Kurzbefehle-App:
// die darf Health lesen und ruft Gym-Log mit `?schritte=8432` auf. Siehe schrittHilfe() in
// den Einstellungen.
//
// ⚠️ Und der Rechenfehler, den es hier zu vermeiden gilt: der uebliche Faktor kg x 30 enthaelt
// bereits Alltagsbewegung. Wer die Schritte obendrauf rechnet, zaehlt dieselbe Bewegung
// zweimal. Karls Entscheidung vom 22.08.2026: Grundumsatz runter auf den Sitz-Wert kg x 26,
// dafuer zaehlt jeder Schritt. Das Tagesziel wird dadurch an ruhigen Tagen kleiner als vorher.
const ERHALT_SITZEND = 26;          // Grundumsatz, wenn Schritte getrennt gezaehlt werden
const ERHALT_NORMAL  = 30;          // enthaelt Alltagsbewegung schon mit drin
// kcal je Schritt und kg Koerpergewicht. Herleitung: Gehen kostet rund 0,5 kcal je kg und km,
// ein km sind rund 1250 Schritte. 0,5 / 1250 = 0,0004.
// ⚠️ Eine Faustregel, keine Physik - deshalb wird das Ergebnis gerundet und nirgends mit
// Nachkommastellen ausgewiesen.
const KCAL_JE_SCHRITT_KG = 0.0004;

function schrittModus(){ return !!kcalInit().schritte; }
// Die Adresse, die der Kurzbefehl aufruft. ⚠️ Bewusst aus location zusammengesetzt statt
// fest verdrahtet: die App laeuft auf GitHub Pages, kann aber auch lokal oder unter einer
// anderen Adresse liegen — eine eingetippte Adresse waere dort sofort falsch.
function schrittLinkBasis(){ return location.origin + location.pathname + '?schritte='; }
function erhaltFaktor(){ return schrittModus() ? ERHALT_SITZEND : ERHALT_NORMAL; }
function schrittListe(){ const k=kcalInit(); if(!Array.isArray(k.steps)) k.steps=[]; return k.steps; }
function schritteAmTag(ts){ const e=schrittListe().find(x=>sameDay(x.date,ts)); return e?e.n:0; }
function schritteHeute(){ return schritteAmTag(Date.now()); }
// Ein Eintrag pro Tag. ⚠️ Ueberschreiben statt addieren: der Kurzbefehl schickt den
// TAGESSTAND, nicht die Schritte seit dem letzten Mal. Wer hier addiert, hat nach drei
// Aufrufen das Dreifache stehen.
function setzeSchritte(n, ts){
  n=Math.round(+n); if(!(n>=0) || n>200000) return false;
  ts=ts||Date.now();
  const l=schrittListe(), i=l.findIndex(x=>sameDay(x.date,ts));
  if(i>=0) l[i]={date:ts,n}; else l.push({date:ts,n});
  l.sort((a,b)=>a.date-b.date);
  save(); return true;
}
function kcalAusSchritten(n){
  const w=lastWeight();
  if(!w || !(n>0)) return 0;
  return Math.round(n * w.kg * KCAL_JE_SCHRITT_KG);
}
// Das Ziel eines bestimmten Tages: Grundziel plus das, was an dem Tag gelaufen wurde.
// ⚠️ Ohne Schritt-Modus ist es schlicht das Grundziel - sonst wuerde das Ziel von Leuten,
// die gar keine Schritte pflegen, ploetzlich vom Zufall abhaengen.
function zielAmTag(ts){
  const k=kcalInit(); if(!(k.goal>0)) return 0;
  return schrittModus() ? k.goal + kcalAusSchritten(schritteAmTag(ts)) : k.goal;
}
function zielHeute(){ return zielAmTag(Date.now()); }

// Schritte aus dem Link uebernehmen (`?schritte=8432`), den der Kurzbefehl aufruft.
// ⚠️ Die Adresse wird danach bereinigt. Ohne das stuende die Zahl in der Adresszeile und
// jedes Neuladen - auch ein versehentliches am naechsten Tag - schriebe sie erneut ein.
function leseSchritteAusLink(){
  try{
    const p=new URLSearchParams(location.search);
    const roh=p.get('schritte'); if(roh===null) return null;
    p.delete('schritte');
    const rest=p.toString();
    history.replaceState(null,'',location.pathname+(rest?'?'+rest:'')+location.hash);
    const n=Math.round(+roh);
    if(!isFinite(n) || n<0 || n>200000) return null;
    return n;
  }catch(e){ return null; }
}

const ZIELE = {
  abnehmen: {name:'Abnehmen', proWoche:-0.5, versatz:-400, satz:'0,5 kg pro Woche runter'},
  halten:   {name:'Halten',   proWoche:0,    versatz:0,    satz:'Gewicht halten'},
  zunehmen: {name:'Aufbauen', proWoche:0.25, versatz:300,  satz:'0,25 kg pro Woche rauf'}
};
function zielArt(){ const k=kcalInit(); return ZIELE[k.art] ? k.art : null; }

// Kalorienziel aus Gewicht UND Vorhaben. Ohne Vorhaben bleibt es beim reinen Erhalt.
function kcalVorschlagFuer(art){
  const w=lastWeight(); if(!w) return null;
  // ⚠️ Der Faktor haengt am Schritt-Modus: 30 enthaelt Alltagsbewegung, 26 nicht.
  const erhalt=w.kg*erhaltFaktor(), z=ZIELE[art];
  return Math.round((erhalt + (z?z.versatz:0))/50)*50;
}

// Gewichtsentwicklung in kg pro Woche, ueber die letzten `tage` Tage.
// ⚠️ Mindestens zwei Wiegungen ueber mindestens 7 Tage - alles darunter ist
// Rauschen. Tagesschwankungen von 1 kg sind normal; wer daraus eine Woche
// hochrechnet, bekommt Unsinn heraus und richtet sein Essen danach.
// Der Zeitraum, ueber den der Regelkreis urteilt -- fuer Gewicht UND Essen derselbe.
const RK_FENSTER = 21;
function gewichtsTrend(tage){
  const grenze=Date.now()-tage*864e5;
  const w=weightList().filter(x=>x.date>=grenze);
  if(w.length<2) return null;
  const erst=w[0], letzt=w[w.length-1];
  const spanne=(letzt.date-erst.date)/864e5;
  if(spanne<7) return null;
  /* 🔴 Ausgleichsgerade ueber ALLE Messungen (27.08.2026, Karls Entscheidung).

     Bis hierher nahm die Rechnung nur den **ersten und letzten** Punkt: `(letzt.kg-erst.kg)`.
     Alles dazwischen fiel weg. Bei drei Wochen und acht Wiegungen sind das sechs
     weggeworfene Messungen -- und ausgerechnet die beiden empfindlichsten bleiben stehen,
     denn ein einzelner schwerer Morgen am Anfang oder ein leichter am Ende kippt das
     Ergebnis komplett.

     ⚠️ **Das war nicht egal.** Aus dieser Zahl leitet der Regelkreis eine
     kcal-Korrektur ab und bietet sie als Knopf an. Bei den ueblichen ein Kilo
     Tagesschwankung konnte der Vorschlag um mehrere hundert Kalorien danebenliegen, ohne
     dass sich am Essen irgendetwas geaendert haette. Der Kommentar bei `kcalSchnitt` warnt
     seit jeher vor genau diesem Rauschen -- die Trendrechnung hat es dann selbst eingeladen.

     ⚠️ `von` und `bis` sind seither die Werte **auf der Geraden**, nicht die gemessenen
     Randpunkte. Das muss so sein, sonst passt die angezeigte Spanne nicht mehr zu der
     Rate daneben -- und ein Satz, dessen zwei Haelften sich widersprechen, ist schlimmer
     als eine ungenaue Zahl.
     💡 Bei genau zwei Messungen kommt dasselbe heraus wie vorher: durch zwei Punkte
     geht nur eine Gerade. */
  const x=w.map(p=>(p.date-erst.date)/864e5), y=w.map(p=>p.kg), n=w.length;
  const mx=x.reduce((a,b)=>a+b,0)/n, my=y.reduce((a,b)=>a+b,0)/n;
  let zaehler=0, nenner=0;
  for(let i=0;i<n;i++){ zaehler+=(x[i]-mx)*(y[i]-my); nenner+=(x[i]-mx)*(x[i]-mx); }
  const proTag = nenner ? zaehler/nenner : 0;
  const achse  = my - proTag*mx;
  return { proWoche:proTag*7, tage:Math.round(spanne), messungen:n,
           von:achse, bis:achse+proTag*spanne };
}

// Die eigentliche Rueckmeldung: passt das, was auf der Waage passiert, zu dem,
// was gegessen wird und was gewollt ist? Wenn nicht - um wie viel daneben?
//
// Rechnung: rund 7000 kcal entsprechen einem Kilo Koerpermasse. Eine Abweichung
// von 1 kg/Woche sind also ~1000 kcal/Tag.
// ⚠️ Das ist eine Faustregel, keine Physik. Deshalb wird unten gerundet und ein
// Streifen von +/- 0,15 kg/Woche als "passt" behandelt, statt Nachkommastellen
// als Wahrheit zu verkaufen.
function regelkreis(){
  const art=zielArt(); if(!art) return {stand:'kein-ziel'};
  /* ⚠️ EIN Fenster fuer beide Seiten (27.08.2026, Karls Ansage). Vorher stand hier ein
     21-Tage-Gewichtstrend gegen einen 14-Tage-Kalorienschnitt -- verglichen wurden also zwei
     verschiedene Zeitraeume, und begruendet war das nirgends. Der Regelkreis fragt aber
     genau eine Sache: passt das, was in DIESEM Zeitraum gegessen wurde, zu dem, was die
     Waage in DEMSELBEN Zeitraum gemacht hat. Zwei Fenster koennen das nicht beantworten.
     💡 Die Zahl steht als Konstante da, damit die beiden nicht wieder auseinanderlaufen. */
  const trend=gewichtsTrend(RK_FENSTER);
  if(!trend) return {stand:'zu-wenig-gewicht'};
  const schnitt=kcalSchnitt(RK_FENSTER);
  if(!schnitt || schnitt.tage<4) return {stand:'zu-wenig-essen', tage:schnitt?schnitt.tage:0};

  const soll=ZIELE[art].proWoche, ist=trend.proWoche, abweichung=ist-soll;
  if(Math.abs(abweichung)<=0.15)
    return {stand:'passt', art, trend, schnitt, ist, soll};

  // kcal/Tag, um die es danebenliegt. Auf 50 gerundet - feiner ist Schein-Genauigkeit.
  const korrektur=Math.round(abweichung*1000/50)*50;
  return {stand:'daneben', art, trend, schnitt, ist, soll, korrektur,
          neuesZiel: Math.max(1200, Math.round((schnitt.schnitt-korrektur)/50)*50)};
}

// Was fehlt heute noch an Eiweiss - und was aus der EIGENEN Liste wuerde es decken?
// Die App misst bisher nur; sie sagt nie, was jetzt zu tun waere.
function eiweissTipp(bisher, ziel){
  const fehlt=ziel-bisher; if(fehlt<=0) return null;
  const k=kcalInit();
  // Nur eigene Lebensmittel (Werte je 100 g), sortiert nach Eiweiss je 100 kcal -
  // gesucht ist nicht das eiweissreichste, sondern das guenstigste.
  const kandidaten=k.foods.filter(f=>+f.p>0 && +f.kcal>0)
    .sort((a,b)=>(b.p/b.kcal)-(a.p/a.kcal));
  if(!kandidaten.length) return {fehlt, essen:null};
  const f=kandidaten[0];
  let gramm=Math.round(fehlt/(+f.p)*100/10)*10;
  // ⚠️ Deckel bei 300 g. Ohne ihn kommt bei einer grossen Luecke "800 g Magerquark"
  // heraus - rechnerisch richtig, praktisch albern, und ein Vorschlag, den niemand
  // befolgt, ist schlechter als keiner. Ueber dem Deckel sagt der Tipp ehrlich, dass
  // er die Luecke nur teilweise schliesst.
  const deckt = gramm>300 ? false : true;
  if(!deckt) gramm=300;
  const eiweiss=Math.round(+f.p*gramm/100);
  return {fehlt, essen:f, gramm, eiweiss, deckt, kcal:Math.round(+f.kcal*gramm/100)};
}

// Ein Balken in derselben Bildsprache wie der Ring. Ueber 100 % faerbt er sich,
// statt einfach stehenzubleiben — sonst sieht "genau erreicht" aus wie "weit drueber".
function zielBalken(ist, ziel, farbe){
  const teil = ziel>0 ? Math.min(1, ist/ziel) : 0;
  const drueber = ziel>0 && ist>ziel;
  return `<div style="height:8px;background:var(--card2);border-radius:99px;overflow:hidden">
    <i style="display:block;height:100%;width:${Math.round(teil*100)}%;background:${drueber?'var(--danger)':farbe}"></i></div>`;
}
// Ring fuer „heute gegessen". Reines SVG, kein Bild — passt sich jedem Design an.
function kcalRing(ist,ziel){
  const r=52, u=2*Math.PI*r, teil=ziel>0?Math.min(1.4,ist/ziel):0, drueber=teil>1;
  return `<svg viewBox="0 0 130 130" width="130" height="130" style="flex:0 0 auto">
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--card2)" stroke-width="13"/>
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="${drueber?'var(--danger)':'var(--ok)'}" stroke-width="13"
      stroke-linecap="round" stroke-dasharray="${u}" stroke-dashoffset="${u*(1-Math.min(1,teil))}"
      transform="rotate(-90 65 65)"/>
    <text x="65" y="61" text-anchor="middle" fill="var(--txt)" font-size="25" font-weight="800">${ist}</text>
    <text x="65" y="80" text-anchor="middle" fill="var(--muted)" font-size="12">${ziel>0?'von '+ziel:'kcal'}</text></svg>`;
}
// ---------- Lebensmittel waehlen / anlegen ----------
// Alle drei Wege (eigene Liste, Barcode, Foto) enden an derselben Stelle: ein foodDraft
// steht fest, und es fehlt nur noch die Menge. Deshalb eine Ansicht mit drei Schritten
// statt drei getrennter Abläufe.
// `foodMz` haelt fest, in WELCHEN Mahlzeiten-Block eingetragen wird — gesetzt vom
// Plus-Knopf des Blocks, geleert beim Verlassen. Leer heisst: nach Uhrzeit entscheiden.
let foodStep='list', foodDraft=null, foodBusy='', foodFehler='', foodMz='';
// basis 'g100' = die Werte gelten je 100 g (eigene Liste, Barcode)
// basis 'portion' = die Werte gelten fuer genau diese eine Portion (Foto)
function leerDraft(){ return {name:'',marke:'',kcal:'',p:'',c:'',f:'',basis:'g100',menge:100,quelle:'eigen'}; }
function draftWerte(d,menge){
  const faktor = d.basis==='portion' ? (+menge||1) : (+menge||0)/100;
  return { kcal:Math.round((+d.kcal||0)*faktor), p:Math.round((+d.p||0)*faktor),
           c:Math.round((+d.c||0)*faktor), f:Math.round((+d.f||0)*faktor) };
}
function addMeal(d,menge){
  const w=draftWerte(d,menge), k=kcalInit();
  // ⚠️ `foodMz` ist die im Block angetippte Mahlzeit. Ist keine gewaehlt (etwa ueber
  // den allgemeinen Knopf), entscheidet die Uhrzeit — nie ein fester Vorgabewert.
  aufgabeErledigen('mahlzeit');  // Tagesaufgabe: eine Mahlzeit eingetragen
  k.meals.push({id:uid(),date:Date.now(),name:d.name||'Essen', mz: foodMz || mahlzeitJetzt(),
    menge:(+menge||0)+(d.basis==='portion'?'×':' g'), quelle:d.quelle||'eigen', ...w});
  /* Zuletzt benutzte Menge (02.09.2026, Karls Ansage). Nur fuer Eintraege aus der EIGENEN
     Liste (`d.id` zeigt in `k.foods`) und nur in Gramm — Foto-Portionen haben keine feste
     Basismenge, die man wiederholen wuerde. Beim naechsten Antippen desselben
     Lebensmittels steht dann nicht mehr 100 g da, sondern was zuletzt eingetragen wurde.
     ⚠️ Bewusst NICHT in KCAL_SKALARE: das ist kein Feld von profile.kcal selbst, sondern
     von einem EINTRAG in profile.kcal.foods — und die Liste geht schon durch `vereinige()`.
     ⚠️ Grenze, die dabei ehrlich bleiben soll: `vereinige()` behaelt bei einer bekannten
     Kennung die BASIS-Seite ganz, sie fuehrt Felder innerhalb eines Eintrags nicht
     zusammen. Isst man am Handy und hat das Lebensmittel schon auf dem PC, gewinnt beim
     naechsten Abgleich der PC-Stand — die neuere Menge vom Handy zieht dann nicht
     automatisch nach. Kein Datenverlust, nur ein Vorschlag, der etwas hinterherhinkt. */
  if(d.id && d.basis==='g100'){
    const f = k.foods.find(x=>x.id===d.id);
    if(f) f.letzteMenge = +menge || f.letzteMenge;
  }
  save(); return w;
}
// ---------- Ernaehrungs-Assistent (beim allerersten Oeffnen) ----------
// Karls Ansage vom 22.08.2026: „wenn man darauf klickt wird beim aller ersten mal auch eine
// einstellung/tutorial gemacht. dh wielange will man drannbleiben und was ist das ziel etc."
//
// ⚠️ Warum ein eigener Assistent und nicht die Knoepfe im Tab: der Trainings-Teil fuehrt seit
// jeher durch die Einrichtung, der Ernaehrungs-Teil fing als leerer Ring an. Wer ihn zum ersten
// Mal aufmacht, sieht sonst eine Null und weiss nicht, woran er sie messen soll.
//
// ⚠️ Der Zeitraum ist NICHT Deko. Er macht aus einem Vorhaben eine Ansage mit Datum
// (`kcalZielDatum`) und erlaubt eine Prognose (`kcalPrognose`) — beides gibt es ohne ihn nicht.
/* ⚠️ Seit dem 27.08.2026 sechs Schritte statt fuenf. Karls Ansage: "beim Tutorial die
   Sache mit dem KI-Schluessel einfuegen, dass man das da schon machen kann, aber auch
   ueberspringen kann."
   Er gehoert hierher und nicht in den Trainings-Assistenten: der Schluessel ist nur fuer
   "Essen per Foto" da, und das ist genau dieser Teil der App.
   🔴 **Ueberspringen muss die gleiche Groesse haben wie Eintragen.** Ein Schritt, der
   etwas von aussen verlangt (Google-Konto, zweite Seite, Warten), darf den Assistenten nicht
   blockieren -- sonst bleibt jemand beim Einrichten haengen und die Kalorien stehen nie. */
const KOB_LAST = 5;
const KOB_SAY = [
  'Kalorien! Mein zweites Lieblingsthema. Drei Fragen, dann steht das.',
  'Erstmal: wo soll die Reise hin?',
  'Ohne dein Gewicht rate ich nur. Und Raten kann jeder.',
  'Wie lange bleibst du dran? Sag was Ehrliches, nicht was Schönes.',
  'Willst du dein Essen fotografieren können? Geht auch später.',
  'Steht. Ab jetzt rechne ich mit.'
];
const KOB_WOCHEN = [4, 8, 12, 16];
let kobStep = 0, kobDraft = null;

// Der Assistent laeuft genau einmal. Danach steht `setup` und alles ist im Tab aenderbar.
// ⚠️ Wer laengst ein Tagesziel gesetzt hat, wird NICHT nachtraeglich in den Assistenten
// geschickt — das waere eine Bevormundung fuer alle Bestandskonten. Fuer die gibt es den
// Knopf „Vorhaben ändern" im Tab.
function kcalBraucht(){ const k = kcalInit(); return kobErzwingen || (!k.setup && !(k.goal > 0)); }
// ⚠️ `kobErzwingen` ist noetig fuer „Vorhaben ändern": wer schon ein Ziel hat, faellt sonst
// durch die Pruefung oben und der Assistent kaeme gar nicht erst hoch.
let kobErzwingen = false;
// ⚠️ Aufbau und Zeichnen sind getrennt: renderBody ruft kobInit() OHNE render(), sonst
// riefe render() wieder renderBody und die Sache dreht sich im Kreis.
function kobInit(){
  const k = kcalInit(), w = lastWeight();
  kobStep = 0;
  kobDraft = { art: k.art || null, wochen: (k.wochen > 0 || k.wochen === 0) ? k.wochen : 12, kg: w ? w.kg : '' };
}
function startKcalOb(){ kobErzwingen = true; kobInit(); view = 'body'; render(); }
// Zieldatum aus Startzeitpunkt und Zeitraum. `wochen:0` heisst „offen" — dann gibt es keins.
function kcalZielDatum(){ const k = kcalInit();
  return (k.wochen > 0 && k.start) ? k.start + k.wochen * 7 * 864e5 : null; }
// In welcher Woche des Vorhabens stehen wir? 1-basiert, damit „Woche 1 von 12" stimmt.
function kcalWoche(){ const k = kcalInit();
  return k.start ? Math.floor((Date.now() - k.start) / (7 * 864e5)) + 1 : null; }
// Was am Ende herauskaeme, wenn es so laeuft wie vorgenommen.
// ⚠️ Bewusst aus dem VORHABEN gerechnet, nicht aus dem bisherigen Verlauf — es ist die Ansage,
// nicht die Vorhersage. Was wirklich passiert, sagt der Regelkreis.
function kcalPrognose(){
  const k = kcalInit(), z = ZIELE[k.art];
  if(!z || !(k.wochen > 0) || !(k.startKg > 0)) return null;
  return { kg: k.startKg + z.proWoche * k.wochen, wochen: k.wochen, von: k.startKg };
}

function renderKcalOb(){
  const d = kobDraft;
  let h = '<div class="ob-dots">' + [0,1,2,3,4,5].map(i => '<i class="' + (i <= kobStep ? 'on' : '') + '"></i>').join('') + '</div>';
  h += mascot(KOB_SAY[kobStep], (kobStep === 0 || kobStep === KOB_LAST) ? 'happy' : '',
              kobStep === 0 ? 96 : 72, equippedRank());

  if(kobStep === 0){ h += `<div class="card">
    <h2 style="margin-top:0">Essen mitschreiben</h2>
    <p class="muted" style="font-size:13.5px;line-height:1.65">Der Teil hier rechnet dir aus,
      wie viel du am Tag essen solltest — und sagt dir hinterher, ob es aufgeht. Dafür brauche
      ich drei Angaben.</p>
    <div class="tiny muted" style="line-height:1.9;margin-bottom:4px">
      1. Was du vorhast<br>2. Was du wiegst<br>3. Wie lange du dranbleiben willst</div>
    <button class="btn primary" style="margin-top:12px" data-act="kob:next">Los</button>
    <button class="link" data-act="kob:skip" style="width:100%;text-align:center;margin-top:12px">Überspringen — ich stell das selbst ein</button></div>`; }

  else if(kobStep === 1){ h += `<div class="card">
    <h2 style="margin-top:0">Was hast du vor?</h2>
    <p class="muted tiny" style="margin-bottom:14px">Danach richtet sich dein Tagesziel.</p>
    ${Object.entries(ZIELE).map(([id, z]) => `<button class="ob-opt ${d.art === id ? 'on' : ''}" data-act="kob:art:${id}">
      <b>${z.name}</b><span>${z.satz}${z.versatz ? ` · ${z.versatz > 0 ? '+' : '−'}${Math.abs(z.versatz)} kcal am Tag` : ' · Erhaltungsbedarf'}</span></button>`).join('')}
    ${kobNav(!d.art)}</div>`; }

  else if(kobStep === 2){ h += `<div class="card">
    <h2 style="margin-top:0">Was wiegst du?</h2>
    <p class="muted tiny" style="margin-bottom:14px">Am besten morgens, nüchtern. Der Wert landet
      gleich in deiner Gewichtskurve.</p>
    <div class="field" style="margin:0"><label>Gewicht (kg)</label>
      <input id="kobKg" type="number" inputmode="decimal" step="0.1" min="20" max="500"
             value="${d.kg || ''}" placeholder="z. B. 78,5"></div>
    ${kobNav(false)}</div>`; }

  else if(kobStep === 3){ h += `<div class="card">
    <h2 style="margin-top:0">Wie lange bleibst du dran?</h2>
    <p class="muted tiny" style="margin-bottom:14px">Ein Zeitraum macht aus einem Vorsatz eine
      Ansage mit Datum. Verlängern kannst du jederzeit.</p>
    <div class="ob-grid">${KOB_WOCHEN.map(n => `<button class="chip big ${d.wochen === n ? 'on' : ''}" data-act="kob:w:${n}">${n} Wo</button>`).join('')}</div>
    <button class="ob-opt ${d.wochen === 0 ? 'on' : ''}" style="margin-top:12px" data-act="kob:w:0">
      <b>Ohne festes Ende</b><span>Läuft einfach mit. Dann gibt es kein Zieldatum und keine Prognose.</span></button>
    ${d.wochen > 0 ? `<div class="tiny muted" style="margin-top:12px">Das wären
      <b style="color:var(--txt)">${fmtDate(Date.now() + d.wochen * 7 * 864e5)}</b>.</div>` : ''}
    ${kobNav(false)}</div>`; }

  else if(kobStep === 4){ const hat = !!aiKey() && !altSchluessel();
    h += `<div class="card">
    <h2 style="margin-top:0">Essen per Foto</h2>
    <p class="muted" style="font-size:13.5px;line-height:1.65">Statt jede Zutat einzeln
      einzutippen, kannst du dein Essen fotografieren — die Nährwerte werden geschätzt.
      Dafür wird ein API-Schlüssel von Google Gemini benötigt.</p>
    ${hat
      ? `<div class="row between" style="background:var(--card2);border-radius:12px;padding:12px 14px;margin-bottom:12px">
           <b>Schlüssel liegt</b><span class="pill">…${esc(aiKey().slice(-4))}</span></div>
         <button class="btn" style="width:100%" data-act="kob:key">Ändern</button>`
      : `<button class="btn primary" style="width:100%" data-act="kob:key">Schlüssel eintragen</button>`}
    <div class="tiny muted" style="margin-top:10px;line-height:1.6">Kostenlos, ein Google-Konto
      reicht. <b style="color:var(--txt)">Alles andere funktioniert auch ohne</b> — Barcode,
      eigene Lebensmittel und das Tagesziel brauchen keinen Schlüssel.
      <br>Nachtragen kannst du ihn jederzeit unter Einstellungen.</div>
    ${kobNav(false)}</div>`; }

  else { const z = ZIELE[d.art], kg = +String(d.kg).replace(',', '.') || 0;
    const ziel = kg > 0 ? Math.round((kg * erhaltFaktor() + (z ? z.versatz : 0)) / 50) * 50 : null;
    const ende = (kg > 0 && z && d.wochen > 0) ? kg + z.proWoche * d.wochen : null;
    h += `<div class="card">
    <h2 style="margin-top:0">Passt das so?</h2>
    <div class="sess"><span class="muted">Vorhaben</span><b>${z ? z.name : '—'}</b></div>
    <div class="sess"><span class="muted">Gewicht</span><b>${kg > 0 ? fmtKg(kg) + ' kg' : '—'}</b></div>
    <div class="sess"><span class="muted">Zeitraum</span><b>${d.wochen > 0 ? d.wochen + ' Wochen' : 'ohne Ende'}</b></div>
    <div class="sess"><span class="muted">Tagesziel</span><b>${ziel ? ziel + ' kcal' : '—'}</b></div>
    ${ende !== null ? `<div class="tiny muted" style="margin-top:12px">Wenn es so läuft, stehst du am
      <b style="color:var(--txt)">${fmtDate(Date.now() + d.wochen * 7 * 864e5)}</b> bei rund
      <b style="color:var(--txt)">${fmtKg(ende)} kg</b>.</div>` : ''}
    ${!ziel ? `<div class="tiny" style="color:var(--danger);margin-top:12px">Ohne Gewicht kann ich kein
      Tagesziel ausrechnen — geh einen Schritt zurück.</div>` : ''}
    <button class="btn primary" style="margin-top:14px" data-act="kob:finish" ${ziel ? '' : 'disabled'}>Fertig</button>
    <button class="link" data-act="kob:back" style="width:100%;text-align:center;margin-top:10px">Zurück</button></div>`; }

  app.innerHTML = h;
}
function kobNav(sperre){
  return `<div class="row" style="gap:8px;margin-top:16px">
    <button class="btn" style="flex:1" data-act="kob:back">Zurück</button>
    <button class="btn primary" style="flex:2" data-act="kob:next" ${sperre ? 'disabled' : ''}>Weiter</button></div>`;
}
// ⚠️ Der Weiter-Knopf muss den Gewichtswert MITNEHMEN, bevor neu gezeichnet wird — sonst ist
// die Eingabe beim Schrittwechsel weg, weil das Feld neu gebaut wird.
function kobMerkeKg(){ const el = document.getElementById('kobKg');
  if(el && el.value !== '') kobDraft.kg = el.value; }

/* Die Flamme (23.08.2026, Karls Ansage). Sie sitzt im Kopf des Ernaehrungs-Teils,
   weil sie genau das misst, was dort passiert: mitschreiben, jeden Tag.

   ⚠️ Bei 0 wird sie GRAU statt versteckt. Eine Anzeige, die erst ab Tag 1 auftaucht,
   erklaert sich nie — man sieht sie zum ersten Mal, wenn man sie schon hat. Grau
   heisst: es gibt sie, sie laeuft nur gerade nicht.

   ⚠️ Der Rekord steht nur daneben, wenn er GROESSER als die laufende Serie ist.
   „5 · Rekord 5" waere doppelt gemoppelt, und beim allerersten Lauf entsteht genau das. */
function flammeHTML(serie, rekord){
  const an = serie > 0;
  const titel = an
    ? `${serie} ${serie===1?'Tag':'Tage'} am Stück mitgeschrieben`
      + (rekord>serie ? ` · dein Rekord: ${rekord}` : '')
    : 'Noch keine Serie — trag heute etwas ein, dann fängt sie an.';
  return `<span class="flamme${an?' an':''}" title="${titel}">
    <span aria-hidden="true">🔥</span><b>${serie}</b>
    ${rekord>serie?`<span class="rek">${rekord}</span>`:''}</span>`;
}
function renderBody(){
  // Beim allerersten Oeffnen zuerst durch die Einrichtung (Karls Ansage vom 22.08.2026).
  if(kcalBraucht()){ if(!kobDraft) kobInit(); return renderKcalOb(); }
  const k=kcalInit(), heute=mealsToday(), s=sumMeals(heute);
  const eZiel=eiweissZiel(), vorschlag=kcalVorschlag(), schnitt=kcalSchnitt(7);

  // NEU: Brock ist jetzt auch hier. Er stand bisher nur auf der Startseite und
  // redete ausschliesslich ueber das Training — der halbe App-Charakter fehlte
  // in diesem Bereich komplett.
  // Karls Ansage vom 22.08.2026: „brock kann gerne links neben den kalorin kreis."
  // ⚠️ Sprechblase UNTER das Paar statt daneben: Figur (72) + Ring (130) + Text nebeneinander
  // waeren auf einem Telefon drei Spalten in ~340 px — der Text bricht dann nach jedem Wort um.
  const woche = kcalWoche(), prog = kcalPrognose();
  // ⚠️ `zt` statt k.goal ueberall in der Anzeige: im Schritt-Modus ist das Tagesziel
  // beweglich (Grundziel + heute gelaufene Schritte). k.goal bleibt das GRUNDziel.
  const zt = zielHeute(), schrittKcal = kcalAusSchritten(schritteHeute());
  // ⚠️ Im Schritt-Modus hat JEDER Tag ein eigenes Ziel. Den Wochenschnitt gegen das
  // Grundziel zu halten waere irrefuehrend - verglichen wird deshalb mit dem
  // Durchschnitt der Tagesziele ueber denselben Zeitraum.
  const zielSchnitt = (() => {
    const g = kcalInit().goal; if(!(g>0)) return 0;
    if(!schrittModus() || !schnitt) return g;
    let sum = 0;
    for(let i = 0; i < 7; i++) sum += zielAmTag(Date.now() - i*864e5);
    return Math.round(sum / 7);
  })();
  const serie=essSerie(), rekord=essSerieRekord();
  /* ➡️ Brock steht ganz oben (03.09.2026, Karls Ansage: „move the Brok widget to the top,
     above the calorie menu"). Bis dahin sass er links neben dem Ring, in derselben Karte
     (das war Karls Ansage vom 22.08.: „brock kann gerne links neben den kalorin kreis").
     ⚠️ Was der Umzug mitnimmt: die Sprechblase. Figur oben und Blase unten am Ring waeren
     zwei Sprecher gewesen. Und der Ring rueckt in die Mitte seiner Karte -- ohne Brock
     daneben stuende er sonst links und die Karte saehe halb leer aus.
     💡 Der Ring wird dabei etwas groesser: er hat die Breite geerbt, die Brock frei
     gemacht hat, und ist jetzt das einzige Bild in seiner Karte. */
  let h=`<div class="card brock-oben">
      <div class="row" style="gap:12px;align-items:center">
        ${monster(64,'',equippedRank())}
        <div class="bubble kcal-bubble" style="margin:0;flex:1">${brockEssenSay(s.kcal, zt)}</div>
      </div></div>
    <div class="row between" style="margin:14px 4px 6px"><h2>Heute</h2>
      <div class="row" style="gap:8px;align-items:center">
        ${flammeHTML(serie, rekord)}
        <button class="btn sm ghost link" data-act="kcalgoal">${zt>0?zt+' kcal Ziel':'Ziel setzen'}</button>
      </div></div>
    <div class="card">
      <div class="row" style="gap:12px;align-items:center;justify-content:center">
        ${kcalRing(s.kcal, zt)}
      </div>
      <div style="margin-top:12px">
        ${zt>0?`<div class="tiny muted" style="margin-bottom:8px">${s.kcal<=zt
            ? `noch <b style="color:var(--txt)">${zt-s.kcal} kcal</b> übrig`
            : `<b style="color:var(--danger)">${s.kcal-zt} kcal</b> darüber`}</div>`
          :`<div class="tiny muted" style="margin-bottom:8px">Setz oben ein Tagesziel, dann füllt sich der Ring.</div>`}

        ${/* Schritte: nur im Schritt-Modus, und nur als eigene Zeile - sie sind eine
              Herkunft des Ziels, keine Naehrwertangabe. */''}
        ${schrittModus()?`<div class="makro"><span>Schritte${schrittKcal>0
            ? ` <span class="muted" style="font-size:11px">· +${schrittKcal} kcal</span>` : ''}</span>
          <b>${schritteHeute()?schritteHeute().toLocaleString('de-DE'):'—'}</b></div>`:''}

        ${/* NEU: Eiweiss bekommt ein echtes Ziel statt nur einer Zahl. Es ist der
              Wert, der beim Krafttraining wirklich zaehlt — und die App kann ihn
              ausrechnen, weil sie das Koerpergewicht kennt. */''}
        <div class="makro" style="border-bottom:none;padding-bottom:2px">
          <span>Eiweiß${istTrainingstag()?' <span class="muted" style="font-size:11px">· Trainingstag</span>':''}</span>
          <b>${s.p} g${eZiel?` <span class="muted" style="font-weight:400">von ${eZiel} g</span>`:''}</b></div>
        ${eZiel ? zielBalken(s.p, eZiel, 'var(--accent)')
                : `<div class="tiny muted">Trag dein Gewicht ein, dann rechne ich dir das Eiweißziel aus.</div>`}
        <div class="makro" style="margin-top:8px"><span>Kohlenhydrate</span><b>${s.c} g</b></div>
        <div class="makro"><span>Fett</span><b>${s.f} g</b></div>
      </div></div>`;

  // NEU: der Zeitraum aus dem Assistenten wird sichtbar. Ohne ihn ist „12 Wochen" nur eine
  // Zahl in der Ablage — mit ihm steht in der App, in welcher Woche man ist und worauf es
  // hinauslaeuft. ⚠️ Die Prognose kommt aus dem VORHABEN, nicht aus dem Verlauf; was
  // tatsaechlich passiert, sagt eine Karte weiter unten der Regelkreis.
  if(woche && k.wochen > 0){
    const rest = k.wochen - woche + 1, durch = Math.min(1, woche / k.wochen);
    h+=`<div class="card" style="margin-top:10px">
      <div class="row between"><span class="tiny muted">${ZIELE[k.art] ? ZIELE[k.art].name : 'Vorhaben'}</span>
        <b>Woche ${Math.min(woche, k.wochen)} von ${k.wochen}</b></div>
      ${zielBalken(Math.min(woche, k.wochen), k.wochen, 'var(--ok)')}
      <div class="tiny muted" style="margin-top:8px">${rest > 0
        ? `Noch <b style="color:var(--txt)">${rest} ${rest === 1 ? 'Woche' : 'Wochen'}</b> bis
           ${/* ⚠️ KEIN Punkt hinter fmtDate — das Format endet selbst auf einen ("Fr., 30.10."),
                sonst steht dort "30.10..". */''}
           <b style="color:var(--txt)">${fmtDate(kcalZielDatum())}</b>${prog
             ? ` Vorgenommen: <b style="color:var(--txt)">${fmtKg(prog.kg)} kg</b>.` : ''}`
        : `Die ${k.wochen} Wochen sind um.${prog ? ` Vorgenommen waren <b style="color:var(--txt)">${fmtKg(prog.kg)} kg</b>.` : ''}`}</div>
      <button class="btn sm ghost link" style="margin-top:8px" data-act="kob:neu">Vorhaben ändern</button></div>`;
  } else if(zielArt()){
    h+=`<div class="row between" style="margin:10px 4px 0">
      <span class="tiny muted">Vorhaben: ${ZIELE[zielArt()].name}, ohne festes Ende</span>
      <button class="btn sm ghost link" data-act="kob:neu">Ändern</button></div>`;
  }

  // NEU: Was willst du überhaupt? Das stand bisher NIRGENDS in der App — und ohne
  // diese eine Angabe ist jede Kalorienzahl geraten.
  if(!zielArt()){
    h+=`<div class="card" style="margin-top:10px">
      <div style="margin-bottom:4px"><b>Was hast du vor?</b></div>
      <div class="tiny muted" style="margin-bottom:10px">Danach richtet sich dein Kalorienziel —
        und ich kann dir sagen, ob es aufgeht.</div>
      <div class="fab-row">
        ${Object.entries(ZIELE).map(([id,z])=>
          `<button class="btn" data-zielart="${id}">${z.name}</button>`).join('')}
      </div>
      ${vorschlag?`<div class="tiny muted" style="margin-top:8px">Bei ${fmtKg(lastWeight().kg)} kg
        rechne ich dir daraus das Tagesziel aus.</div>`
        :`<div class="tiny muted" style="margin-top:8px">⚠️ Dafür brauche ich dein Gewicht —
          trag es weiter unten ein.</div>`}</div>`;
  }

  // NEU: Zielvorschlag statt Kopfrechnen. Die Faustregel stand bisher nur als Text
  // im Eingabefenster — der Nutzer sollte sie selbst anwenden.
  if(!(k.goal>0) && vorschlag){
    const fuer=kcalVorschlagFuer(zielArt());
    h+=`<div class="card" style="margin-top:10px">
      <div class="tiny muted" style="margin-bottom:8px">Aus deinem Gewicht von
        <b style="color:var(--txt)">${fmtKg(lastWeight().kg)} kg</b>${zielArt()
          ? ` und dem Vorhaben <b style="color:var(--txt)">${ZIELE[zielArt()].name}</b>`
          : ''} ergibt sich <b style="color:var(--txt)">${fuer} kcal</b> am Tag.</div>
      <button class="btn" data-act="kcalgoalauto">${fuer} kcal als Ziel übernehmen</button></div>`;
  }

  // NEU: der Regelkreis. Passt das, was auf der Waage passiert, zu dem was gegessen
  // wird und was gewollt ist? Das ist die eine Sache, die kein bezahltes Abo besser
  // kann — die Daten liegen längst da.
  const rk=regelkreis();
  if(rk.stand!=='kein-ziel'){
    let inhalt = '';
    // Zu wenig Wiegungen: gar keine Karte. Der erklaerende Satz ist am 27.08.2026 auf Karls
    // Ansage raus -- und eine leere Karte mit Ueberschrift waere schlechter als keine.
    if(rk.stand==='zu-wenig-gewicht')
      inhalt='';
    /* Zu wenig Essenstage: auch hier keine Karte. Am 31.08.2026 auf Karls Ansage raus
       („der Satz raus“) — genau wie vier Tage zuvor der Satz über die fehlenden Wiegungen.
       💡 Beide sagten dasselbe: **du hast zu wenig eingetragen.** Das weiß, wer einträgt,
       ohne dass eine Karte es ihm vorrechnet — und wer es nicht tut, fängt deswegen nicht an. */
    else if(rk.stand==='zu-wenig-essen')
      inhalt='';
    else if(rk.stand==='passt')
      inhalt=`<div class="row between"><span><b style="color:var(--ok)">Es geht auf.</b></span>
        <span class="tiny muted">${rk.trend.tage} Tage</span></div>
      <div class="tiny muted" style="margin-top:6px">
        ${fmtKg(rk.trend.von)} → ${fmtKg(rk.trend.bis)} kg, also
        <b style="color:var(--txt)">${rk.ist>0?'+':''}${fmtKg(rk.ist)} kg pro Woche</b>
        bei Ø ${rk.schnitt.schnitt} kcal. Vorhaben: ${ZIELE[rk.art].satz}. <b style="color:var(--txt)">Nichts ändern.</b></div>`;
    else
      inhalt=`<div class="row between"><span><b>${rk.korrektur>0?'Zu langsam':'Zu schnell'}</b></span>
        <span class="tiny muted">${rk.trend.tage} Tage</span></div>
      <div class="tiny muted" style="margin-top:6px">
        ${fmtKg(rk.trend.von)} → ${fmtKg(rk.trend.bis)} kg, also
        <b style="color:var(--txt)">${rk.ist>0?'+':''}${fmtKg(rk.ist)} kg pro Woche</b>
        bei Ø ${rk.schnitt.schnitt} kcal. Gewollt war ${ZIELE[rk.art].satz}.</div>
      <div style="margin-top:8px">➡️ <b>${rk.neuesZiel} kcal</b> am Tag würden besser passen
        <span class="muted">(${rk.korrektur>0?'−':'+'}${Math.abs(rk.korrektur)})</span></div>
      <button class="btn" style="margin-top:8px" data-act="kcalziel-uebernehmen">Auf ${rk.neuesZiel} kcal umstellen</button>`;
    if(inhalt) h+=`<div class="card" style="margin-top:10px">${inhalt}</div>`;
  }

  // NEU: die App misst nicht mehr nur, sie schlägt auch etwas vor.
  const tipp = eZiel ? eiweissTipp(s.p, eZiel) : null;
  if(tipp && tipp.essen){
    h+=`<div class="card" style="margin-top:10px"><div class="tiny muted">
      Dir fehlen noch <b style="color:var(--txt)">${tipp.fehlt} g Eiweiß</b>.
      <b style="color:var(--txt)">${tipp.gramm} g ${esc(tipp.essen.name)}</b> ${tipp.deckt
        ? `wären genau das`
        : `bringen <b style="color:var(--txt)">${tipp.eiweiss} g</b> davon`}, bei ${tipp.kcal} kcal.</div></div>`;
  }

  // NEU: der Wochenschnitt. Ein einzelner Tag sagt fast nichts — was zaehlt, ist die
  // Linie ueber die Woche. ⚠️ Gerechnet wird nur ueber Tage MIT Eintrag.
  if(schnitt){
    h+=`<div class="card" style="margin-top:10px">
      <div class="row between"><span class="tiny muted">Schnitt der letzten 7 Tage</span>
        <b>${schnitt.schnitt} kcal</b></div>
      <div class="tiny muted" style="margin-top:4px">über ${schnitt.tage} ${schnitt.tage===1?'Tag':'Tage'} mit Eintrag${
        zielSchnitt>0 ? ` · Ziel ${zielSchnitt} kcal${schrittModus()?' im Schnitt':''}, also <b style="color:var(--txt)">${
          schnitt.schnitt>zielSchnitt?'+':''}${schnitt.schnitt-zielSchnitt}</b>` : ''}</div></div>`;
  }

  /* ➡️ Zwei Ansagen von Karl am 03.09.2026, die zusammen eine sind:
     · *„ich will bitte das man sein essen nur noch ueber die einzelnen button bei
       fruehstueck undso eintragen kann"* -- der allgemeine Knopf „+ Essen eintragen"
       stand frueher hier und ist weg.
     · *„die zuletzt eingetragenen essen sollen gerne rueber zu da wo man das essen
       auch entraegt"* -- der „Nochmal"-Block stand ebenfalls hier und steht jetzt in
       `renderFood()`, unter den zwei Wegen.
     🔴 Beides greift ineinander: ohne den allgemeinen Knopf gaebe es hier einen
     „Nochmal"-Block, dessen Eintraege in keiner Mahlzeit landen -- der alte Weg hat
     die Mahlzeit aus der Uhrzeit geraten. Jetzt fuehrt jeder Weg durch einen
     Mahlzeiten-Knopf, und die Zuordnung steht fest, bevor etwas eingetragen wird. */

  /* ---------- Ernährung: vier Mahlzeiten statt einer Liste (23.08.2026) ----------
     Karls Vorlage. Jeder Block hat ein eigenes Ziel (Anteil am Tagesziel) und einen
     eigenen Plus-Knopf, der die Mahlzeit gleich mitgibt.
     ⚠️ Der jetzt fällige Block wird hervorgehoben — nachmittags ist „Abendessen"
     der wahrscheinlichste Griff, und ihn zu suchen ist eine Bewegung zu viel. */
  const jetztMz = mahlzeitJetzt();
  h+=`<div class="row between" style="margin:20px 4px 6px"><h2>Ernährung</h2>
      <span class="tiny muted">${heute.length} ${heute.length===1?'Eintrag':'Einträge'}</span></div>
    <div class="card" style="padding:4px 0">`;
  MAHLZEITEN.forEach((mz,i)=>{
    const drin = heute.filter(m=>mahlzeitVon(m)===mz.id);
    const sum  = drin.reduce((a,m)=>a+(+m.kcal||0),0);
    const ziel = mahlzeitZiel(mz.id, zt);
    h+=`<div class="mz${mz.id===jetztMz?' jetzt':''}${i?' trenn':''}">
      <div class="row between" style="align-items:center;gap:10px">
        <div class="row" style="gap:10px;align-items:center;min-width:0">
          <span class="mz-icon" aria-hidden="true">${mz.icon}</span>
          <div style="min-width:0">
            <b>${mz.name}</b>
            <div class="tiny muted">${Math.round(sum)}${ziel?` / ${ziel}`:''} kcal</div>
          </div>
        </div>
        <button class="mz-plus" data-act="food:start:${mz.id}"
          aria-label="Zu ${mz.name} eintragen">+</button>
      </div>
      ${ziel?zielBalken(sum, ziel, 'var(--ok)'):''}
      ${drin.length?`<div style="margin-top:8px">`+[...drin].reverse().map(m=>
        `<div class="mz-eintrag"><div style="min-width:0">
           <span>${esc(m.name)}</span>
           <div class="tiny muted">${esc(String(m.menge))} · ${fmtTime(m.date)}${m.quelle==='foto'?' · Foto':m.quelle==='barcode'?' · Barcode':m.quelle==='db'?' · Datenbank':''}</div></div>
         <span class="row" style="gap:10px;flex:0 0 auto"><b>${m.kcal} kcal</b>
         <button class="link" style="padding:0 2px;color:var(--muted)" data-delmeal="${m.id}">✕</button></span></div>`
      ).join('')+`</div>`:''}
    </div>`;
  });
  h+=`</div>`;

  // ---------- Gewicht (war frueher der ganze Tab) ----------
  const w=weightList(), cur=lastWeight();
  h+=`<div class="row between" style="margin:22px 4px 6px"><h2>Gewicht</h2>
      ${cur?`<span class="pill">zuletzt ${fmtDate(cur.date)}</span>`:''}</div>
    <div class="card">
      <div class="row" style="gap:8px;align-items:flex-end">
        <div class="field" style="flex:1;margin:0"><label>Heute wiegen (kg)</label>
          <input id="wInput" type="number" inputmode="decimal" step="0.1" min="20" max="500"
                 placeholder="${cur?fmtKg(cur.kg):'z. B. 78,5'}"></div>
        <button class="btn primary" style="width:auto;padding:12px 18px" data-act="addweight">Eintragen</button>
      </div>
      <div class="tiny muted" style="margin-top:8px">Am besten immer morgens vor dem Essen wiegen.</div>
    </div>`;

  if(w.length===0){ h+=`<div class="empty">Noch nichts eingetragen.<br>Trag dein Gewicht ein, dann entsteht hier deine Kurve.</div>`;
    app.innerHTML=h; return; }

  const first=w[0], diff=cur.kg-first.kg;
  h+=`<div class="grid3" style="margin-top:14px">
      <div class="stat"><b>${fmtKg(first.kg)}</b><span>Start</span></div>
      <div class="stat"><b>${fmtKg(cur.kg)}</b><span>Aktuell</span></div>
      <div class="stat"><b>${diff>0?'+':''}${fmtKg(diff)}</b><span>kg seit Start</span></div></div>`;

  /* ⚠️ „kg seit Start" statt „kg Differenz" (01.09.2026, zusammen mit der Zeitraum-Wahl
     darunter). Die drei Kaesten zeigen IMMER die ganze Geschichte, die Kurve darunter nur
     noch den gewaehlten Zeitraum. Ohne das Wort „Start" liest man bei „1 Woche" die
     Differenz von einem halben Jahr als die der Woche — zwei Zahlen, die sich
     widersprechen, und keine sagt, worauf sie sich bezieht. */

  /* ➡️ Karls Ansage am 02.09.2026: „den verlauf des gewichtes kann bitte rueber in
     die einstellungen unter verlauf". Hier bleibt, was man BEIM WIEGEN braucht — das Feld
     und die drei Zahlen. Kurve, Zeitraum-Wahl und die Liste der Eintraege stehen jetzt
     unter Einstellungen -> Verlauf, wo auch die Trainings-Geschichte steht.
     ⚠️ Die Eintraege sind mitgewandert, nicht nur die Kurve: sie sind dieselbe
     Sache. Kurve hier und Liste dort haette eine Sache auf zwei Seiten verteilt. */
  h+=`<button class="btn ghost" style="margin-top:14px" data-nav="history">Verlauf ansehen ›</button>`;
  app.innerHTML=h;
}

/* Der Gewichts-Verlauf: Kurve, Zeitraum-Wahl und alle Eintraege.
   Steht seit dem 02.09.2026 unter Einstellungen -> Verlauf (Karls Ansage) und wird von

function gewichtVerlaufHTML(){

  /* ➡️ Karls Ansage am 03.09.2026: „die kurve fuer gewicht soll nicht im verlauf stehen,
     nur der gewicht verlauf an sich, die eintragungen".
     Vorher standen hier Kurve, Zeitraum-Wahl (1 Woche / 1 Monat / 1 Jahr / Max) und die
     Liste. Jetzt nur noch die Liste. Mit der Kurve sind auch `GW_FENSTER`, `gwFenster`
     und `weightImFenster()` gegangen -- sie hatten keinen zweiten Nutzer. Toter Code,

     ⚠️ Die drei Kaesten Start / Aktuell / seit Start bleiben im Koerper-Tab stehen,

  let h = `<div class="row between" style="margin:22px 4px 6px"><h2>Gewicht</h2>

     am Handy die unbequemste Ecke ueberhaupt, und mit dem Daumen kaum zu treffen.
     ⚠️ „Fertig" und nicht „Zurueck": wer hier steht, hat entweder eingetragen oder es
     gelassen. Beides ist fertig. Ein „Zurueck" liest sich wie ein Abbruch und macht aus

  h+=`<button class="btn primary gross" style="margin-top:24px" data-nav="body">Fertig</button>`;

  app.innerHTML=h;
