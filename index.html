/* ---------- Favoriten (03.09.2026, Karls Ansage) ----------
   Ersetzt „Nochmal", das bis zum selben Tag hier stand und die zuletzt gegessenen Sachen
   automatisch vorschlug.
   🔴 Der Unterschied ist nicht die Anzeige, sondern wer entscheidet: „Nochmal" riet aus
   dem Verlauf, was oft dran ist -- wer einmal etwas Ungewoehnliches isst, hatte es
   tagelang oben stehen, und was man jeden Tag isst, fiel heraus, sobald drei andere
   Sachen dazwischen kamen. Ein Favorit steht, bis er weggeklickt wird.
   ⚠️ Der Stern haengt am eigenen Lebensmittel (`k.foods`), nicht an der Mahlzeit -- er
   ueberlebt damit das Loeschen eines Eintrags und wandert ueber `blobsZusammen` mit auf
   das zweite Geraet, weil `foods` dort schon zusammengefuehrt wird. */
function istFavorit(f){ return !!(f && f.fav); }

/* Ein Zurueck-Pfeil, ueberall derselbe (03.09.2026). `attr` ist das, was den Klick
   auffaengt -- meist `data-nav="..."`, bei den zwei Verlauf-Seiten `data-act="backhist"`.
   `wohin` steht nur im aria-label, nicht auf dem Bildschirm. */
function zurueckPfeil(attr, wohin){
  return `<button class="zurueck" ${attr} aria-label="Zurück${wohin?' zu '+wohin:''}">`
    + `<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"`
    + ` stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">`
    + `<path d="M15 5l-7 7 7 7"/></svg></button>`;
}

function renderFoodList(q){
  const el=document.getElementById('foodList'); if(!el) return;
  const roh=(q||'').trim(), s=roh.toLowerCase(), k=kcalInit();
  const treffer=s?k.foods.filter(f=>(f.name+' '+(f.marke||'')).toLowerCase().includes(s)):k.foods;
  /* Favoriten zuerst, der Rest in seiner Reihenfolge dahinter. `sort` ist stabil (seit
     ES2019 zugesichert), die Liste wird also nicht durcheinandergewuerfelt -- die
     Favoriten wandern nur nach oben. ⚠️ Auf einer Kopie, sonst haette das Anzeigen
     die gespeicherte Reihenfolge veraendert. */
  const sortiert=[...treffer].sort((a,b)=>(istFavorit(b)?1:0)-(istFavorit(a)?1:0));
  const favZahl=sortiert.filter(istFavorit).length;
  const zeile=f=>`<div class="lib-row${istFavorit(f)?' ist-fav':''}" data-pickfood="${f.id}" style="cursor:pointer">
      <button class="fav-stern${istFavorit(f)?' an':''}" data-foodfav="${f.id}"
        aria-label="${istFavorit(f)?'Kein Favorit mehr':'Zu den Favoriten'}"
        aria-pressed="${istFavorit(f)?'true':'false'}">${istFavorit(f)?'★':'☆'}</button>
      <div style="flex:1;min-width:0"><div>${esc(f.name)}</div>
        <div class="tiny muted">${f.kcal} kcal je 100 g${f.marke?' · '+esc(f.marke):''}</div></div>
      <button class="del-x" data-delfood="${f.id}" aria-label="Lebensmittel löschen">✕</button></div>`;
  // ⚠️ Bewusst ein div, kein button: der Loesch-Knopf sitzt darin, und ein Knopf im Knopf
  // ist ungueltiges HTML — der Browser reisst ihn aus der Zeile heraus.
  let h='';
  /* Die Trennlinie steht nur ohne Suchtext. Wer tippt, sucht etwas Bestimmtes -- dann
     ist „Favoriten / Alle" eine Einteilung, die der Suche im Weg steht. */
  if(!roh && favZahl){
    h+=`<div class="listen-kopf">Favoriten</div>`
     + sortiert.slice(0,favZahl).map(zeile).join('');
    if(sortiert.length>favZahl) h+=`<div class="listen-kopf">Alle anderen</div>`
     + sortiert.slice(favZahl).map(zeile).join('');
  } else {
    h+=sortiert.map(zeile).join('');
  }
  if(!treffer.length) h+=`<div class="empty" style="padding:18px">${k.foods.length
      ? 'Nichts gefunden.' : 'Noch keine eigenen Lebensmittel.'}</div>`;
  /* Erst die Datenbank, dann das Abtippen: suchen kostet einen Griff, die Nährwerte von
     der Packung abschreiben kostet fünf. Ohne Suchtext wäre der Knopf sinnlos -- dann
     steht nur das Anlegen da, wie vorher.
     💡 Die Reihenfolge der beiden Knöpfe ist meine Fassung, nicht Karls Ansage. */
  if(roh) h+=`<button class="btn ghost" style="margin-top:10px" data-act="food:dbsuche">
      🔍 „${esc(roh)}" in der Datenbank suchen</button>`;
  h+=`<button class="btn ghost" style="margin-top:${roh?'8':'10'}px" data-act="food:new">+ Neues Lebensmittel${roh?` „${esc(roh)}"`:''}</button>`;
  el.innerHTML=h;
}

// ---------- Barcode ----------
// Drei Wege, in dieser Reihenfolge:
//  1. BarcodeDetector im Browser (Chrome/Android) - schnell, nichts nachzuladen.
//  2. ZXing im Browser (./zxing.min.js) - fuer Safari/iPhone, das BarcodeDetector bis heute
//     nicht kennt. Wird erst geladen, wenn wirklich gescannt wird.
//  3. Nummer eintippen - nur noch, wenn gar keine Kamera da ist oder sie verweigert wird.
function kameraGeht(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
let scanStream=null, scanReader=null, zxingLaedt=null;
function stopScan(){
  if(scanReader){ try{ scanReader.reset(); }catch(e){} scanReader=null; }
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; } }
function nummerTippen(text){
  const nr=prompt(text||'Nummer unter dem Barcode eintippen (die 8-13 Ziffern):');
  if(nr) holeBarcode(nr.replace(/\D/g,'')); }
// 330 KB gehoeren nicht in den Start der App - deshalb erst hier, und nur einmal.
function ladeZXing(){
  if(window.ZXing) return Promise.resolve(true);
  if(zxingLaedt) return zxingLaedt;
  zxingLaedt=new Promise(res=>{ const s=document.createElement('script');
    s.src='./zxing.min.js';
    s.onload=()=>res(typeof window.ZXing!=='undefined');
    s.onerror=()=>{ zxingLaedt=null; res(false); };
    document.head.appendChild(s); });
  return zxingLaedt; }
function scanHinweis(t){ const h=document.getElementById('scanHint'); if(h) h.textContent=t; }
async function openScan(){
  if(!kameraGeht()){ nummerTippen('Dieses Gerät gibt keine Kamera her. Nummer unter dem Barcode eintippen:'); return; }
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal-box" style="max-width:380px;padding:14px">
    <div class="row between" style="margin-bottom:8px"><b>Barcode scannen</b>
      <button class="del-x" data-act="closescan" style="margin:0">✕</button></div>
    <video id="scanVid" playsinline muted autoplay style="width:100%;border-radius:12px;background:#000"></video>
    <div class="tiny muted" id="scanHint" style="margin-top:8px">Halt den Strichcode ins Bild.</div>
    <button class="btn ghost sm" data-act="scantippen" style="margin-top:10px;width:100%">Nummer stattdessen eintippen</button>
  </div>`;
  m.classList.add('show');
  const treffer=nr=>{ stopScan(); closeModal(); holeBarcode(nr); };

  // Weg 1
  if(typeof window.BarcodeDetector!=='undefined'){
    try{
      scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
      const v=document.getElementById('scanVid');
      if(!v){ stopScan(); return; }
      v.srcObject=scanStream; await v.play();
      const det=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
      const tick=async()=>{
        if(!scanStream) return;                       // abgebrochen
        try{ const codes=await det.detect(v);
          if(codes&&codes.length){ treffer(codes[0].rawValue); return; }
        }catch(e){}
        setTimeout(tick,400); };
      tick(); return;
    }catch(e){ stopScan();
      // Kamera verweigert? Dann hilft auch Weg 2 nicht.
      if(e && (e.name==='NotAllowedError'||e.name==='NotFoundError'||e.name==='SecurityError')){
        closeModal(); nummerTippen('Kamera geht nicht. Nummer unter dem Barcode eintippen:'); return; }
    }
  }

  // Weg 2 - ZXing macht die Kamera selbst auf und raeumt sie mit reset() wieder weg.
  scanHinweis('Barcode-Leser wird geladen …');
  const da=await ladeZXing();
  if(!document.getElementById('scanVid')) return;     // zwischendurch zugemacht
  if(!da){ closeModal(); nummerTippen('Der Barcode-Leser lässt sich nicht laden (kein Netz?). Nummer eintippen:'); return; }
  scanHinweis('Halt den Strichcode ins Bild.');
  try{
    const hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,
      [ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E]);
    scanReader=new ZXing.BrowserMultiFormatReader(hints,250);
    scanReader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}},'scanVid',(res,err)=>{
      if(res&&scanReader) treffer(res.getText()); });
  }catch(e){ stopScan(); closeModal();
    nummerTippen('Kamera geht nicht. Nummer unter dem Barcode eintippen:'); }
}
// Open Food Facts: offene Datenbank, kein Schluessel noetig, kennt deutsche Produkte gut.
// Erst die eigene Liste, dann das Netz. Ein einmal selbst angelegtes Produkt wird
// damit beim naechsten Scan SOFORT gefunden — auch ohne Netz, also auch im Keller-Gym.
function eigenesZuBarcode(nr){
  return kcalInit().foods.find(f=>f.barcode && String(f.barcode)===String(nr)) || null;
}

/* Ein Open-Food-Facts-Produkt in einen Entwurf. Ausgelagert am 31.08.2026, weil es die
   Namenssuche genauso braucht wie der Barcode -- vor allem die Kalorien-Umrechnung: nicht
   jedes Produkt hat `energy-kcal_100g`, manche nur `energy_100g` in Kilojoule.
   ⚠️ Gibt `null` zurück, wenn keine Kalorien da sind. Ein Treffer ohne Nährwerte ist eine
   Sackgasse -- der Barcode-Weg fängt das ab, die Suche zeigt ihn gar nicht erst an. */
function offNachDraft(p, ersatzName){
  const n = (p && p.nutriments) || {};
  const kcal = n['energy-kcal_100g'] != null ? n['energy-kcal_100g']
             : (n['energy_100g'] != null ? n['energy_100g']/4.184 : null);
  if(kcal == null) return null;
  /* ⚠️ `brands` kommt aus ZWEI Quellen mit verschiedener Form (03.09.2026): die alte
     `cgi/search.pl` liefert einen String ("Ehrmann,Aldi"), der neue Suchdienst
     `search.openfoodfacts.org` ein Array (["Ehrmann","Aldi"]). Ohne diese Weiche
     wirft `.split` auf dem Array -- und zwar mitten in `.map()`, womit die GANZE
     Trefferliste leer bliebe und wie "nichts gefunden" ausgesehen haette. */
  const marken = Array.isArray(p.brands) ? p.brands.join(',') : (p.brands||'');
  return { name:(p.product_name_de||p.product_name||ersatzName||'Produkt').slice(0,60),
    marke:(marken.split(',')[0]||'').trim(),
    kcal:Math.round(kcal), p:Math.round(n.proteins_100g||0),
    c:Math.round(n.carbohydrates_100g||0), f:Math.round(n.fat_100g||0),
    basis:'g100', menge:100 };
}

/* Ein Fehler mit Merkmal. 🔴 Bis zum 02.09.2026 entschied der `catch` unten am
   WORTLAUT der Meldung (`/nicht in der Datenbank|keine Nährwerte/`), ob das
   Anlegen-Formular aufgeht. Das hat zweimal Schaden angerichtet, ohne dass etwas rot wurde:
     · Am 01.09. rutschte ein 503 in genau diesen Wortlaut -- Formular auf, Naehrwerte einer
       Packung abgetippt, die die Datenbank kennt (v57).
     · Und die Reparatur musste ihre eigene Meldung so formulieren, dass sie NICHT auf den
       Ausdruck passt. Eine Fehlermeldung, deren Text man nicht mehr frei aendern darf, ist
       kein Text mehr, sondern ein Schalter mit Tarnkappe.
   ➡️ Jetzt haengt die Weiche an `e.art`. Der Text darf sagen, was er will. */
function ffehler(text, art){ const e = new Error(text); e.art = art; return e; }

async function holeBarcode(nr){
  if(!nr || nr.length<6){ foodFehler='Das war keine gültige Barcode-Nummer.'; render(); return; }

  // NEU: eigener Treffer schlaegt die Datenbank. Kein Netz, keine Wartezeit.
  const eigen=eigenesZuBarcode(nr);
  if(eigen){
    foodDraft={...eigen, basis:'g100', menge:eigen.letzteMenge>0?eigen.letzteMenge:100, quelle:'barcode'};
    foodBusy=''; foodFehler=''; foodStep='menge'; view='food'; render();
    toast('Aus deiner Liste');
    return;
  }

  foodBusy='Suche '+nr+' in der Lebensmittel-Datenbank …'; foodFehler=''; view='food'; render();
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(nr)}.json?fields=product_name,product_name_de,brands,nutriments`);
    /* ⚠️ Ein 503 lässt fetch NICHT werfen — die Antwort kommt, sie ist nur leer. Ohne
       diese Zeile rutscht eine überlastete Datenbank durch `!d.product` in die Meldung
       „steht nicht in der Datenbank“, das Anlegen-Formular geht auf, und man tippt die
       Nährwerte einer Packung ab, die längst erfasst ist. Nichts wird rot, nur unnötige
       Arbeit. (Gefunden 01.09.2026: `dbSuche` prüft das seit dem 31.08., diese Stelle
       nicht — dieselbe Lehre war nur an einer von zwei Aufrufstellen eingebaut.)
       ✅ Seit dem 02.09.2026 ist der Wortlaut wieder frei: die Weiche unten liest `e.art`,
       nicht den Text. */
    if(!r.ok) throw ffehler('Die Datenbank antwortet gerade nicht (Fehler '+r.status+').', 'server');
    const d=await r.json();
    if(!d || d.status===0 || !d.product) throw ffehler('Das Produkt steht nicht in der Datenbank.', 'unbekannt');
    const entwurf=offNachDraft(d.product, 'Produkt '+nr);
    if(!entwurf) throw ffehler('Zu dem Produkt sind keine Nährwerte hinterlegt.', 'unbekannt');
    foodDraft={...entwurf, quelle:'barcode', barcode:String(nr)};
    foodBusy=''; foodStep='menge'; render();
  }catch(e){
    foodBusy='';
    /* ⚠️ Nur ein ausdrücklich so markierter Fehler öffnet das Formular. Alles
       andere -- ein 503, ein Netzabbruch, ein Fehler, den es heute noch gar nicht gibt --
       landet im `else`, auch wenn sein Text zufällig „nicht in der Datenbank" enthält. */
    const nichtDrin = !!(e && e.art === 'unbekannt');
    if(nichtDrin){
      // NEU: keine Sackgasse mehr. Bisher kam eine Fehlermeldung und der Weg war zu
      // Ende. Jetzt geht das Anlegen-Formular auf, MIT dem Barcode im Gepaeck — beim
      // Speichern wird er mitgemerkt, und derselbe Scan trifft danach sofort.
      // 💡 Der Fall ist nicht selten: von 422.265 Produkten mit Deutschland-Kennung
      // haben nur 246.807 vollstaendige Naehrwerte (nachgemessen am 22.08.2026).
      foodDraft=leerDraft(); foodDraft.barcode=String(nr); foodDraft.quelle='barcode';
      foodStep='new';
      foodFehler='Diese Packung steht nicht in der Datenbank. Trag die Werte einmal von der '
               + 'Verpackung ab — beim nächsten Scan ist sie sofort da.';
    } else {
      foodStep='list';
      foodFehler=(e&&e.message)||'Kein Netz oder Datenbank nicht erreichbar.';
    }
    render(); }
}

/* ---------- Suchen statt scannen (31.08.2026) ----------
   Karls Ansage: „wir brauchen eine Datenbank für essen zum eintragen falls man keinen
   QR-Code hat.“ Die Datenbank war längst angeschlossen -- aber **nur über den Barcode.**
   Ohne Packung (loses Obst, Kantine, Restaurant, abgeschält und weggeworfen) blieb nur:
   alle Nährwerte von Hand abtippen.

   ⚠️ **Gesucht wird auf Knopfdruck, nicht beim Tippen.** Zwei Gründe, beide gemessen:
   Open Food Facts drosselt spürbar (beim Bauen am 31.08. kamen nach wenigen Anfragen
   hintereinander nur noch 503er), und im Keller-Gym ist ohnehin kein Netz. Eine Suche bei
   jedem Tastendruck wäre dort eine Reihe von Fehlschlägen statt einer Antwort.

   💡 **Die eigene Liste kommt zuerst** -- sie steht schon oben und braucht kein Netz.
   Der Knopf zur Datenbank erscheint darunter, also genau dort, wo man merkt, dass das
   Eigene nicht reicht. */
let dbTreffer=[], dbFrage='';

/* ---------- Lebensmittel suchen: zwei Wege und ein Wiederholversuch ----------
   🔴 Karls Meldung am 03.09.2026: „einen fehler als ich was gesucht habe, als ich dann
   nochmal gesucht habe hat es sofort funktioniert". Nachgemessen an demselben Abend,
   fuenf Anfragen an die alte `cgi/search.pl`: **vier mal 503, einmal 200.** Es ist keine
   Drosselung nach Anzahl (dann waeren die spaeteren dran, nicht die ersten) und es liegt
   nicht am Suchbegriff -- die alte Perl-Suche von Open Food Facts lehnt unter Last
   einfach zufaellig ab. Ein zweiter Versuch geht oft sofort durch, genau wie bei Karl.

   ➡️ Zwei Aenderungen, in dieser Reihenfolge:
   1. **Der neue Suchdienst `search.openfoodfacts.org` ist jetzt der erste Weg.**
      Nachgemessen: 6 von 6 Anfragen durch, 240-400 ms. Die alte Suche brauchte fuer
      dasselbe zwischen 350 ms und einem Fehlschlag.
   2. **Wer trotzdem scheitert, wird wiederholt** -- erst der neue Weg ein zweites Mal,
      dann die alte Suche als Ausweichweg. Karls Ansage dazu: *„sonst muss es laenger
      laden"*. Genau der Handel: bis zu ~1,5 s mehr im schlechten Fall, dafuer keine
      Fehlermeldung, die beim zweiten Tippen von selbst verschwindet.

   ⚠️ Ein 503 wirft hier bewusst weiter, statt eine leere Liste zu liefern -- sonst waere
   der Fehlschlag als „nichts gefunden" getarnt, und das Anlege-Formular ginge auf. Genau
   dieser Fall hat am 01.09. dazu gefuehrt, dass Naehrwerte abgetippt wurden, die die
   Datenbank kennt. */
const SUCH_FELDER='code,product_name,product_name_de,brands,nutriments';
function suchAdresseNeu(q){
  return 'https://search.openfoodfacts.org/search?page_size=24&fields='+SUCH_FELDER
       + '&q='+encodeURIComponent(q); }
function suchAdresseAlt(q){
  return 'https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1'
       + '&page_size=24&fields='+SUCH_FELDER+'&search_terms='+encodeURIComponent(q); }

async function einSuchversuch(url){
  const r=await fetch(url);
  if(!r.ok) throw new Error('Die Datenbank antwortet gerade nicht (Fehler '+r.status+').');
  return await r.json();
}

async function sucheMitAusweichweg(q){
  const wege=[suchAdresseNeu(q), suchAdresseNeu(q), suchAdresseAlt(q)];
  let letzter=null;
  for(let i=0;i<wege.length;i++){
    try{ return await einSuchversuch(wege[i]); }
    catch(e){
      letzter=e;
      /* Kurz durchatmen lassen, aber nur zwischen den Versuchen -- nach dem letzten
         waere das Warten geschenkte Zeit. 300 ms reichen: die 503 der alten Suche
         kamen in der Messung nach 35-350 ms zurueck, das ist kein Stau, der sich
         aussitzen laesst, sondern eine Ablehnung. */
      if(i<wege.length-1) await new Promise(f=>setTimeout(f,300));
    }
  }
  throw letzter || new Error('Kein Netz oder Datenbank nicht erreichbar.');
}

async function dbSuche(text){
  const q=(text||'').trim();
  if(q.length<2){ foodFehler='Gib mindestens zwei Buchstaben ein.'; render(); return; }
  dbFrage=q; dbTreffer=[];
  foodBusy='Suche „'+q+'“ in der Lebensmittel-Datenbank …'; foodFehler=''; view='food'; render();
  try{
    const d=await sucheMitAusweichweg(q);
    /* ⚠️ Treffer ohne Nährwerte werden hier weggelassen, nicht erst beim Antippen. Von den
       Produkten mit Deutschland-Kennung hatte am 22.08.2026 nur gut die Hälfte vollständige
       Werte -- eine Liste, in der jeder zweite Eintrag in eine Fehlermeldung führt, ist
       schlechter als eine kurze. */
    /* Beide Wege heissen die Trefferliste anders: `hits` beim neuen Suchdienst,
       `products` bei der alten cgi-Suche. */
    dbTreffer=(d.hits||d.products||[]).map(p=>{ const e=offNachDraft(p, q);
                 return e ? {...e, barcode:String(p.code||'')} : null; })
               .filter(Boolean);
    foodBusy='';
    if(!dbTreffer.length){
      foodStep='list';
      foodFehler='Zu „'+q+'“ steht nichts mit Nährwerten in der Datenbank. '
               + 'Trag es einmal von Hand ein — danach steht es in deiner Liste.';
    } else foodStep='db';
    render();
  }catch(e){
    foodBusy=''; foodStep='list';
    foodFehler=(e&&e.message)||'Kein Netz oder Datenbank nicht erreichbar.';
    render();
  }
}

// Vor dem Senden verkleinern: ein Handyfoto in voller Aufloesung kostet ein Vielfaches
// an Bild-Tokens, ohne dass der Teller dadurch besser zu erkennen waere.
function fotoKlein(file, max){
  return new Promise((ok,fail)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1, max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s)||1; c.height=Math.round(img.height*s)||1;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg',0.8).split(',')[1]); };
    img.onerror=()=>{ URL.revokeObjectURL(url); fail(new Error('Das Bild ließ sich nicht lesen.')); };
    img.src=url;
  });
}
async function schaetzeFoto(file){
  // fragKey() ist seit dem 22.08.2026 ein Dialog und damit asynchron — ohne await
  // liefe es sofort mit einem Promise (immer wahr) weiter und schickte das Foto ohne Schluessel.
  if((!aiKey() || altSchluessel()) && !(await fragKey())){ foodFehler='Ohne Schlüssel kann das Foto nicht geschätzt werden.'; render(); return; }
  foodBusy='Das Bild wird angesehen … das dauert ein paar Sekunden.'; foodFehler=''; view='food'; render();
  try{
    const b64=await fotoKlein(file,1024);
    // Google statt Anthropic (Karls Entscheidung, 21.08.2026): der Schluessel kostet dort
    // nur ein Google-Konto, kein Rechnungskonto. Interactions-API, nicht das aeltere
    // generateContent. Der Aufruf aus dem Browser ist erlaubt - nachgemessen am 21.08.2026:
    // die Vorabfrage antwortet mit Access-Control-Allow-Origin fuer genau diese Seite und
    // erlaubt 'x-goog-api-key'. Ein Sonderheader wie bei Anthropic ist nicht noetig.
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{ method:'POST',
      headers:{ 'content-type':'application/json', 'x-goog-api-key':aiKey() },
      body: JSON.stringify({
        model:'gemini-3.7-flash',
        /* 🔴 Am 02.09.2026 von Karl gemeldet, beim ERSTEN echten Foto -- zwoelf Tage
           nach dem Einbau. Hier stand `type:'json_schema'` mit dem Schema in
           `json_schema.schema`, also die Form, die OpenAI verwendet. Google antwortet
           darauf mit 400: *"The value 'json_schema' is not supported for 'type' at
           'response_format'"*.
           ⚡ Bei der Interactions-API ist `type` die AUSGABEART (text, image, audio,
           number, ...), nicht das Schema-Format. Erzwungenes JSON heisst hier:
           type 'text' + mime_type 'application/json' + das Schema in `schema`.
           ⚠️ Und der eigentliche Merkposten steht in der Commit-Nachricht vom
           21.08.2026 selbst: *"Nicht geprueft: ein echtes Foto mit echtem Schluessel."*
           Die Form war aus der Dokumentation geschrieben und nie abgeschickt worden.
           **Keine Pruefung dieses Ordners haette das finden koennen** -- sie haetten
           genau die falsche Form festgehalten, an die ich geglaubt habe. */
        response_format:{ type:'text', mime_type:'application/json', schema:{
          type:'object',
          properties:{
            name:{type:'string', description:'Kurzer deutscher Name des Gerichts'},
            menge:{type:'string', description:'Geschätzte Portionsgröße, z.B. "ca. 350 g"'},
            kcal:{type:'number'}, eiweiss:{type:'number'}, kohlenhydrate:{type:'number'}, fett:{type:'number'},
            sicher:{type:'boolean', description:'false, wenn das Essen schlecht zu erkennen ist'}
          },
          required:['name','menge','kcal','eiweiss','kohlenhydrate','fett','sicher'] } },
        input:[
          { type:'text', text:'Schätze für das Essen auf diesem Bild die Nährwerte der abgebildeten Portion (nicht je 100 g). Antworte auf Deutsch. Wenn kein Essen zu sehen ist, setze sicher auf false und alle Zahlen auf 0.' },
          { type:'image', mime_type:'image/jpeg', data:b64 } ]
      }) });
    if(r.status===401||r.status===403) throw new Error('Der Schlüssel wurde nicht angenommen. Trag ihn in den Einstellungen neu ein.');
    if(r.status===429) throw new Error('Das kostenlose Kontingent bei Google ist gerade aufgebraucht. Versuch es später noch einmal.');
    if(!r.ok){ let t=''; try{ t=(await r.json()).error.message; }catch(e){}
      if(/api[ _-]?key/i.test(t)) throw new Error('Der Schlüssel wurde nicht angenommen. Trag ihn in den Einstellungen neu ein.');
      throw new Error('Die KI antwortet nicht ('+r.status+')'+(t?': '+t:'.')); }
    const d=await r.json();
    // ⚠️ Nicht steps[0] nehmen: vor der Antwort koennen Denk-Schritte stehen.
    const txt=(d.steps||[]).filter(s=>s&&s.type==='model_output')
      .map(s=>(s.content||[]).filter(c=>c&&c.type==='text').map(c=>c.text||'').join('')).join('');
    if(!txt) throw new Error('Die KI hat nichts zurückgegeben. Versuch ein anderes Bild.');
    const g=JSON.parse(txt);
    if(!g.sicher && !(+g.kcal>0)) throw new Error('Auf dem Bild war kein Essen zu erkennen.');
    foodDraft={ name:String(g.name||'Essen').slice(0,60), marke:String(g.menge||''),
      kcal:Math.round(+g.kcal||0), p:Math.round(+g.eiweiss||0), c:Math.round(+g.kohlenhydrate||0),
      f:Math.round(+g.fett||0), basis:'portion', menge:1, quelle:'foto', unsicher:!g.sicher };
    foodBusy=''; foodStep='menge'; render();
  }catch(e){ foodBusy=''; foodStep='list';
    foodFehler=(e&&e.message)||'Unbekannter Fehler.'; render(); }
}

function weightList(){ return (profile.weights||[]).slice().sort((a,b)=>a.date-b.date); }

/* ---------- Zeitraum der Gewichtskurve (Karls Ansage 01.09.2026) ----------
   „ich will das die kurve fuer das gewicht zeitlich einstellbar ist 1 woche 1 monat
   1 jahr max".
   ⚠️ Die Reihenfolge im Feld ist die Reihenfolge auf dem Bildschirm UND die Reihenfolge,
   in der unten der naechstgroessere Zeitraum gesucht wird — von eng nach weit. Wer hier
   umsortiert, aendert beides.                                                        */
function lastWeight(){ const w=weightList(); return w.length?w[w.length-1]:null; }
// Fuer die Erinnerung auf der Startseite. Bewusst „heute", nicht „in den letzten 24 Stunden":
// wer abends um 23 Uhr wiegt, soll am naechsten Morgen wieder gefragt werden.
function gewogenHeute(){ const n=Date.now(); return (profile.weights||[]).some(x=>sameDay(x.date,n)); }
function erinnerungAn(id){ const e=profile.erinnerungen; return !e || e[id]!==false; }
function erinnerungSetzen(id,an){
  if(!profile.erinnerungen||typeof profile.erinnerungen!=='object') profile.erinnerungen={wiegen:true,essen:true,ts:0};
  profile.erinnerungen[id]=!!an;
  profile.erinnerungen.ts=Date.now();   // die spaetere Entscheidung gewinnt beim Abgleich
  save();
}
function sameDay(a,b){ return new Date(a).toDateString()===new Date(b).toDateString(); }
// Ein Eintrag pro Tag — nochmal wiegen am selben Tag überschreibt den alten Wert.
function addWeight(kg){
  kg=Math.round((+kg)*10)/10;
  if(!(kg>0)||kg>500) return false;
  const now=Date.now(), i=(profile.weights||[]).findIndex(x=>sameDay(x.date,now));
  if(i>=0) profile.weights[i]={date:now,kg}; else profile.weights.push({date:now,kg});
  aufgabeErledigen('gewicht');   // Tagesaufgabe: Gewicht eingetragen
  save(); return true;
}

/* ---------- Push-Anmeldung (23.08.2026) ----------
   ⚠️ Der oeffentliche VAPID-Schluessel darf im Quelltext stehen — dafuer ist er da.
   Er ist derselbe wie bei angel-log, weil derselbe Bot sendet: die Schluessel gehoeren
   zum ABSENDER, nicht zum Supabase-Projekt. Zwei Paare waeren zwei Dinge zu pflegen
   ohne jeden Gewinn. Der PRIVATE Teil liegt allein in der .env des Bots.               */
const VAPID_PUB = 'BLxEeSl5L86MrjuBwAOcJxk1dEdThUaAsqKSarUpI8EN58iYQUmL2SyFUrmXFnbs3tgCfACcqaVdUjL5FsP2xcg';

/* Der Schluessel muss als Bytes uebergeben werden, nicht als Text. base64url hat statt
   `+/` die Zeichen `-_` und laesst das Auffuellen weg — `atob` kennt beides nicht. */
function urlBase64ZuBytes(x){
  const voll = (x + '='.repeat((4 - x.length % 4) % 4)).replace(/-/g,'+').replace(/_/g,'/');
  return Uint8Array.from(atob(voll), c => c.charCodeAt(0));
}
const pushMoeglich = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

async function pushAnmeldungHolen(){
  if(!pushMoeglich()) return null;
  try{ const reg = await navigator.serviceWorker.getRegistration();
       return reg ? await reg.pushManager.getSubscription() : null; }
  catch{ return null; }
}
async function pushEinschalten(){
  if(!session){ toast('Dafür brauchst du ein Konto'); return; }
  if(!pushMoeglich()){ toast('Dieses Gerät kann keine Mitteilungen'); return; }
  /* ⚠️ Erst fragen, dann anmelden. subscribe() fragt zwar selbst, aber der Fehler
     bei Ablehnung ist ein nichtssagender NotAllowedError — so lässt sich
     "abgelehnt" von "geht hier nicht" unterscheiden und auch so sagen. */
  let erlaubnis = Notification.permission;
  if(erlaubnis === 'default') erlaubnis = await Notification.requestPermission();
  if(erlaubnis !== 'granted'){
    toast('Ohne Erlaubnis geht es nicht — in den Geräte-Einstellungen änderbar');
    if(view==='meldung') renderMeldung();
    return;
  }
  const reg = await navigator.serviceWorker.ready;
  let sub;
  try{
    sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,                 // Pflicht; "stille" Pushs sind nicht erlaubt
      applicationServerKey: urlBase64ZuBytes(VAPID_PUB)
    });
  }catch(e){ toast('Anmelden fehlgeschlagen: ' + (e.message||e.name||'')); return; }

  const roh = sub.toJSON();
  let ok = false;
  try{
    /* ⚠️ Ohne user_id. Die App kennt ihre eigene Benutzer-id nicht — im Gerät liegt
       nur das Token. In der Tabelle steht dafür `default auth.uid()`; der Server setzt
       sie aus der Sitzung. */
    const r = await fetch(`${SUPA_URL}/rest/v1/gym_push`, { method:'POST',
      headers:{...authHeaders(true), 'Prefer':'resolution=merge-duplicates,return=minimal'},
      body: JSON.stringify({ endpoint: sub.endpoint, p256dh: roh.keys.p256dh, auth: roh.keys.auth }) });
    ok = r.ok;
  }catch(e){ ok = false; }
  if(!ok){
    /* ⚠️ Beim Fehlschlag die Anmeldung im Gerät wieder auflösen. Sonst hielte sich
       das Gerät für angemeldet, während niemand weiss, wohin gesendet werden soll —
       der Schalter stünde auf "an" und es käme nie etwas. */
    try{ await sub.unsubscribe(); }catch{}
    toast('Konnte nicht gespeichert werden — später nochmal');
    return;
  }
  toast('Mitteilungen sind an');
  if(view==='meldung') renderMeldung();
}
/* Die eigentliche Abmeldung, ohne Meldung an den Nutzer — damit sie auch dort laufen kann,
   wo gerade gar nicht von Mitteilungen die Rede ist (beim Abmelden vom Konto).
   ⚠️ Zuerst im Geraet, dann auf dem Server. Andersherum bliebe bei einem Netzfehler eine
   Anmeldung im Geraet ohne Zeile auf dem Server -- der Schalter stuende auf „an" und es
   kaeme nie etwas. Umgekehrt ist eine verwaiste Serverzeile harmlos: das Senden schlaegt
   dann mit 410 fehl, und dafuer ist die Zeile ohnehin zum Aufraeumen vorgesehen. */
async function pushAbmelden(){
  const sub = await pushAnmeldungHolen();
  if(!sub) return false;
  const ep = sub.endpoint;
  try{ await sub.unsubscribe(); }catch{}
  try{
    await fetch(`${SUPA_URL}/rest/v1/gym_push?endpoint=eq.${encodeURIComponent(ep)}`,
      { method:'DELETE', headers: authHeaders(true) });
  }catch(e){}
  return true;
}
async function pushAusschalten(){
  await pushAbmelden();
  toast('Mitteilungen sind aus');
  if(view==='meldung') renderMeldung();
}

/* ---------- Die Melde-Ansicht (23.08.2026) ----------
   Formular oben, Postfach darunter. Bewusst EINE Seite: wer etwas melden will,
   soll nicht erst suchen, und wer eine Antwort bekommen hat, sieht sie an
   derselben Stelle. */
let meldTexte = '';            // haelt den Tippstand ueber ein Neuzeichnen hinweg
/* Traegt den Push-Zustand nach, sobald er bekannt ist. Drei Faelle, die sich
   unterscheiden muessen: geht hier gar nicht / abgelehnt / an oder aus. */
async function pushStandZeichnen(){
  const stand = document.getElementById('pushStand'), knopf = document.getElementById('pushKnopf');
  if(!stand || !knopf) return;
  if(!pushMoeglich()){
    stand.textContent = 'Dieses Gerät kann keine Mitteilungen.';
    knopf.innerHTML = ''; return;
  }
  if(Notification.permission === 'denied'){
    stand.textContent = 'In den Geräte-Einstellungen abgelehnt — nur dort wieder einschaltbar.';
    knopf.innerHTML = ''; return;
  }
  const an = !!(await pushAnmeldungHolen());
  stand.textContent = an ? 'An' : 'Aus';
  knopf.innerHTML = `<button class="btn sm ${an?'ghost':'primary'}" data-act="push:${an?'aus':'an'}">${an?'Ausschalten':'Einschalten'}</button>`;
}
/* Was bei DIESEM Besuch im Postfach neu war. ⚠️ Wird beim Zeichnen sofort als gelesen
   verbucht, bleibt aber bis zum Verlassen der Seite hervorgehoben -- sonst verschwindet die
   Markierung im selben Moment, in dem man hinsieht, und man erfaehrt nie, WELCHE Antwort neu
   war. Gleiche Linie wie bei den frisch freigeschalteten Erfolgen. */
let meldNeuMarkiert = null;
function renderMeldung(){
  const wartend = meldungenLesen(), post = postfachLesen();
  /* 🔴 Hier wird abgehakt, nicht erst beim Tippen auf die einzelne Meldung. Die Antwort
     steht vollstaendig auf dieser Seite -- wer hier ist, hat sie gesehen. */
  if(meldNeuMarkiert === null) meldNeuMarkiert = [];
  const jetztNeu = post.filter(m => m.antwort && !m.gelesen_am).map(m => m.id);
  jetztNeu.forEach(id => { if(meldNeuMarkiert.indexOf(id) === -1) meldNeuMarkiert.push(id); });
  jetztNeu.forEach(id => { antwortGelesen(id); });   // oertlich sofort, beim Server nebenher
  let h = `<div class="row between" style="margin:2px 4px 10px">
      <h2>Problem melden</h2>
      <button class="btn sm ghost" data-nav="settings">Zurück</button></div>`;

  h += `<div class="card">

        style="width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;
               color:var(--txt);padding:12px;font-size:16px;font-family:inherit;resize:vertical">${esc(meldTexte)}</textarea>

    ${wartend.length?`<div class="tiny muted" style="margin-top:10px">⏳ ${wartend.length}
      ${wartend.length===1?'Meldung wartet':'Meldungen warten'} auf Verbindung — sie
      ${wartend.length===1?'geht':'gehen'} automatisch raus, sobald du wieder online bist.</div>`:''}
    </div>`;

  /* Mitteilungen. ⚠️ Der Stand wird ASYNCHRON nachgetragen (pushStand), weil
     getSubscription() ein Versprechen ist — beim Zeichnen ist er noch nicht bekannt.
     Bis dahin steht "wird geprüft" da und kein geratener Zustand. */
  h += `<div class="card" id="pushKarte">
      <div class="row between" style="align-items:center;gap:10px">
        <div style="min-width:0"><b>Mitteilung bei einer Antwort</b>
          <div class="tiny muted" id="pushStand">wird geprüft …</div></div>
        <div id="pushKnopf"></div></div></div>`;

  h += `<div class="row between" style="margin:20px 4px 6px"><h2>Deine Meldungen</h2>
      <span class="tiny muted">letzte 30 Tage</span></div>`;
  if(!post.length){
    h += `<div class="empty">Noch nichts gemeldet.</div>`;
  } else {
    h += `<div class="card">`;
    post.forEach(m => {
      const neu_ = m.antwort && meldNeuMarkiert.indexOf(m.id) !== -1;
      h += `<div class="meld${neu_?' neu':''}">
        <div class="row between" style="align-items:baseline;gap:8px">
          <b>#${m.nummer||'–'}</b>
          <span class="tiny muted">${fmtDate(new Date(m.erstellt).getTime())}</span></div>
        <div class="tiny" style="margin:4px 0 0;white-space:pre-wrap">${esc(m.text||'')}</div>
        ${m.antwort?`<div class="meld-antwort">
            <div class="tiny" style="color:var(--ok);font-weight:700;margin-bottom:3px">
              Antwort${neu_?' · neu':''}</div>
            <div class="tiny" style="white-space:pre-wrap">${esc(m.antwort)}</div></div>`
          :`<div class="tiny muted" style="margin-top:6px">Noch keine Antwort.</div>`}
      </div>`;
    });
    h += `</div>`;
  }
  app.innerHTML = h;
  /* ⚠️ setNav() laeuft in render() VOR dieser Funktion -- die rote Zahl waere sonst noch
     die alte. Genau das hat Karl gesehen. */
  navPunktZeichnen();
  pushStandZeichnen();
  // Nachladen, ohne die Ansicht zu blockieren — offline bleibt die Spiegelung stehen.
  // ⚠️ Verglichen wird der INHALT, nicht die Anzahl. Eine Antwort legt keine Zeile an,
  // sie fuellt `antwort` in einer bestehenden. Auf die Anzahl zu schauen hiess: die
  // Antwort kam an, wurde gespeichert -- und die Ansicht zeichnete sich nie neu.
  // Genau das war der Fehler vom 25.08.2026: sichtbar erst nach einem Neustart.
  postfachHolen().then(rows => { if(view==='meldung' && postfachGeaendert(post, rows)) renderMeldung(); });

       kommen und nicht vom Server. Karls Ansage: kann geloescht werden.
       ⚠️ An der SACHE aendert das nichts -- XP wird weiterhin auf dem Geraet gerechnet und
       hochgeschrieben, und wer will, kann seinen Browser-Speicher aendern. Der Hinweis steht
       weiter im Kopf von `supabase-bestenliste.sql`, damit er nicht ganz verlorengeht. */
  }


  app.innerHTML = h;
  /* ⚠️ setNav() laeuft in render() VOR dieser Funktion -- die goldene Zahl waere also noch
     die alte. Hier also nochmal, nachdem oben abgehakt wurde. */
  if(wurdeGesehen) navPunktZeichnen();
}

         oben) hat NICHT gereicht -- Karl meldete danach erneut 401. Direkt gegen
         Supabase geprueft (curl, mit dem echten Schluessel):
           /rest/v1/                              -> 401 "Secret API key required"

         Fehler lag also am ZIEL, nicht an fehlenden Headern.
         ⚠️ Jetzt eine echte, aber leichte Tabellenabfrage -- derselbe Weg, den

         lässt anonym ohnehin nichts zurueck ('[]') -- das ist hier gewollt: es geht

      const c=document.createElement('canvas'); c.width=2; c.height=2;
      c.getContext('2d').fillRect(0,0,2,2);
      const b64=c.toDataURL('image/jpeg',0.5).split(',')[1];
      const r=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{ method:'POST',
        headers:{ 'content-type':'application/json', 'x-goog-api-key':aiKey() },
        body: JSON.stringify({ model:'gemini-3.7-flash',
          response_format:{ type:'text', mime_type:'application/json', schema:{ type:'object',
            properties:{ok:{type:'boolean'}}, required:['ok'] } },
          input:[{type:'text', text:'Antworte nur mit {"ok":true}.'},
                 {type:'image', mime_type:'image/jpeg', data:b64}] }) });

// ---------- Timer ----------
let rest={total:0,remaining:0,id:null}; const tb=document.getElementById('timerbar');
function startRest(sec){ stopRest(); rest.total=sec; rest.remaining=sec; rest.id=setInterval(tick,1000); paintTimer(); }
function stopRest(){ if(rest.id){ clearInterval(rest.id); rest.id=null; } }
// stopRest haelt nur die Uhr an — rest.remaining bleibt stehen, und paintTimer zeigt die Leiste
// dann weiter. Beim Beenden, Abbrechen oder Verwerfen muss sie ganz weg, also auch die Restzeit.
function endRest(){ stopRest(); rest.remaining=0; rest.total=0; paintTimer(); }
function tick(){ rest.remaining--; if(rest.remaining<=0){ stopRest(); if(navigator.vibrate) navigator.vibrate([300,120,300]); toast('Pause vorbei — weiter!'); } paintTimer(); }
function adjust(d){ if(!rest.id&&rest.remaining<=0){ startRest(Math.max(5,d)); return; } rest.remaining=Math.max(0,rest.remaining+d); rest.total=Math.max(rest.total,rest.remaining); paintTimer(); }
function paintTimer(){ if(rest.remaining<=0&&!rest.id){ tb.classList.remove('show'); tb.innerHTML=''; return; }
  const m=Math.floor(rest.remaining/60), s=rest.remaining%60, pct=rest.total?Math.max(0,rest.remaining/rest.total*100):0;
  tb.classList.add('show');
  tb.innerHTML=`<div class="timer"><div class="time">${m}:${String(s).padStart(2,'0')}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <button class="t-btn" data-rest="-15">−15</button><button class="t-btn" data-rest="15">+15</button><button class="t-btn" data-rest="skip">✓</button></div>`; }

const APP_FASSUNG = 'v0.066';          // ⚠️ mit der Cacheversion in sw.js gleichziehen
/* 🔴 Stand hier bis zum 31.08.2026 auf 'v32' -- 22 Fassungen lang. Jede Problemmeldung,

const MELD_KEY = 'gymlog:meldungen';
const POST_KEY = 'gymlog:postfach';

function umfeldSammeln(){

  return {
    fassung: APP_FASSUNG,

function meldungenLesen(){ try{ return JSON.parse(localStorage.getItem(MELD_KEY)||'[]'); }catch{ return []; } }
function meldungenSchreiben(l){ try{ localStorage.setItem(MELD_KEY, JSON.stringify(l)); }catch{} }

/* ============================================================================
   Ein globaler Fehlerfang (02.09.2026, Idee 1 — Karls Ansage: „ok was können wir da machen").

   🔴 Bis heute gab es in der ganzen App KEIN window.onerror und KEIN
   unhandledrejection — nachgesehen, null Treffer in 6600 Zeilen. Jeder Fehler, der aus
   einem Klick-Handler oder einem nicht abgefangenen `await` fliegt, verschwand in der
   Konsole eines Handys, die niemand aufmacht. Genau die Bauform, die heute achtmal
   aufgetreten ist: etwas ist kaputt, und nichts wird rot.

   ⚠️ Bewusst KEIN allzu eifriger Fänger. Zwei Filter, beide mit einem echten Grund:
   1. Bekanntes Rauschen wird verworfen (ResizeObserver-Warnung, ein `Script error.`
      ohne jede Zeilennummer — das ist ein Fehler in fremdem Code, meist einer
      Browser-Erweiterung, den die App nie beeinflussen kann).
   2. Dieselbe Meldung erscheint höchstens EINMAL je Sitzung. Ein Fehler, der jede
      Sekunde neu wirft (z. B. in einem Intervall), soll nicht 60 Banner in der Minute
      auslösen — das würde die Leiste zur Tapete machen, die man nicht mehr ansieht. */
let fehlerGesehen = new Set();
let letzterFehler = null;

function fehlerFangen(text, ort){
  if(!text) return;
  if(/ResizeObserver loop/.test(text)) return;
  if(text === 'Script error.' && !ort) return;     // fremdes Skript, keine Zeile -- nichts zu zeigen
  const kennung = text.slice(0, 200);
  if(fehlerGesehen.has(kennung)) return;
  fehlerGesehen.add(kennung);
  letzterFehler = { text: text.slice(0, 2000), ort: ort || '', zeit: new Date().toISOString() };
  const l = document.getElementById('fehlerbanner');
  if(l) l.classList.add('show');
  try{ console.error('gym-log: unerwarteter Fehler:', text, ort||''); }catch(e){}
}

window.addEventListener('error', e => {
  fehlerFangen(e.error ? (e.error.message || String(e.error)) : e.message,
               e.filename ? (e.filename.split('/').pop() + ':' + e.lineno) : '');
});
window.addEventListener('unhandledrejection', e => {
  const r = e.reason;
  fehlerFangen('Unbehandelt: ' + (r && r.message ? r.message : String(r)), '');
});

function fehlerbannerText(){
  if(!letzterFehler) return '';
  return '<div class="big">🔍</div><b>Etwas ist schiefgelaufen</b>'
    + '<p style="font-size:13px;line-height:1.5;margin-top:10px;text-align:left;'
    + 'font-family:monospace;white-space:pre-wrap;word-break:break-word;'
    + 'background:var(--card2);border-radius:8px;padding:10px">'
    + esc(letzterFehler.text) + (letzterFehler.ort ? '\n' + esc(letzterFehler.ort) : '') + '</p>'
    + '<p style="font-size:13px;line-height:1.5">Nichts ist verloren gegangen — das hier ist nur'
    + ' eine Aufzeichnung. Magst du sie schicken, damit ich nachsehen kann?</p>';
}
document.addEventListener('click', e => {
  if(e.target && e.target.id === 'fehlerbanner'){
    const m = document.getElementById('modal');
    m.innerHTML = `<div class="modal-box" style="max-width:400px;text-align:center">
        ${fehlerbannerText()}
        <div class="fab-row" style="margin-top:16px">
          <button class="btn ghost" data-act="fehlerbanner:weg">Verwerfen</button>
          <button class="btn primary" data-act="fehlerbanner:melden">Schicken</button>

/* Legt die Meldung ins Geraet. Das Verschicken ist ein zweiter, eigener Schritt. */
function meldungAnlegen(text){
  const l = meldungenLesen();
  l.push({ id: uid()+uid(), text: String(text).slice(0,4000), umfeld: umfeldSammeln(),
           erstellt: new Date().toISOString() });
  meldungenSchreiben(l);
  return l.length;
}
/* 🔴 Die Zeichenkette muss WOERTLICH mit supabase-meldungen.sql uebereinstimmen
   (`raise exception 'GYM_BREMSE:%'`). Wird sie dort je umformuliert, gilt die Drosselung
   hier als harter Fehler -- und die Schlange steht. Die Pruefung
   `GYM_BREMSE steht wortgleich in der Datenbank` haelt beides zusammen. */
const GYM_BREMSE = 'GYM_BREMSE';
/* Meldungen, die der Server dauerhaft abgelehnt hat. Sie sind AUS der Schlange raus --
   sonst kaeme nie wieder eine durch -- gehen aber nicht verloren. */
const MELD_ABGELEHNT = 'meldungen-abgelehnt';
function abgelehnteLesen(){ const l = DB.get(MELD_ABGELEHNT, []); return Array.isArray(l) ? l : []; }

async function meldungenNachreichen(){
  if(!session || !(await ensureToken())) return 0;
  const l = meldungenLesen();
  if(!l.length) return 0;
  let durch = 0;                 // wie viele vorn in der Schlange erledigt sind
  const abgelehnt = [];          // was der Server nie annehmen wird
  for(const m of l){
    let r;
    try{
      r = await fetch(`${SUPA_URL}/rest/v1/gym_meldungen`, { method:'POST',
        headers:{...authHeaders(true), 'Prefer':'resolution=merge-duplicates,return=minimal'},
        body: JSON.stringify({ id:m.id, text:m.text, umfeld:m.umfeld }) });
    }catch(e){ break; }                       // kein Netz: alles bleibt liegen
    if(r.ok){ durch++; continue; }
    const txt = await r.text().catch(()=>'');
    /* Die Bremse ist kein Fehler, sondern eine Auskunft: "spaeter nochmal".
       Die Meldung bleibt liegen und geht beim naechsten Abgleich mit. */
    if(txt.indexOf(GYM_BREMSE) !== -1) break;
    /* 🔴 Gefunden am 01.09.2026. Vorher stand hier ein `throw` -- und die
       fehlgeschlagene Meldung blieb auf Platz `durch` in der Schlange stehen. Bei einem
       wiederholbaren Fehler (400, eine RLS-Regel, ein Feld, das der Trigger nicht mag)
       schlug sie beim naechsten Mal wieder fehl, und **jede spaetere Meldung stand
       dahinter** -- fuer immer. Genau die Sackgasse, vor der der Kommentar beim
       Stapelversand warnt; der Umbau auf Einzelversand hat die Nachbarn befreit, den
       Kopf nicht.
       ⚠️ Ein 5xx ist etwas anderes als ein 4xx: der Server ist nur gerade
       ueberlastet. Da wird abgebrochen und beim naechsten Mal weitergemacht -- sonst
       wuerfe eine Wartung die ganze Schlange weg. */
    if(r.status >= 500) break;
    abgelehnt.push({ id:m.id, text:m.text, erstellt:m.erstellt,
                     status:r.status, grund:String(txt).slice(0,200),
                     abgelehnt_am:new Date().toISOString() });
    durch++;                     // raus aus der Schlange, damit der Rest durchkommt
  }
  meldungenSchreiben(l.slice(durch));
  if(abgelehnt.length){
    DB.set(MELD_ABGELEHNT, abgelehnteLesen().concat(abgelehnt).slice(-20));
    /* ⚠️ Der Fehler wird GEWORFEN, aber erst hier: die uebrigen Meldungen sind
       da schon raus. Vorher hat der throw mitten in der Schleife beides verhindert. */
    throw new Error(abgelehnt.length === 1
      ? 'Eine Meldung wurde abgewiesen (Fehler ' + abgelehnt[0].status + ') und liegt beiseite.'
      : abgelehnt.length + ' Meldungen wurden abgewiesen und liegen beiseite.');
  }
  return durch;
}

/* ---------- Das Postfach ----------
   ⚠️ Der Bestand wird lokal gespiegelt. Ohne das waere das Postfach im Studio
   leer — genau dort, wo die App benutzt wird. Es ist eine Kopie zum Anschauen,
   keine zweite Wahrheit: geschrieben wird nur, was vom Server kam.              */
function postfachLesen(){ try{ return JSON.parse(localStorage.getItem(POST_KEY)||'[]'); }catch{ return []; } }
function postfachSchreiben(l){ try{ localStorage.setItem(POST_KEY, JSON.stringify(l)); }catch{} }
async function postfachHolen(){
  if(!session || !(await ensureToken())) return postfachLesen();
  try{
    const seit = new Date(Date.now()-30*864e5).toISOString();
    const r = await fetch(`${SUPA_URL}/rest/v1/gym_meldungen`
      + `?select=id,nummer,text,antwort,antwort_am,gelesen_am,erstellt`
      + `&erstellt=gte.${seit}&order=erstellt.desc`, { headers: authHeaders(true) });
    if(!r.ok) return postfachLesen();
    const rows = gelesenLokalAnwenden(await r.json());
    postfachSchreiben(rows);
    return rows;
  }catch(e){ return postfachLesen(); }
}
/* ---------- Gelesen bleibt gelesen (27.08.2026) ----------
   🔴 Karls Meldung: "die rote Zahl bei den Einstellungen geht nicht weg, wenn ich den
   Postkasten oeffne."

   Dahinter steckten ZWEI Fehler uebereinander, und der zweite haette den ersten ueberlebt:

   **1. Das Oeffnen hat nichts abgehakt.** Gelesen wurde eine Antwort nur, wenn man auf die
   einzelne Meldung TIPPTE. Im Postfach steht die Antwort aber vollstaendig da -- nichts ist
   zugeklappt. Wer sie gelesen hat, hat sie gelesen; ein zusaetzlicher Tipp auf etwas, das man
   schon sieht, ist keine Handlung, sondern eine Huerde.

   **2. Der Server hat die Marke wieder ueberschrieben.** `postfachHolen()` legt die Zeilen vom
   Server ueber die oertliche Spiegelung. Bis die Meldung "gelesen" beim Server angekommen und
   verbucht war, kam von dort weiter `gelesen_am: null` zurueck -- und die rote Zahl war wieder
   da. Ohne Netz sogar dauerhaft.
   ➡️ Deshalb merkt sich das Geraet, was es hier als gelesen betrachtet, und legt diese
   Marke ueber jede Antwort vom Server. Die Kennung fliegt raus, sobald der Server es selbst so
   sieht (oder die Zeile aus den 30 Tagen faellt) -- die Liste waechst also nicht mit.        */
function gelesenLokal(){ const l = DB.get('postfach-gelesen', []); return Array.isArray(l) ? l : []; }
function gelesenLokalMerken(id){
  const l = gelesenLokal();
  if(l.indexOf(id) === -1){ l.push(id); DB.set('postfach-gelesen', l.slice(-200)); }
}
/* ⚠️ Aendert `rows` an Ort und Stelle -- genau das ist der Zweck: was hier als gelesen
   gilt, soll auch in der Spiegelung stehen, sonst haengt die rote Zahl am Server. */
function gelesenLokalAnwenden(rows){
  const l = gelesenLokal(); if(!l.length) return rows;
  const behalten = [];
  l.forEach(id => {
    const m = (rows||[]).find(x => x.id === id);
    if(!m) return;                                  // Zeile weg (aelter als 30 Tage): Kennung kann weg
    if(m.gelesen_am) return;                        // Server weiss es selbst: Kennung kann weg
    m.gelesen_am = new Date().toISOString();        // Server hinkt hinterher: hier gilt gelesen
    behalten.push(id);
  });
  if(behalten.length !== l.length) DB.set('postfach-gelesen', behalten);
  return rows;
}
/* Wie viele ungelesene Antworten? Das ist die rote Zahl am Zahnrad. */
function postfachUngelesen(){
  return postfachLesen().filter(m => m.antwort && !m.gelesen_am).length;
}
/* Ein Fingerabdruck ueber das, was sich aendern KANN: die Antwort und ob sie gelesen ist.
   Der Text einer Meldung liegt fest, sobald sie raus ist -- er gehoert nicht hierher. */
function postfachSignatur(l){
  return (l||[]).map(m => `${m.id}|${m.antwort||''}|${m.gelesen_am||''}`).join('~');
}
/* DIE Entscheidung: muss neu gezeichnet werden? Steht bewusst als eigene Funktion da und
   nicht inline -- sonst haengt die Pruefung an der Signatur statt an der Entscheidung,
   und ein Rueckfall auf den Anzahl-Vergleich faellt keiner Pruefung auf. */
function postfachGeaendert(vorher, nachher){
  return postfachSignatur(vorher) !== postfachSignatur(nachher);
}
/* Nachsehen, ob eine Antwort da ist, und die Ansicht nur dann neu zeichnen.
   ⚠️ Ohne das erfaehrt die App NIE von einer Antwort, solange man nicht von Hand ins
   Postfach geht. Der Push weckt das Geraet, aber nichts fragte den Server -- die rote
   Zahl blieb auf 0 und die Startseite sah aus wie vorher. */
let postfachZuletzt = 0;
/* Auf die Mitteilung getippt: direkt ins Postfach.
   🔴 **Ausser es laeuft gerade ein Training.** Wer zwischen zwei Saetzen aufs Handy schaut,
   darf nicht aus seiner Einheit gerissen werden -- die Zeit laeuft weiter, die Eingaben
   stehen halb da. Dann bleibt es bei der roten Zahl, und er geht hin, wenn er fertig ist.
   Das ist der einzige Nachteil, den das Direktspringen hat, und er ist damit weg. */
async function postfachOeffnen(){
  await postfachAuffrischen();
  return postfachSpringen();
}
/* Der Sprung selbst -- bewusst SYNCHRON und als eigene Funktion. Der Prueframen ist
   synchron; steckte die Entscheidung in der async-Funktion, waere sie nur ueber einen
   Umweg pruefbar, und geprueft wuerde am Ende etwas anderes als das, was passiert. */
function postfachSpringen(){
  if(active){ navPunktZeichnen(); return false; }   // Training laeuft -- nicht wegreissen
  view = 'meldung'; render();
  return true;
}
/* ---------- XP-Bestenliste (29.08.2026) ----------
   Karls Wunsch: die zehn mit den meisten XP, auf der Erfolge-Seite.

   ⚠️ XP und Name anderer Nutzer stehen NICHT in `gymlog_data` -- der Block ist per
   Zeilensperre auf den Eigentuemer beschraenkt und bleibt es. Es gibt deshalb eine eigene
   Tabelle `gym_bestenliste`, in die jedes Geraet nur seine eigene Zeile schreibt: Name, XP,
   Zeitpunkt. Mehr kann sie gar nicht hergeben. Aufbau: `supabase-bestenliste.sql`.

   ⚠️ Solange dieses SQL nicht ausgefuehrt ist, antwortet Supabase mit einem Fehler. Das ist
   kein Absturz und darf auch nicht wie einer aussehen -- die Seite sagt dann, dass die Liste
   noch eingerichtet werden muss. `null` heisst "noch nicht geladen", `[]` heisst "geladen,
   aber leer", `false` heisst "gibt es serverseitig nicht". Drei Zustaende, drei Anzeigen. */
let bestenliste = null;
let bestenlisteZuletzt = 0;
let bestenlisteLaeuft = false;

/* Die eigene Zeile hochschreiben. ⚠️ Getrennt vom Lesen, weil es auch dann passieren soll,
   wenn gerade niemand die Erfolge-Seite ansieht -- sonst stuende in der Liste nur, wer sie
   selbst schon einmal geoeffnet hat. */
async function bestenlisteSchieben(){
  if(!session || !session.user || !await ensureToken()) return false;
  const name = (session.username || session.user.email || '').split('@')[0].slice(0,40);
  if(!name) return false;
  try{
    const r = await fetch(`${SUPA_URL}/rest/v1/gym_bestenliste`, {
      method:'POST',
      headers:{...authHeaders(true), 'Prefer':'resolution=merge-duplicates'},
      body: JSON.stringify([{ user_id: session.user.id, name,
                              xp: Math.max(0, Math.round(+profile.xp || 0)),
                              stand: new Date().toISOString() }]) });
    return r.ok;
  }catch(e){ return false; }
}

/* 🔴 Gefunden am 01.09.2026: die erste Zeile hat den Vertrag darueber gebrochen.
   `ensureToken()` gibt auch bei Netzfehler und bei jedem 5xx `false` zurueck -- damit
   wurde aus "kein Empfang" ein `false`, und `false` heisst hier "die Tabelle gibt es
   serverseitig nicht". Auf dem Bildschirm stand dann: **"Die Bestenliste ist noch nicht
   eingerichtet"** samt Verweis auf supabase-bestenliste.sql.
   ⚠️ Das ist schlimmer als eine ausbleibende Antwort -- es ist eine falsche
   Arbeitsanweisung. Karl setzt sich an SQL, das laengst richtig ist.
   ➡️ Jetzt heisst `false` nur noch, was es heissen soll: **404**, die Tabelle
   ist wirklich nicht da. Alles andere (kein Netz, 5xx, Drosselung, abgelaufene Anmeldung)
   ist `null` = "gerade nicht", und der alte Stand bleibt stehen. */
async function bestenlisteHolen(){
  if(!session) return null;                 // nicht angemeldet -- keine Aussage ueber den Server
  if(!await ensureToken()) return null;     // Token/Netz -- "gerade nicht", nicht "gibt es nicht"
  try{
    const r = await fetch(`${SUPA_URL}/rest/v1/gym_bestenliste?select=user_id,name,xp&order=xp.desc&limit=10`,
                          { headers: authHeaders(true) });
    if(r.status === 404) return false;      // die Tabelle fehlt -- das SQL ist wirklich nicht gelaufen
    if(!r.ok) return null;                  // 5xx, Drosselung, sonstiges: nur gerade nicht
    const rows = await r.json();
    return Array.isArray(rows) ? rows : false;
  }catch(e){ return null; }          // Netz weg: nicht "gibt es nicht", nur "gerade nicht"
}

/* ⚠️ Erst schieben, dann holen. Sonst sieht man beim ersten Oeffnen eine Liste, in der man
   selbst noch fehlt -- und haelt das fuer einen Fehler. */
async function bestenlisteAuffrischen(erzwingen){
  if(!session || bestenlisteLaeuft) return;
  if(!erzwingen && Date.now() - bestenlisteZuletzt < 30000) return;
  bestenlisteLaeuft = true;
  bestenlisteZuletzt = Date.now();
  try{
    await bestenlisteSchieben();
    const rows = await bestenlisteHolen();
    if(rows === null) return;        // Netz weg -- den alten Stand stehen lassen
    bestenliste = rows;
    if(view === 'erfolge') render();
  } finally { bestenlisteLaeuft = false; }
}

async function postfachAuffrischen(){
  if(!session) return false;
  postfachZuletzt = Date.now();
  const vorher = postfachLesen();
  const rows = await postfachHolen();
  if(!postfachGeaendert(vorher, rows)) return false;
  render();          // zeichnet die aktuelle Ansicht neu -- inkl. der roten Zahl
  return true;
}
async function antwortGelesen(id){
  const l = postfachLesen();
  const m = l.find(x => x.id === id);
  if(m) { m.gelesen_am = new Date().toISOString(); postfachSchreiben(l); }
  gelesenLokalMerken(id);   // damit die naechste Antwort vom Server sie nicht wieder aufmacht
  if(!session || !(await ensureToken())) return;
  /* ⚠️ Ueber die Funktion, nicht per PATCH: eine abgeschickte Meldung soll sich
     nicht nachtraeglich aendern lassen. gym_meldung_gelesen fasst nur gelesen_am an. */
  try{
    await fetch(`${SUPA_URL}/rest/v1/rpc/gym_meldung_gelesen`, { method:'POST',
      headers: authHeaders(true), body: JSON.stringify({ mid: id }) });
  }catch(e){}
}

let toastT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }
function showModal(html){ keyDialogAufloesen();      // ein offener Schluessel-Dialog wird sonst stumm weggeraeumt
  const m=document.getElementById('modal'); m.innerHTML=`<div class="modal-box">${html}<button class="btn primary" data-act="closemodal" style="margin-top:16px">Weiter</button></div>`; m.classList.add('show'); }
function closeModal(){ keyDialogAufloesen(); document.getElementById('modal').classList.remove('show'); }

// ---------- Daten herunterladen ----------
// Kein Backup mehr, sondern Datenübertragbarkeit (Art. 20 DSGVO). Der Knopf sitzt
// deshalb seit dem 03.08. auf der Datenschutz-Seite statt bei den Einstellungen.
// ⚠️ Das Gegenstück (Datei wieder einlesen) ist bewusst weg — gesichert wird über
// das Konto, und ein zweiter Weg, der Daten hineinschiebt, käme dem Abgleich in
// die Quere.
// ---------- Trainingsplan teilen ----------
// Der Plan steckt vollstaendig im Link — kein Server noetig, der Empfaenger braucht nur die App.
// btoa kann nur Bytes, deshalb der Umweg ueber TextEncoder; sonst zerbricht es an Umlauten.
function b64enc(str){ const b=new TextEncoder().encode(str); let s='';
  b.forEach(x=>{ s+=String.fromCharCode(x); });
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64dec(t){ t=String(t).replace(/-/g,'+').replace(/_/g,'/');
  const s=atob(t), b=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i);
  return new TextDecoder().decode(b); }
// Kurzform: nur was den Plan ausmacht. Keine ids (der Empfaenger vergibt eigene), keine
// Einheiten, kein Fortschritt, kein Name — geteilt wird der Plan, nicht die Historie.
function planCode(prog){
  const pr=prog||activeProg();
  return b64enc(JSON.stringify({v:2, name:String(pr.name||'Trainingsplan').slice(0,40), p:(pr.plans||[]).map(p=>({
    n:String(p.name||'Training').slice(0,40), d:(p.day==null?null:+p.day), w:planWarm(p)?1:0,
    e:(p.exercises||[]).filter(e=>e.name).map(e=>[String(e.name).slice(0,60), +e.sets||3, volOf(e)==='low'?'l':'h'])
  })).filter(p=>p.e.length)}));
}

/* ---------- Der Link war zu lang (27.08.2026) ----------
   Karls Meldung: "kannst du irgendwas dagegen tun, dass der Link fuer einen Plan gefuehlt
   ein A4-Blatt fuellt."

   Gemessen an einem echten Vier-Tage-Plan: **1.005 Zeichen**. In einer WhatsApp-Blase ist
   das eine Wand aus Buchstaben, und mancher Messenger bricht sie mittendrin um.

   Zwei Schritte, zusammen **auf 398 Zeichen — 60 % kuerzer**:
   1. **v3 spart die Feldnamen.** Statt {"n":...,"d":...,"w":...,"e":[...]} steht dort jetzt
      [name, tag, aufwaermen, uebungen]. Die Reihenfolge traegt die Bedeutung.
   2. **Deflate.** Uebungsnamen wiederholen sich zwischen den Trainings ("Bankdruecken" steht
      in Push UND Oberkoerper) -- genau davon lebt ein Packer. Das bringt mehr als Schritt 1.

   ⚠️ **Warum trotzdem beides:** faellt der Packer aus (alter Browser ohne
   CompressionStream), bleibt v2 uebrig -- und der alte Link funktioniert weiter. Empfangen
   werden v1, v2 und v3; ein Link, den Karl gestern verschickt hat, darf morgen nicht
   ploetzlich unbekannt sein.
   🔴 **Und warum das Packen NICHT im Klick passiert:** `CompressionStream` ist
   asynchron. Ein `await` vor `navigator.share()` kostet auf iOS die Nutzergeste, und dann
   geht das Teilen-Fenster gar nicht mehr auf. Der Code wird deshalb vorgewaermt, sobald die
   Plan-Liste gezeichnet wird -- also lange bevor jemand auf Teilen druecken kann. Ist er
   wider Erwarten noch nicht fertig, geht der alte lange Link raus statt gar keiner.        */
/* ---------- Schritt 3: Namen durch Nummern (27.08.2026) ----------
   🔴 Karls Rueckfrage, nachdem v3 den Link von 1.050 auf 391 Zeichen gebracht hatte:
   "sieht besser aus, aber immer noch sehr lang -- oder bist du am Ende deiner Macht?"

   War ich nicht. Was ich beim ersten Mal gemacht habe, waren die zwei **folgenlosen**
   Schritte. Dieser hier kostet etwas, und deshalb stand er nicht gleich dabei:

   ⚠️ **Eine Nummer ist nur so viel wert wie die Liste, auf die sie zeigt.** Beide Seiten
   muessen dieselbe Uebungs-Bibliothek haben. Bei Karl und seinen Testern ist das der Fall --
   sie laden alle dieselbe Adresse --, aber es ist eine Voraussetzung, wo vorher keine war.

   🔴 **Daraus folgt eine Regel, die wichtiger ist als dieses Feature:**

       EXLIB und EXLIB_WGER sind AB JETZT anhaengend. Nie umsortieren, nie etwas
       mittendrin einfuegen, nie einen Eintrag loeschen.

   Verschiebt sich ein Eintrag, zeigt jeder alte Link auf die falsche Uebung -- und zwar
   still, denn eine falsche Nummer sieht aus wie eine richtige. Eine Pruefung haelt Laenge
   und Pruefsumme der Liste fest und faellt um, sobald jemand daran dreht.

   Dazu kommt das Weglassen der Normalfaelle: **3 Saetze, Volumen hoch** ist die Vorgabe, also
   steht dort nur noch die Nummer. Zusammen: **391 -> 198 Zeichen** (davon 43 die Adresse
   selbst). Weiter geht es ohne Server nicht -- der Plan steckt vollstaendig im Link, und
   kuerzer als seine eigene Information wird er nicht. */
const EXNAMEN = EXLIB.map(e=>e.name).concat(EXLIB_WGER.map(e=>e[0]));
const EXNUMMER = (()=>{ const m=new Map(); EXNAMEN.forEach((n,i)=>{ if(!m.has(n)) m.set(n,i); }); return m; })();

/* Eine Uebung so klein wie moeglich: nur die Nummer, wenn Satzzahl und Volumen dem Normalfall
   entsprechen. Ein Name, den die Bibliothek nicht kennt (Karls eigene Uebungen), steht
   weiterhin als Text da -- der muss ja mit. */
function ueNutzlast(e){
  const k = EXNUMMER.has(e.name) ? EXNUMMER.get(e.name) : String(e.name).slice(0,60);
  const saetze = +e.sets||3, hoch = volOf(e)!=='low';
  if(saetze===3 && hoch) return k;
  if(hoch) return [k, saetze];
  return [k, saetze, 0];
}
/* Und zurueck. ⚠️ Eine Nummer, die diese Bibliothek nicht hat (Empfaenger auf einem
   aelteren Stand), liefert null -- die Uebung faellt dann raus, statt unter falschem Namen
   im Plan zu landen. Der Empfaenger bekommt das gesagt, siehe zeigeImport(). */
function ueAusNutzlast(x){
  const roh = Array.isArray(x) ? x : [x, 3, 1];
  const k = roh[0], saetze = +roh[1]||3, vol = (roh[2]===0) ? 'l' : 'h';
  const name = (typeof k === 'number') ? (EXNAMEN[k] || null) : String(k);
  return name===null ? null : [name, saetze, vol];
}
function planNutzlast(prog){
  const pr=prog||activeProg();
  return [4, String(pr.name||'Trainingsplan').slice(0,40), (pr.plans||[]).map(p=>[
    String(p.name||'Training').slice(0,40),
    (p.day==null ? -1 : +p.day),
    planWarm(p)?1:0,
    (p.exercises||[]).filter(e=>e.name).map(ueNutzlast)
  ]).filter(p=>p[3].length)];
}
const planCodeCache = new Map();          // Nutzlast-JSON -> fertiger Kurzcode
function packerDa(){ return typeof CompressionStream === 'function'; }
async function packe(text){
  const roh = new TextEncoder().encode(text);
  const str = new Blob([roh]).stream().pipeThrough(new CompressionStream('deflate-raw'));
  const buf = await new Response(str).arrayBuffer();
  let bin=''; new Uint8Array(buf).forEach(x=>{ bin+=String.fromCharCode(x); });
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function entpacke(code){
  const t=String(code).replace(/-/g,'+').replace(/_/g,'/');
  const bin=atob(t), b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
  const str = new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Response(str).arrayBuffer().then(a=>new TextDecoder().decode(a));
}
/* Vorwaermen. Ruhig, folgenlos, und ein Fehlschlag faellt niemandem auf die Fuesse:
   dann bleibt es eben beim langen Link. */
function planCodeVorwaermen(prog){
  if(!packerDa()) return;
  const roh = JSON.stringify(planNutzlast(prog));
  if(planCodeCache.has(roh)) return;
  packe(roh).then(c=>{ planCodeCache.set(roh, 'z'+c); }).catch(()=>{});
}
function alleplaeneVorwaermen(){ (programs||[]).forEach(planCodeVorwaermen); }
/* Der kurze Code, wenn er fertig ist -- sonst der alte lange. Synchron, damit die
   Nutzergeste beim Teilen erhalten bleibt. */
function planCodeKurz(prog){
  const roh = JSON.stringify(planNutzlast(prog));
  return planCodeCache.get(roh) || planCode(prog);
}
function planLink(prog){ return location.origin+location.pathname+'#p='+planCodeKurz(prog); }
/* ---------- Plan teilen: drei Wege statt einem (27.08.2026) ----------
   Karls Frage: "kann man den Link sonst verpacken? In eine Ueberschrift z.B."

   🔴 **Kurzfassung: es haengt am Empfaenger, nicht an dieser App.** Was mit einem Link
   passiert, entscheidet das Programm, in dem er landet:

   - **Discord** kann es wirklich. `[Mein Plan](adresse)` zeigt nur die zwei Worte, die
     Adresse ist komplett unsichtbar.
   - **E-Mail, Notizen, Word** koennen es auch -- ueber die Zwischenablage, wenn dort neben
     dem Text auch eine HTML-Fassung liegt.
   - **WhatsApp kann es nicht.** Dort steht die Adresse als Text, immer. Was hilft, ist die
     Vorschau-Karte oben im Kopf der Seite: dann sieht die Nachricht nach Gym-Log aus statt
     nach hingeworfenem Text. Mehr ist von hier aus nicht zu machen, und ich tue nicht so.

   ⚠️ Der Dialog ersetzt den direkten Griff zum Teilen-Fenster des Handys nicht -- der steht
   als erster Knopf drin. Ein Knopf, der frueher eine Sache tat und jetzt vier anbietet, waere
   eine Verschlechterung fuer den haeufigsten Fall.
   ⚠️ `navigator.share` braucht eine Nutzergeste. Der Knopf IM Dialog ist eine -- deshalb geht
   das hier auf, obwohl der Dialog dazwischensteht. */
function kopiereReich(url, titel){
  const html = `<a href="${esc(url)}">${esc(titel)} — Gym-Log</a>`;
  /* ClipboardItem gibt es nicht ueberall (Firefox kann kein text/html schreiben). Faellt es
     aus, landet wenigstens die Adresse in der Zwischenablage -- lieber schlichter als leer. */
  try{
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      return navigator.clipboard.write([new ClipboardItem({
        'text/html':  new Blob([html], {type:'text/html'}),
        'text/plain': new Blob([url],  {type:'text/plain'})
      })]);
    }
  }catch(e){}
  return navigator.clipboard.writeText(url);
}
function sharePlan(progId){
  const pr=(progId?progById(progId):null)||activeProg();
  if(!pr.plans||!pr.plans.length){ toast('Dieser Plan hat noch keine Trainings'); return; }
  const url=planLink(pr);
  const text=`„${pr.name}" — mein Trainingsplan aus Gym-Log (${pr.plans.length} Trainings)`;
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal-box" style="max-width:380px;text-align:left">
    <div class="row between" style="margin-bottom:4px"><b>„${esc(pr.name)}" teilen</b>
      <button class="del-x" data-act="closemodal" style="margin:0">✕</button></div>
    <div class="tiny muted" style="margin-bottom:14px">${pr.plans.length} Trainings · ${url.length} Zeichen</div>
    ${navigator.share?`<button class="btn primary" data-act="teile-app" style="width:100%">Teilen…</button>`:''}
    <button class="btn" data-act="teile-discord" style="width:100%;margin-top:8px">Für Discord kopieren</button>
    <div class="tiny muted" style="margin:4px 2px 0">Dort steht nur „${esc(pr.name)}" — die Adresse ist unsichtbar.</div>
    <button class="btn" data-act="teile-reich" style="width:100%;margin-top:12px">Als Link kopieren</button>
    <div class="tiny muted" style="margin:4px 2px 0">Für E-Mail und Notizen — fügt als anklickbares Wort ein.</div>
    <button class="btn" data-act="teile-roh" style="width:100%;margin-top:12px">Nur die Adresse</button>
    <div class="tiny muted" style="margin:4px 2px 0">Für WhatsApp. ⚠️ Dort zeigt WhatsApp die
      Adresse immer als Text — das lässt sich von hier aus nicht abstellen.</div>
    </div>`;
  m.classList.add('show');
  m.dataset.url=url; m.dataset.titel=pr.name; m.dataset.text=text;
}
// Empfangen: der Link wird beim Start gelesen, der Hash sofort entfernt (sonst haengt er beim
// naechsten Oeffnen noch dran) und das Angebot erst nach der Anmeldung gezeigt.
let planImport=null, importGezeigt=false, planImportFehler='', importFehlerGezeigt=false;
/* Aus dem gepackten v3-Format zurueck in die Form, mit der zeigeImport() und
   importierePlan() seit jeher arbeiten. ⚠️ Die beiden bleiben damit unangetastet -- ein
   neues Link-Format soll nicht bis in die Uebernahme durchschlagen. */
function v3ZuPlan(a){
  if(!Array.isArray(a) || !Array.isArray(a[2])) return null;
  if(a[0]!==3 && a[0]!==4) return null;
  let verloren = 0;
  const p = a[2].slice(0,10).map(p=>{
    const roh = (p[3]||[]);
    // v3 hatte je Uebung [Name, Saetze, 'l'|'h'], v4 nur noch die Nummer (oder [Nr, Saetze, Vol]).
    const e = (a[0]===4 ? roh.map(ueAusNutzlast) : roh.map(x=>[x[0], +x[1]||3, x[2]?'h':'l']))
              .filter(x=>{ if(!x) verloren++; return !!x; });
    return { n:p[0], d:(p[1]===-1||p[1]==null)?null:+p[1], w:p[2]?1:0, e };
  }).filter(x=>x.e.length);
  return { name:(a[1]||'Geteilter Plan'), p, verloren };
}
/* 🔴 Am 01.09.2026 gefunden, und der Fund hatte zwei Haelften:
   1. Der Fehlerfang war LEER. Ein von WhatsApp abgeschnittener oder beim Kopieren
      zerrissener Link lief in atob, DecompressionStream oder JSON.parse auf einen Fehler --
      und die App ging auf, als haette man sie normal gestartet. Kein Angebot, kein Hinweis.
      Drei Faelle sahen identisch aus: Link kaputt, Empfaenger hat eine alte Fassung, oder
      Plan-Teilen geht grundsaetzlich nicht.
   2. Der Beweis war vorher schon weg. `history.replaceState` raeumte das `#p=...` aus der
      Adresszeile, BEVOR entpackt wurde -- danach half auch Neuladen nicht mehr.
   ➡️ Jetzt wird die Adresse erst geraeumt, wenn der Plan wirklich dasteht. Geht es
   schief, bleibt der Link stehen (Neuladen ist damit ein echter zweiter Versuch) und es
   erscheint ein Hinweis, der die drei Faelle auseinanderhaelt. */
function leseImportAusLink(){
  const m=/[#&]p=([A-Za-z0-9\-_]+)/.exec(location.hash||''); if(!m) return;
  const code=m[1];
  const hashWeg = () => { try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} };
  const misslungen = (grund) => { planImport=null; planImportFehler=grund; if(session) render(); };

     planImport hier zunaechst leer und wird nachgereicht. render() zeigt das Angebot, sobald
     es steht; wer in der Zwischenzeit schon in der App ist, sieht es einen Wimpernschlag
     spaeter aufgehen. Frueher als der Anmeldeschirm ist es ohnehin nie. */
  if(code[0]==='z'){
    if(typeof DecompressionStream !== 'function'){ misslungen('alt'); return; }
    entpacke(code.slice(1))
      .then(txt=>{ const p=v3ZuPlan(JSON.parse(txt));
        if(p && p.p.length){ planImport=p; hashWeg(); if(session) render(); }
        else misslungen('leer'); })
      .catch(()=> misslungen('kaputt'));
    return;
  }
  try{ const d=JSON.parse(b64dec(code));
    // v1 waren nur Trainings ohne Plan-Namen, v2 bringt den Namen mit. Beides annehmen.
    if(d && (d.v===1||d.v===2) && Array.isArray(d.p) && d.p.length){
      planImport={name:(d.name||'Geteilter Plan'), p:d.p.slice(0,10)}; hashWeg(); }
    else misslungen('leer');
  }catch(e){ misslungen('kaputt'); }
}

const RPC_FEHLER = Symbol('rpc-fehler');

    username: username || (d.user.user_metadata&&d.user.user_metadata.username) || d.user.email }; DB.set('session',session); }

/* 🔴 Ein Auffrischen zur Zeit. Gefunden beim Durchsehen am 27.08.2026.

   Beim Start laufen `cloudSyncStart()` und `postfachAuffrischen()` nebeneinander los, und
   beide fragen hier nach. War der Token abgelaufen (App laenger als eine Stunde zu), schickten
   **beide** denselben `refresh_token` los. Supabase gibt bei jedem Auffrischen einen neuen aus
   und macht den alten ungueltig -- der zweite Aufruf bekam also ein 400 zurueck, und der
   Zweig darunter wirft bei 4xx die Anmeldung weg.

   ⚠️ Das Bild fuer Karl waere gewesen: **App nach ein paar Stunden aufgemacht und
   rausgeflogen** -- ohne erkennbaren Anlass und nicht jedes Mal, weil es am Rennen zweier
   Anfragen haengt. Ein Fehler, den man nicht nachstellt, sondern nur liest.

   ➡️ Laeuft schon eins, warten alle anderen auf DASSELBE Versprechen. */
let tokenLaeuft = null;
async function ensureToken(){ if(!session) return false; if(Date.now()<session.expires_at-30000) return true;
  if(tokenLaeuft) return tokenLaeuft;
  tokenLaeuft = (async () => {
    try{ const r=await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});
      if(r.ok){ setSession(await r.json(), session.username); return true; }
      if(r.status>=400&&r.status<500){ clearSession(); render(); toast('Bitte neu anmelden'); return false; }
      setSync(false); return false; }
    catch(e){ setSync(false); return false; }
  })();
  /* ⚠️ Der Riegel muss auch nach einem Fehlschlag wieder aufgehen, sonst wartet der
     naechste Aufruf ewig auf ein Versprechen, das laengst beantwortet ist. */
  try { return await tokenLaeuft; } finally { tokenLaeuft = null; } }

   "wer etwas Ungesichertes hat, schiebt; alle anderen holen". Ein Geraet mit einer
   einzigen offenen Aenderung holte deshalb NIE -- es schob seinen Stand darueber.
   Zwei Geraete konnten sich so gegenseitig Trainings und Gewichtseintraege loeschen.

   ⚠️ Zusammengefuehrt werden genau die zwei Listen, die nebenbei an beiden Geraeten
   entstehen: Trainings und Gewichtskurve. Plaene und Einstellungen bleiben bewusst beim

// Vereinigt zwei Listen ueber einen Schluessel. Was die Basis schon kennt, bleibt wie es ist.
function vereinige(basis, dazu, schluessel){
  const liste=(Array.isArray(basis)?basis:[]).slice();
  const kenne=new Set(liste.map(schluessel));
  const neu=[];
  (Array.isArray(dazu)?dazu:[]).forEach(x=>{ const k=schluessel(x);
    if(!kenne.has(k)){ kenne.add(k); liste.push(x); neu.push(x); } });
  return {liste, neu};

function gewichteZusammen(a, b){
  const tag=x=>new Date(x.date).toDateString(), m=new Map();
  [].concat(Array.isArray(a)?a:[], Array.isArray(b)?b:[]).forEach(x=>{
    if(!x||!(x.kg>0)) return; const k=tag(x), alt=m.get(k);
    if(!alt||x.date>alt.date) m.set(k,x); });
  return Array.from(m.values()).sort((x,y)=>x.date-y.date);

     (💡 Diese Aufgabe gibt es seit dem 29.08.2026 nicht mehr -- der Ausloeser ist damit
     weg, der Fehler war aber nie an ihr festgemacht, sondern am Zusammenfuehren selbst.) Der Zweig

     Verloren gingen dadurch: die **Tagesaufgaben** (Karls Fall), die Liste der **ausgezahlten
     Erfolge**, die **Mahlzeiten und eigenen Lebensmittel** und die **Schritte**.
     \U0001f534 Die ausgezahlten Erfolge waren dabei mehr als ein fehlender Haken: kennt das

  if(aD && aD.tag && aD.fertig){
    if(!aB || !aB.tag || aD.tag > aB.tag){

     🔴 Ohne diesen Block faellt die Einstellung unter "alles andere im Profil kommt von
     basis" -- also vom eigenen Geraet. Wer die Erinnerung am Handy ausschaltet, haette sie
     am PC weiter, und beim naechsten Schieben kaeme sie am Handy zurueck. Genau die Sorte

     ⚠️ Entschieden ueber den Zeitstempel und NICHT ueber "Aus gewinnt": bei "Aus gewinnt"
     kaeme man nie wieder an, solange ein Geraet noch das alte Aus kennt. */
  if(dp.erinnerungen && typeof dp.erinnerungen==='object'){

     \u26a0\ufe0f Das ist echter Inhalt, kein Zustand. Wer am Handy gegessen eintraegt und danach

  if(kD && typeof kD==='object'){

    if(beimSchliessen && new TextEncoder().encode(koerper).length < 60*1024) opt.keepalive=true;
    const r=await fetch(`${SUPA_URL}/rest/v1/gymlog_data`,opt);
    setSync(r.ok); if(r.ok) setDirty(false);

// eingefroren, feuert der Timer nie und der Eintrag bleibt auf dem Geraet liegen.
// Bei einem Training faellt dasselbe nicht auf, weil man danach noch lange in der App ist.
function flushSync(){ if(!session||!dirty) return; clearTimeout(syncT); cloudPush(true); }

// ⚠️ Hier stand bis zum 24.08.2026 "if(dirty){ push; return; }" -- ein Geraet mit einer
// offenen Aenderung holte damit nie und ueberschrieb das andere. Genau der Datenverlust.

  //   dirty -> der lokale Stand ist der frischere, er gibt Plaene und Einstellungen vor
  //   sonst -> der Stand aus der Cloud gibt sie vor
  // Die zweite Rechnung sagt nur, ob die Cloud etwas NICHT hat -- dann muss geschoben werden.
  const ausLokal=blobsZusammen(lokal, res.data);

async function passwortSetzen(neu, token){

  if(!r.ok) throw (d&&(d.msg||d.error_description||d.message))||'Das Passwort ließ sich nicht ändern.';

/* Der Rueckweg aus der Mail. Supabase haengt die Sitzung als Rauten-Teil an die Adresse:
   `#access_token=…&refresh_token=…&type=recovery`.
   ⚠️ Der Rauten-Teil wird sofort aus der Adresszeile geraeumt. Ein Zugangs-Token im
      Verlauf des Browsers ist genau das, was man nicht will -- und beim Teilen der
      Adresse ginge er mit. Gelesen ist er da schon.
   ⚠️ Auch der Fehlerfall kommt als Rauten-Teil (`error_description`), typisch beim
      abgelaufenen Link. Ohne diesen Zweig staende der Anmelde-Schirm wortlos da. */
let resetToken=null, resetRefresh=null, resetMail='';
function rueckkehrAusMail(){
  const roh=(location.hash||'').replace(/^#/,''); if(!roh) return null;
  const p=new URLSearchParams(roh);
  const typ=p.get('type'), fehler=p.get('error_description')||p.get('error'), token=p.get('access_token');
  if(!typ && !fehler) return null;
  if(typ!=='recovery' && !fehler) return null;
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  if(fehler || !token) return {fehler: /expired|invalid/i.test(fehler||'')
    ? 'Dieser Link ist abgelaufen. Fordere unten einen neuen an.'
    : 'Mit diesem Link stimmt etwas nicht. Fordere unten einen neuen an.'};
  resetToken=token; resetRefresh=p.get('refresh_token')||null;
  return {token};
}

async function deleteAccount(){

    /* ⚠️ Zuerst die Mitteilungen, dann die Daten. `gym_push` haengt zwar per
       `on delete cascade` am Konto — aber nur, wenn das Konto wirklich verschwindet.
       Geht `delete_own_account` schief (Ausgang 'dataonly'), bliebe die Zeile stehen, und
       die Anmeldung im Geraet bleibt in jedem Fall bestehen. Hier steht „alle Daten
       dauerhaft"; dann darf auch nichts mehr klingeln. */
    try{ await pushAbmelden(); }catch(e){}
