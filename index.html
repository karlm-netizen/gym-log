  }

  // NEU: Was willst du überhaupt? Das stand bisher NIRGENDS in der App — und ohne
  // diese eine Angabe ist jede Kalorienzahl geraten.
  if(!zielArt()){
    h+=`<div class="card" style="margin-top:10px">
      <div style="margin-bottom:4px"><b>Was hast du vor?</b></div>
      <div class="tiny muted" style="margin-bottom:10px">Danach richtet sich dein Kalorienziel —
        und ich kann dir sagen, ob es aufgeht.</div>
      <div class="fab-row">
        ${Object.entries(ZIELE).map(([id,z])=>
          `<button class="btn" data-zielart="${id}">${z.name}</button>`).join('')}
      </div>
      ${vorschlag?`<div class="tiny muted" style="margin-top:8px">Bei ${fmtKg(lastWeight().kg)} kg
        rechne ich dir daraus das Tagesziel aus.</div>`
        :`<div class="tiny muted" style="margin-top:8px">⚠️ Dafür brauche ich dein Gewicht —
          trag es weiter unten ein.</div>`}</div>`;
  }

  // NEU: Zielvorschlag statt Kopfrechnen. Die Faustregel stand bisher nur als Text
  // im Eingabefenster — der Nutzer sollte sie selbst anwenden.
  if(!(k.goal>0) && vorschlag){
    const fuer=kcalVorschlagFuer(zielArt());
    h+=`<div class="card" style="margin-top:10px">
      <div class="tiny muted" style="margin-bottom:8px">Aus deinem Gewicht von
        <b style="color:var(--txt)">${fmtKg(lastWeight().kg)} kg</b>${zielArt()
          ? ` und dem Vorhaben <b style="color:var(--txt)">${ZIELE[zielArt()].name}</b>`
          : ''} ergibt sich <b style="color:var(--txt)">${fuer} kcal</b> am Tag.</div>
      <button class="btn" data-act="kcalgoalauto">${fuer} kcal als Ziel übernehmen</button></div>`;
  }

  // NEU: der Regelkreis. Passt das, was auf der Waage passiert, zu dem was gegessen
  // wird und was gewollt ist? Das ist die eine Sache, die kein bezahltes Abo besser
  // kann — die Daten liegen längst da.
  const rk=regelkreis();
  if(rk.stand!=='kein-ziel'){
    let inhalt;
    if(rk.stand==='zu-wenig-gewicht')
      inhalt=`<div class="tiny muted">Für die Rückmeldung brauche ich <b style="color:var(--txt)">zwei
        Wiegungen über mindestens eine Woche</b>. Tagesschwankungen von einem Kilo sind normal —
        daraus eine Woche hochzurechnen gäbe Unsinn.</div>`;
    else if(rk.stand==='zu-wenig-essen')
      inhalt=`<div class="tiny muted">Die Gewichtskurve steht, aber es fehlen Essenstage:
        <b style="color:var(--txt)">${rk.tage} von mindestens 4</b> in den letzten zwei Wochen.</div>`;
    else if(rk.stand==='passt')
      inhalt=`<div class="row between"><span><b style="color:var(--ok)">Es geht auf.</b></span>
        <span class="tiny muted">${rk.trend.tage} Tage</span></div>
      <div class="tiny muted" style="margin-top:6px">
        ${fmtKg(rk.trend.von)} → ${fmtKg(rk.trend.bis)} kg, also
        <b style="color:var(--txt)">${rk.ist>0?'+':''}${fmtKg(rk.ist)} kg pro Woche</b>
        bei Ø ${rk.schnitt.schnitt} kcal. Vorhaben: ${ZIELE[rk.art].satz}. <b style="color:var(--txt)">Nichts ändern.</b></div>`;
    else
      inhalt=`<div class="row between"><span><b>${rk.korrektur>0?'Zu langsam':'Zu schnell'}</b></span>
        <span class="tiny muted">${rk.trend.tage} Tage</span></div>
      <div class="tiny muted" style="margin-top:6px">
        ${fmtKg(rk.trend.von)} → ${fmtKg(rk.trend.bis)} kg, also
        <b style="color:var(--txt)">${rk.ist>0?'+':''}${fmtKg(rk.ist)} kg pro Woche</b>
        bei Ø ${rk.schnitt.schnitt} kcal. Gewollt war ${ZIELE[rk.art].satz}.</div>
      <div style="margin-top:8px">➡️ <b>${rk.neuesZiel} kcal</b> am Tag würden besser passen
        <span class="muted">(${rk.korrektur>0?'−':'+'}${Math.abs(rk.korrektur)})</span></div>
      <button class="btn" style="margin-top:8px" data-act="kcalziel-uebernehmen">Auf ${rk.neuesZiel} kcal umstellen</button>`;
    h+=`<div class="card" style="margin-top:10px">
      <div class="tiny muted" style="margin-bottom:6px">Waage und Essen im Abgleich</div>${inhalt}</div>`;
  }

  // NEU: die App misst nicht mehr nur, sie schlägt auch etwas vor.
  const tipp = eZiel ? eiweissTipp(s.p, eZiel) : null;
  if(tipp && tipp.essen){
    h+=`<div class="card" style="margin-top:10px"><div class="tiny muted">
      Dir fehlen noch <b style="color:var(--txt)">${tipp.fehlt} g Eiweiß</b>.
      <b style="color:var(--txt)">${tipp.gramm} g ${esc(tipp.essen.name)}</b> ${tipp.deckt
        ? `wären genau das`
        : `bringen <b style="color:var(--txt)">${tipp.eiweiss} g</b> davon`}, bei ${tipp.kcal} kcal.</div></div>`;
  }

  // NEU: der Wochenschnitt. Ein einzelner Tag sagt fast nichts — was zaehlt, ist die
  // Linie ueber die Woche. ⚠️ Gerechnet wird nur ueber Tage MIT Eintrag.
  if(schnitt){
    h+=`<div class="card" style="margin-top:10px">
      <div class="row between"><span class="tiny muted">Schnitt der letzten 7 Tage</span>
        <b>${schnitt.schnitt} kcal</b></div>
      <div class="tiny muted" style="margin-top:4px">über ${schnitt.tage} ${schnitt.tage===1?'Tag':'Tage'} mit Eintrag${
        zielSchnitt>0 ? ` · Ziel ${zielSchnitt} kcal${schrittModus()?' im Schnitt':''}, also <b style="color:var(--txt)">${
          schnitt.schnitt>zielSchnitt?'+':''}${schnitt.schnitt-zielSchnitt}</b>` : ''}</div></div>`;
  }

  h+=`<div class="fab-row" style="margin-top:10px">
      <button class="btn primary" data-act="food:start">+ Essen eintragen</button></div>`;

  // NEU: Ein-Tipp-Wiederholung. Der haeufigste Grund, warum Essensprotokolle nach
  // einer Woche einschlafen, ist nicht Faulheit — es ist, dass man dasselbe
  // Fruehstueck jeden Tag neu zusammensucht.
  const letzte=zuletztGegessen(6);
  if(letzte.length){
    h+=`<div class="row between" style="margin:20px 4px 6px"><h2>Nochmal</h2>
        <span class="tiny muted">ein Tipp genügt</span></div><div class="card">`;
    letzte.forEach(m=>{ h+=`<div class="lib-row" data-again="${m.id}" style="cursor:pointer">
      <div style="flex:1;min-width:0"><div>${esc(m.name)}</div>
        <div class="tiny muted">${esc(String(m.menge))} · ${m.kcal} kcal · ${m.p} g Eiweiß</div></div>
      <span class="muted" style="font-size:20px;padding:0 4px">+</span></div>`; });
    h+=`</div>`;
  }

  /* ---------- Ernährung: vier Mahlzeiten statt einer Liste (23.08.2026) ----------
     Karls Vorlage. Jeder Block hat ein eigenes Ziel (Anteil am Tagesziel) und einen
     eigenen Plus-Knopf, der die Mahlzeit gleich mitgibt.
     ⚠️ Der jetzt fällige Block wird hervorgehoben — nachmittags ist „Abendessen"
     der wahrscheinlichste Griff, und ihn zu suchen ist eine Bewegung zu viel. */
  const jetztMz = mahlzeitJetzt();
  h+=`<div class="row between" style="margin:20px 4px 6px"><h2>Ernährung</h2>
      <span class="tiny muted">${heute.length} ${heute.length===1?'Eintrag':'Einträge'}</span></div>
    <div class="card" style="padding:4px 0">`;
  MAHLZEITEN.forEach((mz,i)=>{
    const drin = heute.filter(m=>mahlzeitVon(m)===mz.id);
    const sum  = drin.reduce((a,m)=>a+(+m.kcal||0),0);
    const ziel = mahlzeitZiel(mz.id, zt);
    h+=`<div class="mz${mz.id===jetztMz?' jetzt':''}${i?' trenn':''}">
      <div class="row between" style="align-items:center;gap:10px">
        <div class="row" style="gap:10px;align-items:center;min-width:0">
          <span class="mz-icon" aria-hidden="true">${mz.icon}</span>
          <div style="min-width:0">
            <b>${mz.name}</b>
            <div class="tiny muted">${Math.round(sum)}${ziel?` / ${ziel}`:''} kcal</div>
          </div>
        </div>
        <button class="mz-plus" data-act="food:start:${mz.id}"
          aria-label="Zu ${mz.name} eintragen">+</button>
      </div>
      ${ziel?zielBalken(sum, ziel, 'var(--ok)'):''}
      ${drin.length?`<div style="margin-top:8px">`+[...drin].reverse().map(m=>
        `<div class="mz-eintrag"><div style="min-width:0">
           <span>${esc(m.name)}</span>
           <div class="tiny muted">${esc(String(m.menge))} · ${fmtTime(m.date)}${m.quelle==='foto'?' · Foto':m.quelle==='barcode'?' · Barcode':''}</div></div>
         <span class="row" style="gap:10px;flex:0 0 auto"><b>${m.kcal} kcal</b>
         <button class="link" style="padding:0 2px;color:var(--muted)" data-delmeal="${m.id}">✕</button></span></div>`
      ).join('')+`</div>`:''}
    </div>`;
  });
  h+=`</div>`;

  // ---------- Gewicht (war frueher der ganze Tab) ----------
  const w=weightList(), cur=lastWeight();
  h+=`<div class="row between" style="margin:22px 4px 6px"><h2>Gewicht</h2>
      ${cur?`<span class="pill">zuletzt ${fmtDate(cur.date)}</span>`:''}</div>
    <div class="card">
      <div class="row" style="gap:8px;align-items:flex-end">
        <div class="field" style="flex:1;margin:0"><label>Heute wiegen (kg)</label>
          <input id="wInput" type="number" inputmode="decimal" step="0.1" min="20" max="500"
                 placeholder="${cur?fmtKg(cur.kg):'z. B. 78,5'}"></div>
        <button class="btn primary" style="width:auto;padding:12px 18px" data-act="addweight">Eintragen</button>
      </div>
      <div class="tiny muted" style="margin-top:8px">Am besten morgens, nüchtern, immer zur gleichen Zeit —
        dann sind die Zahlen vergleichbar. Ein Eintrag pro Tag; nochmal wiegen überschreibt den heutigen Wert.</div>
    </div>`;

  if(w.length===0){ h+=`<div class="empty">Noch nichts eingetragen.<br>Trag dein Gewicht ein, dann entsteht hier deine Kurve.</div>`;
    app.innerHTML=h; return; }

  const first=w[0], diff=cur.kg-first.kg;
  h+=`<div class="grid3" style="margin-top:14px">
      <div class="stat"><b>${fmtKg(first.kg)}</b><span>Start</span></div>
      <div class="stat"><b>${fmtKg(cur.kg)}</b><span>Aktuell</span></div>
      <div class="stat"><b>${diff>0?'+':''}${fmtKg(diff)}</b><span>kg Differenz</span></div></div>`;

  if(w.length>1){
    h+=`<div class="row between" style="margin:20px 4px 6px"><h2>Verlauf</h2>
        <span class="tiny muted">${fmtKg(Math.min(...w.map(x=>x.kg)))}–${fmtKg(Math.max(...w.map(x=>x.kg)))} kg</span></div>
      <div class="card" style="padding:10px 6px">${lineChart(w.map(x=>x.kg),300,110)}</div>`;
  } else {
    h+=`<div class="empty" style="margin-top:16px">Ab dem zweiten Eintrag siehst du hier eine Kurve.</div>`;
  }

  h+=`<div class="row between" style="margin:20px 4px 6px"><h2>Einträge</h2></div><div class="card">`;
  [...w].reverse().forEach(x=>{ h+=`<div class="sess"><span>${fmtDate(x.date)}</span>
      <span class="row" style="gap:10px"><b>${fmtKg(x.kg)} kg</b>
      <button class="link" style="padding:0 2px;color:var(--muted)" data-delweight="${x.date}">✕</button></span></div>`; });
  h+=`</div>`;
  app.innerHTML=h;
}

  app.innerHTML=h;
  renderFoodList('');
}

      <button class="del-x" data-delfood="${f.id}" aria-label="Lebensmittel löschen">✕</button></div>`).join('');
  if(!treffer.length) h+=`<div class="empty" style="padding:18px">${k.foods.length
      ? 'Nichts gefunden.' : 'Noch keine eigenen Lebensmittel.'}</div>`;

// ---------- Barcode ----------
// Drei Wege, in dieser Reihenfolge:
//  1. BarcodeDetector im Browser (Chrome/Android) - schnell, nichts nachzuladen.
//  2. ZXing im Browser (./zxing.min.js) - fuer Safari/iPhone, das BarcodeDetector bis heute
//     nicht kennt. Wird erst geladen, wenn wirklich gescannt wird.
//  3. Nummer eintippen - nur noch, wenn gar keine Kamera da ist oder sie verweigert wird.
function kameraGeht(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
let scanStream=null, scanReader=null, zxingLaedt=null;
function stopScan(){
  if(scanReader){ try{ scanReader.reset(); }catch(e){} scanReader=null; }
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; } }
function nummerTippen(text){
  const nr=prompt(text||'Nummer unter dem Barcode eintippen (die 8-13 Ziffern):');
  if(nr) holeBarcode(nr.replace(/\D/g,'')); }
// 330 KB gehoeren nicht in den Start der App - deshalb erst hier, und nur einmal.
function ladeZXing(){
  if(window.ZXing) return Promise.resolve(true);
  if(zxingLaedt) return zxingLaedt;
  zxingLaedt=new Promise(res=>{ const s=document.createElement('script');
    s.src='./zxing.min.js';
    s.onload=()=>res(typeof window.ZXing!=='undefined');
    s.onerror=()=>{ zxingLaedt=null; res(false); };
    document.head.appendChild(s); });
  return zxingLaedt; }
function scanHinweis(t){ const h=document.getElementById('scanHint'); if(h) h.textContent=t; }
async function openScan(){
  if(!kameraGeht()){ nummerTippen('Dieses Gerät gibt keine Kamera her. Nummer unter dem Barcode eintippen:'); return; }
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal-box" style="max-width:380px;padding:14px">
    <div class="row between" style="margin-bottom:8px"><b>Barcode scannen</b>
      <button class="del-x" data-act="closescan" style="margin:0">✕</button></div>
    <video id="scanVid" playsinline muted autoplay style="width:100%;border-radius:12px;background:#000"></video>
    <div class="tiny muted" id="scanHint" style="margin-top:8px">Halt den Strichcode ins Bild.</div>
    <button class="btn ghost sm" data-act="scantippen" style="margin-top:10px;width:100%">Nummer stattdessen eintippen</button>
  </div>`;
  m.classList.add('show');
  const treffer=nr=>{ stopScan(); closeModal(); holeBarcode(nr); };

  // Weg 1
  if(typeof window.BarcodeDetector!=='undefined'){
    try{
      scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
      const v=document.getElementById('scanVid');
      if(!v){ stopScan(); return; }
      v.srcObject=scanStream; await v.play();
      const det=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
      const tick=async()=>{
        if(!scanStream) return;                       // abgebrochen
        try{ const codes=await det.detect(v);
          if(codes&&codes.length){ treffer(codes[0].rawValue); return; }
        }catch(e){}
        setTimeout(tick,400); };
      tick(); return;
    }catch(e){ stopScan();
      // Kamera verweigert? Dann hilft auch Weg 2 nicht.
      if(e && (e.name==='NotAllowedError'||e.name==='NotFoundError'||e.name==='SecurityError')){
        closeModal(); nummerTippen('Kamera geht nicht. Nummer unter dem Barcode eintippen:'); return; }
    }
  }

  // Weg 2 - ZXing macht die Kamera selbst auf und raeumt sie mit reset() wieder weg.
  scanHinweis('Barcode-Leser wird geladen …');
  const da=await ladeZXing();
  if(!document.getElementById('scanVid')) return;     // zwischendurch zugemacht
  if(!da){ closeModal(); nummerTippen('Der Barcode-Leser lässt sich nicht laden (kein Netz?). Nummer eintippen:'); return; }
  scanHinweis('Halt den Strichcode ins Bild.');
  try{
    const hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,
      [ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E]);
    scanReader=new ZXing.BrowserMultiFormatReader(hints,250);
    scanReader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}},'scanVid',(res,err)=>{
      if(res&&scanReader) treffer(res.getText()); });
  }catch(e){ stopScan(); closeModal();
    nummerTippen('Kamera geht nicht. Nummer unter dem Barcode eintippen:'); }
}
// Open Food Facts: offene Datenbank, kein Schluessel noetig, kennt deutsche Produkte gut.
// Erst die eigene Liste, dann das Netz. Ein einmal selbst angelegtes Produkt wird
// damit beim naechsten Scan SOFORT gefunden — auch ohne Netz, also auch im Keller-Gym.
function eigenesZuBarcode(nr){
  return kcalInit().foods.find(f=>f.barcode && String(f.barcode)===String(nr)) || null;
}

async function holeBarcode(nr){
  if(!nr || nr.length<6){ foodFehler='Das war keine gültige Barcode-Nummer.'; render(); return; }

  // NEU: eigener Treffer schlaegt die Datenbank. Kein Netz, keine Wartezeit.
  const eigen=eigenesZuBarcode(nr);
  if(eigen){
    foodDraft={...eigen, basis:'g100', menge:100, quelle:'barcode'};
    foodBusy=''; foodFehler=''; foodStep='menge'; view='food'; render();
    toast('Aus deiner Liste');
    return;
  }

  foodBusy='Suche '+nr+' in der Lebensmittel-Datenbank …'; foodFehler=''; view='food'; render();
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(nr)}.json?fields=product_name,product_name_de,brands,nutriments`);
    const d=await r.json();
    if(!d || d.status===0 || !d.product) throw new Error('Das Produkt steht nicht in der Datenbank.');
    const p=d.product, n=p.nutriments||{};
    const kcal = n['energy-kcal_100g'] != null ? n['energy-kcal_100g']
               : (n['energy_100g']!=null ? n['energy_100g']/4.184 : null);
    if(kcal==null) throw new Error('Zu dem Produkt sind keine Nährwerte hinterlegt.');
    foodDraft={ name:(p.product_name_de||p.product_name||'Produkt '+nr).slice(0,60),
      marke:(p.brands||'').split(',')[0].trim(),
      kcal:Math.round(kcal), p:Math.round(n.proteins_100g||0), c:Math.round(n.carbohydrates_100g||0),
      f:Math.round(n.fat_100g||0), basis:'g100', menge:100, quelle:'barcode', barcode:String(nr) };
    foodBusy=''; foodStep='menge'; render();
  }catch(e){
    foodBusy='';
    const nichtDrin=/nicht in der Datenbank|keine Nährwerte/.test((e&&e.message)||'');
    if(nichtDrin){
      // NEU: keine Sackgasse mehr. Bisher kam eine Fehlermeldung und der Weg war zu
      // Ende. Jetzt geht das Anlegen-Formular auf, MIT dem Barcode im Gepaeck — beim
      // Speichern wird er mitgemerkt, und derselbe Scan trifft danach sofort.
      // 💡 Der Fall ist nicht selten: von 422.265 Produkten mit Deutschland-Kennung
      // haben nur 246.807 vollstaendige Naehrwerte (nachgemessen am 22.08.2026).
      foodDraft=leerDraft(); foodDraft.barcode=String(nr); foodDraft.quelle='barcode';
      foodStep='new';
      foodFehler='Diese Packung steht nicht in der Datenbank. Trag die Werte einmal von der '
               + 'Verpackung ab — beim nächsten Scan ist sie sofort da.';
    } else {
      foodStep='list';
      foodFehler=(e&&e.message)||'Kein Netz oder Datenbank nicht erreichbar.';
    }
    render(); }
}

// Vor dem Senden verkleinern: ein Handyfoto in voller Aufloesung kostet ein Vielfaches
// an Bild-Tokens, ohne dass der Teller dadurch besser zu erkennen waere.
function fotoKlein(file, max){
  return new Promise((ok,fail)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1, max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s)||1; c.height=Math.round(img.height*s)||1;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg',0.8).split(',')[1]); };
    img.onerror=()=>{ URL.revokeObjectURL(url); fail(new Error('Das Bild ließ sich nicht lesen.')); };
    img.src=url;
  });
}
async function schaetzeFoto(file){
  // fragKey() ist seit dem 22.08.2026 ein Dialog und damit asynchron — ohne await
  // liefe es sofort mit einem Promise (immer wahr) weiter und schickte das Foto ohne Schluessel.
  if((!aiKey() || altSchluessel()) && !(await fragKey())){ foodFehler='Ohne Schlüssel kann das Foto nicht geschätzt werden.'; render(); return; }
  foodBusy='Das Bild wird angesehen … das dauert ein paar Sekunden.'; foodFehler=''; view='food'; render();
  try{
    const b64=await fotoKlein(file,1024);
    // Google statt Anthropic (Karls Entscheidung, 21.08.2026): der Schluessel kostet dort
    // nur ein Google-Konto, kein Rechnungskonto. Interactions-API, nicht das aeltere
    // generateContent. Der Aufruf aus dem Browser ist erlaubt - nachgemessen am 21.08.2026:
    // die Vorabfrage antwortet mit Access-Control-Allow-Origin fuer genau diese Seite und
    // erlaubt 'x-goog-api-key'. Ein Sonderheader wie bei Anthropic ist nicht noetig.
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{ method:'POST',
      headers:{ 'content-type':'application/json', 'x-goog-api-key':aiKey() },
      body: JSON.stringify({
        model:'gemini-3.7-flash',
        response_format:{ type:'json_schema', json_schema:{ name:'Naehrwerte', schema:{
          type:'object',
          properties:{
            name:{type:'string', description:'Kurzer deutscher Name des Gerichts'},
            menge:{type:'string', description:'Geschätzte Portionsgröße, z.B. "ca. 350 g"'},
            kcal:{type:'number'}, eiweiss:{type:'number'}, kohlenhydrate:{type:'number'}, fett:{type:'number'},
            sicher:{type:'boolean', description:'false, wenn das Essen schlecht zu erkennen ist'}
          },
          required:['name','menge','kcal','eiweiss','kohlenhydrate','fett','sicher'] } } },
        input:[
          { type:'text', text:'Schätze für das Essen auf diesem Bild die Nährwerte der abgebildeten Portion (nicht je 100 g). Antworte auf Deutsch. Wenn kein Essen zu sehen ist, setze sicher auf false und alle Zahlen auf 0.' },
          { type:'image', mime_type:'image/jpeg', data:b64 } ]
      }) });
    if(r.status===401||r.status===403) throw new Error('Der Schlüssel wurde nicht angenommen. Trag ihn in den Einstellungen neu ein.');
    if(r.status===429) throw new Error('Das kostenlose Kontingent bei Google ist gerade aufgebraucht. Versuch es später noch einmal.');
    if(!r.ok){ let t=''; try{ t=(await r.json()).error.message; }catch(e){}
      if(/api[ _-]?key/i.test(t)) throw new Error('Der Schlüssel wurde nicht angenommen. Trag ihn in den Einstellungen neu ein.');
      throw new Error('Die KI antwortet nicht ('+r.status+')'+(t?': '+t:'.')); }
    const d=await r.json();
    // ⚠️ Nicht steps[0] nehmen: vor der Antwort koennen Denk-Schritte stehen.
    const txt=(d.steps||[]).filter(s=>s&&s.type==='model_output')
      .map(s=>(s.content||[]).filter(c=>c&&c.type==='text').map(c=>c.text||'').join('')).join('');
    if(!txt) throw new Error('Die KI hat nichts zurückgegeben. Versuch ein anderes Bild.');
    const g=JSON.parse(txt);
    if(!g.sicher && !(+g.kcal>0)) throw new Error('Auf dem Bild war kein Essen zu erkennen.');
    foodDraft={ name:String(g.name||'Essen').slice(0,60), marke:String(g.menge||''),
      kcal:Math.round(+g.kcal||0), p:Math.round(+g.eiweiss||0), c:Math.round(+g.kohlenhydrate||0),
      f:Math.round(+g.fett||0), basis:'portion', menge:1, quelle:'foto', unsicher:!g.sicher };
    foodBusy=''; foodStep='menge'; render();
  }catch(e){ foodBusy=''; foodStep='list';
    foodFehler=(e&&e.message)||'Unbekannter Fehler.'; render(); }
}

function weightList(){ return (profile.weights||[]).slice().sort((a,b)=>a.date-b.date); }
function lastWeight(){ const w=weightList(); return w.length?w[w.length-1]:null; }
function sameDay(a,b){ return new Date(a).toDateString()===new Date(b).toDateString(); }
// Ein Eintrag pro Tag — nochmal wiegen am selben Tag überschreibt den alten Wert.
function addWeight(kg){
  kg=Math.round((+kg)*10)/10;
  if(!(kg>0)||kg>500) return false;
  const now=Date.now(), i=(profile.weights||[]).findIndex(x=>sameDay(x.date,now));
  if(i>=0) profile.weights[i]={date:now,kg}; else profile.weights.push({date:now,kg});
  save(); return true;
}

// ---------- Timer ----------
let rest={total:0,remaining:0,id:null}; const tb=document.getElementById('timerbar');
function startRest(sec){ stopRest(); rest.total=sec; rest.remaining=sec; rest.id=setInterval(tick,1000); paintTimer(); }
function stopRest(){ if(rest.id){ clearInterval(rest.id); rest.id=null; } }
// stopRest haelt nur die Uhr an — rest.remaining bleibt stehen, und paintTimer zeigt die Leiste
// dann weiter. Beim Beenden, Abbrechen oder Verwerfen muss sie ganz weg, also auch die Restzeit.
function endRest(){ stopRest(); rest.remaining=0; rest.total=0; paintTimer(); }
function tick(){ rest.remaining--; if(rest.remaining<=0){ stopRest(); if(navigator.vibrate) navigator.vibrate([300,120,300]); toast('Pause vorbei — weiter!'); } paintTimer(); }
function adjust(d){ if(!rest.id&&rest.remaining<=0){ startRest(Math.max(5,d)); return; } rest.remaining=Math.max(0,rest.remaining+d); rest.total=Math.max(rest.total,rest.remaining); paintTimer(); }
function paintTimer(){ if(rest.remaining<=0&&!rest.id){ tb.classList.remove('show'); tb.innerHTML=''; return; }
  const m=Math.floor(rest.remaining/60), s=rest.remaining%60, pct=rest.total?Math.max(0,rest.remaining/rest.total*100):0;
  tb.classList.add('show');
  tb.innerHTML=`<div class="timer"><div class="time">${m}:${String(s).padStart(2,'0')}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <button class="t-btn" data-rest="-15">−15</button><button class="t-btn" data-rest="15">+15</button><button class="t-btn" data-rest="skip">✓</button></div>`; }

let toastT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }
function showModal(html){ const m=document.getElementById('modal'); m.innerHTML=`<div class="modal-box">${html}<button class="btn primary" data-act="closemodal" style="margin-top:16px">Weiter</button></div>`; m.classList.add('show'); }

// ---------- Daten herunterladen ----------
// Kein Backup mehr, sondern Datenübertragbarkeit (Art. 20 DSGVO). Der Knopf sitzt
// deshalb seit dem 03.08. auf der Datenschutz-Seite statt bei den Einstellungen.
// ⚠️ Das Gegenstück (Datei wieder einlesen) ist bewusst weg — gesichert wird über
// das Konto, und ein zweiter Weg, der Daten hineinschiebt, käme dem Abgleich in
// die Quere.
// ---------- Trainingsplan teilen ----------
// Der Plan steckt vollstaendig im Link — kein Server noetig, der Empfaenger braucht nur die App.
// btoa kann nur Bytes, deshalb der Umweg ueber TextEncoder; sonst zerbricht es an Umlauten.
function b64enc(str){ const b=new TextEncoder().encode(str); let s='';
  b.forEach(x=>{ s+=String.fromCharCode(x); });
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64dec(t){ t=String(t).replace(/-/g,'+').replace(/_/g,'/');
  const s=atob(t), b=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i);
  return new TextDecoder().decode(b); }
// Kurzform: nur was den Plan ausmacht. Keine ids (der Empfaenger vergibt eigene), keine
// Einheiten, kein Fortschritt, kein Name — geteilt wird der Plan, nicht die Historie.
function planCode(prog){
  const pr=prog||activeProg();
  return b64enc(JSON.stringify({v:2, name:String(pr.name||'Trainingsplan').slice(0,40), p:(pr.plans||[]).map(p=>({
    n:String(p.name||'Training').slice(0,40), d:(p.day==null?null:+p.day), w:planWarm(p)?1:0,
    e:(p.exercises||[]).filter(e=>e.name).map(e=>[String(e.name).slice(0,60), +e.sets||3, volOf(e)==='low'?'l':'h'])
  })).filter(p=>p.e.length)}));
}
function planLink(prog){ return location.origin+location.pathname+'#p='+planCode(prog); }
function sharePlan(progId){
  const pr=(progId?progById(progId):null)||activeProg();
  if(!pr.plans||!pr.plans.length){ toast('Dieser Plan hat noch keine Trainings'); return; }
  const url=planLink(pr), text=`„${pr.name}" — mein Trainingsplan aus Gym-Log (${pr.plans.length} Trainings)`;
  const fallback=()=>{ (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject())
    .then(()=>toast('Link kopiert'))
    .catch(()=>showModal(`<div class="tiny muted">Link zum Weitergeben</div>
      <textarea readonly style="width:100%;height:90px;margin-top:8px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px;font-size:12px">${esc(url)}</textarea>`)); };
  if(navigator.share){ navigator.share({title:'Trainingsplan',text,url}).catch(e=>{ if(!e||e.name!=='AbortError') fallback(); }); }
  else fallback();
}
// Empfangen: der Link wird beim Start gelesen, der Hash sofort entfernt (sonst haengt er beim
// naechsten Oeffnen noch dran) und das Angebot erst nach der Anmeldung gezeigt.
let planImport=null, importGezeigt=false;
function leseImportAusLink(){
  const m=/[#&]p=([A-Za-z0-9\-_]+)/.exec(location.hash||''); if(!m) return;
  try{ const d=JSON.parse(b64dec(m[1]));
    // v1 waren nur Trainings ohne Plan-Namen, v2 bringt den Namen mit. Beides annehmen.
    if(d && (d.v===1||d.v===2) && Array.isArray(d.p) && d.p.length)
      planImport={name:(d.name||'Geteilter Plan'), p:d.p.slice(0,10)};
  }catch(e){ planImport=null; }
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
}
function zeigeImport(){

    <span>${esc(p.n)}${p.d!=null?` <span class="muted tiny">· ${DAYNAME[p.d]||''}</span>`:''}</span>
    <span class="muted tiny">${(p.e||[]).length} Übungen</span></div>`).join('');
  const m=document.getElementById('modal');

    ${liste}
    <div class="fab-row" style="margin-top:16px">
      <button class="btn" data-act="importno">Nein danke</button>
      <button class="btn primary" data-act="importyes">Übernehmen</button></div></div>`;

function importierePlan(){
  // Der geteilte Plan kommt als eigener Trainingsplan dazu — nicht in einen bestehenden hinein.
  // Innerhalb des neuen Plans gilt die Ein-Training-pro-Tag-Regel weiter: kollidiert ein Tag
  // mit einem schon im selben Plan vergebenen, kommt das Training ohne festen Tag rein.
  const neu=[]; let ohneTag=0;
  planImport.p.forEach(p=>{
    let tag=(p.d==null)?null:+p.d;
    if(tag!=null && neu.some(x=>x.day===tag)){ tag=null; ohneTag++; }
    neu.push({id:uid(), name:p.n, day:tag, warmup:!!p.w,
      exercises:(p.e||[]).map(e=>({id:uid(), name:e[0], sets:+e[1]||3, reps:10, vol:e[2]==='l'?'low':'high'}))});
  });
  const pr=neuerPlan(planImport.name, neu); programs.push(pr);
  planImport=null; save(); closeModal(); editProgId=pr.id; view='plans'; render();
  toast(ohneTag ? `„${pr.name}" übernommen — ${ohneTag} ohne Tag` : `„${pr.name}" übernommen`);
}

// ---------- Konto & Cloud-Sync (Supabase) ----------
let authMode='login', syncT, syncState='Cloud aktiv';
let dirty=DB.get('dirty',false);   // lokale Änderungen, die noch nicht in der Cloud sind
function setDirty(v){ dirty=v; DB.set('dirty',v); }
function setSync(ok){ const s= ok?'Cloud aktiv':'Offline — wird nachgeholt';
  if(s!==syncState){ syncState=s; if(view==='settings'&&session) renderSettings(); } }
function authHeaders(withToken){ return {'apikey':SUPA_KEY,'Content-Type':'application/json',
  'Authorization':'Bearer '+((withToken&&session&&session.access_token)?session.access_token:SUPA_KEY)}; }
async function supaRPC(fn,args){ try{ const r=await fetch(`${SUPA_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:authHeaders(false),body:JSON.stringify(args)}); return r.ok?await r.json():null; }catch(e){ return null; } }
function setSession(d,username){ session={ access_token:d.access_token, refresh_token:d.refresh_token,
    expires_at:Date.now()+((d.expires_in||3600)*1000), user:{id:d.user.id,email:d.user.email},
    username: username || (d.user.user_metadata&&d.user.user_metadata.username) || d.user.email }; DB.set('session',session); }
function clearSession(){ session=null; DB.set('session',null); }
// Wichtig: Kein Rauswurf bei Netzproblemen — nur wenn der Server die Anmeldung wirklich ablehnt.
async function ensureToken(){ if(!session) return false; if(Date.now()<session.expires_at-30000) return true;
  try{ const r=await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});
    if(r.ok){ setSession(await r.json(), session.username); return true; }
    if(r.status>=400&&r.status<500){ clearSession(); render(); toast('Bitte neu anmelden'); return false; }
    setSync(false); return false; }
  catch(e){ setSync(false); return false; } }
function appDataBlob(){ return {programs,plans,sessions,profile,settings}; }
function loadBlob(d){ if(!d) return;
  // Neue Staende bringen programs mit. Aeltere (und Backups von vor dem 05.08.) nur plans —
  // die wandern in einen Trainingsplan, damit nichts verlorengeht.
  if(Array.isArray(d.programs)&&d.programs.length) programs=d.programs;
  else if(Array.isArray(d.plans)) programs=[neuerPlan('Mein Plan',d.plans)];
  if(Array.isArray(d.sessions)) sessions=d.sessions;
  if(d.profile) profile=d.profile; if(d.settings) settings=d.settings; normalizeProfile(); bindPlans();
  DB.set('programs',programs); DB.set('sessions',sessions); DB.set('profile',profile); DB.set('settings',settings); applyTheme(); }
// Liefert {ok,data}: ok=false heißt "konnte nicht laden" (Netz), NICHT "Konto ist leer".
async function cloudPull(){ if(!await ensureToken()) return {ok:false,data:null};
  try{ const r=await fetch(`${SUPA_URL}/rest/v1/gymlog_data?id=eq.${session.user.id}&select=data`,{headers:authHeaders(true)});
    if(!r.ok){ setSync(false); return {ok:false,data:null}; }
    const rows=await r.json(); setSync(true); return {ok:true,data:(rows&&rows.length)?rows[0].data:null}; }
  catch(e){ setSync(false); return {ok:false,data:null}; } }
async function cloudPush(){ if(!await ensureToken()) return false;
  try{ const r=await fetch(`${SUPA_URL}/rest/v1/gymlog_data`,{method:'POST',headers:{...authHeaders(true),'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify([{id:session.user.id,data:appDataBlob(),updated_at:new Date().toISOString()}])});
    setSync(r.ok); if(r.ok) setDirty(false); return r.ok; }
  catch(e){ setSync(false); return false; } }
function scheduleSync(){ if(!session) return; setDirty(true); clearTimeout(syncT); syncT=setTimeout(cloudPush,2000); }
// Beim Start: lokale ungesicherte Änderungen haben Vorrang, sonst Cloud laden.
async function cloudSyncStart(){ if(!session) return;
  if(dirty){ await cloudPush(); return; }
  const res=await cloudPull(); if(!res.ok) return;
  if(res.data){ loadBlob(res.data); if(session) render(); } else await cloudPush(); }
async function authSignUp(username,email,password){ username=(username||'').trim(); email=(email||'').trim();
  if(!username||!email||!password) throw 'Bitte Username, E-Mail und Passwort ausfüllen.';
  if(password.length<6) throw 'Passwort mind. 6 Zeichen.';
  if(await supaRPC('username_taken',{uname:username})===true) throw 'Username ist schon vergeben.';
  const r=await fetch(`${SUPA_URL}/auth/v1/signup`,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password,data:{username}})});
  const d=await r.json(); if(!r.ok) throw d.msg||d.error_description||d.error||'Registrierung fehlgeschlagen.';
  if(!d.access_token) throw 'Konto erstellt. Falls E-Mail-Bestätigung aktiv ist: E-Mail bestätigen, dann anmelden.';
  setSession(d,username); setDirty(true); await cloudPush(); }
async function authSignIn(idOrEmail,password){ idOrEmail=(idOrEmail||'').trim();
  if(!idOrEmail||!password) throw 'Bitte E-Mail/Username und Passwort eingeben.';
  let email=idOrEmail; if(!idOrEmail.includes('@')){ email=await supaRPC('email_for_username',{uname:idOrEmail}); if(!email) throw 'Username nicht gefunden.'; }
  const r=await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const d=await r.json(); if(!r.ok) throw d.error_description||d.msg||'E-Mail/Username oder Passwort falsch.';
  setSession(d); const res=await cloudPull();
  if(res.ok && res.data) loadBlob(res.data);            // Konto hat Daten → die gelten
  else if(res.ok){ setDirty(true); await cloudPush(); } // Konto noch leer → lokale Daten übernehmen
}
// Abmelden nur, wenn nichts Ungesichertes offen ist — sonst wären die Daten weg.
async function authSignOut(){
  if(dirty && !await cloudPush()) return false;
  if(session){ try{ await fetch(`${SUPA_URL}/auth/v1/logout`,{method:'POST',headers:authHeaders(true)}); }catch(e){} }
  clearSession();
  programs=[neuerPlan('Mein Plan',seedPlans())]; sessions=[]; profile={xp:0,theme:profile.theme}; settings={rest:90}; active=null; normalizeProfile(); bindPlans();
  DB.set('programs',programs); DB.set('sessions',sessions); DB.set('profile',profile); DB.set('settings',settings); DB.set('active',null);
  setDirty(false); authMode='login'; view='home'; return true; }
// Konto löschen: erst die Daten in der Cloud, dann das Konto selbst.
// Das Konto zu entfernen kann der Browser nicht allein — dafür braucht es die
// Server-Funktion `delete_own_account` in Supabase. Fehlt sie, sind zumindest
// alle Daten weg; das sagen wir dann auch ehrlich statt Erfolg zu melden.
async function deleteAccount(){
  if(!session) return 'none';
  const uidNow=session.user.id;
  let dataGone=false, accountGone=false;
  if(await ensureToken()){
    try{ const r=await fetch(`${SUPA_URL}/rest/v1/gymlog_data?id=eq.${uidNow}`,{method:'DELETE',headers:authHeaders(true)});
      dataGone=r.ok; }catch(e){}
    try{ const r=await fetch(`${SUPA_URL}/rest/v1/rpc/delete_own_account`,{method:'POST',headers:authHeaders(true),body:'{}'});
      accountGone=r.ok; }catch(e){}
  }
  if(!dataGone && !accountGone) return 'offline';       // nichts erreicht — Konto bleibt bestehen
  clearSession();
  programs=[neuerPlan('Mein Plan',seedPlans())]; sessions=[]; profile={xp:0,theme:profile.theme}; settings={rest:90}; active=null; normalizeProfile(); bindPlans();
  DB.set('programs',programs); DB.set('sessions',sessions); DB.set('profile',profile); DB.set('settings',settings); DB.set('active',null);
  setDirty(false); authMode='login'; view='home';
  return accountGone?'full':'dataonly';
}
async function doAuth(mode){ const v=id=>{ const el=document.getElementById(id); return el?el.value:''; };
  const btn=document.querySelector('[data-act="doLogin"],[data-act="doRegister"]');
  if(btn){ btn.disabled=true; btn.textContent='Moment …'; }
  try{ if(mode==='register') await authSignUp(v('au_user'),v('au_id'),v('au_pw')); else await authSignIn(v('au_id'),v('au_pw'));
    // Nach einer Registrierung immer einrichten, beim Anmelden nur wenn noch nie geschehen.
    if(mode==='register' || !profile.onboarded) return startOnboard();
    view = active ? 'workout' : 'home'; render(); toast('Angemeldet'); }
  catch(e){ renderAuthGate(typeof e==='string'?e:'Fehler — bitte nochmal.'); } }

// ---------- Training ----------
// Aufwaermgewicht: rund 70 % des Arbeitsgewichts, auf 2,5 kg gerundet, damit es an der Stange
// auch auflegbar ist. Ohne Vorgeschichte bleibt das Feld leer.
// ⚠️ Das Runden auf 2,5 kg kann NACH OBEN gehen: bei 2 kg Arbeitsgewicht kamen 2,5 kg
// Aufwaermgewicht heraus — schwerer als der Arbeitssatz. Betrifft leichte Uebungen wie
// Seitheben. Ergibt sich kein Wert unter dem Arbeitsgewicht, bleibt das Feld lieber leer,
// als etwas Falsches vorzuschlagen. (Pruefrahmen, 22.08.2026.)
function warmKg(w){ if(!(w>0)) return ''; const v=Math.round(w*0.7/2.5)*2.5; return (v>0&&v<w)?v:''; }
// Plaene ohne eigenes warmup (alle vor dem 05.08.) folgen der Wahl aus dem Assistenten.
function planWarm(p){ return p && p.warmup!=null ? !!p.warmup : !!profile.warmup; }
function startWorkout(plan){
  // Aufwaermsatz: pro Uebung einer, vorneweg, markiert mit warm:true. Ob es ihn gibt, steht am
  // Plan (Karls Wahl im Assistenten oder im Editor).
  const warm = plan.warmup!=null ? !!plan.warmup : !!profile.warmup;
  const ex=plan.exercises.map(e=>{ const lp=lastPerf(e.name);
    // vol wandert mit ins Training — sonst zeigte die Satz-Zeile ein anderes Ziel als der Editor
    const sets=Array.from({length:e.sets||3},()=>({weight:lp&&lp.w?lp.w:'',reps:'',done:false}));
    if(warm) sets.unshift({weight:warmKg(lp&&lp.w),reps:'',done:false,warm:true});
    return {id:uid(),name:e.name,icon:e.icon,reps:e.reps,vol:e.vol,sets}; });
  active={id:uid(),date:Date.now(),planId:plan.id,planName:plan.name,currentIdx:0,exercises:ex}; save(); view='workout'; render(); }

function finishWorkout(){
  const entries=active.exercises.map(e=>({name:e.name||'Übung',icon:e.icon,sets:e.sets.filter(s=>s.done)})).filter(e=>e.sets.length);
  if(entries.length===0){ active=null; save(); toast('Verworfen (nichts erledigt)'); view='home'; render(); return; }
  const beforeL=levelFromXP(profile.xp).level, beforeRank=rankForLevel(beforeL).name;
  const gained=sessXP(entries);
  profile.xp+=gained;
  // dur = wie lange die Einheit gedauert hat. Einheiten vor dem 05.08. haben kein dur.
  // xp = was es dafuer gab. Wird gebraucht, um den Punktestand nachzufuehren, wenn die
  // Einheit spaeter im Verlauf korrigiert wird (seit 06.08.).
  sessions.push({id:active.id,date:active.date,dur:Date.now()-active.date,planName:active.planName,xp:gained,entries});
  active=null; endRest();
  const afterL=levelFromXP(profile.xp).level, afterRank=rankForLevel(afterL);
  save(); view='home';
  if(afterL>beforeL){ let extra='';
    if(afterRank.name!==beforeRank){ extra+=`<div style="margin-top:8px">Neuer Rang: <b style="color:${afterRank.color}">${esc(afterRank.name)}</b></div>`;
      if(afterRank.unlock) extra+=`<div class="tiny muted" style="margin-top:4px">Design „${THEMES[afterRank.unlock].label}" freigeschaltet — im Rang-Tab wählbar</div>`; }
    render(); showModal(`<div class="tiny muted">Level up!</div><div class="big">Level ${afterL}</div><div>+${gained} XP</div>${extra}`);
  } else { render(); toast(`Stark! +${gained} XP`); }
}

let armed={};
function confirmTwice(key,btn,label,run){ if(armed[key]){ clearTimeout(armed[key]); delete armed[key]; run(); return; }
  const old=btn.textContent; btn.dataset.old=old; btn.textContent=label; btn.style.color='#fff'; btn.style.background='var(--danger)';
  armed[key]=setTimeout(()=>{ delete armed[key]; btn.textContent=old; btn.style.color=''; btn.style.background=''; },2500); }

  if(t.dataset.setbase){ profile.theme=t.dataset.setbase; save(); applyTheme(); render(); return; }
  if(t.dataset.admin){ const [cmd,arg]=t.dataset.admin.split(':'); const cur=levelFromXP(profile.xp).level;

  if(t.dataset.delprog){ const id=t.dataset.delprog, pr=progById(id);
    if(!pr||programs.length<2) return;                       // der letzte Plan bleibt stehen
    confirmTwice('dpr'+id,t,'Plan löschen?',()=>{
      programs=programs.filter(x=>x.id!==id);
      if(profile.prog===id){ profile.prog=programs[0].id; active=null; }
      if(editProgId===id) editProgId=null;
      bindPlans(); save(); view='progs'; render(); toast('Gelöscht'); }); return; }
  if(t.dataset.editplan){ editPlanId=t.dataset.editplan; view='plan'; render(); return; }
  if(t.dataset.startplan){ startWorkout(editPlans().find(p=>p.id===t.dataset.startplan)); return; }
  if(t.dataset.opensess){ detailSessionId=t.dataset.opensess; view='session'; render(); return; }
  if(t.dataset.focusex){ active.currentIdx=+t.dataset.focusex; save(); render(); return; }
  if(t.dataset.check){ const [ei,si]=t.dataset.check.split(':').map(Number); const s=active.exercises[ei].sets[si]; s.done=!s.done;
    // Wdh werden seit dem 05.08. wieder selbst eingetippt. Nur wenn das Feld leer bleibt,
    // zählt fürs Volumen ersatzweise die untere Zahl des Zielbereichs.
    if(s.done && !(+s.reps>0)) s.reps=exRange(active.exercises[ei])[0];
    // NEU: einen Rekord in dem Moment feiern, in dem er passiert. Bisher standen
    // Rekorde nur als stille Liste im Verlauf — man erfuhr erst Tage spaeter davon,
    // dass man einen aufgestellt hat. Das ist der billigste Motivationsmoment, den
    // die App zu vergeben hat, und sie hat ihn liegen lassen.
    // ⚠️ prFor() rechnet nur ueber ABGESCHLOSSENE Einheiten, das laufende Training

    if(s.done && !s.warm){

    }
    save();
    if(s.done){ startRest(settings.rest); if(navigator.vibrate) navigator.vibrate(40); } render(); return; }
  if(t.dataset.addset!=null){ const e=active.exercises[+t.dataset.addset], last=e.sets[e.sets.length-1]||{}; e.sets.push({weight:last.weight||'',reps:last.reps||'',done:false}); save(); render(); return; }
  if(t.dataset.delset!=null){ const e=active.exercises[+t.dataset.delset]; if(e.sets.length>1){ e.sets.pop(); save(); render(); } return; }
  if(t.dataset.delex!=null){ editPlans().find(x=>x.id===editPlanId).exercises.splice(+t.dataset.delex,1); save(); render(); return; }
  const a=t.dataset.act;
  if(a==='resume'){ view='workout'; render(); }
  else if(a==='discard'){ confirmTwice('disc',t,'Wirklich verwerfen?',()=>{ active=null; save(); endRest(); render(); }); }
  // ---- Ernaehrungs-Assistent ----
  // ---- Schritte ----
  // ⚠️ Beim Einschalten wird das Grundziel neu gerechnet: der Faktor faellt von 30 auf 26,
  // sonst stuende das alte, zu hohe Ziel da UND die Schritte kaemen obendrauf — genau das

  else if(a==='schritt:an' || a==='schritt:aus'){

    k.schritte=an;

  else if(a==='schritt:setzen'){
    const el=document.getElementById('schrittInput'); if(!el) return;
    const n=Math.round(+el.value);
    if(!(n>=0) || !isFinite(n)){ toast('Keine gültige Zahl'); return; }
    if(setzeSchritte(n)){ render(); toast(n.toLocaleString('de-DE')+' Schritte = +'+kcalAusSchritten(n)+' kcal'); }
    else toast('Das sieht nicht nach Schritten aus'); }
  else if(a==='schritt:kopieren'){
    const t=schrittLinkBasis();
    // ⚠️ Zwei Wege: der moderne braucht einen sicheren Kontext, der alte tut es sonst ueberall.
    const alt=()=>{ const f=document.createElement('textarea'); f.value=t;
      f.style.position='fixed'; f.style.opacity='0'; document.body.appendChild(f);
      f.select(); try{ document.execCommand('copy'); toast('Adresse kopiert'); }

    if(navigator.clipboard && window.isSecureContext)
      navigator.clipboard.writeText(t).then(()=>toast('Adresse kopiert')).catch(alt);
    else alt(); }
  else if(a==='kob:neu'){ startKcalOb(); }
  else if(a==='kob:next'){ if(kobStep===2) kobMerkeKg();
    kobStep=Math.min(KOB_LAST,kobStep+1); renderKcalOb(); }
  else if(a==='kob:back'){ if(kobStep===2) kobMerkeKg();
    if(kobStep>0){ kobStep--; renderKcalOb(); } }
  // ⚠️ Ueberspringen setzt `setup`, sonst kaeme der Assistent beim naechsten Oeffnen wieder —
  // und „ich stell das selbst ein" waere eine Luege.
  else if(a==='kob:skip'){ kcalInit().setup=true; save(); kobDraft=null; kobErzwingen=false; render();
    toast('Kannst du jederzeit nachholen'); }
  else if(a&&a.startsWith('kob:art:')){ kobDraft.art=a.slice(8); renderKcalOb(); }
  else if(a&&a.startsWith('kob:w:')){ kobDraft.wochen=+a.slice(6); renderKcalOb(); }
  else if(a==='kob:finish'){
    const k=kcalInit(), d=kobDraft, kg=+String(d.kg).replace(',','.')||0;
    if(!(kg>0)){ toast('Ohne Gewicht geht es nicht'); return; }

    addWeight(kg);
    k.art=d.art; k.wochen=d.wochen; k.start=Date.now(); k.startKg=kg;
    k.goal=Math.round((kg*erhaltFaktor()+(ZIELE[d.art]?ZIELE[d.art].versatz:0))/50)*50;
    k.setup=true; save(); kobDraft=null; kobErzwingen=false; render();
    toast(k.goal+' kcal am Tag — los geht’s'); }
  else if(a==='ob:start'){ startOnboard(); }
  // Selbst anlegen: nichts wird gebaut und nichts ersetzt — nur der Assistent gilt als erledigt,
  // damit die untere Leiste zurückkommt. Das Volumen bleibt auf dem Standard 'high' (8–12 Wdh),
  // weil auf diesem Weg nie danach gefragt wird.
  else if(a==='ob:manual'){ profile.onboarded=true;
    save(); view='plans'; render(); toast('Du legst selbst an'); }
  else if(a==='ob:next'){ if(obStep===1&&!obDraft.days.length) obDraft.days=(OB_DEFDAYS[obDraft.n]||OB_DEFDAYS[3]).slice();
    obStep=Math.min(OB_LAST,obStep+1); renderOnboard(); }
  else if(a==='ob:back'){ if(obStep>0){ obStep--; renderOnboard(); }
    else if(obCanLeave()){ view=obReturn; render(); } }                  // frisch registriert: kein Ausstieg
  else if(a==='ob:cancel'){ if(obCanLeave()){ view=obReturn; render(); toast('Nichts geändert'); } }
  else if(a&&a.startsWith('ob:n:')){ obDraft.n=+a.slice(5); obDraft.days=(OB_DEFDAYS[obDraft.n]||OB_DEFDAYS[3]).slice(); renderOnboard(); }
  else if(a&&a.startsWith('ob:day:')){ const i=+a.slice(7), k=obDraft.days.indexOf(i);
    if(k<0) obDraft.days.push(i); else obDraft.days.splice(k,1); renderOnboard(); }
  else if(a&&a.startsWith('ob:vol:')){ obDraft.vol=a.slice(7); renderOnboard(); }
  else if(a&&a.startsWith('ob:warm:')){ obDraft.warm=a.slice(8)==='1'; renderOnboard(); }
  else if(a==='ob:finish'){ profile.days=obDraft.days.slice().sort((x,y)=>x-y); profile.vol=obDraft.vol;
    profile.warmup=!!obDraft.warm;
    profile.favs=obDraft.favs.slice(); profile.onboarded=true;
    // Neuer Trainingsplan statt Ersetzen: bestehende Plaene bleiben, der neue wird der aktuelle.
    const nm=(obDraft.name||'').trim() || splitName(obDraft.days.length);
    const prog=neuerPlan(nm, buildPlans());
    programs.push(prog); profile.prog=prog.id; bindPlans();
    active=null; save(); view='home'; render(); toast(`„${nm}" steht — viel Erfolg!`); }
  else if(a==='newplan'){ const p={id:uid(),name:'Neues Training',day:null,warmup:!!profile.warmup,exercises:[{id:uid(),name:'',sets:volSets(),reps:10,vol:profile.vol}]}; editPlans().push(p); save(); editPlanId=p.id; view='plan'; render(); }
  // sets war hier fest auf 3, waehrend der Assistent 4 gibt — jetzt beides aus volSets()
  else if(a==='addex'){ editPlans().find(x=>x.id===editPlanId).exercises.push({id:uid(),name:'',sets:volSets(),reps:10,vol:profile.vol}); save(); render(); }
  else if(a==='library'){ openLibrary(); }
  else if(a==='addweight'){ const el=document.getElementById('wInput'); const v=el?el.value.replace(',','.'):'';
    if(addWeight(v)){ render(); toast('Eingetragen'); } else toast('Bitte ein Gewicht in kg eingeben'); }
  // ---- Kalorien: Essen eintragen ----
  else if(a==='kcalgoal'){ const k=kcalInit();
    const v=prompt('Wie viele Kalorien willst du pro Tag essen?\n\n(Grober Anhalt: Körpergewicht in kg × 30. Wer abnehmen will, zieht 300–500 ab.)', k.goal||'');
    if(v!==null){ const n=Math.round(+String(v).replace(',','.'));
      k.goal = n>0 ? n : null; save(); render(); } }
  // NEU: den errechneten Vorschlag mit einem Tipp uebernehmen, statt ihn abzutippen.
  else if(a==='kcalgoalauto'){ const v=kcalVorschlagFuer(zielArt()) || kcalVorschlag();
    if(v){ kcalInit().goal=v; save(); render(); toast(v+' kcal als Tagesziel gesetzt'); } }
  // NEU: das nachgerechnete Ziel aus dem Regelkreis uebernehmen.
  else if(a==='kcalziel-uebernehmen'){ const rk=regelkreis();
    if(rk.stand==='daneben'){ kcalInit().goal=rk.neuesZiel; save(); render();
      toast('Ziel auf '+rk.neuesZiel+' kcal umgestellt'); } }
  else if(a==='setkey'){ fragKey().then(ok=>{ if(ok) toast('Schlüssel gespeichert'); render(); }); }
  else if(a==='delkey'){ confirmTwice('dk',t,'Entfernen?',()=>{ DB.set('aikey',''); render(); toast('Schlüssel entfernt'); }); }
  else if(a==='food:start'||a.startsWith('food:start:')){
    foodMz = a.startsWith('food:start:') ? a.slice(11) : '';
    foodStep='list'; foodDraft=null; foodFehler=''; view='food'; render(); }
  else if(a==='food:back'){ foodStep='list'; foodDraft=null; foodFehler=''; render(); }
  else if(a==='food:new'){ const s=document.getElementById('foodSearch');
    foodDraft=leerDraft(); foodDraft.name=s?s.value.trim():''; foodStep='new'; render(); }
  else if(a==='food:barcode'){ foodFehler=''; openScan(); }
  else if(a==='closescan'){ stopScan(); closeModal(); }
  else if(a==='scantippen'){ stopScan(); closeModal(); nummerTippen(); }
  else if(a==='food:foto'){ foodFehler=''; const fi=document.getElementById('fotoInput');
    if(fi){ fi.value=''; fi.click(); } }
  else if(a==='food:newsave'){
    const g=id=>{ const el=document.getElementById(id); return el?el.value.replace(',','.'):''; };
    const nm=(document.getElementById('nfName')||{}).value||'';
    if(!nm.trim()){ toast('Bitte einen Namen eintragen'); return; }
    const f={id:uid(), name:nm.trim().slice(0,60), marke:'',
      kcal:Math.round(+g('nfKcal')||0), p:Math.round(+g('nfP')||0),
      c:Math.round(+g('nfC')||0), f:Math.round(+g('nfF')||0),
      // NEU: den Barcode mitspeichern, falls dieser Entwurf aus einem Scan kam.
      // ⚠️ Ohne das laeuft der naechste Scan derselben Packung wieder ins Netz und
      // wieder in dieselbe Sackgasse — man legt dasselbe Produkt zweimal an.
      barcode:(foodDraft && foodDraft.barcode) || ''};
    kcalInit().foods.push(f); save();
    foodDraft={...f, basis:'g100', menge:100, quelle:f.barcode?'barcode':'eigen'}; foodStep='menge'; render();
    toast(`„${f.name}" gespeichert${f.barcode?' — Barcode gemerkt':''}`); }
  else if(a==='food:merken'){ const d=foodDraft; if(!d) return;
    kcalInit().foods.push({id:uid(), name:d.name, marke:d.marke||'',
      kcal:+d.kcal||0, p:+d.p||0, c:+d.c||0, f:+d.f||0,
      barcode:d.barcode||''});   // NEU: siehe oben
    d.quelle='eigen'; save(); render();
    toast('In deine Liste aufgenommen'+(d.barcode?' — Barcode gemerkt':'')); }
  else if(a==='food:save'){ const d=foodDraft; if(!d) return;
    const el=document.getElementById('mengeInput'); const menge=el?+el.value.replace(',','.'):d.menge;
    if(!(menge>0)){ toast('Bitte eine Menge eintragen'); return; }
    const w=addMeal(d,menge);
    foodStep='list'; foodDraft=null; view='body'; render(); toast(`+${w.kcal} kcal eingetragen`); }
  else if(a==='newprog'){ const pr=neuerPlan('Neuer Plan',[]); programs.push(pr);
    editProgId=pr.id; save(); view='plans'; render(); }
  else if(a==='importyes'){ importierePlan(); }
  else if(a==='importno'){ planImport=null; closeModal(); }
  else if(a==='export'){ exportData(); }
  else if(a==='resetall'){ confirmTwice('rst',t,'Wirklich alles löschen?',()=>{ programs=[neuerPlan('Mein Plan',seedPlans())]; sessions=[]; profile={xp:0,theme:profile.theme}; settings={rest:90}; active=null; normalizeProfile(); bindPlans(); save(); applyTheme(); view='home'; render(); toast('Zurückgesetzt'); }); }
  else if(a==='authSwitch'){ authMode=(authMode==='login')?'register':'login'; renderAuthGate(); }
  else if(a==='doLogin'){ doAuth('login'); }
  else if(a==='doRegister'){ doAuth('register'); }
  else if(a==='logout'){ confirmTwice('lo',t,'Abmelden?',()=>{ authSignOut().then(ok=>{ render();
      toast(ok?'Abgemeldet':'Kein Netz — Daten noch nicht gesichert. Später nochmal.'); }); }); }
  else if(a==='delaccount'){ confirmTwice('da',t,'Konto wirklich löschen?',()=>{ deleteAccount().then(res=>{ render();
      if(res==='full') toast('Konto und alle Daten gelöscht');
      else if(res==='dataonly') showModal('<b>Deine Daten sind gelöscht.</b><div class="tiny muted" style="margin-top:8px">Alle Trainings, Einheiten und dein Fortschritt sind weg — auch in der Cloud. Die Anmeldung selbst (E-Mail und Passwort) konnte nicht entfernt werden; melde dich beim Betreiber, wenn auch die weg soll.</div>');
      else toast('Kein Netz — nichts gelöscht. Bitte später nochmal.'); }); }); }
  else if(a==='saveplan'){ syncPlanInputs(); const p=editPlans().find(x=>x.id===editPlanId); p.exercises=p.exercises.filter(e=>e.name.trim()); if(!p.exercises.length) p.exercises.push({id:uid(),name:'Übung',sets:3,reps:10}); save(); view='home'; render(); }
  else if(a==='delplan'){ confirmTwice('dp',t,'Training löschen?',()=>{ const pr=editProg();
    pr.plans=pr.plans.filter(x=>x.id!==editPlanId); bindPlans(); save(); view='plans'; render(); }); }
  else if(a==='finish'){ finishWorkout(); }
  else if(a==='cancelworkout'){ confirmTwice('cw',t,'Training abbrechen?',()=>{ active=null; save(); endRest(); view='home'; render(); }); }
  else if(a==='sessedit'){ const s=sessions.find(x=>x.id===detailSessionId);
    if(s&&sessEdit) sessRecalc(s);        // was noch im Feld stand, ist ueber 'change' schon drin
    sessEdit=!sessEdit; render(); }
  else if(a==='backhist'){ view='history'; render(); }
  else if(a==='delsess'){ confirmTwice('ds',t,'Einheit löschen?',()=>{ sessions=sessions.filter(x=>x.id!==detailSessionId); save(); view='history'; render(); }); }
  else if(a==='closemodal'){ closeModal(); }
});

document.addEventListener('input',ev=>{ const t=ev.target;
  if(t.id==='obName'&&obDraft){ obDraft.name=t.value; return; }   // ohne Neuzeichnen mitschreiben
  if(t.id==='libSearch'){ renderLibList(t.value); return; }
  if(t.id==='foodSearch'){ renderFoodList(t.value); return; }
  // Mengen-Vorschau: nur die drei Zahlen nachziehen, nicht neu zeichnen — sonst
  // faellt der Fokus beim Tippen aus dem Feld (gleiche Falle wie im Verlauf).
  if(t.id==='mengeInput'&&foodDraft){ const m=+t.value.replace(',','.');
    foodDraft.menge=t.value; const w=draftWerte(foodDraft,m);
    const set=(sel,v)=>{ const el=document.querySelector(sel); if(el) el.textContent=v; };
    set('[data-vk]',w.kcal); set('[data-vp]',w.p); set('[data-vc]',w.c); return; }
  if(t.dataset.f&&active){ active.exercises[+t.dataset.ex].sets[+t.dataset.set][t.dataset.f]=t.value; DB.set('active',active); return; }
  // Korrektur im Verlauf: beim Tippen nur wegschreiben, nicht neu zeichnen — sonst faellt der
  // Fokus aus dem Feld. Volumen, Rekorde und XP werden beim Verlassen des Feldes nachgezogen.
  if(t.dataset.se&&view==='session'){ const [ei,si]=t.dataset.se.split(':').map(Number);
    const s=sessions.find(x=>x.id===detailSessionId);
    if(s&&s.entries[ei]&&s.entries[ei].sets[si]){ s.entries[ei].sets[si][t.dataset.sf]=t.value; DB.set('sessions',sessions); }
    return; }
  if(t.id==='progName'){ const pr=editProg(); if(pr){ pr.name=t.value.trim()||'Plan'; DB.set('programs',programs); } }
  if(t.id==='planName'){ const p=editPlans().find(x=>x.id===editPlanId); if(p){ p.name=t.value; DB.set('programs',programs); } }
  if(t.id==='restInput'){ settings.rest=Math.max(10,+t.value||90); DB.set('settings',settings); }
});
function syncPlanInputs(){ const p=editPlans().find(x=>x.id===editPlanId); if(!p) return;
  const n=document.getElementById('planName'); if(n) p.name=n.value.trim()||'Training';
  document.querySelectorAll('.ex-name').forEach(el=>p.exercises[+el.dataset.i].name=el.value);
  document.querySelectorAll('.ex-sets').forEach(el=>p.exercises[+el.dataset.i].sets=Math.max(1,+el.value||1)); }
document.addEventListener('change',ev=>{ if(view==='plan') syncPlanInputs();
  // Feld verlassen = Zahl steht fest: Volumen/Rekorde/XP nachziehen.
  // ⚠️ Hier bewusst KEIN render(): ein Neuzeichnen genau im Moment des Fokusverlusts frisst den
  // Klick, der ihn ausgeloest hat (mousedown auf ✕ → blur → neues DOM → mouseup ins Leere → kein
  // click). Stattdessen nur die eine Zahl im Kopf nachtragen.
  if(view==='session'&&ev.target.dataset&&ev.target.dataset.se){
    const s=sessions.find(x=>x.id===detailSessionId); if(!s) return;
    sessRecalc(s);
    const el=document.querySelector('[data-sessvol]'); if(el) el.textContent=volume(s.entries); } });

// Foto gewaehlt (Kamera oder Galerie) → an die KI schicken.
(function(){ const fi=document.getElementById('fotoInput'); if(!fi) return;
  fi.addEventListener('change',()=>{ const f=fi.files&&fi.files[0]; if(f) schaetzeFoto(f); }); })();

// ---------- Start ----------
applyTheme();
leseImportAusLink();      // geteilter Plan im Link? Hash gleich entfernen, Angebot kommt nach dem Login
if(active) view='workout';
else if(session && !profile.onboarded) startOnboard();   // neues Konto → erst der Assistent
// Brock auf dem Ladebildschirm auf den getragenen Rang setzen — beim allerersten Besuch
// steht dort noch der Standard-Brock aus dem Quelltext.
(function(){ const el=document.getElementById('splashMon');
  if(el && window.__splashImg) el.src = window.__splashImg; })();
// Schritte aus dem Kurzbefehl-Link uebernehmen. ⚠️ VOR render(), damit die Zahl gleich in der
// Ansicht steht — und nur bei eingeschaltetem Modus, sonst schriebe ein versehentlich
// geoeffneter Link Werte in ein Konto, das damit gar nicht rechnet.
(function(){ const n=leseSchritteAusLink();
  if(n===null) return;
  if(!schrittModus()){ toast('Schritte sind ausgeschaltet — anschalten in den Einstellungen'); return; }
  if(setzeSchritte(n)){ view='body';
    setTimeout(()=>toast(n.toLocaleString('de-DE')+' Schritte übernommen'), 400); } })();
render();                 // ohne Anmeldung erscheint hier das Login-Fenster
splashWeg();              // die Ansicht steht — der Schirm hat seine Aufgabe erfuellt
cloudSyncStart();         // im Hintergrund; ohne Netz startet die App trotzdem normal
window.addEventListener('online',()=>{ if(session&&dirty) cloudPush(); });

// Versteckte Admin-Freischaltung: 5x auf Brock auf der Startseite tippen (nur auf Karls Gerät).
// Lag früher auf dem App-Titel — den gibt es seit dem Entfernen des Kopfbereichs nicht mehr.
(function(){ let n=0,t0=0;
  document.addEventListener('click',ev=>{
    if(view!=='home' || !ev.target.closest('.mascot')) return;
    const now=Date.now(); if(now-t0>1500) n=0; t0=now; n++;
    if(n>=5){ n=0; devAdmin=!devAdmin; DB.set('devadmin',devAdmin);
      toast(devAdmin?'Admin freigeschaltet — steht unten in den Einstellungen':'Admin deaktiviert'); }
  });
})();

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
