<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Gym-Log</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- Icons: Karls Entwurf vom 23.08.2026. icon.svg zeigte das ALTE Motiv und ist
     deshalb raus - sonst steht im Browser-Tab ein anderes Bild als auf dem Homescreen. -->
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym-Log">
<!-- ⚠️ Laeuft absichtlich HIER oben, vor dem ersten Bild. Wer eine der freigespielten Paletten
     traegt, saehe beim Start sonst kurz Dunkelgrau aufblitzen: die Palette wird erst unten in
     applyTheme() gesetzt. Ein Ladebildschirm in der falschen Farbe waere genau das Aufblitzen,
     das er verhindern soll. Gelesen wird nur ein Abbild aus vier Farben und einem Bildnamen
     (geschrieben in applyTheme) — die Paletten selbst gibt es hier oben noch gar nicht.
     Fehlt der Eintrag (erster Besuch), bleibt es bei den Vorgaben aus :root und brock.png. -->
<script>
(function(){
  try {
    var f = JSON.parse(localStorage.getItem('gymlog:splash') || 'null');
    if (!f) return;
    var s = document.documentElement.style;
    if (f.bg)    s.setProperty('--bg', f.bg);
    if (f.txt)   s.setProperty('--txt', f.txt);
    if (f.muted) s.setProperty('--muted', f.muted);
    if (f.line)  s.setProperty('--line', f.line);
    if (f.card)  s.setProperty('--card', f.card);
    if (f.ok)    s.setProperty('--ok', f.ok);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m && f.bg) m.content = f.bg;
    // Brock in seinem getragenen Rang — der Ladebildschirm zeigt den eigenen Stand,
    // nicht immer den Anfaenger-Brock.
    window.__splashImg = f.img || 'brock.png';
  } catch (e) {}
})();

// ⚠️ Die harte Obergrenze. Der Ladebildschirm liegt UEBER der ganzen App — bliebe er stehen,
// waere die App gesperrt, und zwar unbedienbar, nicht nur haesslich. Der Wecker steht
// absichtlich HIER und nicht in init(): so greift er auch dann, wenn init() nie erreicht wird
// (Skriptfehler weiter unten, abgebrochener Download, kaputter Datenbestand).
// Uebernommen aus angel-log — dort ist genau das schon einmal passiert.
var SPLASH_HOECHSTENS = 5000;

// ---- Wie lange der Schirm MINDESTENS steht (23.08.2026) ----
// Karls Ansage: „der ladescreen ist zu kurz" — dasselbe wie am 08.08. bei angel-log.
// Die Oberflaeche steht nach wenigen Millisekunden, also war der Schirm weg, bevor man
// ihn gesehen hatte.
//
// ⚠️ Gezaehlt wird ab dem OEFFNEN der Seite, nicht ab dem Fertigwerden. Sonst kaeme
// die Wartezeit oben drauf und ein langsames Geraet wuerde doppelt bestraft.
//
// ⚠️ Muss unter SPLASH_HOECHSTENS liegen, sonst laufen zwei Uhren gegeneinander:
// die Obergrenze raeumte den Schirm weg, waehrend die Mindestzeit ihn noch haelt.
var SPLASH_MINDESTENS = 1800;
var splashSeit = Date.now();
setTimeout(function(){
  var s = document.getElementById('splash');
  if (s) s.classList.add('weg');
}, SPLASH_HOECHSTENS);
</script>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#222630; --line:#2b303b;
    --txt:#eef1f6; --muted:#8b93a4; --accent:#e6e9ef; --accent-ink:#12141a; --ok:#3ecf8e;
    --danger:#ff5d5d; --r:16px; --sp:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  /* ---------- Ladebildschirm ----------
     Karls Ansage vom 22.08.2026: „Ich brauche einen lade screen mit brock drauf."
     ⚠️ Er liegt ueber allem. Alles hier drin muss ohne JavaScript funktionieren, weil er
     genau dann sichtbar ist, wenn das Skript noch nicht gelaufen ist. */
  #splash{position:fixed; inset:0; z-index:9000; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px)}
  #splash{transition:opacity .3s ease, visibility 0s .3s}
  #splash.weg{opacity:0; visibility:hidden; pointer-events:none}
  #splash img{width:132px; height:132px; object-fit:contain; display:block;
    animation:splashHeb 1.6s ease-in-out infinite}
  /* Karls Entwurf vom 23.08.2026: Wortmarke oben, darunter der Satz, dann Brock.
     ⚠️ Die zwei Farben stehen als HTML da (`gym<span>-log</span>`) und nicht als
     Bild — der Ladebildschirm ist genau dann sichtbar, wenn noch nichts geladen ist. */
  #splash .titel{font-size:40px; font-weight:800; letter-spacing:-.5px; color:var(--txt);
    line-height:1}
  #splash .titel span{color:var(--ok)}
  #splash .unter{font-size:14px; color:var(--muted); margin-top:-8px}
  #splash .laedt{font-size:13px; color:var(--ok); margin-bottom:-6px}
  #splash .balken{width:132px; height:4px; border-radius:99px; background:var(--line);
    overflow:hidden; position:relative}
  #splash .balken:after{content:''; position:absolute; inset:0; width:40%; border-radius:99px;
    background:var(--ok); animation:splashLauf 1.15s ease-in-out infinite}
  @keyframes splashHeb{0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)}}
  @keyframes splashLauf{0%{left:-40%} 100%{left:100%}}
  /* ⚠️ Wer „Bewegung reduzieren" gesetzt hat, bekommt einen ruhigen Schirm statt eines
     huepfenden Monsters. Der Balken bleibt sichtbar, damit man sieht, dass etwas laeuft. */
  @media (prefers-reduced-motion:reduce){
    #splash img{animation:none}
    #splash .balken:after{animation:none; width:100%; left:0; opacity:.5}
  }

  html,body{margin:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; transition:background .25s}
  /* Kein Kopfbereich mehr — der Abstand nach oben sitzt jetzt am Body. */
  body{max-width:520px; margin:0 auto; padding:0 0 96px; padding-top:calc(env(safe-area-inset-top) + 18px)}
  h1,h2,h3{margin:0; font-weight:700}
  button{font-family:inherit; cursor:pointer; border:none; color:var(--txt)}
  input{font-family:inherit}
  .wrap{padding:0 var(--sp)}
  .theme-toggle{width:38px;height:38px;flex:0 0 38px; display:grid; place-items:center;
    background:var(--card2); border:1px solid var(--line); border-radius:11px; color:var(--muted)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin:12px 0}
  .card h2{font-size:16px; margin-bottom:4px}
  .row{display:flex; align-items:center; gap:12px}
  .between{justify-content:space-between}
  .muted{color:var(--muted)} .tiny{font-size:12px}
  .pill{font-size:11px; padding:3px 9px; border-radius:999px; background:var(--card2); color:var(--muted)}
  .btn{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    font-size:15px; font-weight:600; width:100%; text-align:center}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn.primary:active{filter:brightness(.9)}
  .btn.ghost{background:transparent}
  .btn.sm{width:auto; padding:8px 12px; font-size:13px}
  .btn.danger{color:var(--danger)}
  .iconbtn{width:40px;height:40px;flex:0 0 40px; display:grid; place-items:center;
    background:var(--card2); border:1px solid var(--line); border-radius:12px; color:var(--muted)}
  /* Knopfreihe. Ohne flex-basis + wrap passen drei Knoepfe (Auswaehlen · Bearbeiten · Loeschen)
     bei 320 px nicht nebeneinander: Flex-Elemente schrumpfen von sich aus nicht unter ihre
     Textbreite, also ragte die Reihe aus dem Bild. Jetzt rutscht der letzte notfalls nach unten. */
  .fab-row{display:flex; gap:10px; flex-wrap:wrap}
  .fab-row > .btn{flex:1 1 96px; width:auto; min-width:0}
  /* rank card */
  .rankcard{position:relative; overflow:hidden}
  .rc-body{position:relative; z-index:2}
  .spark{position:absolute; width:5px; height:5px; border-radius:99px; background:#fff;
    box-shadow:0 0 7px #fff, 0 0 13px var(--rc); opacity:.2; z-index:1; pointer-events:none;
    animation:tw 1.9s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.1; transform:scale(.5)} 50%{opacity:.95; transform:scale(1.35)}}
  .aura-1{box-shadow:0 0 18px -9px var(--rc)}
  .aura-2{box-shadow:0 0 26px -7px var(--rc); border-color:var(--rc)}
  .aura-3{box-shadow:0 0 34px -5px var(--rc); border-color:var(--rc)}
  .aura-4{border-color:var(--rc); animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 26px -6px var(--rc)} 50%{box-shadow:0 0 54px 0 var(--rc)}}
  .aura-3::after,.aura-4::after{content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);
    transform:translateX(-130%); animation:shimmer 3.6s ease-in-out infinite}
  @keyframes shimmer{0%,55%{transform:translateX(-130%)} 100%{transform:translateX(130%)}}
  .aura-2 .badge{filter:drop-shadow(0 0 8px var(--rc))}
  .aura-3 .badge{filter:drop-shadow(0 0 11px var(--rc))}
  .aura-4 .badge{filter:drop-shadow(0 0 15px var(--rc))}
  @media (prefers-reduced-motion: reduce){ .spark,.aura-4,.aura-3::after,.aura-4::after{animation:none} }
  .badge{width:44px;height:44px;flex:0 0 44px; display:grid; place-items:center}
  .xpbar{height:10px; background:var(--card2); border-radius:99px; overflow:hidden; margin:12px 0 6px}
  .xpbar > i{display:block; height:100%; background:var(--accent); border-radius:99px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center}
  .stat b{display:block; font-size:22px} .stat span{color:var(--muted); font-size:11px}
  .plan-chip{display:inline-flex; align-items:center; gap:8px}
  .dot{width:9px;height:9px;border-radius:99px;background:var(--accent)}
  /* exercise/sets */
  .ex{background:var(--card); border:1px solid var(--line); border-radius:var(--r); margin:12px 0; overflow:hidden}
  .ex.active{border-color:var(--accent)}
  .ex-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; gap:10px}
  .ex-head .name{font-size:16px; font-weight:700}
  .ex-body{padding:0 12px 12px}
  .set{display:grid; grid-template-columns:26px 1fr 1fr 46px; gap:8px; align-items:center; padding:6px 4px}
  .set .idx{color:var(--muted); font-weight:700; text-align:center; font-size:13px}
  .set input{width:100%; background:var(--card2); border:1px solid var(--line); border-radius:10px;
    color:var(--txt); padding:11px 8px; font-size:16px; text-align:center}
  .set.done input{opacity:.5}
  /* Laufzeit oben rechts im Training: soll man im Vorbeigehen ablesen koennen, deshalb gross
     und in der Akzentfarbe. tabular-nums, damit die Ziffern beim Ticken nicht springen. */
  .sessclock{text-align:right; line-height:1.1; flex:0 0 auto}
  .sessclock b{display:block; font-size:26px; font-weight:800; color:var(--ok);
    font-variant-numeric:tabular-nums; letter-spacing:.5px}
  .sessclock span{display:block; font-size:11px; color:var(--muted); margin-top:2px}
  /* Aufwaermsatz: zaehlt nicht mit, deshalb sichtbar zurueckgenommen und mit „W" statt Nummer */
  .set.warm .idx{color:var(--ok); font-size:12px}
  .set.warm input{border-style:dashed}
  .set .target{padding:11px 8px; font-size:15px; font-weight:700; text-align:center;
    color:var(--muted); border:1px dashed var(--line); border-radius:10px; white-space:nowrap}
  .set.done .target{opacity:.5}
  .ex-target{width:100%; padding:11px 8px; font-size:15px; font-weight:700; text-align:center;
    color:var(--muted); background:transparent; border:1px dashed var(--line); border-radius:10px}
  /* Ohne min-width:0 schrumpft ein Flex-Element nie unter seine Inhaltsbreite — bei 320 px
     schob das Namensfeld den Loesch-Knopf aus dem Bild. Bestand schon vor dem 05.08. */
  .ex-name{min-width:0}
  .ex-vol{display:grid; grid-template-columns:1fr 1fr; gap:6px}
  .ex-vol .chip{padding:11px 0; text-align:center; font-size:12.5px}
  .chip[disabled]{opacity:.35}
  .check{width:44px;height:42px; border-radius:10px; background:var(--card2); border:1px solid var(--line);
    display:grid; place-items:center; color:var(--muted)}
  .check.on{background:var(--ok); border-color:var(--ok); color:var(--bg)}
  .set-head{display:grid; grid-template-columns:26px 1fr 1fr 46px; gap:8px; padding:2px 4px;
    color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px}
  .set-head span{text-align:center}
  .hint{color:var(--muted); font-size:12px; padding:2px 4px 8px}
  .hint b{color:var(--txt)}
  .hint.up{color:var(--ok)} .hint.up b{color:var(--ok)}
  .field{margin:10px 0}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px}
  .field input{width:100%; background:var(--card2); border:1px solid var(--line); border-radius:12px;
    color:var(--txt); padding:13px; font-size:16px}
  /* Kalorien: Makro-Zeilen neben dem Ring, und ein Balken fuers Warten auf Barcode/KI */
  /* Mahlzeiten-Bloecke (23.08.2026, nach Karls Vorlage) */
  .mz{padding:12px 14px}
  .mz.trenn{border-top:1px solid var(--line)}
  /* Der jetzt faellige Block bekommt eine Kante statt einer Flaeche - eine gefuellte
     Zeile zwischen drei leeren sieht aus wie "ausgewaehlt", und ausgewaehlt ist hier
     nichts. Es ist ein Hinweis, keine Auswahl. */
  .mz.jetzt{box-shadow:inset 3px 0 0 var(--ok)}
  .mz-icon{font-size:22px; width:34px; height:34px; border-radius:99px; background:var(--card2);
    display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto}
  .mz-plus{width:32px; height:32px; flex:0 0 auto; border-radius:99px; cursor:pointer;
    border:1px solid var(--line); background:var(--card2); color:var(--txt);
    font-size:20px; line-height:1; display:inline-flex; align-items:center; justify-content:center}
  .mz-plus:active{transform:scale(.94)}
  .mz-eintrag{display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:6px 0 6px 44px; font-size:14px}
  .mz-eintrag + .mz-eintrag{border-top:1px solid var(--line)}

  /* Die Ess-Serie (23.08.2026). Grau, solange sie bei 0 steht — siehe flammeHTML(). */
  .flamme{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:99px;
    background:var(--card2); border:1px solid var(--line); font-size:13px; line-height:1;
    color:var(--muted); white-space:nowrap}
  .flamme span[aria-hidden]{font-size:14px; filter:grayscale(1); opacity:.55}
  .flamme b{font-weight:700}
  /* ⚠️ Zwei Zeilen mit Absicht: color-mix kann aelteres Safari nicht. Ohne die
     erste Zeile faellt der Hintergrund dort ganz weg und die aktive Flamme saehe
     aus wie die inaktive. Die zweite ueberschreibt sie, wo color-mix geht. */
  .flamme.an{color:var(--txt); border-color:transparent; background:rgba(245,158,11,.16)}
  @supports (background: color-mix(in srgb, red 10%, transparent)){
    .flamme.an{background:color-mix(in srgb, #f59e0b 16%, transparent)}
  }
  .flamme.an span[aria-hidden]{filter:none; opacity:1}
  .flamme .rek{font-size:11px; color:var(--muted); font-weight:600}
  .flamme .rek:before{content:'2'; margin-right:4px; opacity:.6}
  .makro{display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    padding:5px 0; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .makro:last-child{border-bottom:none}
  .makro b{color:var(--txt); font-size:15px}
  .ladebalken{height:6px; border-radius:99px; background:var(--card2); overflow:hidden; margin-top:12px}
  .ladebalken > i{display:block; height:100%; width:40%; border-radius:99px; background:var(--accent);
    animation:laden 1.1s ease-in-out infinite}
  @keyframes laden{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}
  @media (prefers-reduced-motion: reduce){ .ladebalken > i{animation:none; width:100%} }
  .sess{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line)}
  .sess:last-child{border-bottom:none}
  .link{color:var(--accent); background:none; font-weight:600; font-size:14px; padding:4px}
  .del-x{color:var(--muted); background:none; font-size:20px; padding:4px 8px}
  .empty{text-align:center; color:var(--muted); padding:30px 10px}
  .ex-ico{flex:0 0 auto; display:grid; place-items:center; background:var(--card2); border:1px solid var(--line); border-radius:10px; color:var(--txt)}
  .ex-move{display:flex; flex-direction:column; gap:3px; flex:0 0 auto}
  .ex-move button{background:var(--card2); border:1px solid var(--line); color:var(--txt);
    border-radius:8px; width:30px; height:23px; font-size:11px; line-height:1; padding:0}
  .ex-move button:disabled{opacity:.3}
  .mon{display:block; height:auto; animation:monbob 3.2s ease-in-out infinite}
  @keyframes monbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @media (prefers-reduced-motion: reduce){ .mon{animation:none} }
  .mascot{display:flex; align-items:center; gap:11px; margin:2px 2px 16px}
  .mascot .mon{flex:0 0 auto}
  .bubble{position:relative; background:var(--card); border:1px solid var(--line); border-radius:15px;
    padding:11px 13px; font-size:13.5px; line-height:1.55; flex:1}
  .bubble:before{content:''; position:absolute; left:-7px; top:26px; width:12px; height:12px; background:var(--card);
    border-left:1px solid var(--line); border-bottom:1px solid var(--line); transform:rotate(45deg)}
  /* Kleine Fassung: Brock sitzt direkt in der Heute-Karte, deshalb Blase auf Kartenhintergrund */
  /* Sprechblase unter Brock+Ring: ohne Zipfel, weil daneben niemand mehr steht. */
  .kcal-bubble{margin-top:12px; text-align:center}
  .kcal-bubble:before{display:none}
  .mascot.mini{gap:9px; margin:12px 0 0}
  .mascot.mini .bubble{background:var(--card2); padding:9px 12px; font-size:13px; border-radius:13px}
  .mascot.mini .bubble:before{background:var(--card2); top:17px; left:-6px; width:10px; height:10px}
  .chip{background:var(--card2); border:1px solid var(--line); color:var(--txt); border-radius:11px;
    padding:9px 12px; font-size:13px; font-weight:600}
  .chip.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .chip.big{padding:14px 0; font-size:17px; font-weight:800}
  .ob-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
  .ob-days{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .ob-days .chip{padding:11px 0; text-align:center}
  .ob-favs{display:flex; flex-wrap:wrap; gap:7px}
  .ob-favs .chip{padding:8px 11px; font-size:12.5px; font-weight:500}
  .ob-dots{display:flex; gap:6px; justify-content:center; margin:2px 0 16px}
  .ob-dots i{width:26px; height:4px; border-radius:99px; background:var(--line)}
  .ob-dots i.on{background:var(--accent)}
  .ob-opt{display:block; width:100%; text-align:left; background:var(--card2); border:1px solid var(--line);
    border-radius:14px; padding:14px; margin-bottom:10px; color:var(--txt)}
  .ob-opt.on{border-color:var(--accent)}
  .ob-opt b{display:block; font-size:15px; margin-bottom:4px}
  .ob-opt span{display:block; font-size:12.5px; color:var(--muted); line-height:1.55}
  .ob-sum > div{padding:9px 0; border-bottom:1px solid var(--line); font-size:14px}
  .ob-sum > div:last-child{border-bottom:none}
  .exa{fill:none; stroke:var(--txt); stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
  .exa .ma{stroke:var(--accent); stroke-width:4.4}
  @media (prefers-reduced-motion: reduce){ .exa animate, .exa animateTransform{display:none} }
  .lib-row{display:flex; align-items:center; gap:12px; width:100%; background:none; border:none;
    border-bottom:1px solid var(--line); padding:11px 4px; text-align:left; font-size:15px; color:var(--txt)}
  .lib-row:last-child{border-bottom:none}
  /* rank ladder + themes */
  .ladder-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line)}
  .ladder-row:last-child{border-bottom:none}
  .ladder-row.now{}
  .ladder-badge{width:30px;height:30px;flex:0 0 30px; display:grid; place-items:center; color:var(--c)}
  .theme-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .theme-cell{border:1px solid var(--line); border-radius:14px; padding:12px; position:relative; cursor:pointer}
  .theme-cell.on{border-color:var(--accent)}
  .theme-cell.locked{opacity:.55}
  .sw{display:flex; gap:5px; margin-bottom:8px}
  .sw i{width:20px;height:20px;border-radius:6px; display:block; border:1px solid rgba(255,255,255,.12)}
  .lock{position:absolute; top:10px; right:10px; color:var(--muted)}
  /* timer */
  #timerbar{position:fixed; left:0; right:0; bottom:56px; z-index:40; max-width:520px; margin:0 auto;
    padding:8px var(--sp); display:none}
  #timerbar.show{display:block}
  .timer{background:var(--card); border:1px solid var(--accent); border-radius:14px; padding:10px 12px;
    display:flex; align-items:center; gap:10px}
  .timer .time{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; min-width:70px}
  .timer .bar{flex:1; height:8px; background:var(--card2); border-radius:99px; overflow:hidden}
  .timer .bar > i{display:block; height:100%; background:var(--accent)}
  .timer .t-btn{background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:8px 9px; font-size:13px; font-weight:700}
  nav{position:fixed; left:0; right:0; bottom:0; z-index:30; max-width:520px; margin:0 auto; display:flex;
    background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1; background:none; padding:9px 0 8px; color:var(--muted); display:flex; flex-direction:column;
    align-items:center; gap:3px; font-size:11px}
  nav button.on{color:var(--accent)} nav svg{width:22px;height:22px}
  body.gate #nav, body.gate #timerbar, body.setup #nav, body.setup #timerbar{display:none}
  body.gate main, body.setup main{padding-bottom:32px}
  .gate-hero{text-align:center; margin:18px 0 22px}
  .gate-hero .big{font-size:22px; font-weight:800; margin-bottom:6px}
  .toast{position:fixed; left:50%; bottom:120px; transform:translateX(-50%); background:var(--ok); color:var(--bg);
    padding:10px 16px; border-radius:12px; font-weight:700; z-index:60; opacity:0; transition:opacity .2s;
    pointer-events:none; max-width:88%; text-align:center}
  .toast.show{opacity:1}
  .modal{position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.6); display:none;
    align-items:center; justify-content:center; padding:24px}
  .modal.show{display:flex}
  .modal-box{background:var(--card); border:1px solid var(--accent); border-radius:20px; padding:24px;
    max-width:340px; width:100%; text-align:center}
  .modal-box .big{font-size:40px; font-weight:800; margin:6px 0}

  /* ============================================================
     PC-Version (ab 900 px). Dieselbe App, nur anders angeordnet:
     die untere Leiste wandert als Seitenleiste nach links, der Inhalt
     wird breiter und liegt in zwei Spalten. Kein zweiter Quelltext —
     alles ueber Umbrueche, damit es eine App bleibt.
     ============================================================ */
  @media (min-width: 900px){
    body{max-width:none; padding:0 0 40px 232px; padding-top:32px}
    #app.wrap{max-width:980px; margin:0 auto; padding:0 32px}

    /* Untere Leiste wird zur Seitenleiste */
    nav{top:0; bottom:0; right:auto; left:0; width:232px; max-width:none; flex-direction:column;
      justify-content:flex-start; gap:4px; padding:26px 14px; border-top:none;
      border-right:1px solid var(--line)}
    nav:before{content:'Gym-Log'; display:block; font-size:17px; font-weight:800;
      color:var(--txt); padding:0 12px 18px}
    nav button{flex:0 0 auto; flex-direction:row; justify-content:flex-start; gap:12px;
      font-size:14.5px; font-weight:600; padding:11px 12px; border-radius:12px; width:100%}
    nav button.on{background:var(--card2)}
    body.gate{padding-left:0} body.setup{padding-left:0}

    /* Pausen-Timer sitzt rechts unten statt ueber der Leiste */
    #timerbar{left:auto; right:24px; bottom:24px; width:380px; max-width:none; margin:0; padding:0}

    /* Zwei Spalten: Karten fliessen nebeneinander statt endlos untereinander */
    .cols2{display:grid; grid-template-columns:1fr 1fr; gap:0 24px; align-items:start}
    .cols2 > .spanne{grid-column:1 / -1}

    /* Auf breiten Schirmen darf mehr nebeneinander */
    .grid3{grid-template-columns:repeat(3,1fr)}
    .ob-favs .chip{font-size:13px}
    .theme-grid{grid-template-columns:repeat(3,1fr)}
    .modal-box{max-width:460px}
    /* Zeiger nur dort, wo wirklich geklickt werden kann */
    .card[data-nav],.card[data-act],.lib-row,.chip,.btn,.iconbtn{cursor:pointer}
  }
  @media (min-width: 1280px){
    #app.wrap{max-width:1120px}
  }
</style>

function rankForLevel(l){ let r=RANKS[0]; for(const x of RANKS) if(l>=x.min) r=x; return r; }
function nextRank(l){ for(const x of RANKS) if(x.min>l) return x; return null; }
function unlockedThemes(level){ const s=new Set(['dark','light']); if(settings.devUnlockAll){ Object.keys(THEMES).forEach(k=>s.add(k)); return s; } RANKS.forEach(r=>{ if(r.unlock && level>=r.min) s.add(r.unlock); }); return s; }

   Ergänzung folgt dahinter. Wer sucht, findet ohnehin alles — die Auswahl hat ein
   Suchfeld. Wer nur blättert, sieht zuerst das Geläufige. */
EXLIB_WGER.forEach(([name, icon, reps]) => EXLIB.push({name, icon, reps}));

function guessIcon(name){ const n=(name||'').toLowerCase();
  if(/kniebeug|beinpress|ausfall|wade|kreuzheb|squat|bein|leg/.test(n)) return 'legs';
  if(/laufband|rudergerät|cardio|fahrrad|lauf|bike|ergo/.test(n)) return 'cardio';
  if(/klimmzug|latzug|lat|klimm|rudern|row|ruder/.test(n)) return 'pull';
  if(/schulter|seitheb|overhead/.test(n)) return 'shoulder';
  if(/curl|bizeps|hammer|trizeps|dip/.test(n)) return 'dumbbell';
  if(/crunch|plank|bauch|core|beinheb|situp/.test(n)) return 'core';
  if(/bank|brust|liege|butterfly|chest|drück/.test(n)) return 'press';
  return 'dumbbell';
}

// Für selbst angelegte Übungen: aus dem Namen raten
function guessMove(name){ const n=(name||'').toLowerCase();
  // ⚠️ Umlaut-Falle: „Klimmzüge" enthaelt NICHT „klimmzug", und „Überzüge" nicht „überzug".
  // Bis zum 22.08.2026 landeten beide bei der neutralen Hantel, sobald jemand sie als eigene
  // Uebung anlegte. Bei den hinterlegten Uebungen fiel es nie auf, weil dort EXMOVE zuerst
  // greift. Gefunden hat es der Pruefrahmen beim allerersten Lauf.
  if(/klimmz[uü]g|pull-?up/.test(n)) return 'pullup';
  if(/latzug|pulldown|überz[uü]g|pullover/.test(n)) return 'pulldown';
  if(/rudern|row|face pull/.test(n)) return 'row';
  if(/liegestütz|push-?up|burpee/.test(n)) return 'pushup';
  if(/dips?\b/.test(n)) return 'dip';
  if(/butterfly|fliegende|flye|pec deck/.test(n)) return 'flye';
  if(/schrägbank|incline|schrägdrück/.test(n)) return 'press_inc';
  if(/negativbank|decline/.test(n)) return 'press_dec';
  if(/bank|brustpresse|bench/.test(n)) return 'press_flat';
  if(/shrug|nackenheben|aufrechtes rudern/.test(n)) return 'shrug';
  if(/seitheb|lateral/.test(n)) return 'lateral';
  if(/fronthe/.test(n)) return 'front_raise';
  if(/schulterdrück|overhead|arnold|military/.test(n)) return 'ohp';
  if(/trizeps|stirndrück|french|kickback|pushdown/.test(n)) return 'pushdown';
  if(/curl|bizeps|hammer/.test(n)) return 'curl';
  if(/beinpress|leg press/.test(n)) return 'legpress';
  if(/beinstreck|leg ext/.test(n)) return 'legext';
  if(/beinbeug|leg curl|hamstring/.test(n)) return 'legcurl';
  if(/wade|calf/.test(n)) return 'calf';
  if(/kreuzheb|deadlift|swing|hyperext|rückenstreck|good morning/.test(n)) return 'deadlift';
  if(/hip thrust|glute bridge|beckenheb/.test(n)) return 'hipthrust';
  if(/kniebeug|squat|ausfall|lunge|step-?up|wall sit/.test(n)) return 'squat';
  if(/plank|unterarmstütz|mountain|rollout|ab-?wheel/.test(n)) return 'plank';
  if(/twist|seitlich/.test(n)) return 'twist';
  if(/crunch|sit-?up|bauch|beinheb/.test(n)) return 'crunch';
  if(/seilspring|rope/.test(n)) return 'rope';
  if(/fahrrad|ergo|bike|rad/.test(n)) return 'bike';
  if(/lauf|sprint|cross|stepper|cardio/.test(n)) return 'run';
  // Nichts erkannt → neutrale Hantel. Vorher stand hier 'curl', also machte jede unbekannte
  // Uebung Bizeps-Curls; bei eigenen Uebungen war das fast immer falsch.
  return 'dumbbell';
}
function iconTile(name,stored,size){ size=size||44;
  const mv=EXANIM[EXMOVE[name]||guessMove(name)]||EXANIM.dumbbell;

function fmtClock(ms){ const t=Math.max(0,Math.floor(ms/1000)), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  return (h?h+':'+String(m).padStart(2,'0'):String(m))+':'+String(s).padStart(2,'0'); }

// nicht beim Rekord und vor allem nicht bei der Steigerung — sonst zoege der leichte erste Satz

function arbeit(sets){ return (sets||[]).filter(s=>!s.warm); }

  if(e){ const d=arbeit(e.sets).filter(s=>s.done&&(+s.weight||+s.reps)); if(d.length){ const b=d[d.length-1]; return {w:+b.weight||0,r:+b.reps||0}; } } } return null; }
// ---------- Steigerung vorschlagen ----------
// Letztes Mal jeden Satz abgehakt → mehr Gewicht. Sonst dasselbe nochmal.
function lastEntry(name){ for(let i=sessions.length-1;i>=0;i--){
  const e=sessions[i].entries.find(x=>x.name===name);
  if(e){ const s=arbeit(e.sets); if(s.length) return {name:e.name, sets:s}; } } return null; }
function stepFor(name){ const n=(name||'').toLowerCase();
  return /kniebeug|squat|kreuzheb|deadlift|beinpress|hack squat|hip thrust|langhantelrudern|beinbeuger|beinstrecker/.test(n) ? 5 : 2.5; }
function fmtKg(v){ return (Math.round(v*10)/10).toString().replace('.',','); }
// Ab wie vielen Wiederholungen mehr Gewicht drankommt. Karls Vorgabe vom 05.08.:
// bei wenig Volumen ueber 10, bei viel Volumen ueber 14. Bewusst ueber dem Zielbereich
// (6–10 bzw. 8–12) — wer den oberen Rand nur trifft, bleibt beim Gewicht.
function repGoal(ex){ return volOf(ex)==='low' ? 10 : 14; }
// ex = die Uebung im laufenden Training; ihr Ziel schlaegt die globale Wahl
function suggest(name,ex){
  const e=lastEntry(name); if(!e) return null;
  const done=e.sets.filter(s=>s.done); if(!done.length) return null;
  const w=Math.max(...done.map(s=>+s.weight||0));
  const alle=done.length===e.sets.length;         // jeder Satz abgehakt
  const [lo,hi]=exRange(ex), grenze=repGoal(ex);
  // Die schwaechste Wiederholungszahl entscheidet: hochgehen erst, wenn JEDER Satz drueber lag.
  // Ein einzelner guter Satz soll das Gewicht nicht hochziehen.
  const minWdh=Math.min.apply(null,done.map(s=>+s.reps||0));
  const drueber=alle && minWdh>grenze;
  if(w>0){
    if(drueber){ const nw=w+stepFor(name);
      return {w:nw, up:true, text:`Heute <b>${fmtKg(nw)} kg</b> — letztes Mal ${minWdh} Wdh bei ${fmtKg(w)} kg, also über ${grenze}`}; }
    if(!alle) return {w:w, up:false, text:`Nochmal <b>${fmtKg(w)} kg</b> — letztes Mal ${done.length} von ${e.sets.length} Sätzen`};
    return {w:w, up:false, text:`Nochmal <b>${fmtKg(w)} kg</b> — mehr Gewicht, sobald jeder Satz über <b>${grenze} Wdh</b> liegt`};
  }
  // Ohne Hantel (Klimmzuege & Co.) gibt es kein Gewicht zum Draufpacken
  if(drueber) return {up:true, text:`Letztes Mal ${minWdh} Wdh — heute schwerer machen, z.B. mit Zusatzgewicht`};
  return {up:false, text:`Ziel <b>${lo}–${hi} Wdh</b> — letztes Mal ${alle?`${minWdh} Wdh`:`${done.length} von ${e.sets.length} Sätzen`}`};
}
function prFor(name){ let best=0,rep=0; sessions.forEach(s=>s.entries.forEach(e=>{ if(e.name===name) arbeit(e.sets).forEach(st=>{ if(st.done&&+st.weight>best){ best=+st.weight; rep=+st.reps||0; } }); })); return best?{w:best,r:rep}:null; }

  // im Assistenten steckt — sonst laege das Fenster ueber der Pflicht-Einrichtung.
  if(planImport && !importGezeigt && view!=='onboard'){ importGezeigt=true;
    // Ein unerwartetes Format darf nicht die ganze Ansicht mitreissen.
    if(planImport && Array.isArray(planImport.p) && planImport.p.length){ try{ zeigeImport(); }catch(e){ planImport=null; } }
    else planImport=null; } }

let sessClock=null;
function paintSessionTime(){
  const els=document.querySelectorAll('[data-sesstime]');
  if(!els.length) return;
  const t=active?fmtClock(Date.now()-active.date):'';
  els.forEach(el=>{ el.textContent=t; });
}
function syncSessionClock(){
  const braucht=!!active && !!document.querySelector('[data-sesstime]');
  if(braucht){ paintSessionTime(); if(!sessClock) sessClock=setInterval(paintSessionTime,1000); }
  else if(sessClock){ clearInterval(sessClock); sessClock=null; }
}

/* NEU (22.08.2026): die Serie — wie viele Wochen am Stueck wurde trainiert?

   💡 Warum Wochen und nicht Tage: eine Tagesserie reisst bei jedem Ruhetag, und
   Ruhetage GEHOEREN zum Plan. Eine Wochenserie misst das, worauf es ankommt —
   dranbleiben, nicht taeglich schuften.

   ⚠️ Karls Restlisten-Punkt 4 („XP soll Dranbleiben staerker belohnen") ist
   ZURUECKGESTELLT. Das hier fasst XP bewusst NICHT an: es zeigt die Serie nur an.
   Der XP-Umbau bleibt seine Entscheidung.                                        */
function wochenStart(ts){
  const d=new Date(ts); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+6)%7));   // zurueck auf Montag
  return d.getTime();
}
function wochenSerie(){
  if(!sessions.length) return 0;
  const wochen=new Set(sessions.map(s=>wochenStart(s.date)));
  let n=0, d=new Date(wochenStart(Date.now()));
  // ⚠️ Die laufende Woche zaehlt nur mit, wenn darin schon trainiert wurde. Sonst
  // waere die Serie jeden Montagmorgen gerissen, obwohl noch nichts versaeumt ist.
  if(!wochen.has(d.getTime())) d.setDate(d.getDate()-7);
  while(wochen.has(d.getTime())){ n++; d.setDate(d.getDate()-7); }
  return n;
}
/* NEU (22.08.2026): das Trainingsjahr als Raster.

   💡 Die Idee: die Serie sagt „5 Wochen am Stück" — eine Zahl. Das Raster ZEIGT es.
   Ein Jahr, 53 Spalten zu je sieben Tagen, jeder Trainingstag ein heller Fleck.
   Man sieht Urlaube, Durchhänger und gute Phasen auf einen Blick, ohne eine
   einzige Zahl zu lesen.

   ⚠️ Die Helligkeit haengt am VOLUMEN des Tages, nicht nur an „trainiert ja/nein" —
   sonst sehen ein Zehn-Minuten-Durchlauf und eine schwere Einheit gleich aus.     */
function jahresRaster(){
  if(!sessions.length) return '';
  // Volumen je Tag einsammeln
  const proTag=new Map();
  sessions.forEach(s=>{
    const d=new Date(s.date); d.setHours(0,0,0,0);
    const k=d.getTime();
    proTag.set(k,(proTag.get(k)||0)+volume(s.entries||[]));
  });
  const werte=[...proTag.values()].filter(v=>v>0).sort((a,b)=>a-b);
  // Schwellen ueber die eigenen Einheiten, nicht ueber feste Zahlen — 3000 kg sind
  // fuer den einen viel und fuer den anderen wenig.
  const q=p=>werte.length?werte[Math.min(werte.length-1,Math.floor(werte.length*p))]:0;
  const s1=q(0.33), s2=q(0.66);
  const stufe=v=>!v?0:v<=s1?1:v<=s2?2:3;
  // ⚠️ NICHT --accent: das ist im dunklen Design fast weiss, und ein Raster aus
  // weissen Kaestchen liest sich wie ein Fehler, nicht wie Fortschritt. --ok ist
  // das Gruen, das der Kalorienring schon benutzt — dieselbe Bedeutung, dieselbe Farbe.
  const farben=['var(--card2)','color-mix(in srgb, var(--ok) 28%, var(--card2))',
                'color-mix(in srgb, var(--ok) 58%, var(--card2))','var(--ok)'];

  // 53 Wochen zurueck, immer bei Montag beginnend
  const heute=new Date(); heute.setHours(0,0,0,0);
  const ende=new Date(wochenStart(heute.getTime()));
  const start=new Date(ende); start.setDate(start.getDate()-52*7);

  let spalten='', monate='', letzterMonat=-1;
  const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  for(let w=0; w<=52; w++){
    const wochenTag=new Date(start); wochenTag.setDate(wochenTag.getDate()+w*7);
    // Monatsbeschriftung nur beim Wechsel, sonst wird es Brei
    const m=wochenTag.getMonth();
    monate+=`<div style="width:11px;font-size:9px;color:var(--muted);white-space:nowrap">${
      m!==letzterMonat && wochenTag.getDate()<=7 ? MON[m] : ''}</div>`;
    if(m!==letzterMonat && wochenTag.getDate()<=7) letzterMonat=m;

    let zellen='';
    for(let d=0; d<7; d++){
      const tag=new Date(wochenTag); tag.setDate(tag.getDate()+d);
      const zukunft=tag.getTime()>heute.getTime();
      const v=proTag.get(tag.getTime())||0;
      zellen+=`<div title="${tag.toLocaleDateString('de-DE')}${v?' · '+v+' kg':''}"
        style="width:11px;height:11px;border-radius:3px;background:${
          zukunft?'transparent':farben[stufe(v)]};${zukunft?'':'box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)'}"></div>`;
    }
    spalten+=`<div style="display:grid;grid-template-rows:repeat(7,11px);gap:3px">${zellen}</div>`;
  }

  const tage=[...proTag.keys()].filter(k=>proTag.get(k)>0).length;
  return `<div class="row between" style="margin:22px 4px 6px"><h2>Dein Jahr</h2>
      <span class="tiny muted">${tage} ${tage===1?'Tag':'Tage'} trainiert</span></div>
    <div class="card" style="padding:12px 10px">
      <div style="overflow-x:auto">
        <div style="display:inline-block;min-width:100%">
          <div style="display:grid;grid-auto-flow:column;gap:3px;margin-bottom:3px">${monate}</div>
          <div style="display:grid;grid-auto-flow:column;gap:3px">${spalten}</div>
        </div>
      </div>
      <div class="row" style="gap:6px;align-items:center;margin-top:10px;justify-content:flex-end">
        <span class="tiny muted">wenig</span>
        ${farben.map(f=>`<div style="width:11px;height:11px;border-radius:3px;background:${f}"></div>`).join('')}
        <span class="tiny muted">viel</span></div>
    </div>`;
}
function sessionsOn(ts){ return sessions.filter(s=>sameDay(s.date,ts)); }
function trainedToday(){ return sessionsOn(Date.now()).length>0; }
function missedYesterday(){ const y=Date.now()-864e5, d=(new Date(y).getDay()+6)%7;
  return plans.some(p=>p.day===d) && sessionsOn(y).length===0; }
function brockSay(){
  const key = active ? 'running' : trainedToday() ? 'done' : missedYesterday() ? 'missed'
            : planForToday() ? 'todo' : 'rest';
  const list=BROCK_SAY[key];
  // Über den Tag stabil — der Spruch springt nicht bei jedem Antippen.
  return list[Math.floor(Date.now()/864e5)%list.length];
}

// ---------- Verlauf einer einzelnen Übung ----------
function exHistory(name){ const out=[];
  sessions.forEach(s=>{ const e=s.entries.find(x=>x.name===name); if(!e) return;
    const d=e.sets.filter(x=>x.done); if(!d.length) return;
    out.push({ date:s.date, w:Math.max(...d.map(x=>+x.weight||0)),
      vol:d.reduce((a,x)=>a+(+x.weight||0)*(+x.reps||0),0), sets:d.length,
      reps:d.reduce((a,x)=>a+(+x.reps||0),0) }); });
  return out; }
function lineChart(vals,w,h){
  if(vals.length<2) return '';
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1, pad=10;
  const pt=(v,i)=>[ pad+(w-2*pad)*i/(vals.length-1), h-pad-(h-2*pad)*((v-min)/span) ];
  const ps=vals.map(pt);
  const line=ps.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${ps[ps.length-1][0].toFixed(1)} ${h-pad} L${ps[0][0].toFixed(1)} ${h-pad} Z`;
  const dots=ps.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="var(--accent)"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block">
    <path d="${area}" fill="var(--accent)" opacity=".13"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}</svg>`;
}

// ---------- Eine Einheit im Verlauf ----------
// Seit dem 06.08. laesst sich eine abgeschlossene Einheit nachtraeglich geradebiegen (Karls
// Ansage). Vorher gab es nur „loeschen" — ein Tippfehler bei kg (100 statt 10) verzog Rekorde,
// Volumen und Kurven dauerhaft, und der einzige Ausweg war, die ganze Einheit wegzuwerfen.
let sessEdit=false;
// XP nachfuehren. Moeglich nur, wenn beim Beenden festgehalten wurde, wie viel es dafuer gab —
// Einheiten von vor dem 06.08. haben kein s.xp, dort bleibt der Punktestand unangetastet
// (lieber ein alter Wert stehen als ein geratener abgezogen).
function sessXP(en){ return doneSets(en)*10 + 50 + Math.floor(volume(en)/1000)*20; }
function sessRecalc(s){
  if(typeof s.xp==='number'){ const neu=sessXP(s.entries);
    profile.xp=Math.max(0, profile.xp + (neu - s.xp)); s.xp=neu; }
  save();
}

  const s=sessions.find(x=>x.id===detailSessionId); if(!s){ view='history'; return render(); }
  const dauer=fmtDauer(s.dur);
  let h=`<button class="link" data-act="backhist">‹ Verlauf</button>
    <div class="row between" style="margin:6px 4px 4px"><h2>${esc(s.planName)}</h2>

  if(sessEdit) h+=`<div class="tiny muted" style="margin:0 4px 12px">kg und Wdh lassen sich ändern, ✕ wirft einen Satz raus.
    Volumen, Rekorde, Kurven und XP rechnen sich danach neu.</div>`;
  let leer=true;
  s.entries.forEach((e,ei)=>{ const d=e.sets.filter(x=>x.done); if(!d.length && !sessEdit) return;
    leer=false;
    h+=`<div class="card"><div class="row between"><div class="row" style="gap:10px">${iconTile(e.name,e.icon,40)}<b>${esc(e.name)}</b></div>
      ${sessEdit?`<button class="del-x" data-sdelex="${ei}" aria-label="Übung aus der Einheit entfernen">✕</button>`:''}</div>
      <div style="margin-top:8px">`;
    if(sessEdit) h+=`<div class="set-head" style="grid-template-columns:1fr 66px 66px 32px">
      <span style="text-align:left"></span><span>kg</span><span>Wdh</span><span></span></div>`;
    let nr=0;
    e.sets.forEach((st,si)=>{ if(!st.done) return; if(!st.warm) nr++;
      // Aufwaermsaetze zaehlen nirgends mit — sie hier als „Satz 1" auszugeben, war irrefuehrend.
      const label=st.warm?'Aufwärmen':'Satz '+nr;
      if(sessEdit){ h+=`<div class="set ${st.warm?'warm':''}" style="grid-template-columns:1fr 66px 66px 32px;padding:5px 2px">
        <span class="muted tiny" style="text-align:left">${label}</span>
        <input type="number" inputmode="decimal" step="0.5" min="0" value="${st.weight??''}" data-se="${ei}:${si}" data-sf="weight" aria-label="Gewicht in kg">
        <input type="number" inputmode="numeric" step="1" min="0" value="${st.reps??''}" data-se="${ei}:${si}" data-sf="reps" aria-label="Wiederholungen">
        <button class="del-x" style="padding:4px 2px" data-sdel="${ei}:${si}" aria-label="Satz löschen">✕</button></div>`; }
      else h+=`<div class="sess"><span class="muted">${label}</span><b>${st.weight||0} kg × ${st.reps||0}</b></div>`;

  if(leer) h+=`<div class="empty">In dieser Einheit steht nichts mehr.<br>Du kannst sie unten löschen.</div>`;
  h+=`<button class="btn danger" data-act="delsess" style="margin-top:12px">Einheit löschen</button>`;
  app.innerHTML=h;
}

// ---------- Kalorien ----------
// Der Tab hiess bis zum 06.08. „Körper" und hielt nur das Gewicht. Jetzt sitzt hier der
// Ernaehrungs-Teil (Karls Ansage): Tagesziel, was heute gegessen wurde, und drei Wege,
// etwas einzutragen — eigene Liste, Barcode, Foto. Das Gewicht bleibt darunter stehen.
//
// Datenmodell (alles in profile.kcal, wandert damit ueber Sync und Backup mit):
//   goal   Tagesziel in kcal (null = noch nicht gesetzt)
//   foods  eigene Lebensmittel [{id,name,marke,kcal,p,c,f}] — Werte immer je 100 g
//   meals  Eintraege [{id,date,name,menge,kcal,p,c,f,quelle}] — Werte schon ausgerechnet,
//          damit ein spaeter geaendertes Lebensmittel die Vergangenheit nicht umschreibt.
function kcalInit(){
  if(!profile.kcal || typeof profile.kcal!=='object') profile.kcal={};
  const k=profile.kcal;
  if(!(k.goal>0)) k.goal=k.goal===0?0:null;
  if(!Array.isArray(k.foods)) k.foods=[];
  if(!Array.isArray(k.meals)) k.meals=[];
  return k;
}
function mealsToday(){ const n=Date.now(); return kcalInit().meals.filter(m=>sameDay(m.date,n)); }

/* ============================================================================
   Mahlzeiten (23.08.2026) — nach Karls Vorlage aus Discord.
   Vorher war der Tag EINE flache Liste; jetzt vier Bloecke mit eigenem Ziel.

   💡 Die Anteile stammen aus Karls Bild, nicht aus dem Lehrbuch: dort stehen
   1.113 / 1.484 / 927 / 185 kcal bei 3.709 kcal Tagesziel — also 30 / 40 / 25 / 5 %.

   ⚠️ BESTANDSDATEN haben kein `mz`-Feld. Sie werden NICHT auf "Snacks" geworfen,
   sondern aus ihrer Uhrzeit erschlossen (`mahlzeitVon`). Ein pauschaler Sammeltopf
   haette jeden alten Eintrag falsch einsortiert und die Bloecke von Tag eins an
   unbrauchbar gemacht. Die Uhrzeit steht in jedem Eintrag — sie ist die beste
   Auskunft, die es rueckwirkend gibt.                                              */
const MAHLZEITEN = [
  { id:'f', name:'Frühstück',   icon:'☕', anteil:0.30, von:4,  bis:11 },
  { id:'m', name:'Mittagessen', icon:'🍝', anteil:0.40, von:11, bis:16 },
  { id:'a', name:'Abendessen',  icon:'🥗', anteil:0.25, von:16, bis:22 },
  { id:'s', name:'Snacks',      icon:'🍎', anteil:0.05, von:22, bis:4  },
];
/* Welche Mahlzeit gehoert zu dieser Stunde? Snacks umschliessen Mitternacht,
   deshalb die Fallunterscheidung statt eines einfachen Vergleichs. */
function mahlzeitAusStunde(std){
  for(const mz of MAHLZEITEN){
    if(mz.von < mz.bis){ if(std >= mz.von && std < mz.bis) return mz.id; }
    else               { if(std >= mz.von || std < mz.bis) return mz.id; }
  }
  return 's';
}
function mahlzeitVon(m){
  if(m && m.mz && MAHLZEITEN.some(x=>x.id===m.mz)) return m.mz;
  return mahlzeitAusStunde(new Date(m && m.date ? m.date : Date.now()).getHours());
}
function mahlzeitJetzt(){ return mahlzeitAusStunde(new Date().getHours()); }
/* Das Ziel eines Blocks. Haengt am TAGESziel des Tages (im Schritt-Modus beweglich),
   nicht am Grundziel — sonst zeigten die vier Bloecke zusammen etwas anderes an als
   der Ring darueber. */
function mahlzeitZiel(mzId, tagesziel){
  const mz = MAHLZEITEN.find(x=>x.id===mzId);
  return (mz && tagesziel>0) ? Math.round(tagesziel*mz.anteil) : 0;
}
function sumMeals(list){ const s={kcal:0,p:0,c:0,f:0};
  list.forEach(m=>{ s.kcal+=+m.kcal||0; s.p+=+m.p||0; s.c+=+m.c||0; s.f+=+m.f||0; });
  Object.keys(s).forEach(x=>s[x]=Math.round(s[x])); return s; }

/* NEU (23.08.2026): die Ess-Serie — wie viele TAGE am Stueck wurde mitgeschrieben?
   Karls Ansage: „Flammen beim kalorientracken streak".

   💡 Warum Tage und nicht Wochen wie beim Training: das ist bewusst anders. Beim
   Training zaehlt die Serie Wochen, weil Ruhetage zum Plan GEHOEREN — eine Tagesserie
   wuerde dort jeden Ruhetag reissen und damit etwas bestrafen, das richtig ist.
   Beim Essen gibt es keinen Ruhetag: gegessen wird jeden Tag, also ist jeder Tag
   entweder mitgeschrieben oder nicht.

   ⚠️ Der heutige Tag zaehlt nur mit, wenn schon etwas eingetragen ist — sonst
   staende die Serie jeden Morgen auf 0, obwohl noch gar nichts versaeumt ist.
   Dieselbe Falle wie bei wochenSerie(), dort schon einmal geloest.

   ⚠️ Fasst XP NICHT an. Am 22.08. wurde bewusst entschieden, fuers Essen keine XP
   zu geben — das wuerde den Rang entwerten, der zurzeit Training misst. Die Flamme
   ist eine Anzeige, keine Waehrung.                                                */
function tagStart(ts){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function essSerie(){
  const meals=kcalInit().meals||[];
  if(!meals.length) return 0;
  const tage=new Set(meals.map(m=>tagStart(m.date)));
  let n=0, d=tagStart(Date.now());
  if(!tage.has(d)) d-=864e5;          // heute noch nichts? Dann ab gestern zaehlen.
  while(tage.has(d)){ n++; d-=864e5; }
  return n;
}
/* Der laengste je erreichte Lauf — damit eine gerissene Serie nicht spurlos weg ist.
   ⚠️ Wird aus den Daten GERECHNET, nicht gespeichert: ein gespeicherter Rekord waere
   nach dem Loeschen eines Eintrags falsch und liesse sich nie wieder richtigstellen. */
function essSerieRekord(){
  const meals=kcalInit().meals||[];
  if(!meals.length) return 0;
  const tage=[...new Set(meals.map(m=>tagStart(m.date)))].sort((a,b)=>a-b);
  let best=1, lauf=1;
  for(let i=1;i<tage.length;i++){
    lauf = (tage[i]-tage[i-1]===864e5) ? lauf+1 : 1;
    if(lauf>best) best=lauf;
  }
  return best;
}

/* ============================================================================
   NEU (lokale Variante, 22.08.2026) — der Ernaehrungsteil kennt das Gewicht

   Der Kern der Idee: die App weiss beides. Sie fuehrt eine Gewichtskurve UND ein
   Essensprotokoll, hat die beiden aber nie miteinander reden lassen. Alles hier
   unten leitet aus dem Gewicht ab, was der Nutzer sonst selbst ausrechnen muesste.
   ========================================================================== */

// Ist heute ein Trainingstag? Die App weiss das laengst (Plan oder bereits trainiert),
// hat es im Ernaehrungsteil aber nie benutzt — die beiden Haelften der App kannten
// einander nicht.
function istTrainingstag(){ return !!planForToday() || trainedToday(); }

// Eiweissziel aus dem Koerpergewicht. 1,8 g je kg ist der gaengige Richtwert beim
// Krafttraining (Bereich 1,6-2,2). ⚠️ Ohne eingetragenes Gewicht gibt es KEIN Ziel —
// geraten wird nicht, dann steht dort ein Hinweis statt einer Zahl.
// 💡 An Trainingstagen 2,0 g statt 1,8 g je kg — an dem Tag, an dem der Reiz gesetzt
// wird, ist der Baustoff am wichtigsten.
function eiweissZiel(){
  const w=lastWeight(); if(!w) return null;
  return Math.round(w.kg*(istTrainingstag()?2.0:1.8));
}

// Kalorien-Vorschlag aus dem Koerpergewicht. Anhalt kg x 30, auf 50 gerundet —
// dieselbe Faustregel, die bisher nur als Text im Eingabefenster stand. Sie dort
// hinzuschreiben und den Nutzer rechnen zu lassen, war der halbe Weg.
function kcalVorschlag(){ const w=lastWeight(); return w ? Math.round(w.kg*30/50)*50 : null; }

function mealsOn(ts){ return kcalInit().meals.filter(m=>sameDay(m.date,ts)); }

// Schnitt der letzten `tage` Tage — aber NUR ueber Tage, an denen etwas eingetragen
// wurde. ⚠️ Wichtig: Tage ohne Eintrag als 0 kcal zu zaehlen wuerde den Schnitt
// beliebig nach unten druecken und aus "nicht protokolliert" ein "nichts gegessen"
// machen. Das ist der haeufigste Rechenfehler in solchen Apps.
function kcalSchnitt(tage){
  const n=Date.now(); let summe=0, mitEintrag=0;
  for(let i=0;i<tage;i++){
    const liste=mealsOn(n-i*864e5);
    if(liste.length){ summe+=sumMeals(liste).kcal; mitEintrag++; }
  }
  return mitEintrag ? {schnitt:Math.round(summe/mitEintrag), tage:mitEintrag} : null;
}

// Die zuletzt gegessenen Sachen, jede nur einmal — fuers Wiedereintragen mit einem Tipp.
// Der groesste Grund, warum Essensprotokolle nach einer Woche sterben, ist nicht
// Faulheit, sondern dass man dasselbe Fruehstueck jeden Tag neu zusammensucht.
function zuletztGegessen(anzahl){
  const gesehen=new Set(), out=[];
  const alle=kcalInit().meals.slice().sort((a,b)=>b.date-a.date);
  for(const m of alle){
    const key=(m.name||'')+'|'+m.menge;
    if(gesehen.has(key)) continue;
    gesehen.add(key); out.push(m);
    if(out.length>=anzahl) break;
  }
  return out;
}

// Brock im Ernaehrungsteil. Bisher kam er dort ueberhaupt nicht vor — er stand nur
// auf der Startseite und redete ausschliesslich ueber das Training.
const BROCK_ESSEN={
  'kein-ziel':[ 'Ohne Ziel ist der Ring nur ein Kreis. Sag mir, worauf du hinwillst.',
                'Setz oben ein Tagesziel — dann kann ich dir auch was dazu sagen.' ],
  leer:[ 'Noch nichts eingetragen. Der Tag ist jung, der Ring ist leer.',
         'Ich seh hier nichts. Hast du heute Luft gegessen?',
         'Leer. Trag was ein, ich guck es mir an.' ],
  wenig:[ 'Das war bis jetzt wenig. Da geht noch was.',
          'Erst ein Bruchteil. Muskeln bauen sich nicht aus Absicht.' ],
  unterwegs:[ 'Gut unterwegs. Weiter so.',
              'Läuft. Der Ring füllt sich ordentlich.',
              'Solide Zwischenbilanz.' ],
  punkt:[ 'Punktlandung. Genau das war der Plan.',
          'Ziel getroffen. Das war sauber.',
          'Auf den Punkt. Ich bin beeindruckt und zeig es nicht.' ],
  drueber:[ 'Ein bisschen drüber. Passiert, morgen wieder.',
            'Leicht über dem Ziel — kein Drama, nur eine Zahl.' ],
  'weit-drueber':[ 'Deutlich drüber heute. Ich sag nichts, ich notiere nur.',
                   'Das war ein üppiger Tag. Auch die gehören dazu.' ]
};
function brockEssenSay(kcal, ziel){
  let key;
  if(!(ziel>0)) key='kein-ziel';
  else if(!kcal) key='leer';
  else { const t=kcal/ziel;
    key = t<0.5 ? 'wenig' : t<0.95 ? 'unterwegs' : t<=1.05 ? 'punkt'
        : t<=1.25 ? 'drueber' : 'weit-drueber'; }
  const list=BROCK_ESSEN[key];
  // Ueber den Tag stabil, wie beim Training — der Spruch springt nicht bei jedem Antippen.
  return list[Math.floor(Date.now()/864e5)%list.length];
}

/* ----------------------------------------------------------------------------
   Der Regelkreis: Gewichtskurve <-> Kalorien

   ⚠️ Das ist die eigentliche Luecke der App gewesen. Sie fuehrt beide Reihen seit
   Wochen und hat sie nie miteinander reden lassen. Es braucht dafuer weder Server
   noch KI — nur Arithmetik ueber zwei Zahlenreihen, die schon da sind.
   -------------------------------------------------------------------------- */

// Was will der Nutzer ueberhaupt? Stand bisher NIRGENDS in der App - und ohne das
// ist jede Kalorienzahl geraten.
// ---------- Schritte ----------
// Karls Ansage vom 22.08.2026: „soll mit der health app verbunden werden können um schritte
// zutracken und die einrechnet."
//
// ⚠️ Gym-Log kann Apple Health NICHT selbst lesen. HealthKit gibt es nur fuer native Apps aus
// dem App Store; Safari stellt dafuer keine Schnittstelle bereit, und einen Web-Standard fuer
// Schrittzaehler gibt es ueberhaupt nicht. Der Weg laeuft deshalb ueber die Kurzbefehle-App:
// die darf Health lesen und ruft Gym-Log mit `?schritte=8432` auf. Siehe schrittHilfe() in
// den Einstellungen.
//
// ⚠️ Und der Rechenfehler, den es hier zu vermeiden gilt: der uebliche Faktor kg x 30 enthaelt
// bereits Alltagsbewegung. Wer die Schritte obendrauf rechnet, zaehlt dieselbe Bewegung
// zweimal. Karls Entscheidung vom 22.08.2026: Grundumsatz runter auf den Sitz-Wert kg x 26,
// dafuer zaehlt jeder Schritt. Das Tagesziel wird dadurch an ruhigen Tagen kleiner als vorher.
const ERHALT_SITZEND = 26;          // Grundumsatz, wenn Schritte getrennt gezaehlt werden
const ERHALT_NORMAL  = 30;          // enthaelt Alltagsbewegung schon mit drin
// kcal je Schritt und kg Koerpergewicht. Herleitung: Gehen kostet rund 0,5 kcal je kg und km,
// ein km sind rund 1250 Schritte. 0,5 / 1250 = 0,0004.
// ⚠️ Eine Faustregel, keine Physik - deshalb wird das Ergebnis gerundet und nirgends mit
// Nachkommastellen ausgewiesen.
const KCAL_JE_SCHRITT_KG = 0.0004;

function schrittModus(){ return !!kcalInit().schritte; }
// Die Adresse, die der Kurzbefehl aufruft. ⚠️ Bewusst aus location zusammengesetzt statt
// fest verdrahtet: die App laeuft auf GitHub Pages, kann aber auch lokal oder unter einer
// anderen Adresse liegen — eine eingetippte Adresse waere dort sofort falsch.
function schrittLinkBasis(){ return location.origin + location.pathname + '?schritte='; }
function erhaltFaktor(){ return schrittModus() ? ERHALT_SITZEND : ERHALT_NORMAL; }
function schrittListe(){ const k=kcalInit(); if(!Array.isArray(k.steps)) k.steps=[]; return k.steps; }
function schritteAmTag(ts){ const e=schrittListe().find(x=>sameDay(x.date,ts)); return e?e.n:0; }
function schritteHeute(){ return schritteAmTag(Date.now()); }
// Ein Eintrag pro Tag. ⚠️ Ueberschreiben statt addieren: der Kurzbefehl schickt den
// TAGESSTAND, nicht die Schritte seit dem letzten Mal. Wer hier addiert, hat nach drei
// Aufrufen das Dreifache stehen.
function setzeSchritte(n, ts){
  n=Math.round(+n); if(!(n>=0) || n>200000) return false;
  ts=ts||Date.now();
  const l=schrittListe(), i=l.findIndex(x=>sameDay(x.date,ts));
  if(i>=0) l[i]={date:ts,n}; else l.push({date:ts,n});
  l.sort((a,b)=>a.date-b.date);
  save(); return true;
}
function kcalAusSchritten(n){
  const w=lastWeight();
  if(!w || !(n>0)) return 0;
  return Math.round(n * w.kg * KCAL_JE_SCHRITT_KG);
}
// Das Ziel eines bestimmten Tages: Grundziel plus das, was an dem Tag gelaufen wurde.
// ⚠️ Ohne Schritt-Modus ist es schlicht das Grundziel - sonst wuerde das Ziel von Leuten,
// die gar keine Schritte pflegen, ploetzlich vom Zufall abhaengen.
function zielAmTag(ts){
  const k=kcalInit(); if(!(k.goal>0)) return 0;
  return schrittModus() ? k.goal + kcalAusSchritten(schritteAmTag(ts)) : k.goal;
}
function zielHeute(){ return zielAmTag(Date.now()); }

// Schritte aus dem Link uebernehmen (`?schritte=8432`), den der Kurzbefehl aufruft.
// ⚠️ Die Adresse wird danach bereinigt. Ohne das stuende die Zahl in der Adresszeile und
// jedes Neuladen - auch ein versehentliches am naechsten Tag - schriebe sie erneut ein.
function leseSchritteAusLink(){
  try{
    const p=new URLSearchParams(location.search);
    const roh=p.get('schritte'); if(roh===null) return null;
    p.delete('schritte');
    const rest=p.toString();
    history.replaceState(null,'',location.pathname+(rest?'?'+rest:'')+location.hash);
    const n=Math.round(+roh);
    if(!isFinite(n) || n<0 || n>200000) return null;
    return n;
  }catch(e){ return null; }
}

const ZIELE = {
  abnehmen: {name:'Abnehmen', proWoche:-0.5, versatz:-400, satz:'0,5 kg pro Woche runter'},
  halten:   {name:'Halten',   proWoche:0,    versatz:0,    satz:'Gewicht halten'},
  zunehmen: {name:'Aufbauen', proWoche:0.25, versatz:300,  satz:'0,25 kg pro Woche rauf'}
};
function zielArt(){ const k=kcalInit(); return ZIELE[k.art] ? k.art : null; }

// Kalorienziel aus Gewicht UND Vorhaben. Ohne Vorhaben bleibt es beim reinen Erhalt.
function kcalVorschlagFuer(art){
  const w=lastWeight(); if(!w) return null;
  // ⚠️ Der Faktor haengt am Schritt-Modus: 30 enthaelt Alltagsbewegung, 26 nicht.
  const erhalt=w.kg*erhaltFaktor(), z=ZIELE[art];
  return Math.round((erhalt + (z?z.versatz:0))/50)*50;
}

// Gewichtsentwicklung in kg pro Woche, ueber die letzten `tage` Tage.
// ⚠️ Mindestens zwei Wiegungen ueber mindestens 7 Tage - alles darunter ist
// Rauschen. Tagesschwankungen von 1 kg sind normal; wer daraus eine Woche
// hochrechnet, bekommt Unsinn heraus und richtet sein Essen danach.
function gewichtsTrend(tage){
  const grenze=Date.now()-tage*864e5;
  const w=weightList().filter(x=>x.date>=grenze);
  if(w.length<2) return null;
  const erst=w[0], letzt=w[w.length-1];
  const spanne=(letzt.date-erst.date)/864e5;
  if(spanne<7) return null;
  return { proWoche:(letzt.kg-erst.kg)/spanne*7, tage:Math.round(spanne), messungen:w.length,
           von:erst.kg, bis:letzt.kg };
}

// Die eigentliche Rueckmeldung: passt das, was auf der Waage passiert, zu dem,
// was gegessen wird und was gewollt ist? Wenn nicht - um wie viel daneben?
//
// Rechnung: rund 7000 kcal entsprechen einem Kilo Koerpermasse. Eine Abweichung
// von 1 kg/Woche sind also ~1000 kcal/Tag.
// ⚠️ Das ist eine Faustregel, keine Physik. Deshalb wird unten gerundet und ein
// Streifen von +/- 0,15 kg/Woche als "passt" behandelt, statt Nachkommastellen
// als Wahrheit zu verkaufen.
function regelkreis(){
  const art=zielArt(); if(!art) return {stand:'kein-ziel'};
  const trend=gewichtsTrend(21);
  if(!trend) return {stand:'zu-wenig-gewicht'};
  const schnitt=kcalSchnitt(14);
  if(!schnitt || schnitt.tage<4) return {stand:'zu-wenig-essen', tage:schnitt?schnitt.tage:0};

  const soll=ZIELE[art].proWoche, ist=trend.proWoche, abweichung=ist-soll;
  if(Math.abs(abweichung)<=0.15)
    return {stand:'passt', art, trend, schnitt, ist, soll};

  // kcal/Tag, um die es danebenliegt. Auf 50 gerundet - feiner ist Schein-Genauigkeit.
  const korrektur=Math.round(abweichung*1000/50)*50;
  return {stand:'daneben', art, trend, schnitt, ist, soll, korrektur,
          neuesZiel: Math.max(1200, Math.round((schnitt.schnitt-korrektur)/50)*50)};
}

// Was fehlt heute noch an Eiweiss - und was aus der EIGENEN Liste wuerde es decken?
// Die App misst bisher nur; sie sagt nie, was jetzt zu tun waere.
function eiweissTipp(bisher, ziel){
  const fehlt=ziel-bisher; if(fehlt<=0) return null;
  const k=kcalInit();
  // Nur eigene Lebensmittel (Werte je 100 g), sortiert nach Eiweiss je 100 kcal -
  // gesucht ist nicht das eiweissreichste, sondern das guenstigste.
  const kandidaten=k.foods.filter(f=>+f.p>0 && +f.kcal>0)
    .sort((a,b)=>(b.p/b.kcal)-(a.p/a.kcal));
  if(!kandidaten.length) return {fehlt, essen:null};
  const f=kandidaten[0];
  let gramm=Math.round(fehlt/(+f.p)*100/10)*10;
  // ⚠️ Deckel bei 300 g. Ohne ihn kommt bei einer grossen Luecke "800 g Magerquark"
  // heraus - rechnerisch richtig, praktisch albern, und ein Vorschlag, den niemand
  // befolgt, ist schlechter als keiner. Ueber dem Deckel sagt der Tipp ehrlich, dass
  // er die Luecke nur teilweise schliesst.
  const deckt = gramm>300 ? false : true;
  if(!deckt) gramm=300;
  const eiweiss=Math.round(+f.p*gramm/100);
  return {fehlt, essen:f, gramm, eiweiss, deckt, kcal:Math.round(+f.kcal*gramm/100)};
}

// Ein Balken in derselben Bildsprache wie der Ring. Ueber 100 % faerbt er sich,
// statt einfach stehenzubleiben — sonst sieht "genau erreicht" aus wie "weit drueber".
function zielBalken(ist, ziel, farbe){
  const teil = ziel>0 ? Math.min(1, ist/ziel) : 0;
  const drueber = ziel>0 && ist>ziel;
  return `<div style="height:8px;background:var(--card2);border-radius:99px;overflow:hidden">
    <i style="display:block;height:100%;width:${Math.round(teil*100)}%;background:${drueber?'var(--danger)':farbe}"></i></div>`;
}
// Ring fuer „heute gegessen". Reines SVG, kein Bild — passt sich jedem Design an.
function kcalRing(ist,ziel){
  const r=52, u=2*Math.PI*r, teil=ziel>0?Math.min(1.4,ist/ziel):0, drueber=teil>1;
  return `<svg viewBox="0 0 130 130" width="130" height="130" style="flex:0 0 auto">
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--card2)" stroke-width="13"/>
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="${drueber?'var(--danger)':'var(--ok)'}" stroke-width="13"
      stroke-linecap="round" stroke-dasharray="${u}" stroke-dashoffset="${u*(1-Math.min(1,teil))}"
      transform="rotate(-90 65 65)"/>
    <text x="65" y="61" text-anchor="middle" fill="var(--txt)" font-size="25" font-weight="800">${ist}</text>
    <text x="65" y="80" text-anchor="middle" fill="var(--muted)" font-size="12">${ziel>0?'von '+ziel:'kcal'}</text></svg>`;
}
// ---------- Lebensmittel waehlen / anlegen ----------
// Alle drei Wege (eigene Liste, Barcode, Foto) enden an derselben Stelle: ein foodDraft
// steht fest, und es fehlt nur noch die Menge. Deshalb eine Ansicht mit drei Schritten
// statt drei getrennter Abläufe.
// `foodMz` haelt fest, in WELCHEN Mahlzeiten-Block eingetragen wird — gesetzt vom
// Plus-Knopf des Blocks, geleert beim Verlassen. Leer heisst: nach Uhrzeit entscheiden.
let foodStep='list', foodDraft=null, foodBusy='', foodFehler='', foodMz='';
// basis 'g100' = die Werte gelten je 100 g (eigene Liste, Barcode)
// basis 'portion' = die Werte gelten fuer genau diese eine Portion (Foto)
function leerDraft(){ return {name:'',marke:'',kcal:'',p:'',c:'',f:'',basis:'g100',menge:100,quelle:'eigen'}; }
function draftWerte(d,menge){
  const faktor = d.basis==='portion' ? (+menge||1) : (+menge||0)/100;
  return { kcal:Math.round((+d.kcal||0)*faktor), p:Math.round((+d.p||0)*faktor),
           c:Math.round((+d.c||0)*faktor), f:Math.round((+d.f||0)*faktor) };
}
function addMeal(d,menge){
  const w=draftWerte(d,menge), k=kcalInit();
  // ⚠️ `foodMz` ist die im Block angetippte Mahlzeit. Ist keine gewaehlt (etwa ueber
  // den allgemeinen Knopf), entscheidet die Uhrzeit — nie ein fester Vorgabewert.
  k.meals.push({id:uid(),date:Date.now(),name:d.name||'Essen', mz: foodMz || mahlzeitJetzt(),
    menge:(+menge||0)+(d.basis==='portion'?'×':' g'), quelle:d.quelle||'eigen', ...w});
  save(); return w;
}
// ---------- Ernaehrungs-Assistent (beim allerersten Oeffnen) ----------
// Karls Ansage vom 22.08.2026: „wenn man darauf klickt wird beim aller ersten mal auch eine
// einstellung/tutorial gemacht. dh wielange will man drannbleiben und was ist das ziel etc."
//
// ⚠️ Warum ein eigener Assistent und nicht die Knoepfe im Tab: der Trainings-Teil fuehrt seit
// jeher durch die Einrichtung, der Ernaehrungs-Teil fing als leerer Ring an. Wer ihn zum ersten
// Mal aufmacht, sieht sonst eine Null und weiss nicht, woran er sie messen soll.
//
// ⚠️ Der Zeitraum ist NICHT Deko. Er macht aus einem Vorhaben eine Ansage mit Datum
// (`kcalZielDatum`) und erlaubt eine Prognose (`kcalPrognose`) — beides gibt es ohne ihn nicht.
const KOB_LAST = 4;
const KOB_SAY = [
  'Kalorien! Mein zweites Lieblingsthema. Drei Fragen, dann steht das.',
  'Erstmal: wo soll die Reise hin?',
  'Ohne dein Gewicht rate ich nur. Und Raten kann jeder.',

];

let kobStep = 0, kobDraft = null;

// Der Assistent laeuft genau einmal. Danach steht `setup` und alles ist im Tab aenderbar.
// ⚠️ Wer laengst ein Tagesziel gesetzt hat, wird NICHT nachtraeglich in den Assistenten
// geschickt — das waere eine Bevormundung fuer alle Bestandskonten. Fuer die gibt es den
// Knopf „Vorhaben ändern" im Tab.
function kcalBraucht(){ const k = kcalInit(); return kobErzwingen || (!k.setup && !(k.goal > 0)); }
// ⚠️ `kobErzwingen` ist noetig fuer „Vorhaben ändern": wer schon ein Ziel hat, faellt sonst
// durch die Pruefung oben und der Assistent kaeme gar nicht erst hoch.
let kobErzwingen = false;
// ⚠️ Aufbau und Zeichnen sind getrennt: renderBody ruft kobInit() OHNE render(), sonst
// riefe render() wieder renderBody und die Sache dreht sich im Kreis.
function kobInit(){
  const k = kcalInit(), w = lastWeight();
  kobStep = 0;
  kobDraft = { art: k.art || null, wochen: (k.wochen > 0 || k.wochen === 0) ? k.wochen : 12, kg: w ? w.kg : '' };
}
function startKcalOb(){ kobErzwingen = true; kobInit(); view = 'body'; render(); }
// Zieldatum aus Startzeitpunkt und Zeitraum. `wochen:0` heisst „offen" — dann gibt es keins.
function kcalZielDatum(){ const k = kcalInit();
  return (k.wochen > 0 && k.start) ? k.start + k.wochen * 7 * 864e5 : null; }
// In welcher Woche des Vorhabens stehen wir? 1-basiert, damit „Woche 1 von 12" stimmt.
function kcalWoche(){ const k = kcalInit();
  return k.start ? Math.floor((Date.now() - k.start) / (7 * 864e5)) + 1 : null; }
// Was am Ende herauskaeme, wenn es so laeuft wie vorgenommen.
// ⚠️ Bewusst aus dem VORHABEN gerechnet, nicht aus dem bisherigen Verlauf — es ist die Ansage,
// nicht die Vorhersage. Was wirklich passiert, sagt der Regelkreis.
function kcalPrognose(){
  const k = kcalInit(), z = ZIELE[k.art];
  if(!z || !(k.wochen > 0) || !(k.startKg > 0)) return null;
  return { kg: k.startKg + z.proWoche * k.wochen, wochen: k.wochen, von: k.startKg };
}

      <b>Ohne festes Ende</b><span>Läuft einfach mit. Dann gibt es kein Zieldatum und keine Prognose.</span></button>
    ${d.wochen > 0 ? `<div class="tiny muted" style="margin-top:12px">Das wären

  else { const z = ZIELE[d.art], kg = +String(d.kg).replace(',', '.') || 0;

  app.innerHTML = h;

/* Die Flamme (23.08.2026, Karls Ansage). Sie sitzt im Kopf des Ernaehrungs-Teils,
   weil sie genau das misst, was dort passiert: mitschreiben, jeden Tag.

   ⚠️ Bei 0 wird sie GRAU statt versteckt. Eine Anzeige, die erst ab Tag 1 auftaucht,
   erklaert sich nie — man sieht sie zum ersten Mal, wenn man sie schon hat. Grau
   heisst: es gibt sie, sie laeuft nur gerade nicht.

   ⚠️ Der Rekord steht nur daneben, wenn er GROESSER als die laufende Serie ist.
   „5 · Rekord 5" waere doppelt gemoppelt, und beim allerersten Lauf entsteht genau das. */
function flammeHTML(serie, rekord){
  const an = serie > 0;
  const titel = an
    ? `${serie} ${serie===1?'Tag':'Tage'} am Stück mitgeschrieben`
      + (rekord>serie ? ` · dein Rekord: ${rekord}` : '')
    : 'Noch keine Serie — trag heute etwas ein, dann fängt sie an.';
  return `<span class="flamme${an?' an':''}" title="${titel}">
    <span aria-hidden="true">🔥</span><b>${serie}</b>
    ${rekord>serie?`<span class="rek">${rekord}</span>`:''}</span>`;
}
function renderBody(){
  // Beim allerersten Oeffnen zuerst durch die Einrichtung (Karls Ansage vom 22.08.2026).
  if(kcalBraucht()){ if(!kobDraft) kobInit(); return renderKcalOb(); }
  const k=kcalInit(), heute=mealsToday(), s=sumMeals(heute);
  const eZiel=eiweissZiel(), vorschlag=kcalVorschlag(), schnitt=kcalSchnitt(7);

  // NEU: Brock ist jetzt auch hier. Er stand bisher nur auf der Startseite und
  // redete ausschliesslich ueber das Training — der halbe App-Charakter fehlte

  // Karls Ansage vom 22.08.2026: „brock kann gerne links neben den kalorin kreis."

  const zt = zielHeute(), schrittKcal = kcalAusSchritten(schritteHeute());

        ${schrittModus()?`<div class="makro"><span>Schritte${schrittKcal>0

          <b>${schritteHeute()?schritteHeute().toLocaleString('de-DE'):'—'}</b></div>`:''}

        ${/* NEU: Eiweiss bekommt ein echtes Ziel statt nur einer Zahl. Es ist der
              Wert, der beim Krafttraining wirklich zaehlt — und die App kann ihn
              ausrechnen, weil sie das Koerpergewicht kennt. */''}
        <div class="makro" style="border-bottom:none;padding-bottom:2px">

        ${eZiel ? zielBalken(s.p, eZiel, 'var(--accent)')
                : `<div class="tiny muted">Trag dein Gewicht ein, dann rechne ich dir das Eiweißziel aus.</div>`}
        <div class="makro" style="margin-top:8px"><span>Kohlenhydrate</span><b>${s.c} g</b></div>
        <div class="makro"><span>Fett</span><b>${s.f} g</b></div>
      </div></div>`;

  // NEU: der Zeitraum aus dem Assistenten wird sichtbar. Ohne ihn ist „12 Wochen" nur eine
  // Zahl in der Ablage — mit ihm steht in der App, in welcher Woche man ist und worauf es
  // hinauslaeuft. ⚠️ Die Prognose kommt aus dem VORHABEN, nicht aus dem Verlauf; was

  if(woche && k.wochen > 0){

      <div class="tiny muted" style="margin-top:8px">${rest > 0

           <b style="color:var(--txt)">${fmtDate(kcalZielDatum())}</b>${prog
             ? ` Vorgenommen: <b style="color:var(--txt)">${fmtKg(prog.kg)} kg</b>.` : ''}`
        : `Die ${k.wochen} Wochen sind um.${prog ? ` Vorgenommen waren <b style="color:var(--txt)">${fmtKg(prog.kg)} kg</b>.` : ''}`}</div>
      <button class="btn sm ghost link" style="margin-top:8px" data-act="kob:neu">Vorhaben ändern</button></div>`;
  } else if(zielArt()){
    h+=`<div class="row between" style="margin:10px 4px 0">
