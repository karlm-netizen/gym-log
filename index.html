<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Gym-Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym-Log">
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#222630; --line:#2b303b;
    --txt:#eef1f6; --muted:#8b93a4; --accent:#e6e9ef; --accent-ink:#12141a; --ok:#3ecf8e;
    --danger:#ff5d5d; --r:16px; --sp:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; transition:background .25s}
  /* Kein Kopfbereich mehr — der Abstand nach oben sitzt jetzt am Body. */
  body{max-width:520px; margin:0 auto; padding:0 0 96px; padding-top:calc(env(safe-area-inset-top) + 18px)}
  h1,h2,h3{margin:0; font-weight:700}
  button{font-family:inherit; cursor:pointer; border:none; color:var(--txt)}
  input{font-family:inherit}
  .wrap{padding:0 var(--sp)}
  .theme-toggle{width:38px;height:38px;flex:0 0 38px; display:grid; place-items:center;
    background:var(--card2); border:1px solid var(--line); border-radius:11px; color:var(--muted)}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin:12px 0}
  .card h2{font-size:16px; margin-bottom:4px}
  .row{display:flex; align-items:center; gap:12px}
  .between{justify-content:space-between}
  .muted{color:var(--muted)} .tiny{font-size:12px}
  .pill{font-size:11px; padding:3px 9px; border-radius:999px; background:var(--card2); color:var(--muted)}
  .btn{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    font-size:15px; font-weight:600; width:100%; text-align:center}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn.primary:active{filter:brightness(.9)}
  .btn.ghost{background:transparent}
  .btn.sm{width:auto; padding:8px 12px; font-size:13px}
  .btn.danger{color:var(--danger)}
  .iconbtn{width:40px;height:40px;flex:0 0 40px; display:grid; place-items:center;
    background:var(--card2); border:1px solid var(--line); border-radius:12px; color:var(--muted)}
  /* Knopfreihe. Ohne flex-basis + wrap passen drei Knoepfe (Auswaehlen · Bearbeiten · Loeschen)
     bei 320 px nicht nebeneinander: Flex-Elemente schrumpfen von sich aus nicht unter ihre
     Textbreite, also ragte die Reihe aus dem Bild. Jetzt rutscht der letzte notfalls nach unten. */
  .fab-row{display:flex; gap:10px; flex-wrap:wrap}
  .fab-row > .btn{flex:1 1 96px; width:auto; min-width:0}
  /* rank card */
  .rankcard{position:relative; overflow:hidden}
  .rc-body{position:relative; z-index:2}
  .spark{position:absolute; width:5px; height:5px; border-radius:99px; background:#fff;
    box-shadow:0 0 7px #fff, 0 0 13px var(--rc); opacity:.2; z-index:1; pointer-events:none;
    animation:tw 1.9s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.1; transform:scale(.5)} 50%{opacity:.95; transform:scale(1.35)}}
  .aura-1{box-shadow:0 0 18px -9px var(--rc)}
  .aura-2{box-shadow:0 0 26px -7px var(--rc); border-color:var(--rc)}
  .aura-3{box-shadow:0 0 34px -5px var(--rc); border-color:var(--rc)}
  .aura-4{border-color:var(--rc); animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 26px -6px var(--rc)} 50%{box-shadow:0 0 54px 0 var(--rc)}}
  .aura-3::after,.aura-4::after{content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);
    transform:translateX(-130%); animation:shimmer 3.6s ease-in-out infinite}
  @keyframes shimmer{0%,55%{transform:translateX(-130%)} 100%{transform:translateX(130%)}}
  .aura-2 .badge{filter:drop-shadow(0 0 8px var(--rc))}
  .aura-3 .badge{filter:drop-shadow(0 0 11px var(--rc))}
  .aura-4 .badge{filter:drop-shadow(0 0 15px var(--rc))}
  @media (prefers-reduced-motion: reduce){ .spark,.aura-4,.aura-3::after,.aura-4::after{animation:none} }
  .badge{width:44px;height:44px;flex:0 0 44px; display:grid; place-items:center}
  .xpbar{height:10px; background:var(--card2); border-radius:99px; overflow:hidden; margin:12px 0 6px}
  .xpbar > i{display:block; height:100%; background:var(--accent); border-radius:99px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center}
  .stat b{display:block; font-size:22px} .stat span{color:var(--muted); font-size:11px}
  .plan-chip{display:inline-flex; align-items:center; gap:8px}
  .dot{width:9px;height:9px;border-radius:99px;background:var(--accent)}
  /* exercise/sets */
  .ex{background:var(--card); border:1px solid var(--line); border-radius:var(--r); margin:12px 0; overflow:hidden}
  .ex.active{border-color:var(--accent)}
  .ex-head{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; gap:10px}
  .ex-head .name{font-size:16px; font-weight:700}
  .ex-body{padding:0 12px 12px}
  .set{display:grid; grid-template-columns:26px 1fr 1fr 46px; gap:8px; align-items:center; padding:6px 4px}
  .set .idx{color:var(--muted); font-weight:700; text-align:center; font-size:13px}
  .set input{width:100%; background:var(--card2); border:1px solid var(--line); border-radius:10px;
    color:var(--txt); padding:11px 8px; font-size:16px; text-align:center}
  .set.done input{opacity:.5}
  /* Laufzeit oben rechts im Training: soll man im Vorbeigehen ablesen koennen, deshalb gross
     und in der Akzentfarbe. tabular-nums, damit die Ziffern beim Ticken nicht springen. */
  .sessclock{text-align:right; line-height:1.1; flex:0 0 auto}
  .sessclock b{display:block; font-size:26px; font-weight:800; color:var(--ok);
    font-variant-numeric:tabular-nums; letter-spacing:.5px}
  .sessclock span{display:block; font-size:11px; color:var(--muted); margin-top:2px}
  /* Aufwaermsatz: zaehlt nicht mit, deshalb sichtbar zurueckgenommen und mit „W" statt Nummer */
  .set.warm .idx{color:var(--ok); font-size:12px}
  .set.warm input{border-style:dashed}
  .set .target{padding:11px 8px; font-size:15px; font-weight:700; text-align:center;
    color:var(--muted); border:1px dashed var(--line); border-radius:10px; white-space:nowrap}
  .set.done .target{opacity:.5}
  .ex-target{width:100%; padding:11px 8px; font-size:15px; font-weight:700; text-align:center;
    color:var(--muted); background:transparent; border:1px dashed var(--line); border-radius:10px}
  /* Ohne min-width:0 schrumpft ein Flex-Element nie unter seine Inhaltsbreite — bei 320 px
     schob das Namensfeld den Loesch-Knopf aus dem Bild. Bestand schon vor dem 05.08. */
  .ex-name{min-width:0}
  .ex-vol{display:grid; grid-template-columns:1fr 1fr; gap:6px}
  .ex-vol .chip{padding:11px 0; text-align:center; font-size:12.5px}
  .chip[disabled]{opacity:.35}
  .check{width:44px;height:42px; border-radius:10px; background:var(--card2); border:1px solid var(--line);
    display:grid; place-items:center; color:var(--muted)}
  .check.on{background:var(--ok); border-color:var(--ok); color:var(--bg)}
  .set-head{display:grid; grid-template-columns:26px 1fr 1fr 46px; gap:8px; padding:2px 4px;
    color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px}
  .set-head span{text-align:center}
  .hint{color:var(--muted); font-size:12px; padding:2px 4px 8px}
  .hint b{color:var(--txt)}
  .hint.up{color:var(--ok)} .hint.up b{color:var(--ok)}
  .field{margin:10px 0}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px}
  .field input{width:100%; background:var(--card2); border:1px solid var(--line); border-radius:12px;
    color:var(--txt); padding:13px; font-size:16px}
  /* Kalorien: Makro-Zeilen neben dem Ring, und ein Balken fuers Warten auf Barcode/KI */
  .makro{display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    padding:5px 0; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
  .makro:last-child{border-bottom:none}
  .makro b{color:var(--txt); font-size:15px}
  .ladebalken{height:6px; border-radius:99px; background:var(--card2); overflow:hidden; margin-top:12px}
  .ladebalken > i{display:block; height:100%; width:40%; border-radius:99px; background:var(--accent);
    animation:laden 1.1s ease-in-out infinite}
  @keyframes laden{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}
  @media (prefers-reduced-motion: reduce){ .ladebalken > i{animation:none; width:100%} }
  .sess{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line)}
  .sess:last-child{border-bottom:none}
  .link{color:var(--accent); background:none; font-weight:600; font-size:14px; padding:4px}
  .del-x{color:var(--muted); background:none; font-size:20px; padding:4px 8px}
  .empty{text-align:center; color:var(--muted); padding:30px 10px}
  .ex-ico{flex:0 0 auto; display:grid; place-items:center; background:var(--card2); border:1px solid var(--line); border-radius:10px; color:var(--txt)}
  .ex-move{display:flex; flex-direction:column; gap:3px; flex:0 0 auto}
  .ex-move button{background:var(--card2); border:1px solid var(--line); color:var(--txt);
    border-radius:8px; width:30px; height:23px; font-size:11px; line-height:1; padding:0}
  .ex-move button:disabled{opacity:.3}
  .mon{display:block; height:auto; animation:monbob 3.2s ease-in-out infinite}
  @keyframes monbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @media (prefers-reduced-motion: reduce){ .mon{animation:none} }
  .mascot{display:flex; align-items:center; gap:11px; margin:2px 2px 16px}
  .mascot .mon{flex:0 0 auto}
  .bubble{position:relative; background:var(--card); border:1px solid var(--line); border-radius:15px;
    padding:11px 13px; font-size:13.5px; line-height:1.55; flex:1}
  .bubble:before{content:''; position:absolute; left:-7px; top:26px; width:12px; height:12px; background:var(--card);
    border-left:1px solid var(--line); border-bottom:1px solid var(--line); transform:rotate(45deg)}
  /* Kleine Fassung: Brock sitzt direkt in der Heute-Karte, deshalb Blase auf Kartenhintergrund */
  .mascot.mini{gap:9px; margin:12px 0 0}
  .mascot.mini .bubble{background:var(--card2); padding:9px 12px; font-size:13px; border-radius:13px}
  .mascot.mini .bubble:before{background:var(--card2); top:17px; left:-6px; width:10px; height:10px}
  .chip{background:var(--card2); border:1px solid var(--line); color:var(--txt); border-radius:11px;
    padding:9px 12px; font-size:13px; font-weight:600}
  .chip.on{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
  .chip.big{padding:14px 0; font-size:17px; font-weight:800}
  .ob-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px}
  .ob-days{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .ob-days .chip{padding:11px 0; text-align:center}
  .ob-favs{display:flex; flex-wrap:wrap; gap:7px}
  .ob-favs .chip{padding:8px 11px; font-size:12.5px; font-weight:500}
  .ob-dots{display:flex; gap:6px; justify-content:center; margin:2px 0 16px}
  .ob-dots i{width:26px; height:4px; border-radius:99px; background:var(--line)}
  .ob-dots i.on{background:var(--accent)}
  .ob-opt{display:block; width:100%; text-align:left; background:var(--card2); border:1px solid var(--line);
    border-radius:14px; padding:14px; margin-bottom:10px; color:var(--txt)}
  .ob-opt.on{border-color:var(--accent)}
  .ob-opt b{display:block; font-size:15px; margin-bottom:4px}
  .ob-opt span{display:block; font-size:12.5px; color:var(--muted); line-height:1.55}
  .ob-sum > div{padding:9px 0; border-bottom:1px solid var(--line); font-size:14px}
  .ob-sum > div:last-child{border-bottom:none}
  .exa{fill:none; stroke:var(--txt); stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
  .exa .ma{stroke:var(--accent); stroke-width:4.4}
  @media (prefers-reduced-motion: reduce){ .exa animate, .exa animateTransform{display:none} }
  .lib-row{display:flex; align-items:center; gap:12px; width:100%; background:none; border:none;
    border-bottom:1px solid var(--line); padding:11px 4px; text-align:left; font-size:15px; color:var(--txt)}
  .lib-row:last-child{border-bottom:none}
  /* rank ladder + themes */
  .ladder-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line)}
  .ladder-row:last-child{border-bottom:none}
  .ladder-row.now{}
  .ladder-badge{width:30px;height:30px;flex:0 0 30px; display:grid; place-items:center; color:var(--c)}
  .theme-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .theme-cell{border:1px solid var(--line); border-radius:14px; padding:12px; position:relative; cursor:pointer}
  .theme-cell.on{border-color:var(--accent)}
  .theme-cell.locked{opacity:.55}
  .sw{display:flex; gap:5px; margin-bottom:8px}
  .sw i{width:20px;height:20px;border-radius:6px; display:block; border:1px solid rgba(255,255,255,.12)}
  .lock{position:absolute; top:10px; right:10px; color:var(--muted)}
  /* timer */
  #timerbar{position:fixed; left:0; right:0; bottom:56px; z-index:40; max-width:520px; margin:0 auto;
    padding:8px var(--sp); display:none}
  #timerbar.show{display:block}
  .timer{background:var(--card); border:1px solid var(--accent); border-radius:14px; padding:10px 12px;
    display:flex; align-items:center; gap:10px}
  .timer .time{font-size:24px; font-weight:800; font-variant-numeric:tabular-nums; min-width:70px}
  .timer .bar{flex:1; height:8px; background:var(--card2); border-radius:99px; overflow:hidden}
  .timer .bar > i{display:block; height:100%; background:var(--accent)}
  .timer .t-btn{background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:8px 9px; font-size:13px; font-weight:700}
  nav{position:fixed; left:0; right:0; bottom:0; z-index:30; max-width:520px; margin:0 auto; display:flex;
    background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1; background:none; padding:9px 0 8px; color:var(--muted); display:flex; flex-direction:column;
    align-items:center; gap:3px; font-size:11px}
  nav button.on{color:var(--accent)} nav svg{width:22px;height:22px}
  body.gate #nav, body.gate #timerbar, body.setup #nav, body.setup #timerbar{display:none}
  body.gate main, body.setup main{padding-bottom:32px}
  .gate-hero{text-align:center; margin:18px 0 22px}
  .gate-hero .big{font-size:22px; font-weight:800; margin-bottom:6px}
  .toast{position:fixed; left:50%; bottom:120px; transform:translateX(-50%); background:var(--ok); color:var(--bg);
    padding:10px 16px; border-radius:12px; font-weight:700; z-index:60; opacity:0; transition:opacity .2s;
    pointer-events:none; max-width:88%; text-align:center}
  .toast.show{opacity:1}
  .modal{position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.6); display:none;
    align-items:center; justify-content:center; padding:24px}
  .modal.show{display:flex}
  .modal-box{background:var(--card); border:1px solid var(--accent); border-radius:20px; padding:24px;
    max-width:340px; width:100%; text-align:center}
  .modal-box .big{font-size:40px; font-weight:800; margin:6px 0}

  /* ============================================================
     PC-Version (ab 900 px). Dieselbe App, nur anders angeordnet:
     die untere Leiste wandert als Seitenleiste nach links, der Inhalt
     wird breiter und liegt in zwei Spalten. Kein zweiter Quelltext —
     alles ueber Umbrueche, damit es eine App bleibt.
     ============================================================ */
  @media (min-width: 900px){
    body{max-width:none; padding:0 0 40px 232px; padding-top:32px}
    #app.wrap{max-width:980px; margin:0 auto; padding:0 32px}

    /* Untere Leiste wird zur Seitenleiste */
    nav{top:0; bottom:0; right:auto; left:0; width:232px; max-width:none; flex-direction:column;
      justify-content:flex-start; gap:4px; padding:26px 14px; border-top:none;
      border-right:1px solid var(--line)}
    nav:before{content:'Gym-Log'; display:block; font-size:17px; font-weight:800;
      color:var(--txt); padding:0 12px 18px}
    nav button{flex:0 0 auto; flex-direction:row; justify-content:flex-start; gap:12px;
      font-size:14.5px; font-weight:600; padding:11px 12px; border-radius:12px; width:100%}
    nav button.on{background:var(--card2)}
    body.gate{padding-left:0} body.setup{padding-left:0}

    /* Pausen-Timer sitzt rechts unten statt ueber der Leiste */
    #timerbar{left:auto; right:24px; bottom:24px; width:380px; max-width:none; margin:0; padding:0}

    /* Zwei Spalten: Karten fliessen nebeneinander statt endlos untereinander */
    .cols2{display:grid; grid-template-columns:1fr 1fr; gap:0 24px; align-items:start}
    .cols2 > .spanne{grid-column:1 / -1}

    /* Auf breiten Schirmen darf mehr nebeneinander */
    .grid3{grid-template-columns:repeat(3,1fr)}
    .ob-favs .chip{font-size:13px}
    .theme-grid{grid-template-columns:repeat(3,1fr)}
    .modal-box{max-width:460px}
    /* Zeiger nur dort, wo wirklich geklickt werden kann */
    .card[data-nav],.card[data-act],.lib-row,.chip,.btn,.iconbtn{cursor:pointer}
  }
  @media (min-width: 1280px){
    #app.wrap{max-width:1120px}
  }
</style>
</head>
<body>
<main id="app" class="wrap"></main>

<div id="timerbar"></div>

<nav id="nav">
  <button data-nav="home" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 7.5v9M17.5 7.5v9M3.5 10v4M20.5 10v4M6.5 12h11"/></svg>Trainieren</button>
  <button data-nav="body">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.7c3.4 3.3 5.3 5.8 5.3 9a5.3 5.3 0 0 1-10.6 0c0-1.9.7-3.3 1.9-4.7.2 1.3.8 2.1 1.7 2.5.6-2.7-.6-4.9 1.7-6.8z"/></svg>Kalorien</button>
  <button data-nav="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Einstellungen</button>
</nav>

<div id="toast" class="toast"></div>
<div id="modal" class="modal"></div>
<!-- Fuer „Essen per Foto": capture=environment oeffnet am Handy direkt die Kamera. -->
<input id="fotoInput" type="file" accept="image/*" capture="environment" style="display:none">

<script>
"use strict";
const DB = {
  get(k,def){ try{ const v=JSON.parse(localStorage.getItem('gymlog:'+k)); return v==null?def:v; }catch(e){ return def; } },
  set(k,v){ localStorage.setItem('gymlog:'+k, JSON.stringify(v)); }
};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- Themes ----------

function levelFromXP(xp){ let lvl=1, need=100; while(xp>=need){ xp-=need; lvl++; need=100+(lvl-1)*40; } return {level:lvl, into:xp, need}; }
function xpForLevel(t){ let xp=0; for(let l=1;l<t;l++) xp+=100+(l-1)*40; return xp; }
function rankForLevel(l){ let r=RANKS[0]; for(const x of RANKS) if(l>=x.min) r=x; return r; }
function nextRank(l){ for(const x of RANKS) if(x.min>l) return x; return null; }
function unlockedThemes(level){ const s=new Set(['dark','light']); if(settings.devUnlockAll){ Object.keys(THEMES).forEach(k=>s.add(k)); return s; } RANKS.forEach(r=>{ if(r.unlock && level>=r.min) s.add(r.unlock); }); return s; }
const STAR='M12 2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L3.2 7.7l5.4-.8z';
function rankBadge(r,size,ctx){
  if(r&&r.grad){ const id='rg'+r.min+(ctx||'');
    return `<svg viewBox="0 0 24 24" width="${size}" height="${size}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${r.grad[0]}"/><stop offset="1" stop-color="${r.grad[1]}"/></linearGradient></defs><path fill="url(#${id})" d="${STAR}"/></svg>`; }
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}"><path fill="${r?r.color:'var(--muted)'}" d="${STAR}"/></svg>`;
}

// Letztes Mal jeden Satz abgehakt → mehr Gewicht. Sonst dasselbe nochmal.
function lastEntry(name){ for(let i=sessions.length-1;i>=0;i--){
  const e=sessions[i].entries.find(x=>x.name===name);
  if(e){ const s=arbeit(e.sets); if(s.length) return {name:e.name, sets:s}; } } return null; }
function stepFor(name){ const n=(name||'').toLowerCase();
  return /kniebeug|squat|kreuzheb|deadlift|beinpress|hack squat|hip thrust|langhantelrudern|beinbeuger|beinstrecker/.test(n) ? 5 : 2.5; }
function fmtKg(v){ return (Math.round(v*10)/10).toString().replace('.',','); }
// Ab wie vielen Wiederholungen mehr Gewicht drankommt. Karls Vorgabe vom 05.08.:
// bei wenig Volumen ueber 10, bei viel Volumen ueber 14. Bewusst ueber dem Zielbereich
// (6–10 bzw. 8–12) — wer den oberen Rand nur trifft, bleibt beim Gewicht.
function repGoal(ex){ return volOf(ex)==='low' ? 10 : 14; }
// ex = die Uebung im laufenden Training; ihr Ziel schlaegt die globale Wahl
function suggest(name,ex){
  const e=lastEntry(name); if(!e) return null;
  const done=e.sets.filter(s=>s.done); if(!done.length) return null;
  const w=Math.max(...done.map(s=>+s.weight||0));
  const alle=done.length===e.sets.length;         // jeder Satz abgehakt
  const [lo,hi]=exRange(ex), grenze=repGoal(ex);
  // Die schwaechste Wiederholungszahl entscheidet: hochgehen erst, wenn JEDER Satz drueber lag.
  // Ein einzelner guter Satz soll das Gewicht nicht hochziehen.
  const minWdh=Math.min.apply(null,done.map(s=>+s.reps||0));
  const drueber=alle && minWdh>grenze;
  if(w>0){
    if(drueber){ const nw=w+stepFor(name);
      return {w:nw, up:true, text:`Heute <b>${fmtKg(nw)} kg</b> — letztes Mal ${minWdh} Wdh bei ${fmtKg(w)} kg, also über ${grenze}`}; }
    if(!alle) return {w:w, up:false, text:`Nochmal <b>${fmtKg(w)} kg</b> — letztes Mal ${done.length} von ${e.sets.length} Sätzen`};
    return {w:w, up:false, text:`Nochmal <b>${fmtKg(w)} kg</b> — mehr Gewicht, sobald jeder Satz über <b>${grenze} Wdh</b> liegt`};
  }
  // Ohne Hantel (Klimmzuege & Co.) gibt es kein Gewicht zum Draufpacken
  if(drueber) return {up:true, text:`Letztes Mal ${minWdh} Wdh — heute schwerer machen, z.B. mit Zusatzgewicht`};
  return {up:false, text:`Ziel <b>${lo}–${hi} Wdh</b> — letztes Mal ${alle?`${minWdh} Wdh`:`${done.length} von ${e.sets.length} Sätzen`}`};
}
function prFor(name){ let best=0,rep=0; sessions.forEach(s=>s.entries.forEach(e=>{ if(e.name===name) arbeit(e.sets).forEach(st=>{ if(st.done&&+st.weight>best){ best=+st.weight; rep=+st.reps||0; } }); })); return best?{w:best,r:rep}:null; }

function resolveSystem(){ return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; }
function applyTheme(){
  const lvl=levelFromXP(profile.xp).level;
  let key=profile.theme||'system';
  if(key!=='system' && !unlockedThemes(lvl).has(key)){ key='system'; profile.theme='system'; }
  const eff = key==='system' ? resolveSystem() : key;
  const th=THEMES[eff]||THEMES.dark, root=document.documentElement;
  Object.entries(th.vars).forEach(([k,v])=>root.style.setProperty(k,v));
  document.querySelector('meta[name=theme-color]').setAttribute('content', th.vars['--bg']);
}

// Eigener Ticker statt render() im Sekundentakt: ein Neuzeichnen wuerde die Eingabefelder
// leeren und den Fokus wegnehmen, waehrend man tippt. Angefasst wird nur der Text.
let sessClock=null;
function paintSessionTime(){
  const els=document.querySelectorAll('[data-sesstime]');
  if(!els.length) return;
  const t=active?fmtClock(Date.now()-active.date):'';
  els.forEach(el=>{ el.textContent=t; });
}
function syncSessionClock(){
  const braucht=!!active && !!document.querySelector('[data-sesstime]');
  if(braucht){ paintSessionTime(); if(!sessClock) sessClock=setInterval(paintSessionTime,1000); }
  else if(sessClock){ clearInterval(sessClock); sessClock=null; }
}

// Körper in der Akzentfarbe, Augen/Mund im Gegenton — passt sich damit jedem Design an.
// Ohne Rang der alte Brock (brock.png) — so bleiben Anmeldung und Assistent, wie Karl es wollte.
// Mit Rang die Stufe aus RANKS. Hoehe kommt aus .mon{height:auto}, die Blaetter haben je ein
// eigenes Seitenverhaeltnis und wuerden von einer festen Hoehe verzerrt.
function brockSrc(rank){ return (rank&&rank.img) || 'brock.png'; }
function monster(size,mood,rank){ size=size||86;
  return `<img class="mon" src="${brockSrc(rank)}" width="${size}" alt="" aria-hidden="true">`; }
// Brock im Abzeichen-Kasten: gesperrte Raenge als Silhouette, damit die Stufe erkennbar bleibt,
// aber noch etwas zu holen ist. Mittelgrau statt schwarz — reines Schwarz verschwand im
// dunklen Design vollstaendig. brightness(0) macht alles schwarz, invert(.55) hebt es auf Grau.
function rankMon(r,size,locked){
  return `<img src="${esc(brockSrc(r))}" width="${size}" height="${size}" alt="" aria-hidden="true"
    style="max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain${locked?';filter:brightness(0) invert(.55);opacity:.55':''}">`; }
function mascot(text,mood,size,rank){ return `<div class="mascot">${monster(size,mood,rank)}<div class="bubble">${text}</div></div>`; }

function sessionsOn(ts){ return sessions.filter(s=>sameDay(s.date,ts)); }

  return plans.some(p=>p.day===d) && sessionsOn(y).length===0; }

}

// ---------- Verlauf einer einzelnen Übung ----------
function exHistory(name){ const out=[];
  sessions.forEach(s=>{ const e=s.entries.find(x=>x.name===name); if(!e) return;
    const d=e.sets.filter(x=>x.done); if(!d.length) return;
    out.push({ date:s.date, w:Math.max(...d.map(x=>+x.weight||0)),
      vol:d.reduce((a,x)=>a+(+x.weight||0)*(+x.reps||0),0), sets:d.length,
      reps:d.reduce((a,x)=>a+(+x.reps||0),0) }); });
  return out; }
function lineChart(vals,w,h){
  if(vals.length<2) return '';
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1, pad=10;
  const pt=(v,i)=>[ pad+(w-2*pad)*i/(vals.length-1), h-pad-(h-2*pad)*((v-min)/span) ];
  const ps=vals.map(pt);
  const line=ps.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${ps[ps.length-1][0].toFixed(1)} ${h-pad} L${ps[0][0].toFixed(1)} ${h-pad} Z`;
  const dots=ps.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="var(--accent)"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" style="display:block">
    <path d="${area}" fill="var(--accent)" opacity=".13"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}</svg>`;
}

// ---------- Eine Einheit im Verlauf ----------
// Seit dem 06.08. laesst sich eine abgeschlossene Einheit nachtraeglich geradebiegen (Karls
// Ansage). Vorher gab es nur „loeschen" — ein Tippfehler bei kg (100 statt 10) verzog Rekorde,
// Volumen und Kurven dauerhaft, und der einzige Ausweg war, die ganze Einheit wegzuwerfen.
let sessEdit=false;
// XP nachfuehren. Moeglich nur, wenn beim Beenden festgehalten wurde, wie viel es dafuer gab —
// Einheiten von vor dem 06.08. haben kein s.xp, dort bleibt der Punktestand unangetastet
// (lieber ein alter Wert stehen als ein geratener abgezogen).
function sessXP(en){ return doneSets(en)*10 + 50 + Math.floor(volume(en)/1000)*20; }
function sessRecalc(s){
  if(typeof s.xp==='number'){ const neu=sessXP(s.entries);
    profile.xp=Math.max(0, profile.xp + (neu - s.xp)); s.xp=neu; }
  save();
}
function renderSession(){
  const s=sessions.find(x=>x.id===detailSessionId); if(!s){ view='history'; return render(); }
  const dauer=fmtDauer(s.dur);
  let h=`<button class="link" data-act="backhist">‹ Verlauf</button>
    <div class="row between" style="margin:6px 4px 4px"><h2>${esc(s.planName)}</h2>
      <button class="btn sm ghost link" data-act="sessedit">${sessEdit?'Fertig':'Bearbeiten'}</button></div>

  if(sessEdit) h+=`<div class="tiny muted" style="margin:0 4px 12px">kg und Wdh lassen sich ändern, ✕ wirft einen Satz raus.
    Volumen, Rekorde, Kurven und XP rechnen sich danach neu.</div>`;
  let leer=true;
  s.entries.forEach((e,ei)=>{ const d=e.sets.filter(x=>x.done); if(!d.length && !sessEdit) return;
    leer=false;
    h+=`<div class="card"><div class="row between"><div class="row" style="gap:10px">${iconTile(e.name,e.icon,40)}<b>${esc(e.name)}</b></div>
      ${sessEdit?`<button class="del-x" data-sdelex="${ei}" aria-label="Übung aus der Einheit entfernen">✕</button>`:''}</div>
      <div style="margin-top:8px">`;
    if(sessEdit) h+=`<div class="set-head" style="grid-template-columns:1fr 66px 66px 32px">
      <span style="text-align:left"></span><span>kg</span><span>Wdh</span><span></span></div>`;
    let nr=0;
    e.sets.forEach((st,si)=>{ if(!st.done) return; if(!st.warm) nr++;
      // Aufwaermsaetze zaehlen nirgends mit — sie hier als „Satz 1" auszugeben, war irrefuehrend.
      const label=st.warm?'Aufwärmen':'Satz '+nr;
      if(sessEdit){ h+=`<div class="set ${st.warm?'warm':''}" style="grid-template-columns:1fr 66px 66px 32px;padding:5px 2px">
        <span class="muted tiny" style="text-align:left">${label}</span>
        <input type="number" inputmode="decimal" step="0.5" min="0" value="${st.weight??''}" data-se="${ei}:${si}" data-sf="weight" aria-label="Gewicht in kg">
        <input type="number" inputmode="numeric" step="1" min="0" value="${st.reps??''}" data-se="${ei}:${si}" data-sf="reps" aria-label="Wiederholungen">
        <button class="del-x" style="padding:4px 2px" data-sdel="${ei}:${si}" aria-label="Satz löschen">✕</button></div>`; }
      else h+=`<div class="sess"><span class="muted">${label}</span><b>${st.weight||0} kg × ${st.reps||0}</b></div>`;
    });
    if(sessEdit) h+=`<button class="link" data-sadd="${ei}" style="margin-top:6px">+ Satz</button>`;
    h+=`</div></div>`; });
  if(leer) h+=`<div class="empty">In dieser Einheit steht nichts mehr.<br>Du kannst sie unten löschen.</div>`;
  h+=`<button class="btn danger" data-act="delsess" style="margin-top:12px">Einheit löschen</button>`;
  app.innerHTML=h;
}

  // Leiter — erreichte Ränge lassen sich antippen und als Look übernehmen
  h+=`<div class="row between" style="margin:16px 4px 4px"><h2>Rang-Leiter</h2></div>
      <div class="tiny muted" style="margin:0 4px 8px">Tipp einen erreichten Rang an, um sein Aussehen zu tragen.</div>`;
  RANKS.forEach(r=>{ const reached=lp.level>=r.min, isReal=r.min===real.min, isShown=r.min===shown.min;
    const sparks=(r.aura||0)>=4?'<i class="spark" style="left:9%;top:30%"></i><i class="spark" style="left:88%;top:34%;animation-delay:.6s"></i><i class="spark" style="left:70%;top:64%;animation-delay:1s"></i>':'';
    h+=`<div class="card rankcard aura-${r.aura||0}" ${reached?`data-skin="${r.min}" style="--rc:${r.color};margin:8px 0;padding:12px;cursor:pointer${isShown?';border-color:var(--rc)':''}"`:`style="--rc:${r.color};margin:8px 0;padding:12px;opacity:.82"`}>
      ${sparks}
      <div class="rc-body row between">
        <div class="row" style="gap:10px">
          <div class="badge" style="width:46px;height:46px;flex:0 0 46px">${rankMon(r,46,!reached)}</div>
          <div><b>${esc(r.name)}</b> ${isReal?'<span class="pill" style="background:var(--accent);color:var(--accent-ink)">dein Rang</span>':''}${isShown&&!isReal?'<span class="pill" style="background:var(--rc);color:#fff">getragen</span>':''}
            <div class="tiny muted">ab Level ${r.min}${r.unlock?` · Design „${THEMES[r.unlock].label}"`:''}</div></div>
        </div>
        <div>${reached?'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--ok)" stroke-width="3"><path d="M5 12l5 5L20 6"/></svg>':'<span class="tiny muted">🔒</span>'}</div>
      </div></div>`; });
  if(profile.rankSkin!=null) h+=`<button class="btn ghost sm" style="margin-top:4px" data-skin="${profile.rankSkin}">Wieder meinen echten Rang zeigen</button>`;
  // Designs
  h+=`<div class="row between" style="margin:18px 4px 4px"><h2>Designs</h2></div><div class="theme-grid">`;
  Object.entries(THEMES).forEach(([key,t])=>{ const free=t.free, open=unlocked.has(key), on=profile.theme===key;
    const need=RANKS.find(r=>r.unlock===key);
    const sw=['--bg','--card2','--accent','--ok'].map(v=>`<i style="background:${t.vars[v]}"></i>`).join('');
    h+=`<div class="theme-cell ${on?'on':''} ${open?'':'locked'}" ${open?`data-theme="${key}"`:''}>
      <div class="sw">${sw}</div><b class="tiny">${esc(t.label)}</b>
      <div class="tiny muted">${free?'immer frei':open?'freigeschaltet':`ab „${need?need.name:'?'}"`}</div>
      ${open?'':'<span class="lock">🔒</span>'}${on?'<span class="lock" style="color:var(--accent)">✓</span>':''}</div>`; });
  h+=`</div>`;
  // Einstellungen
  app.innerHTML=h;
}

// ---------- Kalorien ----------
// Der Tab hiess bis zum 06.08. „Körper" und hielt nur das Gewicht. Jetzt sitzt hier der
// Ernaehrungs-Teil (Karls Ansage): Tagesziel, was heute gegessen wurde, und drei Wege,
// etwas einzutragen — eigene Liste, Barcode, Foto. Das Gewicht bleibt darunter stehen.
//
// Datenmodell (alles in profile.kcal, wandert damit ueber Sync und Backup mit):
//   goal   Tagesziel in kcal (null = noch nicht gesetzt)
//   foods  eigene Lebensmittel [{id,name,marke,kcal,p,c,f}] — Werte immer je 100 g
//   meals  Eintraege [{id,date,name,menge,kcal,p,c,f,quelle}] — Werte schon ausgerechnet,
//          damit ein spaeter geaendertes Lebensmittel die Vergangenheit nicht umschreibt.
function kcalInit(){
  if(!profile.kcal || typeof profile.kcal!=='object') profile.kcal={};
  const k=profile.kcal;
  if(!(k.goal>0)) k.goal=k.goal===0?0:null;
  if(!Array.isArray(k.foods)) k.foods=[];
  if(!Array.isArray(k.meals)) k.meals=[];
  return k;
}
function mealsToday(){ const n=Date.now(); return kcalInit().meals.filter(m=>sameDay(m.date,n)); }
function sumMeals(list){ const s={kcal:0,p:0,c:0,f:0};
  list.forEach(m=>{ s.kcal+=+m.kcal||0; s.p+=+m.p||0; s.c+=+m.c||0; s.f+=+m.f||0; });
  Object.keys(s).forEach(x=>s[x]=Math.round(s[x])); return s; }
// Ring fuer „heute gegessen". Reines SVG, kein Bild — passt sich jedem Design an.
function kcalRing(ist,ziel){
  const r=52, u=2*Math.PI*r, teil=ziel>0?Math.min(1.4,ist/ziel):0, drueber=teil>1;
  return `<svg viewBox="0 0 130 130" width="130" height="130" style="flex:0 0 auto">
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--card2)" stroke-width="13"/>
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="${drueber?'var(--danger)':'var(--ok)'}" stroke-width="13"
      stroke-linecap="round" stroke-dasharray="${u}" stroke-dashoffset="${u*(1-Math.min(1,teil))}"
      transform="rotate(-90 65 65)"/>
    <text x="65" y="61" text-anchor="middle" fill="var(--txt)" font-size="25" font-weight="800">${ist}</text>
    <text x="65" y="80" text-anchor="middle" fill="var(--muted)" font-size="12">${ziel>0?'von '+ziel:'kcal'}</text></svg>`;
}
// ---------- Lebensmittel waehlen / anlegen ----------
// Alle drei Wege (eigene Liste, Barcode, Foto) enden an derselben Stelle: ein foodDraft
// steht fest, und es fehlt nur noch die Menge. Deshalb eine Ansicht mit drei Schritten
// statt drei getrennter Abläufe.
let foodStep='list', foodDraft=null, foodBusy='', foodFehler='';
// basis 'g100' = die Werte gelten je 100 g (eigene Liste, Barcode)
// basis 'portion' = die Werte gelten fuer genau diese eine Portion (Foto)
function leerDraft(){ return {name:'',marke:'',kcal:'',p:'',c:'',f:'',basis:'g100',menge:100,quelle:'eigen'}; }
function draftWerte(d,menge){
  const faktor = d.basis==='portion' ? (+menge||1) : (+menge||0)/100;
  return { kcal:Math.round((+d.kcal||0)*faktor), p:Math.round((+d.p||0)*faktor),
           c:Math.round((+d.c||0)*faktor), f:Math.round((+d.f||0)*faktor) };
}
function addMeal(d,menge){
  const w=draftWerte(d,menge), k=kcalInit();
  k.meals.push({id:uid(),date:Date.now(),name:d.name||'Essen',
    menge:(+menge||0)+(d.basis==='portion'?'×':' g'), quelle:d.quelle||'eigen', ...w});
  save(); return w;
}
function renderBody(){
  const k=kcalInit(), heute=mealsToday(), s=sumMeals(heute);
  let h=`<div class="row between" style="margin:2px 4px 6px"><h2>Heute</h2>
      <button class="btn sm ghost link" data-act="kcalgoal">${k.goal>0?k.goal+' kcal Ziel':'Ziel setzen'}</button></div>
    <div class="card"><div class="row" style="gap:16px">
      ${kcalRing(s.kcal, k.goal||0)}
      <div style="flex:1;min-width:0">
        ${k.goal>0?`<div class="tiny muted" style="margin-bottom:8px">${s.kcal<=k.goal
            ? `noch <b style="color:var(--txt)">${k.goal-s.kcal} kcal</b> übrig`
            : `<b style="color:var(--danger)">${s.kcal-k.goal} kcal</b> darüber`}</div>`
          :`<div class="tiny muted" style="margin-bottom:8px">Setz oben ein Tagesziel, dann füllt sich der Ring.</div>`}
        <div class="makro"><span>Eiweiß</span><b>${s.p} g</b></div>
        <div class="makro"><span>Kohlenhydrate</span><b>${s.c} g</b></div>
        <div class="makro"><span>Fett</span><b>${s.f} g</b></div>
      </div></div></div>
    <div class="fab-row" style="margin-top:10px">
      <button class="btn primary" data-act="food:start">+ Essen eintragen</button></div>`;

  h+=`<div class="row between" style="margin:20px 4px 6px"><h2>Gegessen</h2>
      <span class="tiny muted">${heute.length} ${heute.length===1?'Eintrag':'Einträge'}</span></div>`;
  if(!heute.length) h+=`<div class="empty">Heute noch nichts eingetragen.</div>`;
  else { h+=`<div class="card">`;
    [...heute].reverse().forEach(m=>{ h+=`<div class="sess"><div style="min-width:0">
      <b>${esc(m.name)}</b><div class="tiny muted">${esc(String(m.menge))} · ${fmtTime(m.date)}${m.quelle==='foto'?' · Foto':m.quelle==='barcode'?' · Barcode':''}</div></div>
      <span class="row" style="gap:10px;flex:0 0 auto"><b>${m.kcal} kcal</b>
      <button class="link" style="padding:0 2px;color:var(--muted)" data-delmeal="${m.id}">✕</button></span></div>`; });
    h+=`</div>`; }

  // ---------- Gewicht (war frueher der ganze Tab) ----------
  const w=weightList(), cur=lastWeight();
  h+=`<div class="row between" style="margin:22px 4px 6px"><h2>Gewicht</h2>
      ${cur?`<span class="pill">zuletzt ${fmtDate(cur.date)}</span>`:''}</div>
    <div class="card">
      <div class="row" style="gap:8px;align-items:flex-end">
        <div class="field" style="flex:1;margin:0"><label>Heute wiegen (kg)</label>
          <input id="wInput" type="number" inputmode="decimal" step="0.1" min="20" max="500"
                 placeholder="${cur?fmtKg(cur.kg):'z. B. 78,5'}"></div>
        <button class="btn primary" style="width:auto;padding:12px 18px" data-act="addweight">Eintragen</button>
      </div>
      <div class="tiny muted" style="margin-top:8px">Am besten morgens, nüchtern, immer zur gleichen Zeit —
        dann sind die Zahlen vergleichbar. Ein Eintrag pro Tag; nochmal wiegen überschreibt den heutigen Wert.</div>
    </div>`;

  if(w.length===0){ h+=`<div class="empty">Noch nichts eingetragen.<br>Trag dein Gewicht ein, dann entsteht hier deine Kurve.</div>`;
    app.innerHTML=h; return; }

  const first=w[0], diff=cur.kg-first.kg;
  h+=`<div class="grid3" style="margin-top:14px">
      <div class="stat"><b>${fmtKg(first.kg)}</b><span>Start</span></div>
      <div class="stat"><b>${fmtKg(cur.kg)}</b><span>Aktuell</span></div>
      <div class="stat"><b>${diff>0?'+':''}${fmtKg(diff)}</b><span>kg Differenz</span></div></div>`;

  if(w.length>1){
    h+=`<div class="row between" style="margin:20px 4px 6px"><h2>Verlauf</h2>
        <span class="tiny muted">${fmtKg(Math.min(...w.map(x=>x.kg)))}–${fmtKg(Math.max(...w.map(x=>x.kg)))} kg</span></div>
      <div class="card" style="padding:10px 6px">${lineChart(w.map(x=>x.kg),300,110)}</div>`;
  } else {
    h+=`<div class="empty" style="margin-top:16px">Ab dem zweiten Eintrag siehst du hier eine Kurve.</div>`;
  }

  h+=`<div class="row between" style="margin:20px 4px 6px"><h2>Einträge</h2></div><div class="card">`;
  [...w].reverse().forEach(x=>{ h+=`<div class="sess"><span>${fmtDate(x.date)}</span>
      <span class="row" style="gap:10px"><b>${fmtKg(x.kg)} kg</b>
      <button class="link" style="padding:0 2px;color:var(--muted)" data-delweight="${x.date}">✕</button></span></div>`; });
  h+=`</div>`;
  app.innerHTML=h;
}

function renderFoodList(q){

      <div style="flex:1;min-width:0"><div>${esc(f.name)}</div>

      <button class="del-x" data-delfood="${f.id}" aria-label="Lebensmittel löschen">✕</button></div>`).join('');
  if(!treffer.length) h+=`<div class="empty" style="padding:18px">${k.foods.length

// ---------- Barcode ----------
// Drei Wege, in dieser Reihenfolge:
//  1. BarcodeDetector im Browser (Chrome/Android) - schnell, nichts nachzuladen.
//  2. ZXing im Browser (./zxing.min.js) - fuer Safari/iPhone, das BarcodeDetector bis heute
//     nicht kennt. Wird erst geladen, wenn wirklich gescannt wird.
//  3. Nummer eintippen - nur noch, wenn gar keine Kamera da ist oder sie verweigert wird.
function kameraGeht(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia); }
let scanStream=null, scanReader=null, zxingLaedt=null;
function stopScan(){
  if(scanReader){ try{ scanReader.reset(); }catch(e){} scanReader=null; }
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; } }
function nummerTippen(text){
  const nr=prompt(text||'Nummer unter dem Barcode eintippen (die 8-13 Ziffern):');
  if(nr) holeBarcode(nr.replace(/\D/g,'')); }
// 330 KB gehoeren nicht in den Start der App - deshalb erst hier, und nur einmal.
function ladeZXing(){
  if(window.ZXing) return Promise.resolve(true);
  if(zxingLaedt) return zxingLaedt;
  zxingLaedt=new Promise(res=>{ const s=document.createElement('script');
    s.src='./zxing.min.js';
    s.onload=()=>res(typeof window.ZXing!=='undefined');
    s.onerror=()=>{ zxingLaedt=null; res(false); };
    document.head.appendChild(s); });
  return zxingLaedt; }
function scanHinweis(t){ const h=document.getElementById('scanHint'); if(h) h.textContent=t; }
async function openScan(){
  if(!kameraGeht()){ nummerTippen('Dieses Gerät gibt keine Kamera her. Nummer unter dem Barcode eintippen:'); return; }
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal-box" style="max-width:380px;padding:14px">
    <div class="row between" style="margin-bottom:8px"><b>Barcode scannen</b>
      <button class="del-x" data-act="closescan" style="margin:0">✕</button></div>
    <video id="scanVid" playsinline muted autoplay style="width:100%;border-radius:12px;background:#000"></video>
    <div class="tiny muted" id="scanHint" style="margin-top:8px">Halt den Strichcode ins Bild.</div>
    <button class="btn ghost sm" data-act="scantippen" style="margin-top:10px;width:100%">Nummer stattdessen eintippen</button>
  </div>`;
  m.classList.add('show');
  const treffer=nr=>{ stopScan(); closeModal(); holeBarcode(nr); };

  // Weg 1
  if(typeof window.BarcodeDetector!=='undefined'){
    try{
      scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
      const v=document.getElementById('scanVid');
      if(!v){ stopScan(); return; }
      v.srcObject=scanStream; await v.play();
      const det=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
      const tick=async()=>{
        if(!scanStream) return;                       // abgebrochen
        try{ const codes=await det.detect(v);
          if(codes&&codes.length){ treffer(codes[0].rawValue); return; }
        }catch(e){}
        setTimeout(tick,400); };
      tick(); return;
    }catch(e){ stopScan();
      // Kamera verweigert? Dann hilft auch Weg 2 nicht.
      if(e && (e.name==='NotAllowedError'||e.name==='NotFoundError'||e.name==='SecurityError')){
        closeModal(); nummerTippen('Kamera geht nicht. Nummer unter dem Barcode eintippen:'); return; }
    }
  }

  // Weg 2 - ZXing macht die Kamera selbst auf und raeumt sie mit reset() wieder weg.
  scanHinweis('Barcode-Leser wird geladen …');
  const da=await ladeZXing();
  if(!document.getElementById('scanVid')) return;     // zwischendurch zugemacht
  if(!da){ closeModal(); nummerTippen('Der Barcode-Leser lässt sich nicht laden (kein Netz?). Nummer eintippen:'); return; }
  scanHinweis('Halt den Strichcode ins Bild.');
  try{
    const hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,
      [ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E]);
    scanReader=new ZXing.BrowserMultiFormatReader(hints,250);

// Open Food Facts: offene Datenbank, kein Schluessel noetig, kennt deutsche Produkte gut.
async function holeBarcode(nr){
  if(!nr || nr.length<6){ foodFehler='Das war keine gültige Barcode-Nummer.'; render(); return; }
  foodBusy='Suche '+nr+' in der Lebensmittel-Datenbank …'; foodFehler=''; view='food'; render();
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(nr)}.json?fields=product_name,product_name_de,brands,nutriments`);
    const d=await r.json();
    if(!d || d.status===0 || !d.product) throw new Error('Das Produkt steht nicht in der Datenbank.');
    const p=d.product, n=p.nutriments||{};
    const kcal = n['energy-kcal_100g'] != null ? n['energy-kcal_100g']
               : (n['energy_100g']!=null ? n['energy_100g']/4.184 : null);
    if(kcal==null) throw new Error('Zu dem Produkt sind keine Nährwerte hinterlegt.');
    foodDraft={ name:(p.product_name_de||p.product_name||'Produkt '+nr).slice(0,60),
      marke:(p.brands||'').split(',')[0].trim(),
      kcal:Math.round(kcal), p:Math.round(n.proteins_100g||0), c:Math.round(n.carbohydrates_100g||0),
      f:Math.round(n.fat_100g||0), basis:'g100', menge:100, quelle:'barcode' };
    foodBusy=''; foodStep='menge'; render();
  }catch(e){ foodBusy=''; foodStep='list';
    foodFehler=(e&&e.message)||'Kein Netz oder Datenbank nicht erreichbar.'; render(); }
}

// Vor dem Senden verkleinern: ein Handyfoto in voller Aufloesung kostet ein Vielfaches
// an Bild-Tokens, ohne dass der Teller dadurch besser zu erkennen waere.
function fotoKlein(file, max){
  return new Promise((ok,fail)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1, max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s)||1; c.height=Math.round(img.height*s)||1;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg',0.8).split(',')[1]); };
    img.onerror=()=>{ URL.revokeObjectURL(url); fail(new Error('Das Bild ließ sich nicht lesen.')); };
    img.src=url;
  });
}
async function schaetzeFoto(file){
  // fragKey() ist seit dem 22.08.2026 ein Dialog und damit asynchron — ohne await
  // liefe es sofort mit einem Promise (immer wahr) weiter und schickte das Foto ohne Schluessel.
  if((!aiKey() || altSchluessel()) && !(await fragKey())){ foodFehler='Ohne Schlüssel kann das Foto nicht geschätzt werden.'; render(); return; }
  foodBusy='Das Bild wird angesehen … das dauert ein paar Sekunden.'; foodFehler=''; view='food'; render();
  try{
    const b64=await fotoKlein(file,1024);
    // Google statt Anthropic (Karls Entscheidung, 21.08.2026): der Schluessel kostet dort
    // nur ein Google-Konto, kein Rechnungskonto. Interactions-API, nicht das aeltere
    // generateContent. Der Aufruf aus dem Browser ist erlaubt - nachgemessen am 21.08.2026:
    // die Vorabfrage antwortet mit Access-Control-Allow-Origin fuer genau diese Seite und
    // erlaubt 'x-goog-api-key'. Ein Sonderheader wie bei Anthropic ist nicht noetig.
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{ method:'POST',
      headers:{ 'content-type':'application/json', 'x-goog-api-key':aiKey() },
      body: JSON.stringify({
        model:'gemini-3.7-flash',
        response_format:{ type:'json_schema', json_schema:{ name:'Naehrwerte', schema:{
          type:'object',
          properties:{
            name:{type:'string', description:'Kurzer deutscher Name des Gerichts'},
            menge:{type:'string', description:'Geschätzte Portionsgröße, z.B. "ca. 350 g"'},
            kcal:{type:'number'}, eiweiss:{type:'number'}, kohlenhydrate:{type:'number'}, fett:{type:'number'},
            sicher:{type:'boolean', description:'false, wenn das Essen schlecht zu erkennen ist'}
          },
          required:['name','menge','kcal','eiweiss','kohlenhydrate','fett','sicher'] } } },
        input:[
          { type:'text', text:'Schätze für das Essen auf diesem Bild die Nährwerte der abgebildeten Portion (nicht je 100 g). Antworte auf Deutsch. Wenn kein Essen zu sehen ist, setze sicher auf false und alle Zahlen auf 0.' },
          { type:'image', mime_type:'image/jpeg', data:b64 } ]
      }) });
    if(r.status===401||r.status===403) throw new Error('Der Schlüssel wurde nicht angenommen. Trag ihn in den Einstellungen neu ein.');
    if(r.status===429) throw new Error('Das kostenlose Kontingent bei Google ist gerade aufgebraucht. Versuch es später noch einmal.');
    if(!r.ok){ let t=''; try{ t=(await r.json()).error.message; }catch(e){}
      if(/api[ _-]?key/i.test(t)) throw new Error('Der Schlüssel wurde nicht angenommen. Trag ihn in den Einstellungen neu ein.');
      throw new Error('Die KI antwortet nicht ('+r.status+')'+(t?': '+t:'.')); }
    const d=await r.json();
    // ⚠️ Nicht steps[0] nehmen: vor der Antwort koennen Denk-Schritte stehen.
    const txt=(d.steps||[]).filter(s=>s&&s.type==='model_output')
      .map(s=>(s.content||[]).filter(c=>c&&c.type==='text').map(c=>c.text||'').join('')).join('');
    if(!txt) throw new Error('Die KI hat nichts zurückgegeben. Versuch ein anderes Bild.');
    const g=JSON.parse(txt);
    if(!g.sicher && !(+g.kcal>0)) throw new Error('Auf dem Bild war kein Essen zu erkennen.');
    foodDraft={ name:String(g.name||'Essen').slice(0,60), marke:String(g.menge||''),
      kcal:Math.round(+g.kcal||0), p:Math.round(+g.eiweiss||0), c:Math.round(+g.kohlenhydrate||0),
      f:Math.round(+g.fett||0), basis:'portion', menge:1, quelle:'foto', unsicher:!g.sicher };
    foodBusy=''; foodStep='menge'; render();
  }catch(e){ foodBusy=''; foodStep='list';
    foodFehler=(e&&e.message)||'Unbekannter Fehler.'; render(); }
}

function weightList(){ return (profile.weights||[]).slice().sort((a,b)=>a.date-b.date); }
function lastWeight(){ const w=weightList(); return w.length?w[w.length-1]:null; }
function sameDay(a,b){ return new Date(a).toDateString()===new Date(b).toDateString(); }
// Ein Eintrag pro Tag — nochmal wiegen am selben Tag überschreibt den alten Wert.
function addWeight(kg){
  kg=Math.round((+kg)*10)/10;
  if(!(kg>0)||kg>500) return false;
  const now=Date.now(), i=(profile.weights||[]).findIndex(x=>sameDay(x.date,now));
  if(i>=0) profile.weights[i]={date:now,kg}; else profile.weights.push({date:now,kg});
  save(); return true;
}

// ---------- Timer ----------
let rest={total:0,remaining:0,id:null}; const tb=document.getElementById('timerbar');
function startRest(sec){ stopRest(); rest.total=sec; rest.remaining=sec; rest.id=setInterval(tick,1000); paintTimer(); }
function stopRest(){ if(rest.id){ clearInterval(rest.id); rest.id=null; } }
// stopRest haelt nur die Uhr an — rest.remaining bleibt stehen, und paintTimer zeigt die Leiste
// dann weiter. Beim Beenden, Abbrechen oder Verwerfen muss sie ganz weg, also auch die Restzeit.
function endRest(){ stopRest(); rest.remaining=0; rest.total=0; paintTimer(); }
function tick(){ rest.remaining--; if(rest.remaining<=0){ stopRest(); if(navigator.vibrate) navigator.vibrate([300,120,300]); toast('Pause vorbei — weiter!'); } paintTimer(); }
function adjust(d){ if(!rest.id&&rest.remaining<=0){ startRest(Math.max(5,d)); return; } rest.remaining=Math.max(0,rest.remaining+d); rest.total=Math.max(rest.total,rest.remaining); paintTimer(); }
function paintTimer(){ if(rest.remaining<=0&&!rest.id){ tb.classList.remove('show'); tb.innerHTML=''; return; }
  const m=Math.floor(rest.remaining/60), s=rest.remaining%60, pct=rest.total?Math.max(0,rest.remaining/rest.total*100):0;
  tb.classList.add('show');
  tb.innerHTML=`<div class="timer"><div class="time">${m}:${String(s).padStart(2,'0')}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <button class="t-btn" data-rest="-15">−15</button><button class="t-btn" data-rest="15">+15</button><button class="t-btn" data-rest="skip">✓</button></div>`; }

// ---------- Toast + Modal ----------
let toastT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }
function showModal(html){ const m=document.getElementById('modal'); m.innerHTML=`<div class="modal-box">${html}<button class="btn primary" data-act="closemodal" style="margin-top:16px">Weiter</button></div>`; m.classList.add('show'); }

// ---------- Daten herunterladen ----------
// Kein Backup mehr, sondern Datenübertragbarkeit (Art. 20 DSGVO). Der Knopf sitzt
// deshalb seit dem 03.08. auf der Datenschutz-Seite statt bei den Einstellungen.
// ⚠️ Das Gegenstück (Datei wieder einlesen) ist bewusst weg — gesichert wird über
// das Konto, und ein zweiter Weg, der Daten hineinschiebt, käme dem Abgleich in
// die Quere.
// ---------- Trainingsplan teilen ----------
// Der Plan steckt vollstaendig im Link — kein Server noetig, der Empfaenger braucht nur die App.
// btoa kann nur Bytes, deshalb der Umweg ueber TextEncoder; sonst zerbricht es an Umlauten.
function b64enc(str){ const b=new TextEncoder().encode(str); let s='';
  b.forEach(x=>{ s+=String.fromCharCode(x); });
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64dec(t){ t=String(t).replace(/-/g,'+').replace(/_/g,'/');
  const s=atob(t), b=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i);
  return new TextDecoder().decode(b); }
// Kurzform: nur was den Plan ausmacht. Keine ids (der Empfaenger vergibt eigene), keine
// Einheiten, kein Fortschritt, kein Name — geteilt wird der Plan, nicht die Historie.
function planCode(prog){
  const pr=prog||activeProg();
  return b64enc(JSON.stringify({v:2, name:String(pr.name||'Trainingsplan').slice(0,40), p:(pr.plans||[]).map(p=>({
    n:String(p.name||'Training').slice(0,40), d:(p.day==null?null:+p.day), w:planWarm(p)?1:0,
    e:(p.exercises||[]).filter(e=>e.name).map(e=>[String(e.name).slice(0,60), +e.sets||3, volOf(e)==='low'?'l':'h'])
  })).filter(p=>p.e.length)}));
}
function planLink(prog){ return location.origin+location.pathname+'#p='+planCode(prog); }
function sharePlan(progId){
  const pr=(progId?progById(progId):null)||activeProg();
  if(!pr.plans||!pr.plans.length){ toast('Dieser Plan hat noch keine Trainings'); return; }
  const url=planLink(pr), text=`„${pr.name}" — mein Trainingsplan aus Gym-Log (${pr.plans.length} Trainings)`;
  const fallback=()=>{ (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject())
    .then(()=>toast('Link kopiert'))
    .catch(()=>showModal(`<div class="tiny muted">Link zum Weitergeben</div>
      <textarea readonly style="width:100%;height:90px;margin-top:8px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px;font-size:12px">${esc(url)}</textarea>`)); };
  if(navigator.share){ navigator.share({title:'Trainingsplan',text,url}).catch(e=>{ if(!e||e.name!=='AbortError') fallback(); }); }
  else fallback();
}
// Empfangen: der Link wird beim Start gelesen, der Hash sofort entfernt (sonst haengt er beim
// naechsten Oeffnen noch dran) und das Angebot erst nach der Anmeldung gezeigt.
let planImport=null, importGezeigt=false;
function leseImportAusLink(){
  const m=/[#&]p=([A-Za-z0-9\-_]+)/.exec(location.hash||''); if(!m) return;
  try{ const d=JSON.parse(b64dec(m[1]));
    // v1 waren nur Trainings ohne Plan-Namen, v2 bringt den Namen mit. Beides annehmen.
    if(d && (d.v===1||d.v===2) && Array.isArray(d.p) && d.p.length)
      planImport={name:(d.name||'Geteilter Plan'), p:d.p.slice(0,10)};
  }catch(e){ planImport=null; }
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
}
function zeigeImport(){

    <span>${esc(p.n)}${p.d!=null?` <span class="muted tiny">· ${DAYNAME[p.d]||''}</span>`:''}</span>

function importierePlan(){
  // Der geteilte Plan kommt als eigener Trainingsplan dazu — nicht in einen bestehenden hinein.
  // Innerhalb des neuen Plans gilt die Ein-Training-pro-Tag-Regel weiter: kollidiert ein Tag
  // mit einem schon im selben Plan vergebenen, kommt das Training ohne festen Tag rein.
  const neu=[]; let ohneTag=0;
  planImport.p.forEach(p=>{
    let tag=(p.d==null)?null:+p.d;
    if(tag!=null && neu.some(x=>x.day===tag)){ tag=null; ohneTag++; }
    neu.push({id:uid(), name:p.n, day:tag, warmup:!!p.w,
      exercises:(p.e||[]).map(e=>({id:uid(), name:e[0], sets:+e[1]||3, reps:10, vol:e[2]==='l'?'low':'high'}))});
  });
  const pr=neuerPlan(planImport.name, neu); programs.push(pr);
  planImport=null; save(); closeModal(); editProgId=pr.id; view='plans'; render();
  toast(ohneTag ? `„${pr.name}" übernommen — ${ohneTag} ohne Tag` : `„${pr.name}" übernommen`);
}

// ---------- Konto & Cloud-Sync (Supabase) ----------
let authMode='login', syncT, syncState='Cloud aktiv';
let dirty=DB.get('dirty',false);   // lokale Änderungen, die noch nicht in der Cloud sind
function setDirty(v){ dirty=v; DB.set('dirty',v); }
function setSync(ok){ const s= ok?'Cloud aktiv':'Offline — wird nachgeholt';
  if(s!==syncState){ syncState=s; if(view==='settings'&&session) renderSettings(); } }
function authHeaders(withToken){ return {'apikey':SUPA_KEY,'Content-Type':'application/json',
  'Authorization':'Bearer '+((withToken&&session&&session.access_token)?session.access_token:SUPA_KEY)}; }
async function supaRPC(fn,args){ try{ const r=await fetch(`${SUPA_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:authHeaders(false),body:JSON.stringify(args)}); return r.ok?await r.json():null; }catch(e){ return null; } }
function setSession(d,username){ session={ access_token:d.access_token, refresh_token:d.refresh_token,
    expires_at:Date.now()+((d.expires_in||3600)*1000), user:{id:d.user.id,email:d.user.email},
    username: username || (d.user.user_metadata&&d.user.user_metadata.username) || d.user.email }; DB.set('session',session); }
function clearSession(){ session=null; DB.set('session',null); }
// Wichtig: Kein Rauswurf bei Netzproblemen — nur wenn der Server die Anmeldung wirklich ablehnt.
async function ensureToken(){ if(!session) return false; if(Date.now()<session.expires_at-30000) return true;
  try{ const r=await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});
    if(r.ok){ setSession(await r.json(), session.username); return true; }
    if(r.status>=400&&r.status<500){ clearSession(); render(); toast('Bitte neu anmelden'); return false; }
    setSync(false); return false; }
  catch(e){ setSync(false); return false; } }
function appDataBlob(){ return {programs,plans,sessions,profile,settings}; }
function loadBlob(d){ if(!d) return;
  // Neue Staende bringen programs mit. Aeltere (und Backups von vor dem 05.08.) nur plans —
  // die wandern in einen Trainingsplan, damit nichts verlorengeht.
  if(Array.isArray(d.programs)&&d.programs.length) programs=d.programs;
  else if(Array.isArray(d.plans)) programs=[neuerPlan('Mein Plan',d.plans)];
  if(Array.isArray(d.sessions)) sessions=d.sessions;
  if(d.profile) profile=d.profile; if(d.settings) settings=d.settings; normalizeProfile(); bindPlans();
  DB.set('programs',programs); DB.set('sessions',sessions); DB.set('profile',profile); DB.set('settings',settings); applyTheme(); }
// Liefert {ok,data}: ok=false heißt "konnte nicht laden" (Netz), NICHT "Konto ist leer".
async function cloudPull(){ if(!await ensureToken()) return {ok:false,data:null};
  try{ const r=await fetch(`${SUPA_URL}/rest/v1/gymlog_data?id=eq.${session.user.id}&select=data`,{headers:authHeaders(true)});
    if(!r.ok){ setSync(false); return {ok:false,data:null}; }
    const rows=await r.json(); setSync(true); return {ok:true,data:(rows&&rows.length)?rows[0].data:null}; }
  catch(e){ setSync(false); return {ok:false,data:null}; } }
async function cloudPush(){ if(!await ensureToken()) return false;
  try{ const r=await fetch(`${SUPA_URL}/rest/v1/gymlog_data`,{method:'POST',headers:{...authHeaders(true),'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify([{id:session.user.id,data:appDataBlob(),updated_at:new Date().toISOString()}])});
    setSync(r.ok); if(r.ok) setDirty(false); return r.ok; }
  catch(e){ setSync(false); return false; } }
function scheduleSync(){ if(!session) return; setDirty(true); clearTimeout(syncT); syncT=setTimeout(cloudPush,2000); }
// Beim Start: lokale ungesicherte Änderungen haben Vorrang, sonst Cloud laden.
async function cloudSyncStart(){ if(!session) return;
  if(dirty){ await cloudPush(); return; }
  const res=await cloudPull(); if(!res.ok) return;
  if(res.data){ loadBlob(res.data); if(session) render(); } else await cloudPush(); }
async function authSignUp(username,email,password){ username=(username||'').trim(); email=(email||'').trim();
  if(!username||!email||!password) throw 'Bitte Username, E-Mail und Passwort ausfüllen.';
  if(password.length<6) throw 'Passwort mind. 6 Zeichen.';
  if(await supaRPC('username_taken',{uname:username})===true) throw 'Username ist schon vergeben.';
  const r=await fetch(`${SUPA_URL}/auth/v1/signup`,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password,data:{username}})});
  const d=await r.json(); if(!r.ok) throw d.msg||d.error_description||d.error||'Registrierung fehlgeschlagen.';
  if(!d.access_token) throw 'Konto erstellt. Falls E-Mail-Bestätigung aktiv ist: E-Mail bestätigen, dann anmelden.';
  setSession(d,username); setDirty(true); await cloudPush(); }
async function authSignIn(idOrEmail,password){ idOrEmail=(idOrEmail||'').trim();
  if(!idOrEmail||!password) throw 'Bitte E-Mail/Username und Passwort eingeben.';
  let email=idOrEmail; if(!idOrEmail.includes('@')){ email=await supaRPC('email_for_username',{uname:idOrEmail}); if(!email) throw 'Username nicht gefunden.'; }
  const r=await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'apikey':SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const d=await r.json(); if(!r.ok) throw d.error_description||d.msg||'E-Mail/Username oder Passwort falsch.';
  setSession(d); const res=await cloudPull();
  if(res.ok && res.data) loadBlob(res.data);            // Konto hat Daten → die gelten
  else if(res.ok){ setDirty(true); await cloudPush(); } // Konto noch leer → lokale Daten übernehmen
}
// Abmelden nur, wenn nichts Ungesichertes offen ist — sonst wären die Daten weg.
async function authSignOut(){
  if(dirty && !await cloudPush()) return false;
  if(session){ try{ await fetch(`${SUPA_URL}/auth/v1/logout`,{method:'POST',headers:authHeaders(true)}); }catch(e){} }
  clearSession();
  programs=[neuerPlan('Mein Plan',seedPlans())]; sessions=[]; profile={xp:0,theme:profile.theme}; settings={rest:90}; active=null; normalizeProfile(); bindPlans();
  DB.set('programs',programs); DB.set('sessions',sessions); DB.set('profile',profile); DB.set('settings',settings); DB.set('active',null);
  setDirty(false); authMode='login'; view='home'; return true; }
// Konto löschen: erst die Daten in der Cloud, dann das Konto selbst.
// Das Konto zu entfernen kann der Browser nicht allein — dafür braucht es die
// Server-Funktion `delete_own_account` in Supabase. Fehlt sie, sind zumindest
// alle Daten weg; das sagen wir dann auch ehrlich statt Erfolg zu melden.
async function deleteAccount(){
  if(!session) return 'none';
  const uidNow=session.user.id;
  let dataGone=false, accountGone=false;
  if(await ensureToken()){
    try{ const r=await fetch(`${SUPA_URL}/rest/v1/gymlog_data?id=eq.${uidNow}`,{method:'DELETE',headers:authHeaders(true)});
      dataGone=r.ok; }catch(e){}
    try{ const r=await fetch(`${SUPA_URL}/rest/v1/rpc/delete_own_account`,{method:'POST',headers:authHeaders(true),body:'{}'});
      accountGone=r.ok; }catch(e){}
  }
  if(!dataGone && !accountGone) return 'offline';       // nichts erreicht — Konto bleibt bestehen
  clearSession();
  programs=[neuerPlan('Mein Plan',seedPlans())]; sessions=[]; profile={xp:0,theme:profile.theme}; settings={rest:90}; active=null; normalizeProfile(); bindPlans();
  DB.set('programs',programs); DB.set('sessions',sessions); DB.set('profile',profile); DB.set('settings',settings); DB.set('active',null);
  setDirty(false); authMode='login'; view='home';
  return accountGone?'full':'dataonly';
}
async function doAuth(mode){ const v=id=>{ const el=document.getElementById(id); return el?el.value:''; };
  const btn=document.querySelector('[data-act="doLogin"],[data-act="doRegister"]');
  if(btn){ btn.disabled=true; btn.textContent='Moment …'; }
  try{ if(mode==='register') await authSignUp(v('au_user'),v('au_id'),v('au_pw')); else await authSignIn(v('au_id'),v('au_pw'));
    // Nach einer Registrierung immer einrichten, beim Anmelden nur wenn noch nie geschehen.
    if(mode==='register' || !profile.onboarded) return startOnboard();
    view = active ? 'workout' : 'home'; render(); toast('Angemeldet'); }
  catch(e){ renderAuthGate(typeof e==='string'?e:'Fehler — bitte nochmal.'); } }

// ---------- Training ----------
// Aufwaermgewicht: rund 70 % des Arbeitsgewichts, auf 2,5 kg gerundet, damit es an der Stange
// auch auflegbar ist. Ohne Vorgeschichte bleibt das Feld leer.
// ⚠️ Das Runden auf 2,5 kg kann NACH OBEN gehen: bei 2 kg Arbeitsgewicht kamen 2,5 kg
// Aufwaermgewicht heraus — schwerer als der Arbeitssatz. Betrifft leichte Uebungen wie
// Seitheben. Ergibt sich kein Wert unter dem Arbeitsgewicht, bleibt das Feld lieber leer,
// als etwas Falsches vorzuschlagen. (Pruefrahmen, 22.08.2026.)
function warmKg(w){ if(!(w>0)) return ''; const v=Math.round(w*0.7/2.5)*2.5; return (v>0&&v<w)?v:''; }
// Plaene ohne eigenes warmup (alle vor dem 05.08.) folgen der Wahl aus dem Assistenten.
function planWarm(p){ return p && p.warmup!=null ? !!p.warmup : !!profile.warmup; }
function startWorkout(plan){
  // Aufwaermsatz: pro Uebung einer, vorneweg, markiert mit warm:true. Ob es ihn gibt, steht am
  // Plan (Karls Wahl im Assistenten oder im Editor).
  const warm = plan.warmup!=null ? !!plan.warmup : !!profile.warmup;
  const ex=plan.exercises.map(e=>{ const lp=lastPerf(e.name);
    // vol wandert mit ins Training — sonst zeigte die Satz-Zeile ein anderes Ziel als der Editor
    const sets=Array.from({length:e.sets||3},()=>({weight:lp&&lp.w?lp.w:'',reps:'',done:false}));
    if(warm) sets.unshift({weight:warmKg(lp&&lp.w),reps:'',done:false,warm:true});
    return {id:uid(),name:e.name,icon:e.icon,reps:e.reps,vol:e.vol,sets}; });
  active={id:uid(),date:Date.now(),planId:plan.id,planName:plan.name,currentIdx:0,exercises:ex}; save(); view='workout'; render(); }

function finishWorkout(){
  const entries=active.exercises.map(e=>({name:e.name||'Übung',icon:e.icon,sets:e.sets.filter(s=>s.done)})).filter(e=>e.sets.length);
  if(entries.length===0){ active=null; save(); toast('Verworfen (nichts erledigt)'); view='home'; render(); return; }
  const beforeL=levelFromXP(profile.xp).level, beforeRank=rankForLevel(beforeL).name;
  const gained=sessXP(entries);
  profile.xp+=gained;
  // dur = wie lange die Einheit gedauert hat. Einheiten vor dem 05.08. haben kein dur.
  // xp = was es dafuer gab. Wird gebraucht, um den Punktestand nachzufuehren, wenn die
  // Einheit spaeter im Verlauf korrigiert wird (seit 06.08.).
  sessions.push({id:active.id,date:active.date,dur:Date.now()-active.date,planName:active.planName,xp:gained,entries});
  active=null; endRest();
  const afterL=levelFromXP(profile.xp).level, afterRank=rankForLevel(afterL);
  save(); view='home';
  if(afterL>beforeL){ let extra='';
    if(afterRank.name!==beforeRank){ extra+=`<div style="margin-top:8px">Neuer Rang: <b style="color:${afterRank.color}">${esc(afterRank.name)}</b></div>`;
      if(afterRank.unlock) extra+=`<div class="tiny muted" style="margin-top:4px">Design „${THEMES[afterRank.unlock].label}" freigeschaltet — im Rang-Tab wählbar</div>`; }
    render(); showModal(`<div class="tiny muted">Level up!</div><div class="big">Level ${afterL}</div><div>+${gained} XP</div>${extra}`);
  } else { render(); toast(`Stark! +${gained} XP`); }
}

let armed={};
function confirmTwice(key,btn,label,run){ if(armed[key]){ clearTimeout(armed[key]); delete armed[key]; run(); return; }
  const old=btn.textContent; btn.dataset.old=old; btn.textContent=label; btn.style.color='#fff'; btn.style.background='var(--danger)';
  armed[key]=setTimeout(()=>{ delete armed[key]; btn.textContent=old; btn.style.color=''; btn.style.background=''; },2500); }

document.addEventListener('input',ev=>{ const t=ev.target;
  if(t.id==='obName'&&obDraft){ obDraft.name=t.value; return; }   // ohne Neuzeichnen mitschreiben
  if(t.id==='libSearch'){ renderLibList(t.value); return; }
  if(t.id==='foodSearch'){ renderFoodList(t.value); return; }
  // Mengen-Vorschau: nur die drei Zahlen nachziehen, nicht neu zeichnen — sonst
  // faellt der Fokus beim Tippen aus dem Feld (gleiche Falle wie im Verlauf).
  if(t.id==='mengeInput'&&foodDraft){ const m=+t.value.replace(',','.');
    foodDraft.menge=t.value; const w=draftWerte(foodDraft,m);
    const set=(sel,v)=>{ const el=document.querySelector(sel); if(el) el.textContent=v; };
    set('[data-vk]',w.kcal); set('[data-vp]',w.p); set('[data-vc]',w.c); return; }
  if(t.dataset.f&&active){ active.exercises[+t.dataset.ex].sets[+t.dataset.set][t.dataset.f]=t.value; DB.set('active',active); return; }
  // Korrektur im Verlauf: beim Tippen nur wegschreiben, nicht neu zeichnen — sonst faellt der
  // Fokus aus dem Feld. Volumen, Rekorde und XP werden beim Verlassen des Feldes nachgezogen.
  if(t.dataset.se&&view==='session'){ const [ei,si]=t.dataset.se.split(':').map(Number);
    const s=sessions.find(x=>x.id===detailSessionId);
    if(s&&s.entries[ei]&&s.entries[ei].sets[si]){ s.entries[ei].sets[si][t.dataset.sf]=t.value; DB.set('sessions',sessions); }
    return; }
  if(t.id==='progName'){ const pr=editProg(); if(pr){ pr.name=t.value.trim()||'Plan'; DB.set('programs',programs); } }
  if(t.id==='planName'){ const p=editPlans().find(x=>x.id===editPlanId); if(p){ p.name=t.value; DB.set('programs',programs); } }
  if(t.id==='restInput'){ settings.rest=Math.max(10,+t.value||90); DB.set('settings',settings); }
});
function syncPlanInputs(){ const p=editPlans().find(x=>x.id===editPlanId); if(!p) return;
  const n=document.getElementById('planName'); if(n) p.name=n.value.trim()||'Training';
  document.querySelectorAll('.ex-name').forEach(el=>p.exercises[+el.dataset.i].name=el.value);
  document.querySelectorAll('.ex-sets').forEach(el=>p.exercises[+el.dataset.i].sets=Math.max(1,+el.value||1)); }
document.addEventListener('change',ev=>{ if(view==='plan') syncPlanInputs();
  // Feld verlassen = Zahl steht fest: Volumen/Rekorde/XP nachziehen.
  // ⚠️ Hier bewusst KEIN render(): ein Neuzeichnen genau im Moment des Fokusverlusts frisst den
  // Klick, der ihn ausgeloest hat (mousedown auf ✕ → blur → neues DOM → mouseup ins Leere → kein
  // click). Stattdessen nur die eine Zahl im Kopf nachtragen.
  if(view==='session'&&ev.target.dataset&&ev.target.dataset.se){
    const s=sessions.find(x=>x.id===detailSessionId); if(!s) return;
    sessRecalc(s);
    const el=document.querySelector('[data-sessvol]'); if(el) el.textContent=volume(s.entries); } });

// Versteckte Admin-Freischaltung: 5x auf Brock auf der Startseite tippen (nur auf Karls Gerät).

    const now=Date.now(); if(now-t0>1500) n=0; t0=now; n++;
    if(n>=5){ n=0; devAdmin=!devAdmin; DB.set('devadmin',devAdmin);
      toast(devAdmin?'Admin freigeschaltet — steht unten in den Einstellungen':'Admin deaktiviert'); }
  });
})();

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
